e:"g(ε) = g(k)/(dε/dk) con g(k) dal volume/superficie/lunghezza della «sfera» in k. Il caso 2D costante ha una conseguenza notevole: μ(T) resta fermo al 1° ordine. Nel grafene (dispersione lineare 2D) g ∝ ε: esercizio d'appello."},
{id:"o25",b:"sol",q:"Un elettrone si muove nel potenziale periodico di un cristallo. Quale forma assumono le sue autofunzioni secondo il teorema di Bloch?",
o:["ψ<sub>k</sub>(r) = e^(ik·r)u<sub>k</sub>(r), con u<sub>k</sub> periodica", "ψ(r) = e^(ik·r), onda piana pura come per l'elettrone libero", "ψ(r) = Σc<sub>n</sub>φ(r−R<sub>n</sub>), fortemente localizzata sui siti", "ψ(r) = e^(−r²/2σ²), gaussiana centrata su ciascun sito reticolare"],c:0,
e:"Onda piana modulata dalla periodicità: k è definito a meno di vettori G (si riporta tutto nella 1ª BZ) e nascono le bande ε<sub>n</sub>(k). Ai bordi zona la riflessione di Bragg apre i gap proibiti."},
{id:"o26",b:"sol",q:"Di un elettrone in una banda si conosce la relazione di dispersione ε(k). Come si definisce la sua massa efficace?",
o:["1/m* = (1/ħ²)·d²ε/dk², cioè la curvatura della banda", "m* = ħk/v, definita dalla velocità di gruppo dell'elettrone", "m* = m, cioè la massa dell'elettrone libero nel vuoto", "m* = ħ²k²/2ε, rapporto fra momento ed energia dello stato"],c:0,
e:"L'elettrone risponde ai campi come una particella di massa m* dettata dalla curvatura locale di ε(k). Bande strette → m* grande. In cima alla banda m* &lt; 0: si descrive meglio come lacuna di carica +e — spiega gli Hall positivi."},
{id:"o27",b:"sol",q:"Un semimetallo ha due bande paraboliche sovrapposte di una quantità Δ, con masse efficaci m*<sub>C</sub> e m*<sub>V</sub>. Quale condizione fissa il livello di Fermi a T = 0?",
o:["n<sub>elettroni</sub> = n<sub>lacune</sub>, cioè la neutralità di carica", "E<sub>F</sub> = Δ/2 sempre, a metà della zona di sovrapposizione", "E<sub>F</sub> coincide con il massimo della banda di valenza", "E<sub>F</sub> si colloca dove la densità degli stati è minima"],c:0,
e:"Gli elettroni «versati» nella banda di conduzione lasciano altrettante lacune: ∫g<sub>C</sub> = ∫g<sub>V</sub> con g ∝ (m*)³ᐟ²√E. Con masse uguali E<sub>F</sub> = Δ/2. Problema del tema di luglio, con c<sub>V</sub> = γT ∝ √Δ·T come seguito."},
{id:"o28",b:"sol",q:"Si riempie un reticolo cubico a facce centrate con sfere rigide tangenti fra loro. Quale frazione del volume viene occupata?",
o:["f = π/√18 ≈ 0,74, il massimo possibile per sfere identiche", "f ≈ 0,68, come per il reticolo cubico a corpo centrato", "f ≈ 0,52, come per il reticolo cubico semplice", "f ≈ 0,34, come per la struttura del diamante"],c:0,
e:"FCC e hcp sono le strutture compatte: 0,74 (congettura di Keplero). BCC: 0,68; SC: 0,52; diamante: 0,34. Nei quiz spesso chiedono anche il 2D: esagonale 0,907 &gt; quadrato 0,785."},
{id:"o29",b:"sol",q:"Quanti modi normali (per branca) ha un cristallo di N celle primitive con condizioni di Born–von Karman?",
o:["Esattamente N, uno per ogni k della prima zona", "Infiniti, perché il vettore d'onda varia", "3N per ciascuna branca, uno per grado di libertà", "Un numero che dipende dalla temperatura del cristallo"],c:0,
e:"I k permessi sono spaziati di 2π/L: nella 1ª BZ (larghezza 2π/a) ce ne stanno L/a = N. Con una base di p atomi: 3p branche in 3D (3 acustiche + 3p−3 ottiche) → 3pN modi totali = gradi di libertà."},
{id:"o30",b:"sol",q:"Nella catena biatomica 1D, che cosa accade al bordo della zona di Brillouin (k = π/a)?",
o:["Si apre un gap di frequenze proibite fra le due branche", "Le due branche si incrociano senza aprire alcun intervallo", "La frequenza diverge per entrambe le branche vibrazionali", "I modi diventano tutti puramente longitudinali al bordo"],c:0,
e:"A k = π/a: nella branca acustica oscillano solo le masse pesanti, nell'ottica solo le leggere; l'intervallo [√(2C/M), √(2C/m)] è proibito. Se le masse diventano uguali il gap si chiude e si ritrova la catena monoatomica (con cella dimezzata)."},
// ============ MAGNETISMO ============
{id:"m01",b:"mag",q:"Come si classificano dia-, para- e ferromagneti in base alla suscettività χ?",
o:["Dia: χ &lt; 0 piccola; para: χ &gt; 0 ∝ 1/T; ferro: χ enorme", "Dia: χ &gt; 0; para: χ &lt; 0; ferro: χ nulla in assenza di campo", "Tutti hanno χ &gt; 0 e si distinguono soltanto per il modulo", "Dia e para si distinguono soltanto per la temperatura critica"],c:0,
e:"Nell'esperimento del solenoide: i diamagneti sono debolmente espulsi (χ ∼ −10⁻⁵), i paramagneti debolmente attratti con χ = C/T (Curie), i ferromagneti attratti con forza ×10⁵ e mostrano isteresi e M spontanea."},
{id:"m02",b:"mag",q:"Un campione di materiale magnetico viene sospeso a un dinamometro presso l'imboccatura di un solenoide. Da che cosa dipende la forza che agisce su di esso?",
o:["F = μ·(dB/dz), proporzionale al gradiente del campo", "F = μ·B, proporzionale al campo e massima al centro del solenoide", "È sempre rigorosamente nulla per un materiale lineare", "È proporzionale a B² in ogni punto (anche a campo uniforme)"],c:0,
e:"Un dipolo sente forza solo in campo disomogeneo: U = −μ·B → F = ∇(μ·B). Per dia/para (μ indotto ∝ B) la forza va come il gradiente di B²; è così che si misura χ (bilancia di Gouy)."},
{id:"m03",b:"mag",q:"Il momento magnetico degli atomi si misura in unità di magnetone di Bohr. Quanto vale questa costante e come si esprime a partire dalle costanti fondamentali?",
o:["μ<sub>B</sub> = eħ/2m ≈ 9,3·10⁻²⁴ J/T ≈ 5,8·10⁻⁵ eV/T", "μ<sub>B</sub> = eħ/m, cioè il doppio del valore corretto", "μ<sub>B</sub> = e²/2ħ, rapporto fra carica al quadrato e azione", "μ<sub>B</sub> = ħ²/2m, con le dimensioni di un'energia per lunghezza"],c:0,
e:"Quanto naturale di momento magnetico: μ = −(e/2m)L per il moto orbitale (g<sub>l</sub> = 1) e μ<sub>s</sub> = −(e/m)S per lo spin (g<sub>s</sub> ≈ 2). Il magnetone nucleare è ~2000 volte più piccolo: il magnetismo nucleare è trascurabile."},
{id:"m04",b:"mag",q:"Che cosa dimostra l'effetto Einstein–de Haas?",
o:["Il legame fra magnetizzazione e momento angolare", "L'esistenza dei domini magnetici all'interno del ferromagnete", "La quantizzazione del flusso magnetico nei circuiti superconduttori", "La precessione di Larmor dei momenti attorno al campo applicato"],c:0,
e:"Conservazione del momento angolare: se M cambia, il reticolo compensa ruotando. Il γ misurato è e/m (= spin, g = 2) e non e/2m (orbitale): il momento magnetico del ferro viene dagli spin."},
{id:"m05",b:"mag",q:"Un momento magnetico atomico viene immerso in un campo magnetico uniforme B e comincia a precedere attorno alla sua direzione. Con quale pulsazione?",
o:["ω<sub>L</sub> = eB/2m, con modulo e angolo costanti", "ω<sub>L</sub> = eB/m, cioè il doppio della frequenza corretta", "ω<sub>L</sub> = μ<sub>B</sub>B/ħ², con dimensioni non corrette", "ω<sub>L</sub> = B/m, indipendente dalla carica della particella"],c:0,
e:"τ = μ×B → dL/dt ⊥ L: pura precessione, nessun allineamento (per allinearsi serve dissipazione). Vale finché ω<sub>L</sub> ≪ ω₀ atomica, cioè sempre (B ≪ 10⁶ T). È l'origine del diamagnetismo di Larmor–Langevin."},
{id:"m06",b:"mag",q:"Un materiale costituito da atomi a shell chiuse viene posto in campo magnetico e mostra risposta diamagnetica. Quale espressione ha la sua suscettività?",
o:["χ = −(μ₀ne²/6m)Σ⟨r<sub>i</sub>²⟩, negativa e indipendente da T", "χ = −C/T, negativa e inversamente proporzionale alla temperatura", "χ positiva e proporzionale a 1/T (come nella legge di Curie)", "χ = −1 esattamente, come per un diamagnete perfetto"],c:0,
e:"La precessione delle nuvole elettroniche equivale a correnti indotte che si oppongono a B (Lenz microscopica). Presente in tutti i materiali, visibile solo dove non c'è paramagnetismo (shell chiuse: J = 0, es. gas nobili, Al₂O₃, NaCl)."},
{id:"m07",b:"mag",q:"Che cosa afferma il teorema di Bohr–van Leeuwen?",
o:["In fisica classica all'equilibrio la magnetizzazione è nulla", "Il campo magnetico non riesce a penetrare all'interno dei metalli", "Gli spin non interagiscono fra loro secondo la fisica classica", "La suscettività calcolata classicamente risulta infinita"],c:0,
e:"La forza di Lorentz non compie lavoro: Z classica non dipende da A → M = −∂F/∂B = 0. Van Vleck: dia e para classici si cancellano esattamente. Ogni magnetismo osservato (Curie, Larmor, ferro) richiede la quantizzazione."},
{id:"m08",b:"mag",x:1,q:"Che cosa esprime la variabile indipendente a della funzione di Brillouin B<sub>J</sub>(a)?",
o:["Il rapporto tra l'energia magnetica di orientamento e l'energia termica: a = g<sub>J</sub>μ<sub>B</sub>J·B/k<sub>B</sub>T","La temperatura critica ferromagnetica","La magnetizzazione spontanea a campo nullo","Il numero di domini magnetici"],c:0,
e:"a confronta μB con k<sub>B</sub>T: per a ≪ 1 (sempre a RT: a ∼ 10⁻³) vince il disordine → legge di Curie; per a ≫ 1 (B alti, T criogeniche) vince il campo → saturazione (domanda reale d'esame)."},
{id:"m09",b:"mag",q:"In quale limite la funzione di Brillouin B<sub>J</sub> si riduce alla funzione di Langevin classica L(a)?",
o:["J → ∞ scompare la quantizzazione delle direzioni e si ritrova il continuo classico", "J → 0, cioè quando il momento angolare totale si annulla", "a → 0, cioè nel limite di campo debole e alta temperatura", "T → 0, cioè nel limite di temperatura tendente allo zero"],c:0,
e:"Langevin tratta cosθ continuo; Brillouin somma su 2J+1 orientazioni discrete. Per J → ∞ i due calcoli coincidono. Le curve sperimentali di saturazione seguono B<sub>J</sub> con J piccolo, NON L(a): prova diretta della quantizzazione."},
{id:"m10",b:"mag",q:"Un sale paramagnetico diluito viene studiato a temperatura ambiente in campo moderato, e la sua suscettività segue la legge di Curie. Da quale limite teorico discende?",
o:["Dal limite a ≪ 1 della Brillouin: B<sub>J</sub>(a) ≈ (J+1)a/3J", "Dal limite di saturazione a ≫ 1, dove B<sub>J</sub>(a) → 1", "Dall'interazione di scambio fra ioni vicini, con J′ &gt; 0", "Dalla teoria di Drude, con σ = ne²τ/m per gli elettroni"],c:0,
e:"χ = nμ₀⟨μ⟩²/3k<sub>B</sub>T con ⟨μ⟩ = g<sub>J</sub>μ<sub>B</sub>√(J(J+1)). Regime lineare M ∝ H valido solo per a ≪ 1: nei problemi d'esame va sempre verificato (es. tema di luglio: a = 0,034 ≪ 1 ✓) prima di usare la legge di Curie."},
{id:"m11",b:"mag",q:"Quali condizioni servono per osservare la saturazione di un paramagnete?",
o:["a = μB/k<sub>B</sub>T ≳ 1, cioè campi intensi e T criogeniche", "È sufficiente a ≈ 10⁻³, cioè un campo qualunque a 300 K", "Occorrono T ≫ 300 K e campi deboli, cioè a ≪ 1", "Soltanto i ferromagneti, con M<sub>sat</sub> = nμ<sub>B</sub>g<sub>J</sub>J"],c:0,
e:"A RT con B = 10 T: a ≈ 10⁻². Per portare B<sub>J</sub> → 1 (tutti i dipoli allineati, M<sub>sat</sub> = nμ<sub>B</sub>g<sub>J</sub>J) servono pochi kelvin e parecchi tesla. Sulle curve M vs B/T si leggono direttamente g<sub>J</sub>J e la quantizzazione di J."},
{id:"m12",b:"mag",q:"Perché per gli ioni delle terre rare (4f) il modello a ione libero p<sub>eff</sub> = g<sub>J</sub>√(J(J+1)) funziona così bene nei sali?",
o:["L'orbitale 4f è interno, schermato dalle shell piene 5s e 5p", "Perché gli ioni 4f hanno L = 0 e quindi nessun momento orbitale", "Perché il campo cristallino rafforza lo spin-orbita, che va come Z⁴", "Perché gli ioni trivalenti 4f hanno J = 0 e risultano diamagnetici"],c:0,
e:"Il 4f sta «dentro» l'atomo: lo ione nel cristallo si comporta come libero e valgono le tre regole di Hund complete (Ce³⁺: 2,54 teorico vs 2,51 misurato; Gd³⁺: 7,94 vs 7,98). Eccezioni: Sm³⁺, Eu³⁺ (primo eccitato a ~k<sub>B</sub>T: livelli ripopolati)."},
{id:"m13",b:"mag",q:"Che cos'è il quenching del momento angolare orbitale negli ioni 3d?",
o:["Il campo cristallino impone autostati reali con ⟨L<sub>z</sub>⟩ = 0", "La riduzione dello spin S per effetto dell'agitazione termica k<sub>B</sub>T", "L'annullamento del momento totale, cioè J = L + S = 0", "Un effetto relativistico ∝ (v/c)² degli elettroni più interni"],c:0,
e:"Gli orbitali 3d sono esterni: il campo elettrico dei vicini domina lo spin-orbita e la 3ª regola di Hund salta. I «buoni» stati sono combinazioni reali (autostati di L² ma non di L<sub>z</sub>): su funzioni reali ⟨L<sub>z</sub>⟩ = 0. Quindi p<sub>eff</sub> = 2√(S(S+1)), in ottimo accordo con l'esperimento."},
{id:"m14",b:"mag",q:"Per lo ione Cr³⁺ (3d³) il calcolo da ione libero dà p<sub>eff</sub> = 0,77, contro il valore misurato di 3,85. Quale risultato si ottiene tenendo conto del quenching?",
o:["p<sub>eff</sub> = 2√(S(S+1)) = 3,87 con S = 3/2 accordo ottimo", "p<sub>eff</sub> = √(J(J+1)) = 1,94, usando il momento totale J", "p<sub>eff</sub> = 2S = 3, cioè il doppio dello spin totale", "p<sub>eff</sub> = g<sub>J</sub>J = 0,6, con il fattore di Landé"],c:0,
e:"Tre elettroni d a spin paralleli: S = 3/2, L «spento» → g = 2. p<sub>eff</sub> = 2√(3/2·5/2) = √15 = 3,87. Esattamente il calcolo del tema di luglio (Cr in Al₂O₃, rubino): usare J qui è LA trappola classica."},
{id:"m15",b:"mag",q:"Qual è la gerarchia delle interazioni per uno ione 3d in un cristallo?",
o:["Coulomb &gt; repulsione e–e &gt; campo cristallino &gt; spin-orbita", "Coulomb &gt; spin-orbita &gt; campo cristallino, come per le terre rare", "Il campo cristallino è sempre l'interazione più debole di tutte", "L'interazione Zeeman col campo esterno domina su tutte le altre"],c:0,
e:"Nei 3d il campo cristallino batte lo spin-orbita (orbitali esterni); nelle 4f è il contrario (orbitali schermati). Regole di Hund modificate per i 3d: S max, L = 0 (quench), J = S. Il residuo spin-orbita dà g<sub>eff</sub> leggermente ≠ 2 (dragging)."},
{id:"m16",b:"mag",q:"Perché per Fe³⁺ e Mn²⁺ (3d⁵) il modello a ione libero funziona anche senza invocare il quenching?",
o:["La subshell semipiena ha già L = 0, termine ⁶S₅/₂", "Perché si tratta di ioni a shell chiusa, con L = S = J = 0", "Perché il loro momento di spin totale è nullo, cioè S = 0", "Perché nei loro sali il campo cristallino vale Δ₀ ≈ 0"],c:0,
e:"Cinque elettroni a spin paralleli su m<sub>l</sub> = +2…−2: M<sub>L</sub> = 0. p<sub>eff</sub> = 2√(5/2·7/2) = 5,92 contro 5,82–5,92 sperimentale. Caso in cui ione libero e quenching danno lo stesso risultato."},
{id:"m17",b:"mag",q:"Il sodio metallico mostra una suscettività paramagnetica debole e indipendente dalla temperatura. Quale espressione la descrive correttamente?",
o:["χ<sub>P</sub> = μ₀μ<sub>B</sub>²g(ε<sub>F</sub>), piccola e indipendente da T", "χ = C/T, come per un sale paramagnetico di terre rare", "χ &lt; 0, cioè risposta complessivamente diamagnetica", "χ ~ 10³, dello stesso ordine di quella dei ferromagneti"],c:0,
e:"Le due sottobande di spin si spostano di ∓μ<sub>B</sub>B e si riequilibrano: Δn = g(ε<sub>F</sub>)μ<sub>B</sub>B. Risultato: χ<sub>P</sub> = (T/T<sub>F</sub>)·χ<sub>Curie</sub> — spiega sia il valore ~100 volte più piccolo dell'atteso sia l'indipendenza da T (χ ∝ 1/T<sub>F</sub>, non 1/T). Stesso fattore di soppressione del calore specifico elettronico."},
{id:"m18",b:"mag",q:"Oltre alla risposta di spin, gli elettroni di conduzione danno un contributo magnetico di origine orbitale. Quanto vale il diamagnetismo di Landau?",
o:["χ<sub>L</sub> = −⅓χ<sub>Pauli</sub>: contributo orbitale dei livelli di Landau", "χ<sub>L</sub> = −χ<sub>Pauli</sub>, cosicché i due contributi si cancellano", "χ<sub>L</sub> = +χ<sub>Pauli</sub>, cioè raddoppia la risposta paramagnetica", "χ<sub>L</sub> = 0: nei metalli il contributo orbitale è assente"],c:0,
e:"B curva le traiettorie (livelli di Landau) → magnetizzazione orbitale opposta. Totale: χ = (2/3)χ<sub>P</sub> &gt; 0 per gli alcalini. I livelli di Landau sono anche la base delle oscillazioni Shubnikov–de Haas con cui si mappano le superfici di Fermi."},
{id:"m19",b:"mag",q:"Quali sono le quattro caratteristiche fenomenologiche del ferromagnetismo?",
o:["Isteresi; transizione a T<sub>C</sub>; Curie–Weiss; M spontanea", "Isteresi; suscettività negativa; saturazione; superconduttività", "Soltanto la presenza di magnetizzazione spontanea a campo nullo", "χ ∝ 1/T; assenza di domini; anisotropia; effetto Hall anomalo"],c:0,
e:"Il modello di Weiss (campo molecolare λM) le riproduce qualitativamente tutte e quattro: soluzione grafica L(a) contro retta ∝ T dà M spontanea sotto T<sub>C</sub> = μ²μ₀λn/3k<sub>B</sub> e Curie–Weiss sopra."},
{id:"m20",b:"mag",q:"Perché l'interazione dipolare magnetica NON può spiegare il ferromagnetismo?",
o:["Darebbe T<sub>C</sub> ∼ 1 K, mentre servono campi ∼10³ T", "Perché l'energia dipolare μ²/r³ cresce con la distanza fra gli ioni", "Perché l'interazione dipolare decade come 1/r³ e agisce solo lontano", "Perché fra i dipoli magnetici l'interazione risulta sempre repulsiva"],c:0,
e:"k<sub>B</sub>T<sub>C</sub>/μ<sub>B</sub> con T<sub>C</sub>(Fe) = 1043 K dà B<sub>m</sub> ≈ 1500 T. L'origine vera è l'interazione di scambio: elettrostatica + principio di Pauli, non magnetica. La costante di Weiss λ ≈ 10³ misura proprio questo rapporto."},
{id:"m21",b:"mag",q:"Che cos'è l'interazione di scambio alla base del ferromagnetismo (Heisenberg)?",
o:["Un effetto elettrostatico combinato con l'antisimmetria di Pauli", "Un'interazione magnetica diretta fra i dipoli dei singoli atomi", "Un effetto relativistico riconducibile all'accoppiamento spin-orbita", "Uno scambio di fotoni virtuali fra gli atomi del reticolo"],c:0,
e:"H = −(2J′/ħ²)S<sub>i</sub>·S<sub>j</sub>: J′ = ½(E↑↓−E↑↑) è un integrale coulombiano «incrociato» che esiste solo con overlap delle funzioni d'onda. J′ &gt; 0 favorisce spin paralleli (ferro), J′ &lt; 0 antiparalleli (antiferro)."},
{id:"m22",b:"mag",x:1,q:"Quale affermazione sull'integrale di scambio NON è corretta?",
o:["È dato da J = ∫∫|ψ<sub>a</sub>(r₁)|²·(e²/4πε₀r₁₂)·|ψ<sub>b</sub>(r₂)|² dr₁dr₂","Ha origine dalla combinazione di interazione coulombiana e principio di Pauli","Può favorire spin paralleli o antiparalleli a seconda della distanza tra gli ioni","Contribuisce alla differenza di energia tra stati con diversa simmetria spaziale"],c:0,
e:"Quella formula (con i moduli quadri) è l'integrale di COULOMB diretto: lo scambio ha invece le funzioni d'onda «incrociate» ψ<sub>a</sub>*(r₁)ψ<sub>b</sub>*(r₂)ψ<sub>a</sub>(r₂)ψ<sub>b</sub>(r₁) — senza analogo classico (domanda reale d'esame)."},
{id:"m23",b:"mag",q:"Che cosa descrive la curva di Bethe–Slater?",
o:["J′ in funzione del rapporto distanza interatomica/raggio 3d", "La magnetizzazione spontanea in funzione della temperatura assoluta", "Il ciclo di isteresi caratteristico dei materiali magnetici duri", "La suscettività di Pauli degli elettroni itineranti nei metalli"],c:0,
e:"J′ cambia segno con la distanza: rapporto intermedio → J′ &gt; 0 (Fe, Co, Ni ferro); piccolo → J′ &lt; 0 (Mn antiferro); grande → J′ ≈ 0 (para). Conferma: nelle leghe di Heusler (Cu₂MnSn) gli atomi di Mn, più distanziati, diventano ferromagnetici."},
{id:"m24",b:"mag",q:"Perché un pezzo di ferro smagnetizzato non è una calamita, pur essendo ferromagnetico?",
o:["È suddiviso in domini di Weiss con magnetizzazioni orientate a caso", "Perché la magnetizzazione spontanea compare soltanto sopra T<sub>C</sub>", "Perché gli spin sono disordinati esattamente come in un paramagnete", "Perché il campo magnetico terrestre lo smagnetizza continuamente"],c:0,
e:"Dentro ogni dominio M = M<sub>sat</sub> locale, ma i domini si dispongono per chiudere il flusso (costo: pareti di Bloch, spessore ~10³ Å da competizione scambio–anisotropia). Magnetizzare = spostare le pareti (a scatti: effetto Barkhausen) e poi ruotare i domini."},
{id:"m25",b:"mag",q:"Un ferromagnete viene riscaldato oltre la sua temperatura di Curie e se ne misura la suscettività. Quale comportamento descrive la legge di Curie–Weiss?",
o:["La suscettività di un ferromagnete SOPRA la temperatura di Curie", "La suscettività misurata al di sotto della temperatura di Curie", "Il comportamento tipico dei materiali diamagnetici a ogni T", "L'andamento della magnetizzazione spontanea in funzione di T"],c:0,
e:"Sopra T<sub>C</sub> il ferromagnete è un paramagnete «aiutato» dal campo molecolare λM: χ diverge avvicinandosi a T<sub>C</sub> (transizione). Dal fit di 1/χ vs T si leggono C (quindi p<sub>eff</sub>) e T<sub>C</sub>."},
{id:"m26",b:"mag",q:"Nella scelta di un materiale magnetico si distingue fra materiali «duri» e «dolci». Quale parametro del ciclo di isteresi li separa?",
o:["Il campo coercitivo H<sub>c</sub>, grande nei duri (magneti permanenti)", "La temperatura di Curie a cui avviene la transizione magnetica", "Il segno della suscettività magnetica misurata a campo debole", "La densità di elettroni di conduzione presenti nel materiale"],c:0,
e:"L'area del ciclo di isteresi = energia dissipata per ciclo. Duri: pareti bloccate da difetti e forte anisotropia → B<sub>r</sub> e H<sub>c</sub> grandi. Dolci: ciclo stretto per minimizzare le perdite nelle applicazioni AC."},
{id:"m27",b:"mag",q:"Alcuni ioni hanno momento angolare totale nullo nel fondamentale ma mostrano ugualmente una debole risposta paramagnetica. Quale configurazione dà luogo al paramagnetismo di van Vleck?",
o:["J = 0 nel fondamentale ma L e S diversi da zero", "Momento angolare totale J massimo, cioè J = L + S", "Shell chiuse con L = S = J = 0 e momento complessivamente nullo", "Elettroni itineranti con g(ε<sub>F</sub>) elevata nella banda di conduzione"],c:0,
e:"Con J = 0 lo Zeeman al 1° ordine è nullo, ma il mescolamento con gli stati eccitati (2° ordine) dà χ &gt; 0 piccola e ~indipendente da T. Caso Eu³⁺ (4f⁶, ⁷F₀): senza van Vleck il confronto p<sub>eff</sub> teoria–esperimento fallisce."},
{id:"m28",b:"mag",q:"In un sale paramagnetico, perché gli ioni magnetici devono essere DILUITI in una matrice diamagnetica?",
o:["Per evitare l'interazione di scambio fra ioni vicini", "Per aumentare il valore complessivo della suscettività magnetica", "Perché altrimenti il sale si scioglierebbe alle basse temperature", "Per schermare il campo magnetico esterno applicato al campione"],c:0,
e:"n<sub>para</sub> ≪ n<sub>dia</sub> (es. 10% di Cr³⁺ in Al₂O₃, il rubino del tema di luglio): senza overlap tra le funzioni d'onda 3d/4f lo scambio è spento e ogni ione risponde indipendentemente (Maxwell–Boltzmann, Brillouin, Curie)."},
{id:"m29",b:"mag",q:"Le curve sperimentali M/M<sub>sat</sub> contro B/T misurate su sali di Cr³⁺, Fe³⁺ e Gd³⁺ non si sovrappongono fra loro. Che cosa dimostra questo risultato?",
o:["J è quantizzato, la forma di B<sub>J</sub> dipende da J", "Che la temperatura del campione non è stata controllata bene", "Che la legge di Curie non descrive correttamente i paramagneti", "Che il campo molecolare assume valori diversi nei tre sali"],c:0,
e:"Nella teoria classica tutte le curve normalizzate collassano su L(a). Sperimentalmente ogni ione segue la SUA B<sub>J</sub>(a) con J = 3/2, 5/2, 7/2: test storico della quantizzazione del momento angolare (esperimenti di Henry, 1952)."},
{id:"m30",b:"mag",q:"Uno ione con tutte le shell elettroniche complete, come Al³⁺ oppure O²⁻, è inserito in un reticolo cristallino. Quale comportamento magnetico presenta?",
o:["Diamagnetico: L = S = J = 0, resta il solo Larmor–Langevin", "Paramagnetico debole, con χ ≈ +10⁻⁵ indipendente dalla temperatura", "Ferromagnetico sotto T<sub>C</sub>, con magnetizzazione spontanea non nulla", "Privo di risposta magnetica, cioè con χ esattamente uguale a zero"],c:0,
e:"Senza momento angolare non c'è paramagnetismo (1° ordine nullo): sopravvive solo il diamagnetismo ∝ Σ⟨r²⟩. Per questo Al₂O₃ puro è diamagnetico e serve drogarlo con Cr³⁺ per farne un paramagnete (primo punto del tema di luglio)."},
// ---- Atomica: molecole (Es. 1 e 1-2) ----
{id:"a31",b:"ato",q:"Nella formazione di NaCl, trasferire l'elettrone da Na a Cl (formare Na⁺ + Cl⁻ a distanza infinita) costa circa 1,3 eV. Perché il legame ionico si forma comunque?",
o:["L'attrazione coulombiana ∝ 1/R porta a un minimo a R ≈ 2,4 Å", "Perché l'energia di ionizzazione del sodio vale −5,1 eV, negativa", "Per effetto tunnel dell'elettrone, con probabilità ∝ e^(−2κR)", "Per l'interazione magnetica fra spin, dell'ordine di 10⁻⁴ eV"],c:0,
e:"E<sub>ionizz</sub>(Na) = 5,1 eV, affinità del Cl = −3,8 eV: il bilancio a R → ∞ è +1,3 eV, ma avvicinando gli ioni il termine −e²/4πε₀R vince, con minimo a R<sub>min</sub> ≈ 2,4 Å (Esercitazione 1)."},
{id:"a32",b:"ato",q:"Qual è l'origine della repulsione a corto raggio tra due atomi che si avvicinano?",
o:["La penetrazione delle nuvole elettroniche e il principio di Pauli", "Solo la repulsione elettrostatica fra i nuclei nudi, a qualunque distanza", "La forza magnetica fra gli elettroni dei due atomi che si avvicinano", "L'aumento dell'energia cinetica rotazionale della molecola che si forma"],c:0,
e:"A piccole distanze le shell si sovrappongono: Pauli impedisce la doppia occupazione (promozione a orbitali alti) e la schermatura viene meno. È il muro ripido di ogni potenziale intermolecolare E(R) (Esercitazione 1)."},
{id:"a33",b:"ato",q:"Quali caratteristiche ha il legame ionico?",
o:["È polare e non direzionale, con ioni a shell chiuse sferiche", "È fortemente direzionale e privo di momento di dipolo permanente", "Si forma soltanto fra atomi identici della stessa specie chimica", "Richiede elettroni delocalizzati su tutto il cristallo"],c:0,
e:"Gli ioni a shell chiuse sono sferici: l'attrazione è la stessa in ogni direzione (cristalli ionici compatti). Il legame covalente è invece direzionale (lobi degli orbitali), quello metallico delocalizzato."},
{id:"a34",b:"ato",q:"Per H₂⁺, perché le autofunzioni si cercano nella forma simmetrica/antisimmetrica ψ± = (ψ<sub>A</sub> ± ψ<sub>B</sub>)/√2?",
o:["L'hamiltoniana commuta con l'operatore di parità del centro molecolare", "Perché solo così l'integrale di sovrapposizione I(R) risulta calcolabile", "Perché l'elettrone si trova sempre a metà strada fra i due nuclei", "Per effetto della repulsione elettrostatica e²/4πε₀R fra i nuclei"],c:0,
e:"I due protoni sono identici: il potenziale è simmetrico rispetto al punto medio, [Ĥ, P̂] = 0 → stati gerade (ψ₊) e ungerade (ψ₋). La simmetria decide la struttura ancor prima del calcolo (Esercitazione 1)."},
{id:"a35",b:"ato",q:"Che cos'è l'integrale di sovrapposizione I(R) nel metodo LCAO?",
o:["Quanto gli orbitali dei due atomi si sovrappongono", "L'energia di interazione elettrostatica fra i due nuclei della molecola", "La probabilità di trovare l'elettrone localizzato sull'atomo A", "Il valor medio dell'energia potenziale calcolato sull'orbitale ψ<sub>A</sub>"],c:0,
e:"I(R) → 0 a grandi distanze e → 1 per R → 0. Compare nelle energie E± = (H<sub>AA</sub> ± H<sub>AB</sub>)/(1 ± I): senza sovrapposizione niente legame chimico."},
{id:"a36",b:"ato",q:"Nel metodo LCAO per H₂⁺, che cosa rappresenta l'elemento di matrice H<sub>AB</sub> = ⟨ψ<sub>A</sub>|Ĥ|ψ<sub>B</sub>⟩?",
o:["Il termine di delocalizzazione, o di risonanza, fra i due nuclei", "L'energia dell'atomo A isolato, imperturbato dalla presenza di B", "La repulsione elettrostatica internucleare che destabilizza il legame", "Un termine sempre trascurabile nel calcolo delle energie molecolari"],c:0,
e:"È H<sub>AB</sub> a separare E₊ da E₋: senza di esso i due stati resterebbero degeneri e non ci sarebbe guadagno energetico nel condividere l'elettrone (Esercitazione 1)."},
{id:"a37",b:"ato",q:"Si stima l'energia dello stato fondamentale di un sistema con il metodo variazionale, usando una funzione di prova qualsiasi. Che tipo di stima si ottiene?",
o:["Sempre un limite superiore: E[ψ] ≥ E₀", "Sempre un limite inferiore: E[ψ] ≤ E₀", "Un valore esatto per costruzione, cioè E[ψ] = E₀", "Un valore che oscilla attorno a E₀, senza limite definito"],c:0,
e:"⟨ψ|Ĥ|ψ⟩ ≥ E₀ per qualunque ψ normalizzata. Per questo la sequenza LCAO → Z<sub>eff</sub> variazionale → Kolos-Wolniewicz dà energie di legame via via più vicine (dal basso) al valore sperimentale."},
{id:"a38",b:"ato",q:"Il calcolo LCAO più semplice per H₂⁺ dà D<sub>e</sub> = 1,77 eV a R₀ = 1,32 Å, contro i valori sperimentali 2,79 eV e 1,06 Å. Come si migliora il risultato?",
o:["Rendendo variazionale la carica efficace Z<sub>eff</sub>(R) negli orbitali 1s", "Aggiungendo la correzione relativistica ∝ α² all'energia cinetica", "Includendo lo spin-orbita (con H<sub>SO</sub> ∝ L·S nell'hamiltoniana)", "Trattando i nuclei come particelle quantistiche di massa ridotta μ"],c:0,
e:"Con ψ<sub>1s</sub>(Z<sub>eff</sub>) ottimizzata a ogni R il legame si irrobustisce sensibilmente: lo screening variazionale è lo stesso concetto chiave che spiega le regole di Hund e la tavola periodica (Esercitazione 1)."},
{id:"a39",b:"ato",q:"Si applica il metodo degli orbitali molecolari alla molecola di idrogeno H₂. Quale configurazione descrive lo stato fondamentale?",
o:["ψ₊(1)ψ₊(2) con i due spin in singoletto", "Entrambi gli elettroni nell'orbitale ψ₋", "Un elettrone in ψ₊ e uno in ψ₋", "ψ₊(1)ψ₊(2) con i due spin paralleli"],c:0,
e:"La parte spaziale ψ₊ψ₊ è simmetrica → Pauli impone lo spin antisimmetrico (singoletto χ₀,₀). È la «doppia occupazione» dell'orbitale legante: il legame covalente standard a due elettroni."},
{id:"a40",b:"ato",q:"In H₂, perché lo stato di tripletto di spin richiede una parte spaziale antisimmetrica?",
o:["La funzione d'onda totale di due fermioni deve essere antisimmetrica", "Perché lo stato di tripletto ha sempre energia minore del singoletto", "Per la conservazione del momento angolare totale della molecola", "È una convenzione di segno, senza alcuna conseguenza fisica misurabile"],c:0,
e:"ψ<sub>tot</sub> = (spaziale)×(spin) deve cambiare segno scambiando gli elettroni. La parte spaziale antisimmetrica ha un nodo tra i nuclei → il tripletto di H₂ è antilegante: gli spin decidono la chimica."},
{id:"a41",b:"ato",q:"Scrivendo lo stato MO di H₂ come φ = φ<sup>cov</sup> + φ<sup>ion</sup>, qual è il difetto del metodo MO semplice?",
o:["Pesa al 50% le configurazioni ioniche H⁺H⁻, che è troppo", "Trascura del tutto la parte ionica, assegnandole peso nullo", "Include soltanto configurazioni ioniche, con peso pari al 100%", "Viola il principio di Pauli per gli spin paralleli, con S = 1"],c:0,
e:"Sviluppando ψ₊ψ₊ compaiono con lo stesso peso i termini «un elettrone per nucleo» (covalenti) e «due elettroni sullo stesso nucleo» (ionici). Mescolando φ<sub>α</sub> e φ<sub>β</sub> (CI minima) l'energia scende e il carattere ionico si riduce al valore realistico (Esercitazione 1-2)."},
{id:"a42",b:"ato",q:"In che cosa differisce il metodo di Heitler–London (valence bond) dal metodo MO?",
o:["Costruisce la funzione di prova dagli orbitali degli atomi separati", "Include molte più configurazioni ioniche di quante ne preveda il metodo MO", "Tratta anche i nuclei come particelle quantistiche delocalizzate", "Si applica soltanto alle molecole eteronucleari come HCl o NaCl"],c:0,
e:"φ<sub>HL</sub> = [ψ<sub>A</sub>(1)ψ<sub>B</sub>(2) ± ψ<sub>A</sub>(2)ψ<sub>B</sub>(1)]·χ: ogni elettrone «appartiene» a un atomo. Per H₂ dà R₀ = 0,87 Å e D<sub>e</sub> = 3,2 eV, meglio del MO (2,7 eV) — ma è un caso fortuito (Esercitazione 1-2)."},
{id:"a43",b:"ato",q:"Dal confronto dei modelli per H₂ (sperimentale D<sub>e</sub> = 4,75 eV; MO 2,7; Heitler–London 3,2; HL senza scambio 0,25) quale morale si trae?",
o:["Lo scambio è essenziale: senza, il legame quasi scompare", "Il metodo MO è sempre superiore agli altri: in ogni molecola", "Il legame di H₂ è di natura puramente elettrostatica classica", "I metodi variazionali sovrastimano sistematicamente il legame"],c:0,
e:"Il caso «HL senza scambio» (0,25 eV!) mostra che il legame è quasi tutto quantistico. Kolos–Wolniewicz (variazionale con coordinate ellittiche, 1968) arriva a 4,748 eV: la MQ riproduce l'esperimento con precisione spettroscopica (Esercitazione 1-2)."},
{id:"a44",b:"ato",q:"Gli orbitali molecolari di una molecola biatomica vengono classificati con le lettere σ, π, δ. Quale numero quantico indicano queste lettere?",
o:["Il valore di |Λ|, proiezione di L sull'asse molecolare", "Il numero quantico principale n dell'orbitale atomico di partenza", "Il numero di nodi radiali della funzione d'onda molecolare", "Lo spin totale S dei due elettroni che formano il legame"],c:0,
e:"Nelle molecole biatomiche l'asse rompe la simmetria sferica: si classifica con Λ. Si aggiungono g/u (parità gerade/ungerade rispetto al centro) e * per gli antileganti: es. σ<sub>g</sub>1s legante, σ*<sub>u</sub>1s antilegante."},
{id:"a45",b:"ato",q:"Nell'approssimazione di Born–Oppenheimer si risolve l'equazione del moto dei nuclei di una molecola biatomica. Quale massa compare in questa equazione?",
o:["La massa ridotta μ = M<sub>A</sub>M<sub>B</sub>/(M<sub>A</sub>+M<sub>B</sub>)", "La somma M<sub>A</sub> + M<sub>B</sub> delle masse dei due nuclei", "La massa del solo nucleo più pesante fra M<sub>A</sub> e M<sub>B</sub>", "La massa m dell'elettrone di valenza che forma il legame"],c:0,
e:"Il moto relativo dei due nuclei nel potenziale E<sub>el</sub>(R) è un problema a due corpi → massa ridotta. Da μ dipendono ω₀ = √(k<sub>s</sub>/μ) e I = μR₀²: base degli effetti isotopici."},
{id:"a46",b:"ato",q:"Una molecola biatomica in uno stato Σ ruota attorno al proprio centro di massa. Quale espressione hanno i suoi livelli di energia rotazionale?",
o:["E<sub>R</sub> = (ħ²/2I)·K(K+1), con livelli sempre più spaziati al crescere di K", "E<sub>R</sub> = ħω(K+½), come per un oscillatore armonico", "E<sub>R</sub> ∝ K², con livelli rotazionali equispaziati in energia", "E<sub>R</sub> = costante·K, lineare nel numero quantico rotazionale"],c:0,
e:"È lo spettro del rotatore rigido: spaziature E(K)−E(K−1) = (ħ²/I)K crescenti linearmente — la firma dello spettro rotazionale a righe equispaziate in frequenza. Scala: ħ²/2I ≈ 10⁻³–10⁻⁴ eV (Esercitazione 1-2)."},
{id:"a47",b:"ato",q:"Perché a temperatura ambiente molti livelli rotazionali sono popolati, ma quasi nessun livello vibrazionale?",
o:["k<sub>B</sub>T ≈ 25 meV sta fra le due scale di energia", "Le rotazioni non sono quantizzate, con ΔE → 0 continuo", "Le transizioni vibrazionali con Δv = ±1 sono proibite", "Per il principio di Pauli applicato ai nuclei con spin ½"],c:0,
e:"Statistica di Boltzmann sulle tre scale: rotazioni facilmente eccitate (spettri a molte righe), vibrazioni congelate nel fondamentale, transizioni elettroniche solo con fotoni visibili/UV."},
{id:"a48",b:"ato",q:"In una molecola si sostituisce un atomo di idrogeno con uno di deuterio, senza alterare il legame chimico. Come cambia la frequenza di vibrazione?",
o:["Diminuisce di circa √2, perché μ quasi raddoppia", "Raddoppia, perché per il deuterio si ha M<sub>D</sub> = 2M<sub>H</sub>", "Resta identica: né k<sub>s</sub> né μ cambiano con l'isotopo", "Si annulla: il modo con ħω₀ ≈ 0,5 eV viene congelato"],c:0,
e:"La costante elastica viene da E<sub>el</sub>(R), identica per gli isotopi (Born–Oppenheimer); cambia solo μ. Gli shift isotopici H/D/T degli spettri IR sono la conferma sperimentale (Esercitazione 1-2)."},
{id:"a49",b:"ato",q:"La gerarchia tipica per H₂ è: transizione elettronica ~10 eV, vibrazionale ν̃₀ = 4395 cm⁻¹, rotazionale B = 60,8 cm⁻¹. A quanti eV corrisponde 1 cm⁻¹?",
o:["≈ 1,24·10⁻⁴ eV (E[eV] = numero d'onda/8065)", "≈ 1 eV, come le tipiche transizioni elettroniche", "≈ 10⁻² eV, come i quanti vibrazionali molecolari", "≈ 10⁻⁸ eV, come le transizioni iperfini nucleari"],c:0,
e:"Conversione standard della spettroscopia: 8065 cm⁻¹ per eV. Quindi ħω₀(H₂) ≈ 0,55 eV e B ≈ 7,5 meV: tre ordini di grandezza tra elettronico, vibrazionale e rotazionale (Esercitazione 1-2)."},
{id:"a50",b:"ato",q:"Qual è la differenza tra D<sub>e</sub> e D₀ (energie di dissociazione)?",
o:["D₀ = D<sub>e</sub> − ħω₀/2", "D₀ = D<sub>e</sub> + ħω₀/2, perché il punto zero va aggiunto", "Sono la stessa quantità, misurata", "D₀ è l'energia puramente elettronica"],c:0,
e:"D<sub>e</sub> si misura dal minimo della curva E(R), ma la molecola non può stare sul minimo: il livello v = 0 sta ħω₀/2 sopra. Ciò che si misura dissociando è D₀ (H₂: 4,48 eV misurata vs D<sub>e</sub> = 4,75 eV)."},
{id:"a51",b:"ato",q:"Nello spettro rotovibrazionale IR di una molecola biatomica si osservano due «branche» (P ed R) con un buco al centro. Perché?",
o:["ΔK = ±1, la riga Q con ΔK = 0 è assente negli stati Σ", "Per l'effetto Doppler, con larghezza proporzionale a √(T/M)", "Per l'anarmonicità del potenziale, che cresce come (R−R₀)³", "Per la degenerazione 2K+1 dei livelli rotazionali coinvolti"],c:0,
e:"Il fotone porta un quanto di momento angolare: K deve cambiare di ±1. Branca R (ΔK = +1) a energie sopra ħω₀, branca P (ΔK = −1) sotto: dal passo tra le righe si misura B e quindi R₀."},
{id:"a52",b:"ato",q:"Nell'equazione radiale che descrive il moto dei nuclei di una molecola compare il termine ħ²K(K+1)/2μR². Quale contributo fisico rappresenta?",
o:["Il potenziale centrifugo che si aggiunge a E<sub>el</sub>(R)", "Un termine di scambio fra i due elettroni della molecola", "La correzione relativistica all'energia cinetica nucleare", "L'interazione fra spin elettronico e rotazione molecolare"],c:0,
e:"Come nell'atomo di idrogeno: il moto 3D si riduce a un problema radiale 1D con potenziale efficace E<sub>el</sub>(R) + termine centrifugo. Per K grandi il minimo si sposta (distorsione centrifuga)."},
{id:"a53",b:"ato",q:"Che cosa rappresenta H<sub>AA</sub> = ⟨ψ<sub>A</sub>|Ĥ|ψ<sub>A</sub>⟩ nel metodo LCAO per H₂⁺?",
o:["L'energia dell'atomo A quasi imperturbato", "Il termine di risonanza che delocalizza l'elettrone fra i due nuclei", "L'integrale di sovrapposizione fra gli orbitali 1s dei due atomi", "L'energia cinetica associata al moto dei due nuclei"],c:0,
e:"H<sub>AA</sub> contiene E<sub>1s</sub> più i termini «di campo» dell'altro centro: da solo non produce legame. La separazione legante/antilegante viene tutta da H<sub>AB</sub> (Esercitazione 1)."},
{id:"a54",b:"ato",q:"Si vuole rappresentare una transizione elettronica sul diagramma dell'energia in funzione della distanza internucleare E(R). Come appare secondo Franck–Condon?",
o:["Una transizione verticale a R fisso sul diagramma E(R)", "Una transizione che segue con continuità la curva di potenziale", "Un salto orizzontale, cioè a energia totale costante", "Una transizione che parte sempre da v = 0 e arriva a v′ = 0"],c:0,
e:"Gli elettroni si riarrangiano in tempi ≪ del periodo vibrazionale: R non cambia durante la transizione. Se le curve dei due stati elettronici sono spostate, la verticale «atterra» su v′ &gt; 0: progressioni vibrazionali negli spettri elettronici."},
// ---- Atomica: configurazioni e termini (Es. 3), Zeeman (Es. 4) ----
{id:"a55",b:"ato",q:"Quanti microstati ha la configurazione 2p² del carbonio?",
o:["15, le combinazioni di 2 elettroni su 6 stati di spin-orbitale, C(6,2)", "36, cioè 6 stati per il primo elettrone × 6 per il secondo", "6, quanti gli stati di spin-orbitale disponibili", "20, come per la configurazione 2p³ dell'azoto"],c:0,
e:"6 stati disponibili (3 valori di m<sub>l</sub> × 2 di m<sub>s</sub>), 2 elettroni indistinguibili: 6!/(2!4!) = 15. La tabella dei microstati li smista nei termini ¹D₂ (5) + ³P₀,₁,₂ (9) + ¹S₀ (1) = 15 ✓ (Esercitazione 3)."},
{id:"a56",b:"ato",q:"L'azoto ha configurazione 2p³. Quanti microstati e quale termine fondamentale?",
o:["20 microstati (C(6,3)); fondamentale ⁴S₃/₂", "15 microstati, con termine fondamentale ³P₀", "20 microstati, con termine fondamentale ²D₅/₂", "8 microstati, con termine fondamentale ⁴P₅/₂"],c:0,
e:"6!/(3!3!) = 20. Con il metodo grafico: 3 spin paralleli su m<sub>l</sub> = 1, 0, −1 → S = 3/2, L = 0 → ⁴S₃/₂ (gli altri termini sono ²P e ²D). Subshell semipiena → L = 0, come per 3d⁵ (Esercitazione 3)."},
{id:"a57",b:"ato",q:"Un atomo si trova nella configurazione eccitata 4p¹4d¹, in cui i due elettroni non sono equivalenti. Quali termini spettroscopici sono permessi?",
o:["Tutti quelli permessi dall'algebra dei momenti angolari", "Solo quelli con S e L pari, come per la configurazione 2p²", "Soltanto i termini di tripletto, per la prima regola di Hund", "Soltanto ¹P₁ e ³P₀, gli unici compatibili con Pauli"],c:0,
e:"Con n o l diversi gli elettroni sono distinguibili dai numeri quantici: Pauli non elimina nulla. S = 0,1 e L = 1,2,3 danno tutti i 12 livelli; l'ordine energetico segue Hund: prima S, poi L, poi J (Esercitazione 3)."},
{id:"a58",b:"ato",q:"Uno ione dei metalli di transizione ha configurazione nd⁴ ed è trattato come ione libero. Qual è il suo termine spettroscopico fondamentale?",
o:["⁵D₀, con S = 2, L = 2 e J = |L−S| = 0", "⁵D₄, perché la subshell è oltre metà riempimento", "³F₂, con spin non massimo per effetto della repulsione", "¹S₀, con tutti gli spin accoppiati a due a due"],c:0,
e:"Metodo grafico: 4 frecce parallele nelle caselle m<sub>l</sub> = 2, 1, 0, −1 → S = 2, M<sub>L</sub> = 2 → L = 2. Meno che semipiena → J minimo = 0. Esempio: Cr²⁺, Mn³⁺ (Esercitazione 3)."},
{id:"a59",b:"ato",q:"Si considerano le shell più interne di un atomo pesante, con Z grande. Come scalano con Z l'energia di legame e il raggio medio di quegli orbitali?",
o:["E ≈ (Z−2)²·E<sub>H</sub> e ⟨r⟩ ≈ a₀/(Z−2) quasi idrogenoidi", "E ≈ E<sub>H</sub>/Z² e ⟨r⟩ ≈ Z·a₀, con orbitali molto espansi", "E ≈ Z·E<sub>H</sub> e ⟨r⟩ ≈ a₀, indipendenti dallo schermo", "Né l'energia né il raggio dipendono dal numero atomico Z"],c:0,
e:"Un elettrone 1s vede il nucleo schermato quasi solo dall'altro 1s: Z<sub>eff</sub> ≈ Z−2 (per Z grande vale ~Z). Energie di legame di keV → spettroscopia X e legge di Moseley (Esercitazione 3)."},
{id:"a60",b:"ato",q:"Si considerano ora gli elettroni delle shell più esterne di un atomo neutro. Quale ordine di grandezza ha la loro energia di legame?",
o:["Qualche eV, quasi indipendente da Z", "Cresce come Z², arrivando a decine di keV negli atomi pesanti", "Decresce come 1/Z², fino a frazioni di meV nei pesanti", "Vale sempre esattamente 13,6 eV"],c:0,
e:"Le shell chiuse interne schermano quasi tutta la carica: l'elettrone esterno è quasi idrogenoide (⟨r⟩ ≈ n·a₀, E ≈ E<sub>H</sub>). Per questo la chimica coinvolge sempre energie di pochi eV, dall'idrogeno all'uranio (Esercitazione 3)."},
{id:"a61",b:"ato",q:"Perché nel potassio il 4s si riempie prima del 3d?",
o:["Il 4s penetra verso il nucleo e scende sotto il 3d", "Perché n = 4 &gt; 3 implica sempre un'energia di legame minore", "Per lo spin-orbita sugli orbitali d, che scala come Z⁴", "Per l'indeterminazione ΔrΔp ≈ ħ applicata al raggio orbitale"],c:0,
e:"Il termine centrifugo tiene il 3d lontano dal nucleo, il 4s penetra le shell chiuse: E(4s) &lt; E(3d) negli atomi neutri. Origine dei metalli di transizione e delle loro configurazioni [Ar]3d<sup>n</sup>4s<sup>1,2</sup> (Esercitazione 3)."},
{id:"a62",b:"ato",q:"Un bersaglio metallico viene bombardato con elettroni veloci ed emette la riga X caratteristica K<sub>α</sub>. Quale transizione elettronica la produce?",
o:["Un elettrone della shell L riempie una lacuna nella shell K", "Un elettrone di valenza viene espulso dall'atomo per urto", "Il nucleo si diseccita emettendo un fotone di alta energia", "Un elettrone libero viene catturato in una shell profonda vuota"],c:0,
e:"Bombardando con elettroni si crea la lacuna profonda; la transizione 2p → 1s emette un fotone di ~keV con 1/λ ∝ (Z−a)² (Moseley). Le serie K, L, M dipendono dalla shell della lacuna (Esercitazione 3)."},
{id:"a63",b:"ato",q:"Come varia l'affinità elettronica lungo un periodo della tavola?",
o:["Cresce da sinistra a destra, con massimi agli alogeni", "Decresce da sinistra a destra lungo tutto il periodo", "È costante lungo il periodo e cambia solo fra periodi diversi", "È massima per gli alcalini e minima per i gas nobili"],c:0,
e:"Z<sub>eff</sub> cresce lungo il periodo (lo schermo dei compagni di shell è inefficace): l'elettrone extra è sempre più legato, finché la shell si chiude. Complementare all'energia di ionizzazione, anch'essa crescente (Esercitazione 3)."},
{id:"a64",b:"ato",q:"Alcuni stati atomici eccitati hanno vita media eccezionalmente lunga e vengono detti metastabili. Quale condizione li caratterizza?",
o:["Tutte le transizioni di dipolo verso stati inferiori sono proibite", "Ha energia esattamente doppia rispetto a quella dello stato fondamentale", "È lo stato fondamentale di uno ione dello stesso elemento", "Ha vita media nulla e decade istantaneamente per emissione"],c:0,
e:"Esempio classico: livelli con ΔS ≠ 0 o ΔJ = 0→0 verso tutti gli stati inferiori. Decadono via dipolo magnetico/quadrupolo (vite medie lunghissime): essenziali per l'inversione di popolazione nei laser (problema d'esame sull'O eccitato, Esercitazione 3)."},
{id:"a65",b:"ato",q:"Si confrontano le tre scale di energia dell'atomo: struttura di Bohr, interazione spin-orbita e Zeeman in campo di 1 T. In quale rapporto stanno fra loro?",
o:["eV : 10⁻³ eV (∝ α⁴mc²) : 10⁻⁵ eV", "Tutte e tre confrontabili (dell'ordine dell'elettronvolt)", "10⁻⁵ eV : 10⁻³ eV : 1 eV, in ordine crescente", "eV : eV : eV, distinte soltanto dal segno della correzione"],c:0,
e:"E<sub>Bohr</sub> ≈ α²mc²/2 = 13,6 eV; E<sub>SO</sub> ≈ α⁴mc² ≈ meV; E<sub>Z</sub> = μ<sub>B</sub>B ≈ 5,8·10⁻⁵ eV/T. La teoria delle perturbazioni si applica in cascata: prima la struttura fine, poi lo Zeeman (Esercitazione 4)."},
{id:"a66",b:"ato",q:"Che cosa distingue il regime Zeeman dal regime Paschen–Back?",
o:["Il confronto fra B<sub>ext</sub> e il campo interno dello spin-orbita", "La temperatura del vapore atomico contenuto nella cella di misura", "La polarizzazione della luce usata per l'osservazione", "Il valore del numero quantico principale n dell'orbitale"],c:0,
e:"B<sub>int</sub> è il campo efficace visto dallo spin per il moto orbitale. B<sub>ext</sub> &lt; B<sub>int</sub>: J buon numero quantico, E = g<sub>J</sub>m<sub>J</sub>μ<sub>B</sub>B. B<sub>ext</sub> &gt; B<sub>int</sub>: L e S precedono separatamente, E = (m<sub>l</sub>+2m<sub>s</sub>)μ<sub>B</sub>B (Esercitazione 4)."},
{id:"a67",b:"ato",q:"Un vapore di cadmio in campo magnetico emette la riga rossa a 643,8 nm, corrispondente alla transizione ¹D₂ → ¹P₁. Quante righe si osservano nello spettro?",
o:["3 righe equispaziate, perché g<sub>J</sub> = 1 per entrambi i livelli", "9 righe distinte, una per ciascuna delle transizioni permesse", "5 righe, quanti i 2J+1 sottolivelli del termine ¹D₂", "1 riga sola: con g<sub>J</sub> = 1 lo Zeeman non separa i singoletti"],c:0,
e:"I singoletti hanno g = 1: i pettini di sottolivelli dei due termini hanno la stessa spaziatura μ<sub>B</sub>B, quindi le transizioni si raggruppano per Δm<sub>J</sub>. È lo Zeeman «normale», spiegabile senza spin (Esercitazione 4)."},
{id:"a68",b:"ato",q:"Nella riga gialla del sodio (²P₁/₂ → ²S₁/₂) in campo debole si osservano 4 righe e la riga centrale scompare. Perché?",
o:["g(²S₁/₂) = 2 e g(²P₁/₂) = 2/3, quindi splitting diversi", "Per l'effetto Doppler termico (con Δν/ν ≈ 10⁻⁶ nel vapore)", "Perché la transizione con ΔJ = 0 è rigorosamente proibita", "Per l'autoassorbimento della riga a 589 nm nel vapore denso"],c:0,
e:"Le 4 transizioni (Δm<sub>J</sub> = 0, ±1 tra 2+2 sottolivelli) cadono a ±⅓ΔE₁ e ±⅔ΔE₁ attorno alla riga imperturbata, con ΔE₁ = 2μ<sub>B</sub>B: spaziature ⅓, ⅔, ⅓. Lo spettro «anomalo» rivela g<sub>J</sub> e quindi lo spin (Esercitazione 4)."},
{id:"a69",b:"ato",q:"Nell'apparato di spettroscopia Zeeman si eccita il vapore con una scarica elettrica invece che otticamente. Perché?",
o:["L'urto elettronico non è vincolato dalle regole di dipolo", "Perché la luce ultravioletta non attraversa il vetro della cella", "Per riscaldare il vapore e aumentarne la densità atomica", "Per polarizzare gli atomi lungo la direzione del campo"],c:0,
e:"Le regole ΔS = 0, ΔL = ±1… valgono per i fotoni (dipolo), non per gli urti. Si studia poi l'EMISSIONE durante il rilassamento, dove le regole di dipolo tornano a selezionare le righe (Esercitazione 4)."},
{id:"a70",b:"ato",q:"Un vapore di sodio è immerso in un campo magnetico molto intenso, in regime di Paschen–Back. Quali valori assume la quantità m<sub>l</sub>+2m<sub>s</sub> per il livello 3p?",
o:["2, 1, 0, 0, −1, −2, sei stati, due dei quali degeneri a 0", "3, 2, 1, 0, −1, −2, −3, cioè sette valori distinti", "±1/2 soltanto, come per lo stato fondamentale 3s", "2, 1, −1, −2, senza alcuna degenerazione residua"],c:0,
e:"m<sub>l</sub> ∈ {1,0,−1} e m<sub>s</sub> = ±½: (m<sub>l</sub>+2m<sub>s</sub>) dà 2,1,0,0,−1,−2. Con le regole Δm<sub>l</sub> = 0,±1 e Δm<sub>s</sub> = 0 verso 3s (±1) restano 3 energie: lo spettro «ritorna normale» (Esercitazione 4)."},
{id:"a71",b:"ato",q:"Quale regola di selezione aggiuntiva vale in regime di Paschen–Back?",
o:["Δm<sub>s</sub> = 0, il fotone non agisce sullo spin", "Δm<sub>l</sub> = ±2, per la doppia unità di momento del fotone", "ΔS = ±1, perché lo spin si disaccoppia dall'orbitale", "Δn = 0, cioè transizioni solo entro la stessa shell"],c:0,
e:"Con L e S disaccoppiati, la transizione di dipolo cambia solo la parte orbitale (Δl = ±1, Δm<sub>l</sub> = 0,±1) lasciando lo spin intatto. È questo a ridurre le righe da 4 (anomalo) a 3 (normale)."},
{id:"a72",b:"ato",q:"Nel 1922 Stern e Gerlach fecero passare un fascio di atomi d'argento attraverso un campo magnetico disomogeneo, osservandone la separazione. Che cosa dimostrarono?",
o:["Il momento magnetico atomico è quantizzato spazialmente", "Che gli atomi d'argento sono elettricamente neutri nel fascio", "Che il momento angolare orbitale assume valori continui", "Che anche i nuclei atomici possiedono un momento di spin"],c:0,
e:"Un fascio di atomi d'argento in campo disomogeneo si divide in 2 (non in una banda continua): quantizzazione di m<sub>J</sub> — e col senno di poi, prova dello spin ½ dell'elettrone (2J+1 = 2)."},
{id:"a73",b:"ato",q:"Perché i gas nobili non mostrano effetto Zeeman al primo ordine?",
o:["Il fondamentale è ¹S₀, quindi J = 0", "Perché sono inerti, con energia di ionizzazione &gt; 12 eV", "Perché hanno tutti un numero atomico Z pari", "Perché lo spin-orbita, che va come Z⁴, protegge i livelli"],c:0,
e:"Shell chiuse → L = S = J = 0: lo stato è non degenere e μ = 0. Resta solo la risposta diamagnetica (secondo ordine). Lo stesso vale per ogni ione a shell chiuse (Na⁺, Cl⁻…)."},
{id:"a74",b:"ato",q:"Si calcola con la formula di Landé il fattore g del termine ²P₁/₂ del sodio, responsabile dello Zeeman anomalo. Quale valore si ottiene?",
o:["g = 2/3, il momento magnetico è «ridotto»", "g = 2, come per tutti i termini con L = 0", "g = 1, valore tipico dei termini di singoletto", "g = 4/3, come per il termine ²P₃/₂"],c:0,
e:"g = 1 + [J(J+1)−L(L+1)+S(S+1)]/[2J(J+1)] = 1 + (¾−2+¾)/(3/2) = 2/3. Con J = 3/2 invece: g = 4/3. Questi due numeri generano lo Zeeman anomalo del sodio (Esercitazione 4)."},
{id:"a75",b:"ato",q:"Qual è l'origine fisica della prima regola di Hund (S massimo)?",
o:["Con spin paralleli gli elettroni si evitano e la repulsione cala", "L'interazione magnetica diretta fra i momenti di spin degli elettroni", "L'attrazione fra lo spin elettronico e il momento magnetico nucleare", "La minimizzazione dell'energia cinetica orbitale degli elettroni"],c:0,
e:"Non è un effetto magnetico: è elettrostatica + antisimmetria. Il «buco di Fermi» tra elettroni a spin parallelo riduce ⟨1/r₁₂⟩. Lo stesso meccanismo, tra atomi, genera il ferromagnetismo (integrale di scambio)."},
{id:"a76",b:"ato",q:"Le regole di Hund permettono di ordinare in energia i termini spettroscopici di una configurazione. In quali limiti sono affidabili?",
o:["Solo per il termine fondamentale di una configurazione", "Per ordinare l'intero spettro dei termini di ogni atomo", "Soltanto per gli atomi con un solo elettrone ottico", "Soltanto in presenza di un campo magnetico esterno"],c:0,
e:"Per il C prevedono correttamente ³P₀ &lt; ¹D₂ &lt; ¹S₀, ma in generale l'ordine dei termini eccitati può violarle: sono regole empiriche giustificate dallo scambio solo per lo stato più basso (Esercitazione 3)."},
{id:"a77",b:"ato",q:"Perché la riga D del sodio è un doppietto (589,0 e 589,6 nm) già a campo nullo?",
o:["Per lo spin-orbita, il 3p si separa in ²P₃/₂ e ²P₁/₂", "Per lo Zeeman del campo terrestre, B ≈ 5·10⁻⁵ T", "Per la struttura iperfine dovuta allo spin nucleare I = 3/2", "Per collisioni fra atomi, con frequenza dell'ordine di 10⁹ s⁻¹"],c:0,
e:"H<sub>SO</sub> ∝ L·S separa i due J = 3/2, 1/2 di ~2 meV. Le due righe verso ²S₁/₂ sono il doppietto giallo. In campo esterno debole ciascuna si separa ulteriormente (Zeeman anomalo)."},
// ---- Atomica: effetto Stark (Es. 5) e completamenti ----
{id:"a78",b:"ato",q:"Si studia l'effetto Stark sull'idrogeno trattando H′ = eεz come perturbazione prima della struttura fine. In quali condizioni questo ordine è lecito?",
o:["Il campo è tale che lo shift Stark supera lo spin-orbita", "Il campo elettrico applicato è molto debole, con eεa₀ ≪ 1 meV", "L'atomo si trova nello stato fondamentale non degenere, n = 1", "Quando il campo è tale che eεa₀ ≪ ΔE<sub>SO</sub> ≈ 2 meV"],c:0,
e:"Le perturbazioni si applicano in ordine di grandezza decrescente. Con ε intensi, eεa₀ supera i meV dello spin-orbita: si diagonalizza H′ sulla shell degenere ignorando la struttura fine (Esercitazione 5)."},
{id:"a79",b:"ato",q:"Nella matrice 4×4 dello Stark su n = 2, quali regole annullano quasi tutti gli elementi ⟨2l′m′|z|2lm⟩?",
o:["[L<sub>z</sub>, z] = 0 → m′ = m, e la parità impone l′ ≠ l", "Soltanto la conservazione dell'energia totale del sistema", "La regola di selezione ΔS = 0 sullo spin totale", "Nessuna: la matrice 4×4 è completamente piena"],c:0,
e:"z conserva m (simmetria cilindrica attorno al campo) e connette solo parità opposte: dei 16 elementi resta ⟨200|z|210⟩ = −3a₀. La simmetria fa il 90% del lavoro prima di ogni integrale (Esercitazione 5)."},
{id:"a80",b:"ato",q:"Gli autostati dello Stark lineare su n = 2 sono (ψ₂₀₀ ∓ ψ₂₁₀)/√2 con energie ±3eεa₀. Che proprietà notevole hanno?",
o:["Non hanno parità definita e hanno dipolo permanente d = 3ea₀", "Restano autostati sia di L² sia dell'operatore di parità spaziale", "Hanno momento di dipolo nullo per ragioni di simmetria", "Sono gli stati con m = ±1, imperturbati dal campo elettrico"],c:0,
e:"Il campo mescola 2s e 2p₀ (degeneri): i «buoni» stati hanno carica spostata lungo z, cioè dipolo statico — possibile solo per la degenerazione accidentale s-p dell'idrogeno. ψ₂₁±₁ restano imperturbati (Esercitazione 5)."},
{id:"a81",b:"ato",q:"Un atomo qualsiasi si trova nel suo stato fondamentale, che è non degenere, e viene immerso in un campo elettrico. Che carattere ha l'effetto Stark risultante?",
o:["Quadratico: E⁽²⁾ = −½αε² &lt; 0, con α polarizzabilità", "Lineare in ε, con dipolo permanente pari a d = 3ea₀", "Nullo a tutti gli ordini, cioè E⁽¹⁾ = E⁽²⁾ = 0", "Positivo: E⁽²⁾ &gt; 0, il campo alza il fondamentale"],c:0,
e:"E⁽¹⁾ = 0 per parità (stato non degenere ⇒ parità definita). Al 2° ordine tutti i termini sono negativi per il fondamentale. Il dipolo d = αε è indotto dal campo, a differenza degli ibridi dello Stark lineare (Esercitazione 5)."},
{id:"a82",b:"ato",q:"Per stimare l'effetto Stark quadratico sul fondamentale dell'idrogeno si maggiorano i denominatori e si usa la relazione di completezza. Quale risultato si ottiene?",
o:["Σ′|⟨nlm|z|100⟩|² = ⟨z²⟩₁₀₀ = a₀² (un terzo di ⟨r²⟩ = 3a₀²)", "Σ′|⟨nlm|z|100⟩|² = 0, perché z è dispari sotto parità", "⟨z⟩₁₀₀ = a₀, cioè il raggio medio dell'orbitale 1s", "⟨r⟩₁₀₀ = a₀/2, metà del raggio di Bohr dell'idrogeno"],c:0,
e:"Maggiorando i denominatori con E₂−E₁ e usando Σ|n⟩⟨n| = 1: la somma delle |⟨z⟩|² diventa ⟨z²⟩ nel fondamentale = ⅓⟨r²⟩ = a₀² (per simmetria sferica). Tecnica standard da sapere all'orale (Esercitazione 5)."},
{id:"a83",b:"ato",q:"Un atomo a molti elettroni nello stato |γ, J, M<sub>J</sub>⟩ viene posto in un campo elettrico uniforme. Quale forma assume lo shift Stark al secondo ordine?",
o:["E⁽²⁾ = ε²(A + B·M<sub>J</sub>²), degenere in ±M<sub>J</sub>", "E⁽²⁾ ∝ M<sub>J</sub>, quindi rimuove completamente la degenerazione", "E⁽²⁾ identico per tutti gli M<sub>J</sub> del livello considerato", "E⁽²⁾ = 0 sempre, come la correzione del primo ordine"],c:0,
e:"z è pari sotto inversione temporale combinata con rotazione di π: gli stati ±M<sub>J</sub> restano degeneri (a differenza dello Zeeman, che è dispari in M<sub>J</sub>). Regole: ΔM<sub>J</sub> = 0, J′ = J±1 con parità opposta (Esercitazione 5)."},
{id:"a84",b:"ato",q:"Come scala l'effetto Stark quadratico per un atomo idrogenoide di carica Z?",
o:["Come 1/Z⁴: gli orbitali si contraggono", "Come Z², perché il campo interno cresce", "È indipendente da Z: dipende solo dal numero quantico n", "Come Z⁴, allo stesso modo dell'interazione spin-orbita"],c:0,
e:"E⁽²⁾ ∝ ε²a³/Z⁴ (a³ dal volume, 1/Z⁴ complessivo): gli ioni pesanti sono molto più «rigidi» da polarizzare. Coerente con α ∝ volume atomico (Esercitazione 5)."},
{id:"a85",b:"ato",q:"Nell'elio, a parità di configurazione eccitata (es. 1s2s), lo stato di tripletto (ortoelio) sta sotto il singoletto (paraelio). Perché?",
o:["Per l'energia di scambio, che tiene lontani gli elettroni", "Per l'interazione magnetica diretta fra i due spin elettronici", "Per l'accoppiamento spin-orbita, più forte nello stato eccitato", "Per la massa finita del nucleo e il conseguente rinculo"],c:0,
e:"E = E₀ + J ± K: il segno dello scambio favorisce il tripletto negli atomi (1ª regola di Hund). Nelle molecole avviene l'opposto (il legame preferisce il singoletto): confronto concettuale da orale."},
{id:"a86",b:"ato",q:"Lo ione gadolinio Gd³⁺ ha configurazione 4f⁷, con la subshell esattamente semipiena. Qual è il suo termine spettroscopico fondamentale?",
o:["⁸S₇/₂: S = 7/2, L = 0 (subshell semipiena)", "⁶H₁₅/₂, come per lo ione disprosio Dy³⁺ (4f⁹)", "⁷F₆, con momento orbitale massimo compatibile", "²F₇/₂, come per un solo elettrone nella shell f"],c:0,
e:"Sette elettroni f a spin paralleli su m<sub>l</sub> = 3…−3: M<sub>L</sub> = 0. p<sub>eff</sub> = 2√(7/2·9/2) = 7,94, contro 7,98 sperimentale: uno dei migliori accordi della teoria (Esercitazione 17)."},
{id:"a87",b:"ato",q:"Lo ione cerio Ce³⁺ ha configurazione 4f¹, con un solo elettrone nella shell interna. Qual è il suo termine spettroscopico fondamentale?",
o:["²F₅/₂, con un solo elettrone f e J = |L−S| = 5/2", "²F₇/₂, come per le subshell oltre metà riempimento", "¹F₃, con i due spin accoppiati in singoletto", "⁴F₃/₂, con molteplicità di spin pari a quattro"],c:0,
e:"S = 1/2, L = 3; terza regola di Hund con shell &lt; metà: J = 3−1/2 = 5/2. g<sub>J</sub> = 6/7, p<sub>eff</sub> = 2,54 (sperimentale 2,51). Primo esempio della tabella delle terre rare (Esercitazione 17)."},
{id:"a88",b:"ato",q:"Il termine fondamentale del Dy³⁺ (4f⁹) è ⁶H₁₅/₂. Quale regola fissa J = 15/2?",
o:["Subshell più che semipiena, quindi J = L + S", "La terza regola di Hund impone sempre J minimo", "J = L − S vale per qualunque configurazione elettronica", "La regola dell'intervallo di Landé sulle spaziature"],c:0,
e:"Con 9 elettroni f: S = 5/2, L = 5 (H). Oltre metà riempimento lo spin-orbita cambia segno effettivo → J massimo. p<sub>eff</sub> = 10,65 vs 10,63 sperimentale: record di accordo (Esercitazione 17)."},
{id:"a89",b:"ato",q:"L'europio ([Xe]4f⁷6s²) ha termine fondamentale ⁸S₇/₂. In campo debole, in quante righe si separa il livello?",
o:["8 = 2J+1 sottolivelli, equispaziati di g<sub>J</sub>μ<sub>B</sub>B con g<sub>J</sub> = 2", "7 sottolivelli, cioè 2J come per i livelli interi", "15 sottolivelli, cioè (2J+1) del livello orbitale L = 7", "2 sottolivelli, come per un momento di puro spin ½"],c:0,
e:"J = 7/2 → 2J+1 = 8; con L = 0, g<sub>J</sub> = 2 (puro spin). Problema del tema d'esame di maggio: seguiva lo stato eccitato 4f⁶6p¹ con il suo g<sub>J</sub> «strano» e l'ordine delle righe."},
{id:"a90",b:"ato",q:"Per lo ione Sn²⁺ eccitato (5s¹5p¹), i termini possibili sono ¹P₁ e ³P₀,₁,₂. Quale transizione verso il fondamentale ¹S₀ è permessa in dipolo elettrico?",
o:["Solo ¹P₁ → ¹S₀, le altre violano ΔS = 0 (o ΔJ = 0→0)", "Tutte e quattro, perché ΔJ = 0, ±1 è sempre rispettata", "Solo ³P₁ → ¹S₀, unica compatibile con la parità", "Solo ³P₀ → ¹S₀, perché conserva il momento angolare"],c:0,
e:"ΔS = 0 elimina i tripletti; ³P₀ → ¹S₀ violerebbe anche J = 0 → 0. Ma con Z = 50 lo schema LS è imperfetto (stati non puri di S): le righe di intercombinazione compaiono deboli — commento richiesto all'appello di giugno."},
{id:"a91",b:"ato",q:"Si misurano le separazioni fra i tre livelli J del multipletto ³P₀,₁,₂ di un atomo leggero. Quale regolarità prevede la regola degli intervalli di Landé?",
o:["E(J)−E(J−1) ∝ J, quindi E₂−E₁ = 2α e E₁−E₀ = α", "I tre livelli del multipletto sono equispaziati, con ΔE costante", "E(J) ∝ J², con spaziature che crescono quadraticamente", "Le separazioni sono casuali, senza alcuna legge in J"],c:0,
e:"⟨L·S⟩ = ħ²[J(J+1)−L(L+1)−S(S+1)]/2 → differenze ∝ J. Dalle separazioni misurate si ricava α (per Sn²⁺: α = (E₃−E₁)/6 = 0,117 eV all'appello di giugno). Deviazioni dalla regola segnalano che LS sta cedendo."},
{id:"a92",b:"ato",q:"Come scala l'interazione spin-orbita con il numero atomico Z?",
o:["Circa come Z⁴ (per gli elettroni interni)", "Come Z, cioè linearmente con la carica del nucleo atomico", "Come 1/Z: negli atomi pesanti diventa trascurabile", "È indipendente da Z e dipende solo dai numeri quantici"],c:0,
e:"H<sub>SO</sub> ∝ (1/r)dV/dr: vicino a un nucleo poco schermato cresce ~Z⁴. A Z ≈ 50–60 diventa confrontabile con la repulsione residua: accoppiamento intermedio, poi jj (Au, Pb)."},
{id:"a93",b:"ato",q:"Per stabilire se una transizione di dipolo è permessa occorre conoscere la parità della configurazione elettronica. Come si determina?",
o:["(−1) elevato alla somma degli l di tutti gli elettroni", "(−1) elevato al momento angolare orbitale totale L", "(−1) elevato al momento angolare totale J del termine", "(−1) elevato al numero totale N di elettroni dell'atomo"],c:0,
e:"Parità = (−1)^Σl<sub>i</sub>. La transizione di dipolo richiede cambio di parità (operatore dispari): da qui Δl = ±1 per l'elettrone che salta. Nota: la parità NON è (−1)^L — errore frequente."},
{id:"a94",b:"ato",q:"Perché scrivere la funzione d'onda a N elettroni come determinante di Slater garantisce il principio di Pauli?",
o:["Scambiare due elettroni scambia due righe, cambiando segno", "Perché il valore del determinante di Slater è sempre positivo", "Perché diagonalizza esattamente l'hamiltoniana a molti corpi", "Non lo garantisce affatto: serve una correzione aggiuntiva"],c:0,
e:"L'antisimmetria e l'esclusione sono automatiche nell'algebra dei determinanti. Hartree–Fock usa proprio un determinante di prova: il termine di scambio nell'energia nasce da lì (Esercitazione 3)."},
{id:"a95",b:"ato",q:"Nella molecola di NH₃, i due stati «azoto sopra/sotto il piano degli idrogeni» formano un sistema a due livelli con Δ ≈ 10⁻⁴ eV. Quale applicazione ne è nata?",
o:["Il MASER di Townes, a 23,87 GHz", "Il laser a elio-neon, con la sua riga rossa a 632,8 nm", "La risonanza magnetica nucleare usata in diagnostica", "L'orologio atomico al cesio"],c:0,
e:"Gli stati simmetrico/antisimmetrico dell'inversione sono separati da ~0,1 meV (microonde). Selezionando le molecole eccitate con un campo elettrico (Stark) si ottiene l'inversione di popolazione: primo «laser» della storia (Esercitazione 9)."},
{id:"a96",b:"ato",q:"Quale grandezza è direttamente misurata dalla spettroscopia di fotoemissione X (XPS) o dalle righe di Moseley?",
o:["Le energie di legame delle shell profonde, ∝ (Z−a)²", "La massa atomica dell'elemento (con precisione elevatissima)", "Il raggio del nucleo atomico e la sua distribuzione di carica", "La valenza chimica e il numero di legami che l'atomo forma"],c:0,
e:"Le shell interne sono quasi idrogenoidi e insensibili ai legami chimici: ogni elemento ha le sue righe K, L caratteristiche. Moseley (1913) ordinò così la tavola periodica per Z e non per massa (Esercitazione 3)."},
{id:"a97",b:"ato",q:"Un atomo che si trova in un livello con momento angolare totale J = 0, come il ³P₀, viene posto in un campo magnetico debole. Che cosa accade al livello?",
o:["Non si separa: 2J+1 = 1", "Si separa in 3 componenti", "Si separa in 2L+1 componenti", "Scompare dallo spettro"],c:0,
e:"La degenerazione Zeeman è 2J+1, non 2S+1 né 2L+1: con J = 0 lo stato è unico e non ha momento magnetico al 1° ordine (come i fondamentali ¹S₀ e i ³P₀ dei gruppi IV)."},
{id:"a98",b:"ato",q:"Nel metodo di Hartree ogni elettrone si muove in un potenziale efficace a simmetria sferica. Quali contributi comprende questo potenziale?",
o:["L'attrazione nucleare più la repulsione media degli altri", "Soltanto l'attrazione coulombiana esercitata dal nucleo atomico", "La repulsione istantanea di ciascuno degli altri N−1 elettroni", "Soltanto l'eventuale campo elettrostatico esterno applicato"],c:0,
e:"V<sub>i</sub>(r) = −Ze²/4πε₀r + Σ<sub>j≠i</sub>∫|ψ<sub>j</sub>|²e²/(4πε₀|r−r′|)d³r′: campo medio. Trascura le correlazioni istantanee (e in Hartree semplice anche lo scambio, aggiunto da Fock)."},
{id:"a99",b:"ato",q:"Si riportano in grafico le energie di prima ionizzazione degli elementi in funzione del numero atomico Z. Quale andamento si osserva?",
o:["Massimi ai gas nobili e minimi agli alcalini", "Crescita monotona con Z lungo tutta la tavola periodica", "Decrescita monotona con Z, per l'aumento dello schermo", "Nessuna regolarità apprezzabile fra elementi contigui"],c:0,
e:"Andamento periodico: la shell che si chiude lega moltissimo (He: 24,6 eV), l'elettrone nuovo su una shell vergine è schermatissimo (Na: 5,1 eV). Piccole anomalie (Be→B, N→O) si spiegano con subshell piene/semipiene (Esercitazione 3)."},
{id:"a100",b:"ato",q:"Quale di queste transizioni è permessa in dipolo elettrico?",
o:["²P₃/₂ → ²S₁/₂", "¹S₀ → ¹S₀ (tra configurazioni diverse)", "³P₁ → ¹S₀ (in accoppiamento LS rigoroso)", "²D₅/₂ → ²S₁/₂"],c:0,
e:"²P₃/₂→²S₁/₂: ΔS = 0 ✓, ΔL = 1 ✓, ΔJ = 1 ✓, parità cambia ✓. Le altre violano J = 0→0, ΔS = 0, o ΔJ ≤ 1 (5/2→1/2 richiede ΔJ = 2). Applicare le quattro regole in fila è l'esercizio tipo (Esercitazioni 3-4)."},
// ---- Statistica: microcanonico (Es. 6) ----
{id:"s31",b:"sta",q:"Nel microcanonico si fissa l'energia in un guscio E−Δ ≤ H ≤ E invece che esattamente E. Perché?",
o:["Per l'indeterminazione e per avere un volume finito", "Per tenere conto dell'errore sperimentale sulla misura di E", "Perché l'energia fluttua di ΔE ≈ k<sub>B</sub>T attorno al valor medio", "Per includere gli scambi di energia con il termostato esterno"],c:0,
e:"Una superficie a energia esatta ha misura nulla; il guscio di spessore Δ ha volume ∝ Δ, ma ln Γ (quindi S) è insensibile a Δ per N ~ 10²³. Coerente con ΔEΔt ≳ ħ (Esercitazione 6)."},
{id:"s32",b:"sta",q:"Nel calcolo microcanonico del gas ideale si incontra il volume dell'ipersfera in n dimensioni, V<sub>n</sub>(R) = π^(n/2)R<sup>n</sup>/(n/2)!. A che cosa serve?",
o:["Contare gli stati del gas ideale nello spazio dei momenti", "Calcolare il volume del recipiente che contiene il gas ideale", "Contare le sole configurazioni spaziali delle particelle", "Normalizzare correttamente la distribuzione di Maxwell"],c:0,
e:"ω = V<sup>N</sup> × [volume iperguscio in 3N dimensioni]. La dimostrazione usa l'integrale gaussiano e la funzione Γ di Eulero: passaggio da sapere all'orale (Esercitazione 6)."},
{id:"s33",b:"sta",q:"Perché per N ~ 10²³ il volume dell'iperguscio coincide in pratica con quello dell'intera ipersfera?",
o:["In dimensione altissima il volume sta tutto in una buccia sottile", "Perché lo spessore del guscio Δ è in pratica molto grande", "Per via della simmetria sferica del problema in 3N dimensioni", "È un'approssimazione grossolana, accettata soltanto per comodità di calcolo"],c:0,
e:"Il volume scala come R<sup>3N</sup>: togliere una buccia di spessore relativo s/R riduce il volume di un fattore e^(−3Ns/R) ≈ 0. Da qui la celebre «concentrazione della misura»: S calcolata con la sfera piena o col guscio è identica (Esercitazione 6)."},
{id:"s34",b:"sta",q:"Si calcola l'entropia di un gas ideale monoatomico contando i microstati e includendo il fattore di Gibbs. Quale espressione si ottiene?",
o:["S = k<sub>B</sub>N ln[(V/N)(4πmE/3Nh²)³ᐟ²] + (5/2)k<sub>B</sub>N", "S = k<sub>B</sub>N ln(V·E), proporzionale al logaritmo del prodotto", "S = k<sub>B</sub> ln(V/N), indipendente dall'energia totale", "S = (3/2)k<sub>B</sub>N ln T, con la sola dipendenza dalla temperatura"],c:0,
e:"Deriva da S = k<sub>B</sub>lnΓ con Stirling. Le combinazioni V/N ed E/N garantiscono S(λN, λV, λE) = λS. Senza 1/N! comparirebbe V (non V/N): paradosso di Gibbs (Esercitazione 6)."},
{id:"s35",b:"sta",q:"Nel formalismo microcanonico si dispone soltanto del conteggio dei microstati Γ(E). Come si introduce a partire da esso la temperatura?",
o:["1/T = (∂S/∂E)<sub>N,V</sub> dal conteggio dei microstati si arriva alla termodinamica", "T = ⟨E⟩/Nk<sub>B</sub>, per definizione di temperatura assoluta", "T è un parametro esterno (fissato dal termostato collegato)", "T = 2E/3k<sub>B</sub>, valida per qualunque sistema fisico"],c:0,
e:"È la definizione fondamentale. Per il gas ideale: S(E) → 1/T = (3/2)Nk<sub>B</sub>/E → E = (3/2)Nk<sub>B</sub>T (equipartizione ritrovata dal conteggio puro). Nel microcanonico non c'è nessun bagno: T emerge dal sistema stesso (Esercitazione 6)."},
{id:"s36",b:"sta",q:"Un gas ideale monoatomico viene compresso lentamente senza scambiare calore con l'esterno, quindi a entropia costante. Quale relazione lega energia e volume?",
o:["E·V^(2/3) = costante, cioè TV^(2/3) = cost", "P·V = costante, come nelle trasformazioni isoterme", "E/V = costante, cioè densità di energia invariata", "T·V = costante, con temperatura e volume inversi"],c:0,
e:"Da S(E,V) = cost: (V/N)(E/N)³ᐟ² fisso → EV²ᐟ³ = cost. Con E ∝ T si ritrova l'adiabatica del gas monoatomico: la termodinamica classica esce tutta dal conteggio (Esercitazione 6)."},
{id:"s37",b:"sta",q:"Confrontando l'oscillatore armonico classico e quantistico nel microcanonico si trova che il volume di un microstato è ω₀ = h. Come?",
o:["L'area fra due orbite con ΔE = ħω vale esattamente h", "Per definizione: h è posta pari al volume elementare ΔqΔp", "Misurando h dallo spettro di corpo nero, con la formula di Planck", "È un'analogia qualitativa: il valore esatto sarebbe ħ = h/2π"],c:0,
e:"La traiettoria è un'ellisse di area 2πE/ω: tra livelli adiacenti (spaziatura ħω) l'area cresce di h. Questo fissa la costante additiva di S e giustifica il conteggio semiclassico Γ = ω/h<sup>3N</sup> (Esercitazione 6)."},
{id:"s38",b:"sta",q:"Un sistema di N dipoli distinguibili a due livelli ±ε è isolato, con energia totale E fissata. Quanti microstati sono accessibili?",
o:["Ω = N!/(n₊!n₋!), con n<sub>±</sub> = (N/2)(1 ± E/Nε) fissati da E", "Ω = 2<sup>N</sup> per qualunque valore dell'energia totale E", "Ω = N·n₊, prodotto del numero di particelle per l'occupazione", "Ω = (n₊)<sup>N</sup>, con l'occupazione elevata al numero di dipoli"],c:0,
e:"Fissare E fissa quante particelle stanno su ciascun livello; Ω conta i modi di scegliere QUALI (binomiale). Con Stirling: S = −k<sub>B</sub>N[x lnx + (1−x)ln(1−x)], x = n₊/N. Problema identico al tema d'esame di giugno (Esercitazione 6)."},
{id:"s39",b:"sta",q:"Nel sistema a due livelli microcanonico, che cosa accade quando E &gt; 0 (più di metà delle particelle sul livello alto)?",
o:["∂S/∂E &lt; 0, quindi la temperatura assoluta è negativa", "Il sistema viola il secondo principio della termodinamica", "L'entropia diverge e il sistema non ammette equilibrio", "È impossibile fissare un'energia totale E positiva"],c:0,
e:"S(E) è una campana con massimo a E = 0: sul ramo destro S decresce con E → T &lt; 0. Possibile solo perché lo spettro è limitato superiormente; uno stato non di equilibrio stabile ma realizzabile (spin nucleari, MASER) (Esercitazioni 6 e 9)."},
{id:"s40",b:"sta",q:"Per contare i modi di distribuire M quanti su 3N oscillatori si usa il metodo delle «palline e barriere». Come vengono trattati questi oggetti nel conteggio?",
o:["Oggetti indistinguibili fra loro, da cui M! e (3N−1)!", "Oggetti tutti distinguibili, da cui il conteggio (3N)<sup>M</sup>", "Palline distinguibili e barriere no, da cui M!·(3N−1)", "Fermioni con n<sub>i</sub> = 0, 1 per il principio di Pauli"],c:0,
e:"Γ = (M+3N−1)!/[M!(3N−1)!]: i quanti sono identici (bosoni ante litteram) e le pareti pure. Il conteggio soddisfa automaticamente Gibbs. Da qui, con Stirling e 1/T = ∂S/∂E, l'energia di Planck (Esercitazione 6)."},
{id:"s41",b:"sta",q:"L'energia di N oscillatori quantistici 3D ricavata dal MICROCANONICO è E = (3N/2)ħω·coth(ħω/2k<sub>B</sub>T). Che cosa dimostra il confronto col canonico?",
o:["I due ensemble danno lo stesso risultato per N grande", "Che il conteggio microcanonico è in realtà sbagliato", "Che l'ensemble canonico vale solo ad alta temperatura", "Che la frequenza ω dipende in realtà dalla temperatura"],c:0,
e:"Stesso risultato di Z<sub>N</sub> = [2sinh(βħω/2)]<sup>−N</sup> derivato col termostato: per sistemi macroscopici le fluttuazioni relative di E nel canonico sono ~1/√N → gli ensemble sono equivalenti (Esercitazioni 6 e 8)."},
{id:"s42",b:"sta",q:"L'energia di N oscillatori quantistici tridimensionali vale E = (3N/2)ħω·coth(ħω/2k<sub>B</sub>T). A quale valore tende quando la temperatura è molto elevata?",
o:["3Nk<sub>B</sub>T, il limite classico di equipartizione", "(3N/2)ħω, cioè la sola energia di punto zero", "Zero, perché i modi si congelano ad alta temperatura", "3Nk<sub>B</sub>T², con dipendenza quadratica dalla temperatura"],c:0,
e:"coth(x) ≈ 1/x per x ≪ 1: E → 3Nk<sub>B</sub>T, cioè k<sub>B</sub>T per ciascuno dei 3N modi (cinetica + potenziale). La quantizzazione sparisce quando k<sub>B</sub>T ≫ ħω (Esercitazione 6)."},
{id:"s43",b:"sta",q:"In ciascun ensemble esiste una quantità che genera tutta la termodinamica. Quale grandezza svolge questo ruolo nell'ensemble microcanonico?",
o:["Γ, il numero di microstati accessibili", "Z = Σe^(−βE), la somma sui pesi di Boltzmann degli stati", "Ξ = Σz<sup>N</sup>Z<sub>N</sub>, la somma pesata sulla fugacità", "Ω = −PV/k<sub>B</sub>T, cioè il potenziale grancanonico"],c:0,
e:"Ogni ensemble ha il suo «generatore»: Γ ↔ S = k<sub>B</sub>lnΓ (microcanonico), Z ↔ F (canonico), Ξ ↔ Ω = −PV (grancanonico). Confronto da tenere in mente per l'orale (Esercitazione 6)."},
{id:"s44",b:"sta",q:"Perché nel gas ideale classico il conteggio dei microstati usa ω₀ = h<sup>3N</sup> e non un'altra costante?",
o:["Il confronto col conteggio quantistico dei livelli", "È una scelta arbitraria, priva di qualunque conseguenza fisica", "Per una convenzione storica introdotta da Boltzmann e Gibbs", "Perché il valore di h è numericamente molto piccolo"],c:0,
e:"La scelta fissa la costante additiva dell'entropia (rilevante per potenziali chimici e equilibri): il valore h è imposto dalla meccanica quantistica, come mostra il conteggio esplicito dei livelli (Esercitazione 6)."},
{id:"s45",b:"sta",q:"Due recipienti contenenti lo stesso gas alla medesima temperatura e densità vengono messi in comunicazione. Che cosa accade all'entropia totale?",
o:["Non cambia, non è un vero processo termodinamico", "Aumenta di 2Nk<sub>B</sub>ln2, come per gas di specie diverse", "Diminuisce, perché il volume accessibile si raddoppia", "Aumenta soltanto se la temperatura è sufficientemente alta"],c:0,
e:"Con S estensiva (V/N invariato) ΔS = 0 ✓. Per gas DIVERSI resta invece l'entropia di mescolamento 2Nk<sub>B</sub>ln2: la discontinuità tra «identici» e «diversi» è il cuore del paradosso di Gibbs (Esercitazione 6)."},
{id:"s46",b:"sta",q:"La probabilità che un sistema del canonico abbia energia in [E, E+dE] è P(E) ∝ g(E)e^(−βE). Perché è piccatissima attorno a ⟨E⟩ per N grande?",
o:["g(E) cresce e e^(−βE) decresce: il prodotto è piccatissimo", "Perché l'energia del sistema è quantizzata in livelli discreti", "Perché il termostato impedisce del tutto le fluttuazioni", "Non è piccata affatto: tutte le energie sono equiprobabili"],c:0,
e:"La competizione tra densità di stati e fattore di Boltzmann concentra P(E): fluttuazioni ΔE/⟨E⟩ ~ 10⁻¹² per una mole. Per questo canonico e microcanonico coincidono in pratica (Esercitazioni 6-7)."},
{id:"s47",b:"sta",q:"Si vuole stimare l'ordine di grandezza dell'entropia di una mole di sostanza in condizioni ordinarie. Quale valore ci si deve aspettare?",
o:["S ~ Nk<sub>B</sub> ~ 10 J/K l'entropia per particella è di pochi k<sub>B</sub>", "S ~ k<sub>B</sub> ~ 10⁻²³ J/K, dell'ordine della costante stessa", "S ~ 10²³ J/K, cioè proporzionale al numero di Avogadro", "S ~ 1 k<sub>B</sub> in totale, indipendentemente da N"],c:0,
e:"S = k<sub>B</sub>lnΓ con lnΓ ~ N: ogni particella contribuisce con O(1) k<sub>B</sub> (per il gas ideale ~ una decina). Utile per stimare al volo se un risultato d'esame è sensato."},
{id:"s48",b:"sta",q:"Un sistema isolato viene lasciato evolvere liberamente a partire da una condizione iniziale fuori equilibrio. Verso quale macrostato si porta?",
o:["Con il massimo numero di microstati compatibili coi vincoli", "Con l'energia interna minima compatibile con i vincoli imposti", "Con la temperatura più bassa raggiungibile spontaneamente", "Con il minimo numero di microstati, cioè il massimo ordine"],c:0,
e:"Il secondo principio in chiave statistica: non un divieto assoluto ma una questione di probabilità con numeri tipo e^(10²³). L'energia minima è il criterio a T fissata (canonico, minimo di F), non per sistemi isolati."},
// ---- Statistica: canonico (Es. 7-8-9) ----
{id:"s49",b:"sta",q:"Un gas ideale è contenuto in un cilindro verticale molto alto, in campo gravitazionale uniforme. Quanto vale la sua energia interna?",
o:["U = (5/2)Nk<sub>B</sub>T: 3/2 dai momenti + 1 dal potenziale gravitazionale", "U = (3/2)Nk<sub>B</sub>T, come per il gas ideale senza campo", "U = 3Nk<sub>B</sub>T, come per un solido di Dulong–Petit", "U = (1/2)Nk<sub>B</sub>T, un solo grado di libertà efficace"],c:0,
e:"Z₁ ∝ (k<sub>B</sub>T)^(5/2) → U = −N∂lnZ₁/∂β = (5/2)Nk<sub>B</sub>T. Il termine lineare mgz contribuisce con k<sub>B</sub>T intero (non ½: l'equipartizione con ½k<sub>B</sub>T vale solo per termini quadratici). Esercizio svolto dell'Esercitazione 7."},
{id:"s50",b:"sta",q:"La pressione di un'atmosfera isoterma decresce con la quota secondo P(z) = P(0)e^(−mgz/k<sub>B</sub>T). Con quali due approcci indipendenti si può ricavare?",
o:["Bilancio meccanico dP/dz = −ρg oppure peso di Boltzmann e^(−βmgz)", "Soltanto con la fluidodinamica dei fluidi comprimibili in quiete", "Soltanto con la meccanica quantistica applicata alle molecole", "Con il principio di esclusione applicato alle molecole del gas"],c:0,
e:"La coincidenza non è casuale: la distribuzione canonica È la condizione di equilibrio meccanico-statistico. Esercizio storico di Boltzmann (1879), rifatto in Esercitazione 7."},
{id:"s51",b:"sta",q:"In un gas ideale alla temperatura T si misura la velocità media delle molecole. Quale espressione la fornisce, e come si colloca rispetto alle altre velocità caratteristiche?",
o:["√(8k<sub>B</sub>T/πm), compresa tra v<sub>max</sub> = √(2k<sub>B</sub>T/m) e √⟨v²⟩ = √(3k<sub>B</sub>T/m)", "√(3k<sub>B</sub>T/m), che coincide con la velocità quadratica media", "√(2k<sub>B</sub>T/m), che coincide con la velocità più probabile", "k<sub>B</sub>T/m, rapporto fra energia termica e massa"],c:0,
e:"⟨v⟩ = ∫v·w(v)dv con cambio di variabile e Γ(2) = 1. Ordine: v<sub>max</sub> &lt; ⟨v⟩ &lt; v<sub>qm</sub> (1 : 1,13 : 1,22). Saper distinguere le tre «velocità» è un classico dei quiz (Esercitazione 7)."},
{id:"s52",b:"sta",q:"Per N oscillatori armonici classici 1D identici (es. modello di un solido), la funzione di partizione è Z<sub>N</sub> = Z₁<sup>N</sup> senza 1/N!. Perché?",
o:["Ogni oscillatore è ancorato al proprio sito reticolare", "Perché gli oscillatori vanno trattati in modo quantistico", "È in realtà un errore: il fattore di Gibbs serve sempre", "Perché il numero N di oscillatori è tipicamente piccolo"],c:0,
e:"Z₁ = k<sub>B</sub>T/ħω (due gaussiane: cinetica e potenziale) → U = Nk<sub>B</sub>T → c = Nk<sub>B</sub> (Dulong–Petit in 1D). Lo scambio di due oscillatori è una configurazione DIVERSA: niente Gibbs (Esercitazione 8)."},
