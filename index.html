o:["Il campo cristallino (più forte dello spin-orbita) impone autostati reali tipo p<sub>x</sub>, p<sub>y</sub>, p<sub>z</sub> con ⟨L<sub>z</sub>⟩ = 0: il momento orbitale è «spento» e conta solo lo spin","La riduzione dello spin per effetto termico","L'annullamento del momento magnetico totale","Un effetto relativistico"],c:0,
e:"Gli orbitali 3d sono esterni: il campo elettrico dei vicini domina lo spin-orbita e la 3ª regola di Hund salta. I «buoni» stati sono combinazioni reali (autostati di L² ma non di L<sub>z</sub>): su funzioni reali ⟨L<sub>z</sub>⟩ = 0. Quindi p<sub>eff</sub> = 2√(S(S+1)), in ottimo accordo con l'esperimento."},
{id:"m14",b:"mag",q:"Per il Cr³⁺ (3d³) il p<sub>eff</sub> calcolato con J (ione libero) dà 0,77, quello sperimentale è 3,85. Con il quenching si ottiene:",
o:["p<sub>eff</sub> = 2√(S(S+1)) = 3,87 con S = 3/2: accordo ottimo","p<sub>eff</sub> = √(J(J+1)) = 1,94","p<sub>eff</sub> = 2S = 3","p<sub>eff</sub> = g<sub>J</sub>J = 0,6"],c:0,
e:"Tre elettroni d a spin paralleli: S = 3/2, L «spento» → g = 2. p<sub>eff</sub> = 2√(3/2·5/2) = √15 = 3,87. Esattamente il calcolo del tema di luglio (Cr in Al₂O₃, rubino): usare J qui è LA trappola classica."},
{id:"m15",b:"mag",q:"Qual è la gerarchia delle interazioni per uno ione 3d in un cristallo?",
o:["Coulomb e–nucleo &gt; repulsione e–e &gt; campo cristallino &gt; spin-orbita: per questo la 3ª regola di Hund non vale","Coulomb &gt; spin-orbita &gt; campo cristallino: come per le terre rare","Il campo cristallino è sempre l'interazione più debole","Lo Zeeman domina su tutto"],c:0,
e:"Nei 3d il campo cristallino batte lo spin-orbita (orbitali esterni); nelle 4f è il contrario (orbitali schermati). Regole di Hund modificate per i 3d: S max, L = 0 (quench), J = S. Il residuo spin-orbita dà g<sub>eff</sub> leggermente ≠ 2 (dragging)."},
{id:"m16",b:"mag",q:"Perché per Fe³⁺ e Mn²⁺ (3d⁵) il modello a ione libero funziona anche senza invocare il quenching?",
o:["La subshell semipiena ha già L = 0 (termine ⁶S₅/₂): non c'è momento orbitale da spegnere","Sono ioni diamagnetici","Il loro spin è nullo","Il campo cristallino è assente nei loro sali"],c:0,
e:"Cinque elettroni a spin paralleli su m<sub>l</sub> = +2…−2: M<sub>L</sub> = 0. p<sub>eff</sub> = 2√(5/2·7/2) = 5,92 contro 5,82–5,92 sperimentale. Caso in cui ione libero e quenching danno lo stesso risultato."},
{id:"m17",b:"mag",q:"Il paramagnetismo di Pauli dei metalli (es. Na) ha suscettività:",
o:["χ<sub>P</sub> = μ₀μ<sub>B</sub>²g(ε<sub>F</sub>): piccola e indipendente da T, perché solo gli spin entro ~k<sub>B</sub>T da ε<sub>F</sub> possono ruotare","χ = C/T come ogni paramagnete","χ negativa","χ enorme come nei ferromagneti"],c:0,
e:"Le due sottobande di spin si spostano di ∓μ<sub>B</sub>B e si riequilibrano: Δn = g(ε<sub>F</sub>)μ<sub>B</sub>B. Risultato: χ<sub>P</sub> = (T/T<sub>F</sub>)·χ<sub>Curie</sub> — spiega sia il valore ~100 volte più piccolo dell'atteso sia l'indipendenza da T (χ ∝ 1/T<sub>F</sub>, non 1/T). Stesso fattore di soppressione del calore specifico elettronico."},
{id:"m18",b:"mag",q:"Il diamagnetismo di Landau degli elettroni di conduzione vale:",
o:["χ<sub>L</sub> = −⅓χ<sub>Pauli</sub>: contributo orbitale dei livelli di Landau, opposto a quello di spin","χ<sub>L</sub> = −χ<sub>Pauli</sub>: si cancellano","χ<sub>L</sub> = +χ<sub>Pauli</sub>","χ<sub>L</sub> = 0 nei metalli"],c:0,
e:"B curva le traiettorie (livelli di Landau) → magnetizzazione orbitale opposta. Totale: χ = (2/3)χ<sub>P</sub> &gt; 0 per gli alcalini. I livelli di Landau sono anche la base delle oscillazioni Shubnikov–de Haas con cui si mappano le superfici di Fermi."},
{id:"m19",b:"mag",q:"Quali sono le quattro caratteristiche fenomenologiche del ferromagnetismo?",
o:["Isteresi; transizione ferro→para a T<sub>C</sub>; legge di Curie–Weiss χ = C/(T−T<sub>C</sub>) sopra T<sub>C</sub>; magnetizzazione spontanea","Isteresi; χ &lt; 0; saturazione; superconduttività","Solo la magnetizzazione spontanea","χ ∝ 1/T; assenza di domini; anisotropia; effetto Hall"],c:0,
e:"Il modello di Weiss (campo molecolare λM) le riproduce qualitativamente tutte e quattro: soluzione grafica L(a) contro retta ∝ T dà M spontanea sotto T<sub>C</sub> = μ²μ₀λn/3k<sub>B</sub> e Curie–Weiss sopra."},
{id:"m20",b:"mag",q:"Perché l'interazione dipolare magnetica NON può spiegare il ferromagnetismo?",
o:["Darebbe B ∼ 1 T e T<sub>C</sub> ∼ 1 K: il campo molecolare necessario è ∼10³ T, tre ordini di grandezza più grande","Perché è repulsiva","Perché non esiste tra spin","Perché agisce solo a lunghissimo raggio"],c:0,
e:"k<sub>B</sub>T<sub>C</sub>/μ<sub>B</sub> con T<sub>C</sub>(Fe) = 1043 K dà B<sub>m</sub> ≈ 1500 T. L'origine vera è l'interazione di scambio: elettrostatica + principio di Pauli, non magnetica. La costante di Weiss λ ≈ 10³ misura proprio questo rapporto."},
{id:"m21",b:"mag",q:"Che cos'è l'interazione di scambio alla base del ferromagnetismo (Heisenberg)?",
o:["Un effetto elettrostatico + antisimmetria di Pauli: la differenza di energia tra configurazioni di spin viene dalla diversa simmetria spaziale della funzione d'onda","Un'interazione magnetica diretta tra i dipoli","Un effetto relativistico dello spin-orbita","Lo scambio di fotoni tra atomi"],c:0,
e:"H = −(2J′/ħ²)S<sub>i</sub>·S<sub>j</sub>: J′ = ½(E↑↓−E↑↑) è un integrale coulombiano «incrociato» che esiste solo con overlap delle funzioni d'onda. J′ &gt; 0 favorisce spin paralleli (ferro), J′ &lt; 0 antiparalleli (antiferro)."},
{id:"m22",b:"mag",x:1,q:"Quale affermazione sull'integrale di scambio NON è corretta?",
o:["È dato da J = ∫∫|ψ<sub>a</sub>(r₁)|²·(e²/4πε₀r₁₂)·|ψ<sub>b</sub>(r₂)|² dr₁dr₂","Ha origine dalla combinazione di interazione coulombiana e principio di Pauli","Può favorire spin paralleli o antiparalleli a seconda della distanza tra gli ioni","Contribuisce alla differenza di energia tra stati con diversa simmetria spaziale"],c:0,
e:"Quella formula (con i moduli quadri) è l'integrale di COULOMB diretto: lo scambio ha invece le funzioni d'onda «incrociate» ψ<sub>a</sub>*(r₁)ψ<sub>b</sub>*(r₂)ψ<sub>a</sub>(r₂)ψ<sub>b</sub>(r₁) — senza analogo classico (domanda reale d'esame)."},
{id:"m23",b:"mag",q:"Che cosa descrive la curva di Bethe–Slater?",
o:["L'integrale di scambio J′ in funzione del rapporto distanza interatomica/raggio 3d: spiega perché Fe, Co, Ni sono ferromagnetici e Mn antiferromagnetico","La magnetizzazione in funzione della temperatura","L'isteresi dei materiali duri","La suscettività di Pauli"],c:0,
e:"J′ cambia segno con la distanza: rapporto intermedio → J′ &gt; 0 (Fe, Co, Ni ferro); piccolo → J′ &lt; 0 (Mn antiferro); grande → J′ ≈ 0 (para). Conferma: nelle leghe di Heusler (Cu₂MnSn) gli atomi di Mn, più distanziati, diventano ferromagnetici."},
{id:"m24",b:"mag",q:"Perché un pezzo di ferro smagnetizzato non è una calamita, pur essendo ferromagnetico?",
o:["È suddiviso in domini di Weiss con magnetizzazioni orientate a caso: la M totale è nulla e l'energia magnetostatica è minimizzata","Perché sotto T<sub>C</sub> non c'è magnetizzazione","Perché gli spin sono disordinati come in un paramagnete","Perché il campo terrestre lo smagnetizza"],c:0,
e:"Dentro ogni dominio M = M<sub>sat</sub> locale, ma i domini si dispongono per chiudere il flusso (costo: pareti di Bloch, spessore ~10³ Å da competizione scambio–anisotropia). Magnetizzare = spostare le pareti (a scatti: effetto Barkhausen) e poi ruotare i domini."},
{id:"m25",b:"mag",q:"La legge di Curie–Weiss χ = C/(T−T<sub>C</sub>) descrive:",
o:["La suscettività di un ferromagnete SOPRA la temperatura di Curie: come Curie ma con l'asintoto spostato a T<sub>C</sub>","La suscettività sotto T<sub>C</sub>","Il comportamento dei diamagneti","La magnetizzazione spontanea"],c:0,
e:"Sopra T<sub>C</sub> il ferromagnete è un paramagnete «aiutato» dal campo molecolare λM: χ diverge avvicinandosi a T<sub>C</sub> (transizione). Dal fit di 1/χ vs T si leggono C (quindi p<sub>eff</sub>) e T<sub>C</sub>."},
{id:"m26",b:"mag",q:"Materiali magnetici «duri» e «dolci» si distinguono per:",
o:["Il campo coercitivo H<sub>c</sub>: grande nei duri (magneti permanenti), piccolo nei dolci (trasformatori, poca energia dissipata nel ciclo)","La temperatura di Curie","Il segno di χ","La densità di elettroni"],c:0,
e:"L'area del ciclo di isteresi = energia dissipata per ciclo. Duri: pareti bloccate da difetti e forte anisotropia → B<sub>r</sub> e H<sub>c</sub> grandi. Dolci: ciclo stretto per minimizzare le perdite nelle applicazioni AC."},
{id:"m27",b:"mag",q:"Il paramagnetismo di van Vleck riguarda ioni con:",
o:["J = 0 nel fondamentale ma L, S ≠ 0: un contributo paramagnetico positivo al secondo ordine perturbativo","J massimo","Shell completamente piene","Elettroni itineranti"],c:0,
e:"Con J = 0 lo Zeeman al 1° ordine è nullo, ma il mescolamento con gli stati eccitati (2° ordine) dà χ &gt; 0 piccola e ~indipendente da T. Caso Eu³⁺ (4f⁶, ⁷F₀): senza van Vleck il confronto p<sub>eff</sub> teoria–esperimento fallisce."},
{id:"m28",b:"mag",q:"In un sale paramagnetico, perché gli ioni magnetici devono essere DILUITI in una matrice diamagnetica?",
o:["Per evitare l'interazione di scambio tra ioni vicini, che porterebbe ordine magnetico: diluiti, vale la statistica di ioni indipendenti","Per aumentare la suscettività","Perché altrimenti il sale si scioglie","Per schermare il campo esterno"],c:0,
e:"n<sub>para</sub> ≪ n<sub>dia</sub> (es. 10% di Cr³⁺ in Al₂O₃, il rubino del tema di luglio): senza overlap tra le funzioni d'onda 3d/4f lo scambio è spento e ogni ione risponde indipendentemente (Maxwell–Boltzmann, Brillouin, Curie)."},
{id:"m29",b:"mag",q:"Il fatto che le curve sperimentali M/M<sub>sat</sub> vs B/T di ioni diversi (Cr³⁺, Fe³⁺, Gd³⁺) NON si sovrappongano dimostra che:",
o:["J è quantizzato: la forma di B<sub>J</sub> dipende da J, mentre la teoria classica di Langevin darebbe una curva universale","La temperatura non è ben controllata","La legge di Curie è sbagliata","Il campo molecolare è diverso nei tre sali"],c:0,
e:"Nella teoria classica tutte le curve normalizzate collassano su L(a). Sperimentalmente ogni ione segue la SUA B<sub>J</sub>(a) con J = 3/2, 5/2, 7/2: test storico della quantizzazione del momento angolare (esperimenti di Henry, 1952)."},
{id:"m30",b:"mag",q:"Uno ione con configurazione a shell tutte chiuse (es. Al³⁺, O²⁻, termine ¹S₀) in un cristallo è:",
o:["Diamagnetico: L = S = J = 0, resta solo il termine di Larmor–Langevin","Paramagnetico debole","Ferromagnetico sotto T<sub>C</sub>","Non ha alcuna risposta magnetica"],c:0,
e:"Senza momento angolare non c'è paramagnetismo (1° ordine nullo): sopravvive solo il diamagnetismo ∝ Σ⟨r²⟩. Per questo Al₂O₃ puro è diamagnetico e serve drogarlo con Cr³⁺ per farne un paramagnete (primo punto del tema di luglio)."},
// ---- Atomica: molecole (Es. 1 e 1-2) ----
{id:"a31",b:"ato",q:"Nella formazione di NaCl, trasferire l'elettrone da Na a Cl (formare Na⁺ + Cl⁻ a distanza infinita) costa circa 1,3 eV. Perché il legame ionico si forma comunque?",
o:["L'attrazione coulombiana tra gli ioni, ∝ 1/R, abbassa l'energia fino a un minimo di ≈ −3,6 eV (rispetto agli atomi neutri) a R ≈ 2,4 Å","Perché l'energia di ionizzazione del sodio è negativa","Per effetto tunnel dell'elettrone tra i due atomi","Per l'interazione magnetica tra gli spin"],c:0,
e:"E<sub>ionizz</sub>(Na) = 5,1 eV, affinità del Cl = −3,8 eV: il bilancio a R → ∞ è +1,3 eV, ma avvicinando gli ioni il termine −e²/4πε₀R vince, con minimo a R<sub>min</sub> ≈ 2,4 Å (Esercitazione 1)."},
{id:"a32",b:"ato",q:"Qual è l'origine della repulsione a corto raggio tra due atomi che si avvicinano?",
o:["La penetrazione delle nuvole elettroniche (i nuclei non sono più schermati) e il principio di Pauli, che costringe gli elettroni su stati a energia più alta","Solo la repulsione tra i nuclei nudi a qualunque distanza","La forza magnetica tra gli elettroni","L'aumento dell'energia cinetica rotazionale"],c:0,
e:"A piccole distanze le shell si sovrappongono: Pauli impedisce la doppia occupazione (promozione a orbitali alti) e la schermatura viene meno. È il muro ripido di ogni potenziale intermolecolare E(R) (Esercitazione 1)."},
{id:"a33",b:"ato",q:"Quali caratteristiche ha il legame ionico?",
o:["È polare (momento di dipolo), non direzionale, tipico tra elementi dei gruppi 1–2 e 6–7 con shell chiuse sferiche","È direzionale e apolare","Si forma solo tra atomi identici","Richiede elettroni delocalizzati su tutto il cristallo"],c:0,
e:"Gli ioni a shell chiuse sono sferici: l'attrazione è la stessa in ogni direzione (cristalli ionici compatti). Il legame covalente è invece direzionale (lobi degli orbitali), quello metallico delocalizzato."},
{id:"a34",b:"ato",q:"Per H₂⁺, perché le autofunzioni si cercano nella forma simmetrica/antisimmetrica ψ± = (ψ<sub>A</sub> ± ψ<sub>B</sub>)/√2?",
o:["L'hamiltoniana commuta con l'operatore di parità rispetto al centro molecolare: le autofunzioni hanno parità definita","Per semplicità di calcolo, senza motivo fisico","Perché l'elettrone è sempre a metà strada tra i nuclei","Per la repulsione tra i due nuclei"],c:0,
e:"I due protoni sono identici: il potenziale è simmetrico rispetto al punto medio, [Ĥ, P̂] = 0 → stati gerade (ψ₊) e ungerade (ψ₋). La simmetria decide la struttura ancor prima del calcolo (Esercitazione 1)."},
{id:"a35",b:"ato",q:"Che cos'è l'integrale di sovrapposizione I(R) nel metodo LCAO?",
o:["I(R) = ∫ψ<sub>A</sub>*(r)ψ<sub>B</sub>(r)d³r: misura quanto gli orbitali dei due atomi si sovrappongono; entra nella normalizzazione 1/√(2(1±I))","L'energia di interazione tra i due nuclei","La probabilità di trovare l'elettrone su A","Il valor medio del potenziale su ψ<sub>A</sub>"],c:0,
e:"I(R) → 0 a grandi distanze e → 1 per R → 0. Compare nelle energie E± = (H<sub>AA</sub> ± H<sub>AB</sub>)/(1 ± I): senza sovrapposizione niente legame chimico."},
{id:"a36",b:"ato",q:"Nel metodo LCAO per H₂⁺, che cosa rappresenta l'elemento di matrice H<sub>AB</sub> = ⟨ψ<sub>A</sub>|Ĥ|ψ<sub>B</sub>⟩?",
o:["Il termine di delocalizzazione (o risonanza): l'ampiezza con cui l'elettrone «passa» da un nucleo all'altro, responsabile della separazione legante/antilegante","L'energia dell'atomo A isolato","La repulsione internucleare","Un termine sempre trascurabile"],c:0,
e:"È H<sub>AB</sub> a separare E₊ da E₋: senza di esso i due stati resterebbero degeneri e non ci sarebbe guadagno energetico nel condividere l'elettrone (Esercitazione 1)."},
{id:"a37",b:"ato",q:"Il metodo variazionale fornisce una stima dell'energia dello stato fondamentale che è:",
o:["Sempre un limite superiore: E[ψ<sub>prova</sub>] ≥ E₀, e migliora arricchendo la funzione di prova","Sempre un limite inferiore","Esatta per costruzione","Priva di significato fisico"],c:0,
e:"⟨ψ|Ĥ|ψ⟩ ≥ E₀ per qualunque ψ normalizzata. Per questo la sequenza LCAO → Z<sub>eff</sub> variazionale → Kolos-Wolniewicz dà energie di legame via via più vicine (dal basso) al valore sperimentale."},
{id:"a38",b:"ato",q:"Il calcolo LCAO più semplice per H₂⁺ dà D<sub>e</sub> = 1,77 eV a R₀ = 1,32 Å, contro i valori sperimentali 2,79 eV e 1,06 Å. Come si migliora il risultato?",
o:["Rendendo variazionale la carica efficace Z<sub>eff</sub>(R) negli orbitali 1s: l'elettrone «vede» entrambi i nuclei","Aggiungendo la correzione relativistica","Includendo lo spin-orbita","Trattando i nuclei quantisticamente"],c:0,
e:"Con ψ<sub>1s</sub>(Z<sub>eff</sub>) ottimizzata a ogni R il legame si irrobustisce sensibilmente: lo screening variazionale è lo stesso concetto chiave che spiega le regole di Hund e la tavola periodica (Esercitazione 1)."},
{id:"a39",b:"ato",q:"Nel metodo MO per H₂, lo stato fondamentale è:",
o:["φ = ψ₊(1)ψ₊(2)·χ<sub>0,0</sub>: entrambi gli elettroni nell'orbitale legante, con spin in singoletto","Entrambi gli elettroni in ψ₋ con spin tripletto","Un elettrone in ψ₊ e uno in ψ₋","ψ₊ψ₊ con spin tripletto"],c:0,
e:"La parte spaziale ψ₊ψ₊ è simmetrica → Pauli impone lo spin antisimmetrico (singoletto χ₀,₀). È la «doppia occupazione» dell'orbitale legante: il legame covalente standard a due elettroni."},
{id:"a40",b:"ato",q:"In H₂, perché lo stato di tripletto di spin richiede una parte spaziale antisimmetrica?",
o:["La funzione d'onda TOTALE di due fermioni deve essere antisimmetrica: tripletto (simmetrico) × spaziale antisimmetrica","Perché il tripletto ha energia minore","Per la conservazione del momento angolare","È una convenzione senza conseguenze fisiche"],c:0,
e:"ψ<sub>tot</sub> = (spaziale)×(spin) deve cambiare segno scambiando gli elettroni. La parte spaziale antisimmetrica ha un nodo tra i nuclei → il tripletto di H₂ è antilegante: gli spin decidono la chimica."},
{id:"a41",b:"ato",q:"Scrivendo lo stato MO di H₂ come φ = φ<sup>cov</sup> + φ<sup>ion</sup>, qual è il difetto del metodo MO semplice?",
o:["Pesa al 50% le configurazioni ioniche H⁺H⁻, troppo: l'interazione di configurazione (CI) riduce il peso ionico a ~20%","Trascura completamente la parte ionica","Include solo configurazioni ioniche","Viola il principio di Pauli"],c:0,
e:"Sviluppando ψ₊ψ₊ compaiono con lo stesso peso i termini «un elettrone per nucleo» (covalenti) e «due elettroni sullo stesso nucleo» (ionici). Mescolando φ<sub>α</sub> e φ<sub>β</sub> (CI minima) l'energia scende e il carattere ionico si riduce al valore realistico (Esercitazione 1-2)."},
{id:"a42",b:"ato",q:"In che cosa differisce il metodo di Heitler–London (valence bond) dal metodo MO?",
o:["Costruisce la funzione di prova dagli orbitali degli atomi separati, includendo solo la parte covalente","Include più configurazioni ioniche del MO","Tratta i nuclei come particelle quantistiche","Vale solo per molecole eteronucleari"],c:0,
e:"φ<sub>HL</sub> = [ψ<sub>A</sub>(1)ψ<sub>B</sub>(2) ± ψ<sub>A</sub>(2)ψ<sub>B</sub>(1)]·χ: ogni elettrone «appartiene» a un atomo. Per H₂ dà R₀ = 0,87 Å e D<sub>e</sub> = 3,2 eV, meglio del MO (2,7 eV) — ma è un caso fortuito (Esercitazione 1-2)."},
{id:"a43",b:"ato",q:"Dal confronto dei modelli per H₂ (sperimentale D<sub>e</sub> = 4,75 eV; MO 2,7; Heitler–London 3,2; HL senza scambio 0,25) quale morale si trae?",
o:["Lo scambio è essenziale per il legame covalente: senza, il legame quasi scompare; e il legame ha un piccolo carattere ionico","Il metodo MO è sempre superiore","Il legame di H₂ è puramente elettrostatico classico","I metodi variazionali sovrastimano sempre il legame"],c:0,
e:"Il caso «HL senza scambio» (0,25 eV!) mostra che il legame è quasi tutto quantistico. Kolos–Wolniewicz (variazionale con coordinate ellittiche, 1968) arriva a 4,748 eV: la MQ riproduce l'esperimento con precisione spettroscopica (Esercitazione 1-2)."},
{id:"a44",b:"ato",q:"Nella notazione degli orbitali molecolari, le lettere σ, π, δ indicano:",
o:["Il valore di |Λ| = 0, 1, 2: la proiezione del momento angolare orbitale sull'asse molecolare (analogo di s, p, d)","Il numero quantico principale","Il numero di nodi radiali","Lo spin totale"],c:0,
e:"Nelle molecole biatomiche l'asse rompe la simmetria sferica: si classifica con Λ. Si aggiungono g/u (parità gerade/ungerade rispetto al centro) e * per gli antileganti: es. σ<sub>g</sub>1s legante, σ*<sub>u</sub>1s antilegante."},
{id:"a45",b:"ato",q:"Nell'approssimazione di Born–Oppenheimer, l'equazione nucleare per una molecola biatomica usa come massa:",
o:["La massa ridotta μ = M<sub>A</sub>M<sub>B</sub>/(M<sub>A</sub>+M<sub>B</sub>) del moto relativo","La somma delle masse","La massa del nucleo più pesante","La massa dell'elettrone"],c:0,
e:"Il moto relativo dei due nuclei nel potenziale E<sub>el</sub>(R) è un problema a due corpi → massa ridotta. Da μ dipendono ω₀ = √(k<sub>s</sub>/μ) e I = μR₀²: base degli effetti isotopici."},
{id:"a46",b:"ato",q:"L'energia rotazionale di una molecola biatomica (stati Σ) è:",
o:["E<sub>R</sub> = (ħ²/2I)·K(K+1), con livelli sempre più spaziati al crescere di K","E<sub>R</sub> = ħω(K+½)","E<sub>R</sub> ∝ K²  con livelli equispaziati","E<sub>R</sub> = costante·K"],c:0,
e:"È lo spettro del rotatore rigido: spaziature E(K)−E(K−1) = (ħ²/I)K crescenti linearmente — la firma dello spettro rotazionale a righe equispaziate in frequenza. Scala: ħ²/2I ≈ 10⁻³–10⁻⁴ eV (Esercitazione 1-2)."},
{id:"a47",b:"ato",q:"Perché a temperatura ambiente molti livelli rotazionali sono popolati, ma quasi nessun livello vibrazionale?",
o:["k<sub>B</sub>T ≈ 25 meV è ≫ della spaziatura rotazionale (~0,1–1 meV) ma &lt; del quanto vibrazionale (~100 meV)","Le rotazioni non hanno quantizzazione","Le vibrazioni sono proibite dalle regole di selezione","Per il principio di Pauli"],c:0,
e:"Statistica di Boltzmann sulle tre scale: rotazioni facilmente eccitate (spettri a molte righe), vibrazioni congelate nel fondamentale, transizioni elettroniche solo con fotoni visibili/UV."},
{id:"a48",b:"ato",q:"Sostituendo H con D (deuterio) in una molecola, la frequenza vibrazionale ω₀:",
o:["Diminuisce di circa √2, perché ω₀ = √(k<sub>s</sub>/μ) e μ quasi raddoppia mentre k<sub>s</sub> (elettronico) non cambia","Raddoppia","Resta identica","Si annulla"],c:0,
e:"La costante elastica viene da E<sub>el</sub>(R), identica per gli isotopi (Born–Oppenheimer); cambia solo μ. Gli shift isotopici H/D/T degli spettri IR sono la conferma sperimentale (Esercitazione 1-2)."},
{id:"a49",b:"ato",q:"La gerarchia tipica per H₂ è: transizione elettronica ~10 eV, vibrazionale ν̃₀ = 4395 cm⁻¹, rotazionale B = 60,8 cm⁻¹. A quanti eV corrisponde 1 cm⁻¹?",
o:["≈ 1,24·10⁻⁴ eV (E[eV] = numero d'onda/8065)","≈ 1 eV","≈ 10⁻² eV","≈ 10⁻⁸ eV"],c:0,
e:"Conversione standard della spettroscopia: 8065 cm⁻¹ per eV. Quindi ħω₀(H₂) ≈ 0,55 eV e B ≈ 7,5 meV: tre ordini di grandezza tra elettronico, vibrazionale e rotazionale (Esercitazione 1-2)."},
{id:"a50",b:"ato",q:"Qual è la differenza tra D<sub>e</sub> e D₀ (energie di dissociazione)?",
o:["D₀ = D<sub>e</sub> − ħω₀/2: l'energia di punto zero vibrazionale riduce l'energia necessaria a dissociare","D₀ = D<sub>e</sub> + ħω₀/2","Sono la stessa cosa","D₀ è l'energia elettronica pura"],c:0,
e:"D<sub>e</sub> si misura dal minimo della curva E(R), ma la molecola non può stare sul minimo: il livello v = 0 sta ħω₀/2 sopra. Ciò che si misura dissociando è D₀ (H₂: 4,48 eV misurata vs D<sub>e</sub> = 4,75 eV)."},
{id:"a51",b:"ato",q:"Nello spettro rotovibrazionale IR di una molecola biatomica si osservano due «branche» (P ed R) con un buco al centro. Perché?",
o:["ΔK = ±1: la transizione con ΔK = 0 (riga Q) è assente negli stati Σ","Per l'effetto Doppler","Per l'anarmonicità del potenziale","Per la degenerazione dei livelli"],c:0,
e:"Il fotone porta un quanto di momento angolare: K deve cambiare di ±1. Branca R (ΔK = +1) a energie sopra ħω₀, branca P (ΔK = −1) sotto: dal passo tra le righe si misura B e quindi R₀."},
{id:"a52",b:"ato",q:"Nell'equazione radiale nucleare di una molecola, il termine ħ²K(K+1)/2μR² rappresenta:",
o:["Il potenziale centrifugo: l'energia rotazionale che si aggiunge al potenziale elettronico E<sub>el</sub>(R)","Un termine di scambio","La correzione relativistica","L'interazione spin-rotazione"],c:0,
e:"Come nell'atomo di idrogeno: il moto 3D si riduce a un problema radiale 1D con potenziale efficace E<sub>el</sub>(R) + termine centrifugo. Per K grandi il minimo si sposta (distorsione centrifuga)."},
{id:"a53",b:"ato",q:"Che cosa rappresenta H<sub>AA</sub> = ⟨ψ<sub>A</sub>|Ĥ|ψ<sub>A</sub>⟩ nel metodo LCAO per H₂⁺?",
o:["L'energia dell'atomo A quasi imperturbato, corretta dall'attrazione dell'elettrone verso l'altro nucleo (e dalla repulsione nucleare)","Il termine di risonanza tra i due nuclei","L'integrale di sovrapposizione","L'energia cinetica dei nuclei"],c:0,
e:"H<sub>AA</sub> contiene E<sub>1s</sub> più i termini «di campo» dell'altro centro: da solo non produce legame. La separazione legante/antilegante viene tutta da H<sub>AB</sub> (Esercitazione 1)."},
{id:"a54",b:"ato",q:"Il principio di Franck–Condon si rappresenta sul diagramma E(R) come:",
o:["Una transizione verticale a R fisso: l'intensità verso ogni livello v′ è proporzionale alla sovrapposizione delle funzioni vibrazionali","Una transizione lungo la curva di potenziale","Un salto orizzontale a energia costante","Una transizione che parte sempre da v = 0 verso v′ = 0"],c:0,
e:"Gli elettroni si riarrangiano in tempi ≪ del periodo vibrazionale: R non cambia durante la transizione. Se le curve dei due stati elettronici sono spostate, la verticale «atterra» su v′ &gt; 0: progressioni vibrazionali negli spettri elettronici."},
// ---- Atomica: configurazioni e termini (Es. 3), Zeeman (Es. 4) ----
{id:"a55",b:"ato",q:"Quanti microstati ha la configurazione 2p² del carbonio?",
o:["15: le combinazioni di 2 elettroni su 6 stati di spin-orbitale, C(6,2)","36","6","20"],c:0,
e:"6 stati disponibili (3 valori di m<sub>l</sub> × 2 di m<sub>s</sub>), 2 elettroni indistinguibili: 6!/(2!4!) = 15. La tabella dei microstati li smista nei termini ¹D₂ (5) + ³P₀,₁,₂ (9) + ¹S₀ (1) = 15 ✓ (Esercitazione 3)."},
{id:"a56",b:"ato",q:"L'azoto ha configurazione 2p³. Quanti microstati e quale termine fondamentale?",
o:["20 microstati (C(6,3)); fondamentale ⁴S₃/₂","15 microstati; fondamentale ³P₀","20 microstati; fondamentale ²D₅/₂","8 microstati; fondamentale ⁴P₅/₂"],c:0,
e:"6!/(3!3!) = 20. Con il metodo grafico: 3 spin paralleli su m<sub>l</sub> = 1, 0, −1 → S = 3/2, L = 0 → ⁴S₃/₂ (gli altri termini sono ²P e ²D). Subshell semipiena → L = 0, come per 3d⁵ (Esercitazione 3)."},
{id:"a57",b:"ato",q:"Per la configurazione eccitata 4p¹4d¹ (elettroni NON equivalenti), i termini permessi sono:",
o:["Tutti quelli dell'algebra dei momenti: ¹P₁, ¹D₂, ¹F₃, ³P₀,₁,₂, ³D₁,₂,₃, ³F₂,₃,₄","Solo quelli pari, come per 2p²","Solo i tripletti","Solo ¹P₁ e ³P₀"],c:0,
e:"Con n o l diversi gli elettroni sono distinguibili dai numeri quantici: Pauli non elimina nulla. S = 0,1 e L = 1,2,3 danno tutti i 12 livelli; l'ordine energetico segue Hund: prima S, poi L, poi J (Esercitazione 3)."},
{id:"a58",b:"ato",q:"Il termine fondamentale della configurazione nd⁴ è:",
o:["⁵D₀: S = 2, L = 2, J = |L−S| = 0 (subshell meno che semipiena)","⁵D₄","³F₂","¹S₀"],c:0,
e:"Metodo grafico: 4 frecce parallele nelle caselle m<sub>l</sub> = 2, 1, 0, −1 → S = 2, M<sub>L</sub> = 2 → L = 2. Meno che semipiena → J minimo = 0. Esempio: Cr²⁺, Mn³⁺ (Esercitazione 3)."},
{id:"a59",b:"ato",q:"Per le shell più interne di un atomo pesante (Z grande), energia e raggio scalano circa come:",
o:["E ≈ (Z−2)²·E<sub>H</sub> e ⟨r⟩ ≈ a₀/(Z−2): quasi idrogenoidi con schermo ~2 (l'altro elettrone 1s)","E ≈ E<sub>H</sub>/Z² e ⟨r⟩ ≈ Z·a₀","E ≈ Z·E<sub>H</sub> e ⟨r⟩ ≈ a₀","Non dipendono da Z"],c:0,
e:"Un elettrone 1s vede il nucleo schermato quasi solo dall'altro 1s: Z<sub>eff</sub> ≈ Z−2 (per Z grande vale ~Z). Energie di legame di keV → spettroscopia X e legge di Moseley (Esercitazione 3)."},
{id:"a60",b:"ato",q:"Per gli elettroni di valenza (shell esterne) di un atomo neutro, l'ordine di grandezza dell'energia di legame è:",
o:["Qualche eV, quasi indipendente da Z: lo schermo delle shell interne lascia Z<sub>eff</sub> ≈ piccolo","Cresce come Z²: decine di keV nei pesanti","Decresce come 1/Z²","Sempre esattamente 13,6 eV"],c:0,
e:"Le shell chiuse interne schermano quasi tutta la carica: l'elettrone esterno è quasi idrogenoide (⟨r⟩ ≈ n·a₀, E ≈ E<sub>H</sub>). Per questo la chimica coinvolge sempre energie di pochi eV, dall'idrogeno all'uranio (Esercitazione 3)."},
{id:"a61",b:"ato",q:"Perché nel potassio il 4s si riempie prima del 3d?",
o:["L'orbitale 4s penetra verso il nucleo e con lo screening ha energia più bassa del 3d (riempimento «diagonale» dell'aufbau)","Perché n = 4 &gt; 3 implica sempre energia minore","Per l'interazione spin-orbita","Per il principio di indeterminazione"],c:0,
e:"Il termine centrifugo tiene il 3d lontano dal nucleo, il 4s penetra le shell chiuse: E(4s) &lt; E(3d) negli atomi neutri. Origine dei metalli di transizione e delle loro configurazioni [Ar]3d<sup>n</sup>4s<sup>1,2</sup> (Esercitazione 3)."},
{id:"a62",b:"ato",q:"La riga X K<sub>α</sub> di un elemento è emessa quando:",
o:["Un elettrone della shell L (n = 2) riempie una lacuna creata nella shell K (n = 1)","Un elettrone di valenza viene espulso","Il nucleo si diseccita","Un elettrone libero viene catturato dall'atomo"],c:0,
e:"Bombardando con elettroni si crea la lacuna profonda; la transizione 2p → 1s emette un fotone di ~keV con 1/λ ∝ (Z−a)² (Moseley). Le serie K, L, M dipendono dalla shell della lacuna (Esercitazione 3)."},
{id:"a63",b:"ato",q:"Come varia l'affinità elettronica lungo un periodo della tavola?",
o:["Cresce da sinistra a destra: gli alogeni hanno le affinità massime, i gas nobili tornano a zero","Decresce da sinistra a destra","È costante","È massima per gli alcalini"],c:0,
e:"Z<sub>eff</sub> cresce lungo il periodo (lo schermo dei compagni di shell è inefficace): l'elettrone extra è sempre più legato, finché la shell si chiude. Complementare all'energia di ionizzazione, anch'essa crescente (Esercitazione 3)."},
{id:"a64",b:"ato",q:"Uno stato atomico si dice metastabile quando:",
o:["Tutte le transizioni di dipolo elettrico verso stati inferiori sono proibite dalle regole di selezione: decade lentamente per processi di ordine superiore","Ha energia esattamente doppia del fondamentale","È lo stato fondamentale di uno ione","Ha vita media nulla"],c:0,
e:"Esempio classico: livelli con ΔS ≠ 0 o ΔJ = 0→0 verso tutti gli stati inferiori. Decadono via dipolo magnetico/quadrupolo (vite medie lunghissime): essenziali per l'inversione di popolazione nei laser (problema d'esame sull'O eccitato, Esercitazione 3)."},
{id:"a65",b:"ato",q:"Le tre scale di energia dell'atomo (struttura di Bohr, spin-orbita, Zeeman a 1 T) stanno tra loro circa come:",
o:["eV : 10⁻³ eV (∝ α⁴mc²) : 10⁻⁵ eV — perturbazioni successive su scale decrescenti","Tutte confrontabili","10⁻⁵ : 10⁻³ : 1 eV","eV : eV : eV, distinte solo dal segno"],c:0,
e:"E<sub>Bohr</sub> ≈ α²mc²/2 = 13,6 eV; E<sub>SO</sub> ≈ α⁴mc² ≈ meV; E<sub>Z</sub> = μ<sub>B</sub>B ≈ 5,8·10⁻⁵ eV/T. La teoria delle perturbazioni si applica in cascata: prima la struttura fine, poi lo Zeeman (Esercitazione 4)."},
{id:"a66",b:"ato",q:"Che cosa distingue il regime Zeeman dal regime Paschen–Back?",
o:["Il confronto tra B<sub>ext</sub> e il campo interno B<sub>int</sub> dello spin-orbita (~10 T per l'idrogeno): sotto, lo Zeeman corregge i livelli J; sopra, L e S si disaccoppiano","La temperatura del gas","La polarizzazione della luce","Il valore di n dell'orbitale"],c:0,
e:"B<sub>int</sub> è il campo efficace visto dallo spin per il moto orbitale. B<sub>ext</sub> &lt; B<sub>int</sub>: J buon numero quantico, E = g<sub>J</sub>m<sub>J</sub>μ<sub>B</sub>B. B<sub>ext</sub> &gt; B<sub>int</sub>: L e S precedono separatamente, E = (m<sub>l</sub>+2m<sub>s</sub>)μ<sub>B</sub>B (Esercitazione 4)."},
{id:"a67",b:"ato",q:"Nella transizione ¹D₂ → ¹P₁ del cadmio (riga rossa, 643,8 nm) in campo magnetico, le 9 transizioni permesse producono:",
o:["3 righe equispaziate, perché g<sub>J</sub> = 1 per entrambi i livelli e conta solo Δm<sub>J</sub> = 0, ±1","9 righe distinte","5 righe","1 riga sola: lo Zeeman non agisce sui singoletti"],c:0,
e:"I singoletti hanno g = 1: i pettini di sottolivelli dei due termini hanno la stessa spaziatura μ<sub>B</sub>B, quindi le transizioni si raggruppano per Δm<sub>J</sub>. È lo Zeeman «normale», spiegabile senza spin (Esercitazione 4)."},
{id:"a68",b:"ato",q:"Nella riga gialla del sodio (²P₁/₂ → ²S₁/₂) in campo debole si osservano 4 righe e la riga centrale scompare. Perché?",
o:["g(²S₁/₂) = 2 e g(²P₁/₂) = 2/3: gli splitting diversi generano 4 transizioni tutte spostate, nessuna alla frequenza originale","Per l'effetto Doppler termico","Perché ΔJ = 0 è proibita","Per l'assorbimento del vapore"],c:0,
e:"Le 4 transizioni (Δm<sub>J</sub> = 0, ±1 tra 2+2 sottolivelli) cadono a ±⅓ΔE₁ e ±⅔ΔE₁ attorno alla riga imperturbata, con ΔE₁ = 2μ<sub>B</sub>B: spaziature ⅓, ⅔, ⅓. Lo spettro «anomalo» rivela g<sub>J</sub> e quindi lo spin (Esercitazione 4)."},
{id:"a69",b:"ato",q:"Nell'apparato di spettroscopia Zeeman si eccita il vapore con una scarica elettrica invece che otticamente. Perché?",
o:["L'eccitazione per urto elettronico non è vincolata dalle regole di selezione di dipolo: popola anche stati altrimenti irraggiungibili","Perché la luce non attraversa il vetro","Per riscaldare il vapore","Per polarizzare gli atomi"],c:0,
e:"Le regole ΔS = 0, ΔL = ±1… valgono per i fotoni (dipolo), non per gli urti. Si studia poi l'EMISSIONE durante il rilassamento, dove le regole di dipolo tornano a selezionare le righe (Esercitazione 4)."},
{id:"a70",b:"ato",q:"In regime di Paschen–Back, i livelli del Na 3p (l = 1) si dispongono secondo m<sub>l</sub>+2m<sub>s</sub> nei valori:",
o:["2, 1, 0, 0, −1, −2: sei stati, due dei quali degeneri a 0","3, 2, 1, 0, −1, −2, −3","±1/2 soltanto","2, 1, −1, −2 senza degenerazioni"],c:0,
e:"m<sub>l</sub> ∈ {1,0,−1} e m<sub>s</sub> = ±½: (m<sub>l</sub>+2m<sub>s</sub>) dà 2,1,0,0,−1,−2. Con le regole Δm<sub>l</sub> = 0,±1 e Δm<sub>s</sub> = 0 verso 3s (±1) restano 3 energie: lo spettro «ritorna normale» (Esercitazione 4)."},
{id:"a71",b:"ato",q:"Quale regola di selezione aggiuntiva vale in regime di Paschen–Back?",
o:["Δm<sub>s</sub> = 0: il fotone non agisce sullo spin, e m<sub>s</sub> è tornato un buon numero quantico","Δm<sub>l</sub> = ±2","ΔS = ±1","Δn = 0"],c:0,
e:"Con L e S disaccoppiati, la transizione di dipolo cambia solo la parte orbitale (Δl = ±1, Δm<sub>l</sub> = 0,±1) lasciando lo spin intatto. È questo a ridurre le righe da 4 (anomalo) a 3 (normale)."},
{id:"a72",b:"ato",q:"L'esperimento di Stern–Gerlach (1922) dimostrò che:",
o:["Il momento magnetico atomico è quantizzato spazialmente: il fascio si divide in un numero DISCRETO di componenti","Gli atomi sono elettricamente neutri","Il momento angolare orbitale può assumere valori continui","I nuclei hanno spin"],c:0,
e:"Un fascio di atomi d'argento in campo disomogeneo si divide in 2 (non in una banda continua): quantizzazione di m<sub>J</sub> — e col senno di poi, prova dello spin ½ dell'elettrone (2J+1 = 2)."},
{id:"a73",b:"ato",q:"Perché i gas nobili non mostrano effetto Zeeman al primo ordine?",
o:["Il fondamentale è ¹S₀: J = 0, nessun momento magnetico e nessuna separazione dei livelli","Perché sono chimicamente inerti","Perché hanno Z pari","Perché lo spin-orbita li protegge"],c:0,
e:"Shell chiuse → L = S = J = 0: lo stato è non degenere e μ = 0. Resta solo la risposta diamagnetica (secondo ordine). Lo stesso vale per ogni ione a shell chiuse (Na⁺, Cl⁻…)."},
{id:"a74",b:"ato",q:"Il calcolo esplicito del fattore di Landé per il termine ²P₁/₂ dà:",
o:["g = 2/3: il momento magnetico è «ridotto» perché L e S sono quasi opposti in questo accoppiamento","g = 2","g = 1","g = 4/3"],c:0,
e:"g = 1 + [J(J+1)−L(L+1)+S(S+1)]/[2J(J+1)] = 1 + (¾−2+¾)/(3/2) = 2/3. Con J = 3/2 invece: g = 4/3. Questi due numeri generano lo Zeeman anomalo del sodio (Esercitazione 4)."},
{id:"a75",b:"ato",q:"Qual è l'origine fisica della prima regola di Hund (S massimo)?",
o:["Con spin paralleli la parte spaziale è antisimmetrica: gli elettroni si evitano e la repulsione coulombiana media diminuisce (energia di scambio)","L'interazione magnetica diretta tra gli spin","L'attrazione spin-nucleo","La minimizzazione dell'energia cinetica"],c:0,
e:"Non è un effetto magnetico: è elettrostatica + antisimmetria. Il «buco di Fermi» tra elettroni a spin parallelo riduce ⟨1/r₁₂⟩. Lo stesso meccanismo, tra atomi, genera il ferromagnetismo (integrale di scambio)."},
{id:"a76",b:"ato",q:"Le regole di Hund sono affidabili:",
o:["Solo per individuare il termine FONDAMENTALE di una configurazione, non per ordinare gli stati eccitati","Per l'intero spettro di ogni atomo","Solo per atomi con un elettrone","Solo in presenza di campo magnetico"],c:0,
e:"Per il C prevedono correttamente ³P₀ &lt; ¹D₂ &lt; ¹S₀, ma in generale l'ordine dei termini eccitati può violarle: sono regole empiriche giustificate dallo scambio solo per lo stato più basso (Esercitazione 3)."},
{id:"a77",b:"ato",q:"Perché la riga D del sodio è un doppietto (589,0 e 589,6 nm) già a campo nullo?",
o:["Per lo spin-orbita: il livello 3p si separa in ²P₃/₂ e ²P₁/₂ (struttura fine)","Per l'effetto Zeeman del campo terrestre","Per la struttura iperfine","Per collisioni tra atomi"],c:0,
e:"H<sub>SO</sub> ∝ L·S separa i due J = 3/2, 1/2 di ~2 meV. Le due righe verso ²S₁/₂ sono il doppietto giallo. In campo esterno debole ciascuna si separa ulteriormente (Zeeman anomalo)."},
// ---- Atomica: effetto Stark (Es. 5) e completamenti ----
{id:"a78",b:"ato",q:"Nel trattare l'effetto Stark sull'idrogeno, la perturbazione H′ = eεz viene applicata PRIMA della struttura fine quando:",
o:["Il campo elettrico è abbastanza forte da rendere lo shift Stark maggiore dello splitting spin-orbita","Il campo è debolissimo","L'atomo è nello stato fondamentale","Mai: la struttura fine domina sempre"],c:0,
e:"Le perturbazioni si applicano in ordine di grandezza decrescente. Con ε intensi, eεa₀ supera i meV dello spin-orbita: si diagonalizza H′ sulla shell degenere ignorando la struttura fine (Esercitazione 5)."},
{id:"a79",b:"ato",q:"Nella matrice 4×4 dello Stark su n = 2, quali regole annullano quasi tutti gli elementi ⟨2l′m′|z|2lm⟩?",
o:["[L<sub>z</sub>, z] = 0 → m′ = m; z dispari → l′ ≠ l (parità opposte): sopravvive solo ⟨200|z|210⟩","Solo la conservazione dell'energia","La regola ΔS = 0","Nessuna: la matrice è piena"],c:0,
e:"z conserva m (simmetria cilindrica attorno al campo) e connette solo parità opposte: dei 16 elementi resta ⟨200|z|210⟩ = −3a₀. La simmetria fa il 90% del lavoro prima di ogni integrale (Esercitazione 5)."},
{id:"a80",b:"ato",q:"Gli autostati dello Stark lineare su n = 2 sono (ψ₂₀₀ ∓ ψ₂₁₀)/√2 con energie ±3eεa₀. Che proprietà notevole hanno?",
o:["Non hanno parità definita: sono ibridi sp<sub>z</sub> con momento di dipolo elettrico PERMANENTE d = 3ea₀","Sono ancora autostati di L²  e parità","Hanno dipolo nullo per simmetria","Sono stati con m = ±1"],c:0,
e:"Il campo mescola 2s e 2p₀ (degeneri): i «buoni» stati hanno carica spostata lungo z, cioè dipolo statico — possibile solo per la degenerazione accidentale s-p dell'idrogeno. ψ₂₁±₁ restano imperturbati (Esercitazione 5)."},
{id:"a81",b:"ato",q:"Per lo stato fondamentale (non degenere) di un atomo qualsiasi, l'effetto Stark è:",
o:["Quadratico: E⁽²⁾ = −½αε² &lt; 0, con α polarizzabilità (dipolo indotto, non permanente)","Lineare in ε","Nullo a tutti gli ordini","Positivo: il campo alza il fondamentale"],c:0,
e:"E⁽¹⁾ = 0 per parità (stato non degenere ⇒ parità definita). Al 2° ordine tutti i termini sono negativi per il fondamentale. Il dipolo d = αε è indotto dal campo, a differenza degli ibridi dello Stark lineare (Esercitazione 5)."},
{id:"a82",b:"ato",q:"La stima per maggiorazione dello Stark quadratico sul fondamentale dell'idrogeno usa la completezza per ottenere:",
o:["Σ′|⟨nlm|z|100⟩|² = ⟨z²⟩₁₀₀ = a₀² (un terzo di ⟨r²⟩ = 3a₀²)","Σ′|⟨nlm|z|100⟩|² = 0","⟨z⟩₁₀₀ = a₀","⟨r⟩₁₀₀ = a₀/2"],c:0,
e:"Maggiorando i denominatori con E₂−E₁ e usando Σ|n⟩⟨n| = 1: la somma delle |⟨z⟩|² diventa ⟨z²⟩ nel fondamentale = ⅓⟨r²⟩ = a₀² (per simmetria sferica). Tecnica standard da sapere all'orale (Esercitazione 5)."},
{id:"a83",b:"ato",q:"In un atomo a molti elettroni (stato |γ, J, M<sub>J</sub>⟩), lo shift Stark quadratico ha la forma:",
o:["E⁽²⁾ = ε²(A + B·M<sub>J</sub>²): dipende da M<sub>J</sub>² e NON rimuove la degenerazione tra +M<sub>J</sub> e −M<sub>J</sub>","E⁽²⁾ ∝ M<sub>J</sub>: rimuove tutta la degenerazione","E⁽²⁾ uguale per tutti gli M<sub>J</sub>","E⁽²⁾ = 0 sempre"],c:0,
e:"z è pari sotto inversione temporale combinata con rotazione di π: gli stati ±M<sub>J</sub> restano degeneri (a differenza dello Zeeman, che è dispari in M<sub>J</sub>). Regole: ΔM<sub>J</sub> = 0, J′ = J±1 con parità opposta (Esercitazione 5)."},
{id:"a84",b:"ato",q:"Come scala l'effetto Stark quadratico per un atomo idrogenoide di carica Z?",
o:["Come 1/Z⁴: gli orbitali si contraggono (a₀/Z) e i denominatori crescono (Z²)","Come Z²","È indipendente da Z","Come Z⁴"],c:0,
e:"E⁽²⁾ ∝ ε²a³/Z⁴ (a³ dal volume, 1/Z⁴ complessivo): gli ioni pesanti sono molto più «rigidi» da polarizzare. Coerente con α ∝ volume atomico (Esercitazione 5)."},
{id:"a85",b:"ato",q:"Nell'elio, a parità di configurazione eccitata (es. 1s2s), lo stato di tripletto (ortoelio) sta sotto il singoletto (paraelio). Perché?",
o:["Per l'energia di scambio: la parte spaziale antisimmetrica del tripletto tiene gli elettroni lontani, riducendo la repulsione","Per l'interazione magnetica tra gli spin","Per lo spin-orbita","Per la massa finita del nucleo"],c:0,
e:"E = E₀ + J ± K: il segno dello scambio favorisce il tripletto negli atomi (1ª regola di Hund). Nelle molecole avviene l'opposto (il legame preferisce il singoletto): confronto concettuale da orale."},
{id:"a86",b:"ato",q:"Il termine fondamentale del Gd³⁺ (4f⁷) è:",
o:["⁸S₇/₂: S = 7/2, L = 0 (subshell semipiena), J = 7/2 — con g<sub>J</sub> = 2","⁶H₁₅/₂","⁷F₆","²F₇/₂"],c:0,
e:"Sette elettroni f a spin paralleli su m<sub>l</sub> = 3…−3: M<sub>L</sub> = 0. p<sub>eff</sub> = 2√(7/2·9/2) = 7,94, contro 7,98 sperimentale: uno dei migliori accordi della teoria (Esercitazione 17)."},
{id:"a87",b:"ato",q:"Il termine fondamentale del Ce³⁺ (4f¹) è:",
o:["²F₅/₂: un solo elettrone f, subshell meno che semipiena → J = |L−S| = 5/2","²F₇/₂","¹F₃","⁴F₃/₂"],c:0,
e:"S = 1/2, L = 3; terza regola di Hund con shell &lt; metà: J = 3−1/2 = 5/2. g<sub>J</sub> = 6/7, p<sub>eff</sub> = 2,54 (sperimentale 2,51). Primo esempio della tabella delle terre rare (Esercitazione 17)."},
{id:"a88",b:"ato",q:"Il termine fondamentale del Dy³⁺ (4f⁹) è ⁶H₁₅/₂. Quale regola fissa J = 15/2?",
o:["Subshell PIÙ che semipiena → J = L + S = 5 + 5/2","J minimo sempre","J = L − S per ogni configurazione","La regola dell'intervallo di Landé"],c:0,
e:"Con 9 elettroni f: S = 5/2, L = 5 (H). Oltre metà riempimento lo spin-orbita cambia segno effettivo → J massimo. p<sub>eff</sub> = 10,65 vs 10,63 sperimentale: record di accordo (Esercitazione 17)."},
{id:"a89",b:"ato",q:"L'europio ([Xe]4f⁷6s²) ha termine fondamentale ⁸S₇/₂. In campo debole, in quante righe si separa il livello?",
o:["8 = 2J+1 sottolivelli, equispaziati di g<sub>J</sub>μ<sub>B</sub>B con g<sub>J</sub> = 2","7","15","2"],c:0,
e:"J = 7/2 → 2J+1 = 8; con L = 0, g<sub>J</sub> = 2 (puro spin). Problema del tema d'esame di maggio: seguiva lo stato eccitato 4f⁶6p¹ con il suo g<sub>J</sub> «strano» e l'ordine delle righe."},
{id:"a90",b:"ato",q:"Per lo ione Sn²⁺ eccitato (5s¹5p¹), i termini possibili sono ¹P₁ e ³P₀,₁,₂. Quale transizione verso il fondamentale ¹S₀ è permessa in dipolo elettrico?",
o:["Solo ¹P₁ → ¹S₀: le altre violano ΔS = 0 (o ΔJ = 0→0)","Tutte e quattro","Solo ³P₁ → ¹S₀","Solo ³P₀ → ¹S₀"],c:0,
e:"ΔS = 0 elimina i tripletti; ³P₀ → ¹S₀ violerebbe anche J = 0 → 0. Ma con Z = 50 lo schema LS è imperfetto (stati non puri di S): le righe di intercombinazione compaiono deboli — commento richiesto all'appello di giugno."},
{id:"a91",b:"ato",q:"La regola degli intervalli di Landé per un multipletto ³P₀,₁,₂ afferma che:",
o:["E(J)−E(J−1) ∝ J: quindi E₂−E₁ = 2α e E₁−E₀ = α, con α costante di spin-orbita","I tre livelli sono equispaziati","E(J) ∝ J²","Le separazioni sono casuali"],c:0,
e:"⟨L·S⟩ = ħ²[J(J+1)−L(L+1)−S(S+1)]/2 → differenze ∝ J. Dalle separazioni misurate si ricava α (per Sn²⁺: α = (E₃−E₁)/6 = 0,117 eV all'appello di giugno). Deviazioni dalla regola segnalano che LS sta cedendo."},
{id:"a92",b:"ato",q:"Come scala l'interazione spin-orbita con il numero atomico Z?",
o:["Circa come Z⁴ (per gli elettroni interni): per questo negli atomi pesanti si passa allo schema jj","Come Z","Come 1/Z","È indipendente da Z"],c:0,
e:"H<sub>SO</sub> ∝ (1/r)dV/dr: vicino a un nucleo poco schermato cresce ~Z⁴. A Z ≈ 50–60 diventa confrontabile con la repulsione residua: accoppiamento intermedio, poi jj (Au, Pb)."},
{id:"a93",b:"ato",q:"La parità di una configurazione elettronica è data da:",
o:["(−1) elevato alla somma degli l di tutti gli elettroni","(−1) elevato a L totale","(−1) elevato a J","Sempre pari per gli atomi neutri"],c:0,
e:"Parità = (−1)^Σl<sub>i</sub>. La transizione di dipolo richiede cambio di parità (operatore dispari): da qui Δl = ±1 per l'elettrone che salta. Nota: la parità NON è (−1)^L — errore frequente."},
{id:"a94",b:"ato",q:"Perché scrivere la funzione d'onda a N elettroni come determinante di Slater garantisce il principio di Pauli?",
o:["Scambiare due elettroni scambia due righe (cambio segno); due elettroni nello stesso stato = due colonne uguali → determinante nullo","Perché il determinante è sempre positivo","Perché diagonalizza l'hamiltoniana esattamente","Non lo garantisce: serve una correzione"],c:0,
e:"L'antisimmetria e l'esclusione sono automatiche nell'algebra dei determinanti. Hartree–Fock usa proprio un determinante di prova: il termine di scambio nell'energia nasce da lì (Esercitazione 3)."},
{id:"a95",b:"ato",q:"Nella molecola di NH₃, i due stati «azoto sopra/sotto il piano degli idrogeni» formano un sistema a due livelli con Δ ≈ 10⁻⁴ eV. Quale applicazione ne è nata?",
o:["Il MASER (Townes, 1950): inversione di popolazione tra i due stati e amplificazione a 23,87 GHz","Il laser a elio-neon","La risonanza magnetica nucleare","L'orologio al cesio ottico"],c:0,
e:"Gli stati simmetrico/antisimmetrico dell'inversione sono separati da ~0,1 meV (microonde). Selezionando le molecole eccitate con un campo elettrico (Stark) si ottiene l'inversione di popolazione: primo «laser» della storia (Esercitazione 9)."},
{id:"a96",b:"ato",q:"Quale grandezza è direttamente misurata dalla spettroscopia di fotoemissione X (XPS) o dalle righe di Moseley?",
o:["Le energie di legame delle shell profonde, che scalano come (Z−a)²: un'impronta digitale dell'elemento","La massa atomica","Il raggio del nucleo","La valenza chimica"],c:0,
e:"Le shell interne sono quasi idrogenoidi e insensibili ai legami chimici: ogni elemento ha le sue righe K, L caratteristiche. Moseley (1913) ordinò così la tavola periodica per Z e non per massa (Esercitazione 3)."},
{id:"a97",b:"ato",q:"Un livello con J = 0 (es. ³P₀) posto in campo magnetico debole:",
o:["Non si separa: 2J+1 = 1, nessun sottolivello","Si separa in 3 per la molteplicità di spin","Si separa in 2L+1 componenti","Scompare dallo spettro"],c:0,
e:"La degenerazione Zeeman è 2J+1, non 2S+1 né 2L+1: con J = 0 lo stato è unico e non ha momento magnetico al 1° ordine (come i fondamentali ¹S₀ e i ³P₀ dei gruppi IV)."},
{id:"a98",b:"ato",q:"Nel metodo di Hartree, il potenziale efficace visto da un elettrone include:",
o:["L'attrazione del nucleo più la repulsione MEDIA della densità di carica degli altri N−1 elettroni","Solo l'attrazione del nucleo","La repulsione istantanea di ogni altro elettrone","Solo il campo esterno applicato"],c:0,
e:"V<sub>i</sub>(r) = −Ze²/4πε₀r + Σ<sub>j≠i</sub>∫|ψ<sub>j</sub>|²e²/(4πε₀|r−r′|)d³r′: campo medio. Trascura le correlazioni istantanee (e in Hartree semplice anche lo scambio, aggiunto da Fock)."},
{id:"a99",b:"ato",q:"Le energie di prima ionizzazione lungo la tavola periodica mostrano:",
o:["Massimi ai gas nobili e minimi agli alcalini, con crescita generale lungo ogni periodo","Crescita monotona con Z","Decrescita monotona con Z","Nessuna regolarità"],c:0,
e:"Andamento periodico: la shell che si chiude lega moltissimo (He: 24,6 eV), l'elettrone nuovo su una shell vergine è schermatissimo (Na: 5,1 eV). Piccole anomalie (Be→B, N→O) si spiegano con subshell piene/semipiene (Esercitazione 3)."},
{id:"a100",b:"ato",q:"Quale di queste transizioni è permessa in dipolo elettrico?",
o:["²P₃/₂ → ²S₁/₂","¹S₀ → ¹S₀ (tra configurazioni diverse)","³P₁ → ¹S₀ (in accoppiamento LS rigoroso)","²D₅/₂ → ²S₁/₂"],c:0,
e:"²P₃/₂→²S₁/₂: ΔS = 0 ✓, ΔL = 1 ✓, ΔJ = 1 ✓, parità cambia ✓. Le altre violano J = 0→0, ΔS = 0, o ΔJ ≤ 1 (5/2→1/2 richiede ΔJ = 2). Applicare le quattro regole in fila è l'esercizio tipo (Esercitazioni 3-4)."},
// ---- Statistica: microcanonico (Es. 6) ----
{id:"s31",b:"sta",q:"Nel microcanonico si fissa l'energia in un guscio E−Δ ≤ H ≤ E invece che esattamente E. Perché?",
o:["Per il principio di indeterminazione (e per avere un volume finito nello spazio delle fasi): il risultato non dipende da Δ per N grande","Per errore sperimentale","Perché l'energia non si conserva","Per includere gli scambi col termostato"],c:0,
e:"Una superficie a energia esatta ha misura nulla; il guscio di spessore Δ ha volume ∝ Δ, ma ln Γ (quindi S) è insensibile a Δ per N ~ 10²³. Coerente con ΔEΔt ≳ ħ (Esercitazione 6)."},
{id:"s32",b:"sta",q:"Il volume dell'ipersfera in n dimensioni V<sub>n</sub>(R) = π^(n/2)R<sup>n</sup>/(n/2)! serve nel microcanonico per:",
o:["Contare gli stati del gas ideale: la condizione Σp² ≤ 2mE definisce un'ipersfera di raggio √(2mE) nello spazio dei 3N momenti","Calcolare il volume del recipiente","Contare le configurazioni spaziali","Normalizzare la Maxwell–Boltzmann"],c:0,
e:"ω = V<sup>N</sup> × [volume iperguscio in 3N dimensioni]. La dimostrazione usa l'integrale gaussiano e la funzione Γ di Eulero: passaggio da sapere all'orale (Esercitazione 6)."},
{id:"s33",b:"sta",q:"Perché per N ~ 10²³ il volume dell'iperguscio coincide in pratica con quello dell'intera ipersfera?",
o:["In dimensione altissima quasi tutto il volume sta in una buccia sottilissima sotto la superficie: (1−s/R)<sup>n</sup> → 0 per n enorme","Perché il guscio è spesso","Per la simmetria sferica","È un'approssimazione grossolana ma comoda"],c:0,
e:"Il volume scala come R<sup>3N</sup>: togliere una buccia di spessore relativo s/R riduce il volume di un fattore e^(−3Ns/R) ≈ 0. Da qui la celebre «concentrazione della misura»: S calcolata con la sfera piena o col guscio è identica (Esercitazione 6)."},
{id:"s34",b:"sta",q:"L'entropia di Sackur–Tetrode del gas ideale monoatomico è (a meno di costanti):",
o:["S = k<sub>B</sub>N ln[(V/N)(4πmE/3Nh²)³ᐟ²] + (5/2)k<sub>B</sub>N: estensiva grazie al fattore 1/N!","S = k<sub>B</sub>N ln(V·E)","S = k<sub>B</sub> ln(V/N)","S = (3/2)k<sub>B</sub>N ln T soltanto"],c:0,
e:"Deriva da S = k<sub>B</sub>lnΓ con Stirling. Le combinazioni V/N ed E/N garantiscono S(λN, λV, λE) = λS. Senza 1/N! comparirebbe V (non V/N): paradosso di Gibbs (Esercitazione 6)."},
{id:"s35",b:"sta",q:"Nel microcanonico, la temperatura si definisce come:",
o:["1/T = (∂S/∂E)<sub>N,V</sub>: dal conteggio dei microstati si arriva alla termodinamica","T = ⟨E⟩/Nk<sub>B</sub> per definizione","T è un parametro esterno fissato dal termostato","T = 2E/3k<sub>B</sub> sempre"],c:0,
e:"È la definizione fondamentale. Per il gas ideale: S(E) → 1/T = (3/2)Nk<sub>B</sub>/E → E = (3/2)Nk<sub>B</sub>T (equipartizione ritrovata dal conteggio puro). Nel microcanonico non c'è nessun bagno: T emerge dal sistema stesso (Esercitazione 6)."},
{id:"s36",b:"sta",q:"Dal microcanonico del gas ideale, le trasformazioni adiabatiche (S costante) soddisfano:",
o:["E·V^(2/3) = costante, cioè TV^(2/3) = cost (γ = 5/3 monoatomico)","P·V = costante","E/V = costante","T·V = costante"],c:0,
e:"Da S(E,V) = cost: (V/N)(E/N)³ᐟ² fisso → EV²ᐟ³ = cost. Con E ∝ T si ritrova l'adiabatica del gas monoatomico: la termodinamica classica esce tutta dal conteggio (Esercitazione 6)."},
{id:"s37",b:"sta",q:"Confrontando l'oscillatore armonico classico e quantistico nel microcanonico si trova che il volume di un microstato è ω₀ = h. Come?",
o:["L'area classica tra due orbite con ΔE = ħω è 2πΔE/ω = h: un livello quantistico «occupa» esattamente h nello spazio delle fasi","Per definizione di h","Misurando la costante di Planck con il corpo nero","È solo un'analogia qualitativa"],c:0,
e:"La traiettoria è un'ellisse di area 2πE/ω: tra livelli adiacenti (spaziatura ħω) l'area cresce di h. Questo fissa la costante additiva di S e giustifica il conteggio semiclassico Γ = ω/h<sup>3N</sup> (Esercitazione 6)."},
{id:"s38",b:"sta",q:"Per N dipoli a due livelli ±ε con energia totale E fissata (microcanonico), il numero di microstati è:",
o:["Ω = N!/(n₊!n₋!), con n<sub>±</sub> = (N/2)(1 ± E/Nε) fissati da E","Ω = 2<sup>N</sup> per ogni E","Ω = N·n₊","Ω = (n₊)<sup>N</sup>"],c:0,
e:"Fissare E fissa quante particelle stanno su ciascun livello; Ω conta i modi di scegliere QUALI (binomiale). Con Stirling: S = −k<sub>B</sub>N[x lnx + (1−x)ln(1−x)], x = n₊/N. Problema identico al tema d'esame di giugno (Esercitazione 6)."},
{id:"s39",b:"sta",q:"Nel sistema a due livelli microcanonico, che cosa accade quando E &gt; 0 (più di metà delle particelle sul livello alto)?",
o:["∂S/∂E &lt; 0: la temperatura assoluta è negativa (inversione di popolazione)","Il sistema viola il secondo principio","S diverge","È impossibile fissare E &gt; 0"],c:0,
e:"S(E) è una campana con massimo a E = 0: sul ramo destro S decresce con E → T &lt; 0. Possibile solo perché lo spettro è limitato superiormente; uno stato non di equilibrio stabile ma realizzabile (spin nucleari, MASER) (Esercitazioni 6 e 9)."},
{id:"s40",b:"sta",q:"Il conteggio «palline e barriere» per M quanti su 3N oscillatori tratta palline e barriere come:",
o:["Oggetti indistinguibili tra loro: si divide per M! e (3N−1)! le permutazioni totali","Oggetti tutti distinguibili","Palline distinguibili e barriere no","Fermioni"],c:0,
e:"Γ = (M+3N−1)!/[M!(3N−1)!]: i quanti sono identici (bosoni ante litteram) e le pareti pure. Il conteggio soddisfa automaticamente Gibbs. Da qui, con Stirling e 1/T = ∂S/∂E, l'energia di Planck (Esercitazione 6)."},
{id:"s41",b:"sta",q:"L'energia di N oscillatori quantistici 3D ricavata dal MICROCANONICO è E = (3N/2)ħω·coth(ħω/2k<sub>B</sub>T). Che cosa dimostra il confronto col canonico?",
o:["I due ensemble danno lo stesso risultato per N grande: l'equivalenza degli ensemble","Il microcanonico è sbagliato","Il canonico vale solo ad alta T","Che ω dipende da T"],c:0,
e:"Stesso risultato di Z<sub>N</sub> = [2sinh(βħω/2)]<sup>−N</sup> derivato col termostato: per sistemi macroscopici le fluttuazioni relative di E nel canonico sono ~1/√N → gli ensemble sono equivalenti (Esercitazioni 6 e 8)."},
{id:"s42",b:"sta",q:"Ad alta temperatura, l'energia degli oscillatori E = (3N/2)ħω·coth(ħω/2k<sub>B</sub>T) tende a:",
o:["3Nk<sub>B</sub>T: il limite classico di equipartizione (Dulong–Petit)","(3N/2)ħω","Zero","3Nk<sub>B</sub>T² "],c:0,
e:"coth(x) ≈ 1/x per x ≪ 1: E → 3Nk<sub>B</sub>T, cioè k<sub>B</sub>T per ciascuno dei 3N modi (cinetica + potenziale). La quantizzazione sparisce quando k<sub>B</sub>T ≫ ħω (Esercitazione 6)."},
{id:"s43",b:"sta",q:"La funzione di partizione dell'ensemble microcanonico è a tutti gli effetti:",
o:["Γ (il numero di microstati accessibili): da lnΓ discendono tutte le grandezze termodinamiche","Z = Σe^(−βE)","Ξ = Σz<sup>N</sup>Z<sub>N</sub>","Non esiste una funzione di partizione nel microcanonico"],c:0,
e:"Ogni ensemble ha il suo «generatore»: Γ ↔ S = k<sub>B</sub>lnΓ (microcanonico), Z ↔ F (canonico), Ξ ↔ Ω = −PV (grancanonico). Confronto da tenere in mente per l'orale (Esercitazione 6)."},
{id:"s44",b:"sta",q:"Perché nel gas ideale classico il conteggio dei microstati usa ω₀ = h<sup>3N</sup> e non un'altra costante?",
o:["Il confronto col caso quantistico (oscillatore, particella in scatola) mostra che ogni stato occupa (ΔqΔp)³ = h³ per particella","È una scelta arbitraria priva di conseguenze fisiche","Per convenzione storica di Boltzmann","Perché h è piccola"],c:0,
e:"La scelta fissa la costante additiva dell'entropia (rilevante per potenziali chimici e equilibri): il valore h è imposto dalla meccanica quantistica, come mostra il conteggio esplicito dei livelli (Esercitazione 6)."},
{id:"s45",b:"sta",q:"Due gas identici alla stessa T e densità vengono messi in comunicazione. Secondo il conteggio CON il fattore di Gibbs, l'entropia:",
o:["Non cambia: mescolare gas identici non è un processo termodinamico","Aumenta di 2Nk<sub>B</sub>ln2","Diminuisce","Aumenta solo se T è alta"],c:0,
e:"Con S estensiva (V/N invariato) ΔS = 0 ✓. Per gas DIVERSI resta invece l'entropia di mescolamento 2Nk<sub>B</sub>ln2: la discontinuità tra «identici» e «diversi» è il cuore del paradosso di Gibbs (Esercitazione 6)."},
{id:"s46",b:"sta",q:"La probabilità che un sistema del canonico abbia energia in [E, E+dE] è P(E) ∝ g(E)e^(−βE). Perché è piccatissima attorno a ⟨E⟩ per N grande?",
o:["g(E) cresce rapidissimamente ed e^(−βE) decresce: il prodotto è una gaussiana di larghezza relativa ~1/√N","Perché l'energia è quantizzata","Perché il termostato impedisce le fluttuazioni","Non è piccata: tutte le E sono equiprobabili"],c:0,
e:"La competizione tra densità di stati e fattore di Boltzmann concentra P(E): fluttuazioni ΔE/⟨E⟩ ~ 10⁻¹² per una mole. Per questo canonico e microcanonico coincidono in pratica (Esercitazioni 6-7)."},
{id:"s47",b:"sta",q:"L'ordine corretto di grandezza dell'entropia di un sistema macroscopico (una mole) è:",
o:["S ~ Nk<sub>B</sub> ~ 10 J/K: l'entropia per particella è di pochi k<sub>B</sub>","S ~ k<sub>B</sub> ~ 10⁻²³ J/K","S ~ 10²³ J/K","S ~ 1 k<sub>B</sub> in totale"],c:0,
e:"S = k<sub>B</sub>lnΓ con lnΓ ~ N: ogni particella contribuisce con O(1) k<sub>B</sub> (per il gas ideale ~ una decina). Utile per stimare al volo se un risultato d'esame è sensato."},
{id:"s48",b:"sta",q:"Un sistema isolato evolve spontaneamente verso il macrostato:",
o:["Con il massimo numero di microstati compatibili coi vincoli (S massima): è schiacciantemente il più probabile","Con l'energia minima","Con la temperatura minima","Con il minimo numero di microstati"],c:0,
e:"Il secondo principio in chiave statistica: non un divieto assoluto ma una questione di probabilità con numeri tipo e^(10²³). L'energia minima è il criterio a T fissata (canonico, minimo di F), non per sistemi isolati."},
// ---- Statistica: canonico (Es. 7-8-9) ----
{id:"s49",b:"sta",q:"Un gas ideale in un cilindro verticale in campo gravitazionale (H = p²/2m + mgz, colonna infinita) ha energia interna:",
o:["U = (5/2)Nk<sub>B</sub>T: 3/2 dai momenti + 1 dal potenziale gravitazionale (che è ∝ z, non quadratico)","U = (3/2)Nk<sub>B</sub>T","U = 3Nk<sub>B</sub>T","U = (1/2)Nk<sub>B</sub>T"],c:0,
e:"Z₁ ∝ (k<sub>B</sub>T)^(5/2) → U = −N∂lnZ₁/∂β = (5/2)Nk<sub>B</sub>T. Il termine lineare mgz contribuisce con k<sub>B</sub>T intero (non ½: l'equipartizione con ½k<sub>B</sub>T vale solo per termini quadratici). Esercizio svolto dell'Esercitazione 7."},
{id:"s50",b:"sta",q:"La legge di Stevino/barometrica P(z) = P(0)e^(−mgz/k<sub>B</sub>T) si può ricavare in due modi indipendenti:",
o:["Bilancio meccanico dP/dz = −ρg oppure peso di Boltzmann e^(−βmgz): stessa legge","Solo con la fluidodinamica","Solo con la meccanica quantistica","Con il principio di Pauli"],c:0,
e:"La coincidenza non è casuale: la distribuzione canonica È la condizione di equilibrio meccanico-statistico. Esercizio storico di Boltzmann (1879), rifatto in Esercitazione 7."},
{id:"s51",b:"sta",q:"La velocità media ⟨v⟩ della distribuzione di Maxwell vale:",
o:["√(8k<sub>B</sub>T/πm), compresa tra v<sub>max</sub> = √(2k<sub>B</sub>T/m) e √⟨v²⟩ = √(3k<sub>B</sub>T/m)","√(3k<sub>B</sub>T/m)","√(2k<sub>B</sub>T/m)","k<sub>B</sub>T/m"],c:0,
e:"⟨v⟩ = ∫v·w(v)dv con cambio di variabile e Γ(2) = 1. Ordine: v<sub>max</sub> &lt; ⟨v⟩ &lt; v<sub>qm</sub> (1 : 1,13 : 1,22). Saper distinguere le tre «velocità» è un classico dei quiz (Esercitazione 7)."},
{id:"s52",b:"sta",q:"Per N oscillatori armonici classici 1D identici (es. modello di un solido), la funzione di partizione è Z<sub>N</sub> = Z₁<sup>N</sup> senza 1/N!. Perché?",
o:["Ogni oscillatore è ancorato al suo sito reticolare: l'etichetta del sito li rende distinguibili","Perché gli oscillatori sono quantistici","È un errore: il fattore serve sempre","Perché N è piccolo"],c:0,
e:"Z₁ = k<sub>B</sub>T/ħω (due gaussiane: cinetica e potenziale) → U = Nk<sub>B</sub>T → c = Nk<sub>B</sub> (Dulong–Petit in 1D). Lo scambio di due oscillatori è una configurazione DIVERSA: niente Gibbs (Esercitazione 8)."},
{id:"s53",b:"sta",q:"La funzione di partizione dell'oscillatore armonico quantistico è:",
o:["Z₁ = e^(−βħω/2)/(1−e^(−βħω)) = [2sinh(βħω/2)]⁻¹ (serie geometrica sui livelli)","Z₁ = k<sub>B</sub>T/ħω esattamente","Z₁ = e^(−βħω)","Z₁ = 1 + e^(−βħω)"],c:0,
e:"Somma su ε<sub>n</sub> = (n+½)ħω. Ad alta T restituisce il classico k<sub>B</sub>T/ħω; a bassa T domina il punto zero. Da qui U = ħω/2 + ħω/(e^(βħω)−1): base di Einstein per i solidi e del corpo nero (Esercitazione 8)."},
{id:"s54",b:"sta",q:"Nel modello di Einstein del solido, il calore specifico a bassa temperatura:",
o:["Va a zero esponenzialmente, ∝ (Θ<sub>E</sub>/T)²e^(−Θ<sub>E</sub>/T): troppo veloce rispetto al T³ sperimentale","Va a zero come T³","Resta 3Nk<sub>B</sub>","Cresce linearmente"],c:0,
e:"L'unica frequenza ω<sub>E</sub> congela tutti i modi insieme sotto Θ<sub>E</sub>. L'esperimento dà T³: mancano i modi acustici a bassa frequenza, sempre eccitabili — corretti da Debye (Esercitazione 8)."},
{id:"s55",b:"sta",q:"Nella termodinamica magnetica, la magnetizzazione si ottiene dall'energia libera come:",
o:["M = −(1/μ₀)(∂F/∂H)<sub>T</sub>","M = +∂F/∂T","M = ∂U/∂H","M = F/H"],c:0,
e:"dF = −SdT − μ₀M·dH: la M è la variabile coniugata del campo. Per il paramagnete di Brillouin: F = −Nk<sub>B</sub>T lnZ₁ → M = nμ<sub>B</sub>g<sub>J</sub>J·B<sub>J</sub>(a). Schema di calcolo standard nei temi d'esame (Esercitazione 9)."},
{id:"s56",b:"sta",q:"La funzione di partizione di un dipolo quantistico J in campo B è una somma su m<sub>J</sub> = −J…+J che dà:",
o:["Z₁ = sinh[(1+1/2J)a]/sinh(a/2J): una serie geometrica finita di 2J+1 termini","Un integrale sull'angolo θ","Z₁ = 2cosh(a) per ogni J","Z₁ = e^(−βμB) soltanto"],c:0,
e:"I 2J+1 livelli Zeeman equispaziati formano una progressione geometrica. Il caso classico (Langevin) si ritrova nel limite J → ∞; per J = ½ si riduce a 2cosh. Derivazione da sapere (Esercitazione 9)."},
{id:"s57",b:"sta",q:"Per il sistema a due livelli ±ε in equilibrio canonico, il calore specifico c(T):",
o:["Si annulla sia a T → 0 sia a T → ∞, con un massimo (anomalia di Schottky) a k<sub>B</sub>T ≈ 0,42·Δ","Cresce monotonicamente con T","È costante = Nk<sub>B</sub>","Diverge a T → 0"],c:0,
e:"A bassa T il gap Δ = 2ε non è superabile; ad alta T i livelli sono equipopolati e l'energia satura. Il massimo (x·tanh(x/2) = 2 → x ≈ 2,4) rende il c(T) una sonda dei gap: firma di ogni sistema a due livelli (Esercitazione 9)."},
{id:"s58",b:"sta",q:"L'entropia del sistema a due livelli a T → ∞ tende a:",
o:["Nk<sub>B</sub>ln2: massimo disordine, metà e metà sui due livelli","Zero","Nk<sub>B</sub>","Infinito"],c:0,
e:"Due stati equiprobabili per particella → S = Nk<sub>B</sub>ln2 (formula di Gibbs con P = ½,½). A T → 0 invece S → 0 (tutti giù, terzo principio). Il grafico S(T) tra 0 e Nk<sub>B</sub>ln2 è un classico da disegnare."},
{id:"s59",b:"sta",q:"Le temperature negative realizzate da Purcell e Pound (1951) sfruttavano:",
o:["Gli spin nucleari del LiF: il tempo di termalizzazione interno t₁ ≪ del tempo di scambio col reticolo t₂","Il gas di elio a bassissima T","Fotoni in cavità","Elettroni di conduzione"],c:0,
e:"Invertendo B rapidamente, gli spin restano «allineati al contrario»: un sistema a T &lt; 0 quasi isolato per minuti. Le T negative sono PIÙ CALDE di ogni T positiva: il calore fluisce da T&lt;0 a T&gt;0 (Esercitazione 9)."},
{id:"s60",b:"sta",q:"Che relazione c'è tra il paramagnete a due livelli e il problema dei dipoli nel microcanonico?",
o:["Sono lo stesso sistema in ensemble diversi: U = −Nε·tanh(ε/k<sub>B</sub>T) esce identico da entrambi","Nessuna: sono sistemi fisici diversi","Il microcanonico dà un risultato diverso","Il canonico vale solo per ε piccolo"],c:0,
e:"Dal microcanonico (Ω binomiale + Stirling + 1/T = ∂S/∂E) o dal canonico (Z = (2cosh βε)<sup>N</sup>): stessa fisica. Il tema d'esame di giugno chiedeva proprio il percorso microcanonico (Esercitazioni 6 e 9)."},
{id:"s61",b:"sta",q:"La condizione di validità dell'espansione in serie geometrica per la Z grancanonica dei bosoni è:",
o:["e^(β(μ−ε)) &lt; 1 per ogni livello: μ deve stare sotto tutto lo spettro","μ &gt; 0","β piccolo","Nessuna: converge sempre"],c:0,
e:"Σ<sub>n</sub> x<sup>n</sup> converge per x &lt; 1: da qui μ &lt; ε₀. Quando μ → ε₀ l'occupazione del fondamentale diverge: è l'anticamera della condensazione di Bose–Einstein (Esercitazione 10)."},
{id:"s62",b:"sta",q:"Il potenziale grancanonico Ω = −k<sub>B</sub>T·lnZ<sub>GC</sub> coincide con:",
o:["−PV: da qui l'equazione di stato una volta note Z<sub>GC</sub>(μ,V,T)","F = U − TS","G = μN","H = U + PV"],c:0,
e:"Ω = U − TS − μN = −PV (per l'estensività). Derivando: ⟨N⟩ = −∂Ω/∂μ, S = −∂Ω/∂T. Per i gas quantistici è la via maestra all'equazione di stato (Esercitazione 10)."},
{id:"s63",b:"sta",q:"Perché il grancanonico è l'ensemble «naturale» per le statistiche quantistiche?",
o:["Z<sub>GC</sub> fattorizza sui livelli di singola particella: Π<sub>i</sub>[1 ± e^(β(μ−ε<sub>i</sub>))]<sup>±1</sup>, senza il vincolo scomodo ΣN<sub>i</sub> = N","Perché le particelle quantistiche non si conservano mai","Perché evita la funzione d'onda","Perché T non è definita nel canonico"],c:0,
e:"Nel canonico il vincolo sul numero totale accoppia le occupazioni; nel grancanonico ogni livello è indipendente e si somma su n<sub>i</sub> = 0,1 (fermioni) o 0…∞ (bosoni): due righe di calcolo per FD e BE (Esercitazione 10)."},
{id:"s64",b:"sta",q:"Il numero medio di occupazione di un livello si ottiene da Z<sub>GC</sub> come:",
o:["⟨n<sub>i</sub>⟩ = −(1/β)∂lnZ<sub>GC</sub>/∂ε<sub>i</sub> (o ⟨N⟩ = (1/β)∂lnZ<sub>GC</sub>/∂μ)","⟨n<sub>i</sub>⟩ = Z<sub>GC</sub>/N","⟨n<sub>i</sub>⟩ = e^(−βε<sub>i</sub>)","⟨n<sub>i</sub>⟩ = 1/Z<sub>GC</sub>"],c:0,
e:"Derivando il logaritmo del prodotto si isola il singolo livello: escono direttamente n<sub>FD</sub> = 1/(e^(β(ε−μ))+1) e n<sub>BE</sub> = 1/(e^(β(ε−μ))−1). Il segno ± al denominatore ricorda il segno nella Z (Esercitazione 10)."},
{id:"s65",b:"sta",q:"A parità di ε, μ e T, come si ordinano le occupazioni delle tre statistiche?",
o:["n<sub>BE</sub> &gt; n<sub>MB</sub> &gt; n<sub>FD</sub>: i bosoni si «attraggono» statisticamente, i fermioni si escludono","n<sub>FD</sub> &gt; n<sub>MB</sub> &gt; n<sub>BE</sub>","Tutte uguali","Dipende dal volume"],c:0,
e:"Il −1 al denominatore gonfia la BE, il +1 comprime la FD (≤1); MB sta in mezzo. Le tre curve confluiscono quando e^(β(ε−μ)) ≫ 1: limite classico (Esercitazione 10 e dispense di trasporto)."},
{id:"s66",b:"sta",q:"Il fattore di «accrescimento» (1+n) per i bosoni e di «riduzione» (1−n) per i fermioni nelle probabilità di transizione porta, col bilancio dettagliato, a:",
o:["Le distribuzioni di Bose–Einstein e Fermi–Dirac all'equilibrio","La distribuzione di Maxwell–Boltzmann per entrambi","Una contraddizione","La legge di Curie"],c:0,
e:"È la derivazione «alla Einstein»: l'emissione stimolata (1+n) per i fotoni e il blocco di Pauli (1−n) per gli elettroni determinano le popolazioni stazionarie. Percorso alternativo al grancanonico, usato nelle dispense di trasporto."},
{id:"s67",b:"sta",q:"La lunghezza d'onda termica di de Broglie λ<sub>T</sub> = h/√(2πmk<sub>B</sub>T) serve a esprimere la condizione di limite classico come:",
o:["n·λ<sub>T</sub>³ ≪ 1: distanza media tra particelle ≫ della loro estensione ondulatoria","n·λ<sub>T</sub>³ ≫ 1","λ<sub>T</sub> = 0 esattamente","T ≪ T<sub>F</sub>"],c:0,
e:"Quando i pacchetti d'onda non si sovrappongono, l'indistinguibilità non produce effetti dinamici e vale MB (col suo 1/N!). Per gli elettroni in un metallo nλ³<sub>T</sub> ~ 10³: gas MAI classico → serve Sommerfeld."},
{id:"s68",b:"sta",q:"Nella Z canonica di un sistema con livelli degeneri, la degenerazione g<sub>i</sub> compare come:",
o:["Z = Σ<sub>i</sub> g<sub>i</sub>e^(−βE<sub>i</sub>): ogni livello pesa per il numero dei suoi stati","Z = Σ e^(−βg<sub>i</sub>E<sub>i</sub>)","Z = Π g<sub>i</sub>","Non compare: conta solo l'energia"],c:0,
e:"La somma corre sugli STATI, non sui livelli: raggruppando per energia spunta g<sub>i</sub>. Dimenticare la degenerazione (es. 2J+1, spin, molteplicità orbitali) è tra gli errori più frequenti nei problemi d'esame (Esercitazione 7)."},
{id:"s69",b:"sta",q:"Passando al continuo, la somma sugli stati si trasforma in Z = ∫g(E)e^(−βE)dE. Che cosa serve per farlo correttamente?",
o:["La densità degli stati g(E) del sistema: il conteggio geometrico degli stati per intervallo di energia","Solo il fattore di Boltzmann","La funzione d'onda esatta","Il potenziale chimico"],c:0,
e:"g(E) traduce il conteggio quantistico (livelli discreti) nel linguaggio degli integrali: costruirla (1D, 2D, 3D, dispersioni varie) è LO strumento che ricompare in trasporto, fononi, fotoni e magnetismo (Esercitazioni 7, 10, 14)."},
// ---- Statistica: indistinguibili (Es. 10) e completamenti ----
{id:"s70",b:"sta",q:"Il principio di Pauli in forma completa afferma che:",
o:["La funzione d'onda totale è simmetrica per scambio di bosoni (spin intero) e antisimmetrica per fermioni (spin semintero)","Due particelle qualsiasi non possono avere la stessa energia","Gli elettroni non possono stare nello stesso atomo","Vale solo per gli elettroni"],c:0,
e:"La versione «divulgativa» (niente doppi stati) è il corollario fermionico. Il legame spin-statistica governa tutto: occupazioni n = 0,1 per fermioni, n qualsiasi per bosoni (Esercitazione 10)."},
{id:"s71",b:"sta",q:"Per due particelle di spin ½ (fermioni), gli stati permessi combinano:",
o:["Spaziale simmetrica × singoletto, oppure spaziale antisimmetrica × tripletto (molteplicità 1 e 3)","Solo spaziale antisimmetrica","Spaziale simmetrica × tripletto","Qualunque combinazione"],c:0,
e:"ψ<sub>tot</sub> antisimmetrica: (S)×(A) o (A)×(S). Il conteggio degli stati con pesi 1 e 3 spiega perché Ω<sub>FD</sub> = 4Ω<sub>BE</sub> nell'esercizio dei due livelli degeneri (Esercitazione 10, «tipico aiuto da tema d'esame»)."},
{id:"s72",b:"sta",q:"Nel conteggio classico (Maxwell–Boltzmann) di 2 particelle di spin s, lo spin entra come:",
o:["Un fattore di degenerazione (2s+1)² sul conteggio spaziale, con il fattore corretivo 1/2! di Gibbs","Non entra mai","Un fattore (2s+1)","Un'interazione tra le particelle"],c:0,
e:"Classicamente lo spin è solo un'etichetta che moltiplica gli stati. Il confronto Ω<sub>MB</sub> vs Ω<sub>BE</sub>/Ω<sub>FD</sub> mostra che MB conta «troppo» o «troppo poco»: l'indistinguibilità quantistica non è riducibile al 1/N! (Esercitazione 10)."},
{id:"s73",b:"sta",q:"Le somme utili Σᵢ i = n(n+1)/2 e Σᵢ i² = n(n+1)(2n+1)/6 compaiono tipicamente:",
o:["Nei conteggi di microstati con degenerazioni crescenti (es. livelli con g = 2n+1): fornite come «espressioni utili» nei temi","Nel calcolo di integrali gaussiani","Nella legge di Curie","Nella funzione di Brillouin"],c:0,
e:"Nell'esercizio delle due particelle su livelli E = nε con degenerazione 2n+1, Ω(E) diventa un polinomio in N tramite queste somme. Vanno sapute USARE più che ricordare (Esercitazione 10)."},
{id:"s74",b:"sta",q:"Una particella quantistica in buca 1D ha E<sub>n</sub> = εn² con ε = π²ħ²/2mL². La Z canonica non è sommabile in forma chiusa: come la si studia?",
o:["Nei due limiti: T → 0 (domina n = 1) e T → ∞ (somma → integrale, risultato classico)","Solo numericamente","Con la teoria delle perturbazioni","Con il grancanonico"],c:0,
e:"È il modello del tema d'esame di maggio: chiedeva U e S in entrambi i limiti, con commento su terzo principio (S → 0) ed equipartizione (U → ½k<sub>B</sub>T). Tecnica dei limiti asintotici: sempre presente negli scritti (Esercitazione 7)."},
{id:"s75",b:"sta",q:"Nel limite T → ∞ della buca 1D, l'entropia cresce come:",
o:["S ≈ k<sub>B</sub>[ln((L/h)√(2πmk<sub>B</sub>T)) + ½]: logaritmica in T, come per la particella libera classica in un segmento","S ∝ T","S ∝ √T","Resta costante"],c:0,
e:"Con Z ≈ (L/h)√(2πmk<sub>B</sub>T) e S = k<sub>B</sub>(lnZ + βU): il conteggio classico riemerge con la SUA costante corretta (grazie a ω₀ = h). Il quantistico contiene il classico come caso limite (Esercitazione 7)."},
{id:"s76",b:"sta",q:"L'equivalenza «somma → integrale» per una somma su livelli discreti è lecita quando:",
o:["La spaziatura tra livelli è ≪ k<sub>B</sub>T: moltissimi termini contribuiscono in modo quasi continuo","Sempre","Solo a T = 0","Quando i livelli sono degeneri"],c:0,
e:"Criterio operativo che decide OGNI limite di alta temperatura: buca (ε ≪ k<sub>B</sub>T), rotazioni molecolari (B ≪ k<sub>B</sub>T), oscillatori (ħω ≪ k<sub>B</sub>T). Quando fallisce, compaiono i congelamenti quantistici dei gradi di libertà."},
{id:"s77",b:"sta",q:"L'energia libera F = U − TS è minima all'equilibrio per un sistema:",
o:["A T e V fissati (contatto con termostato): bilancia energia bassa ed entropia alta","Isolato (E fissata)","A P e T fissati","Sempre"],c:0,
e:"Per sistemi isolati il criterio è S massima; a T fissata il fattore e^(−βF) pesa i macrostati: vince il minimo di F. A bassa T domina U (ordine), ad alta T domina −TS (disordine): transizioni di fase in una riga."},
{id:"s78",b:"sta",q:"Perché la capacità termica di TUTTI i sistemi si annulla per T → 0?",
o:["Per il terzo principio: S → costante (zero per stato fondamentale non degenere), quindi c = T·∂S/∂T → 0","Perché l'energia si annulla","È falso: nei metalli resta costante","Per l'indistinguibilità"],c:0,
e:"Sotto la scala del primo stato eccitato non c'è nulla da eccitare. Ogni sistema lo fa a modo suo: esponenziale (gap: Einstein, Schottky), T³ (fononi acustici), T lineare (elettroni). Riconoscere il meccanismo dal comportamento di c(T) è materia d'orale."},
{id:"s79",b:"sta",q:"⟨n⟩ per un modo di fotoni (o fononi) a frequenza ω è n = 1/(e^(βħω)−1) SENZA potenziale chimico. Perché μ = 0?",
o:["Il numero di fotoni/fononi non è conservato: il sistema li crea e distrugge liberamente, quindi ∂F/∂N = 0 all'equilibrio","Perché sono privi di massa","Perché viaggiano alla velocità della luce","Per convenzione"],c:0,
e:"Se N non è vincolato, l'equilibrio si trova minimizzando F rispetto a N: μ = 0. È la distribuzione di Planck: caso particolare di BE. Vale per ogni quasiparticella non conservata (fononi, magnoni…) (Esercitazioni 8-10)."},
{id:"s80",b:"sta",q:"La radiazione di corpo nero e i fononi di Debye differiscono soprattutto perché:",
o:["I modi elettromagnetici sono infiniti, i modi reticolari sono 3N: esiste una frequenza massima (taglio di Debye)","I fotoni non seguono BE","I fononi hanno μ ≠ 0","Il corpo nero vale solo a bassa T"],c:0,
e:"Stessa g(ω) ∝ ω² e stessa statistica, ma il reticolo ha gradi di libertà finiti: l'integrale si ferma a ω<sub>D</sub>. Per questo il solido raggiunge Dulong–Petit mentre il corpo nero non satura mai (legge di Stefan T⁴) (Esercitazione 8)."},
{id:"s81",b:"sta",q:"Il valor medio dell'energia nel canonico si scrive in termini di Z come:",
o:["U = −∂lnZ/∂β = k<sub>B</sub>T²·∂lnZ/∂T","U = lnZ/β","U = −Z/β","U = ∂Z/∂T"],c:0,
e:"Identità operativa fondamentale: derivare lnZ genera i momenti dell'energia. Anche c<sub>V</sub> = ∂U/∂T = k<sub>B</sub>β²·∂²lnZ/∂β²: fluttuazioni di E e calore specifico sono la stessa cosa (⟨ΔE²⟩ = k<sub>B</sub>T²c<sub>V</sub>)."},
{id:"s82",b:"sta",q:"Un sistema con hamiltoniana indipendente da una coordinata (es. gas libero: H non dipende da q) ha Z che fattorizza. Quale conseguenza ha per il magnetismo classico?",
o:["Con la sostituzione p → p + eA la Z classica non cambia (si trasla l'integrale): M = 0, teorema di Bohr–van Leeuwen","Il magnetismo classico è fortissimo","La Z diverge","Nessuna"],c:0,
e:"L'integrale sui momenti è su tutto ℝ³: la traslazione di eA non cambia nulla → F indipendente da B → M = −∂F/∂B = 0. Il magnetismo esiste solo perché i livelli sono quantizzati (Esercitazione 9 e dispense di magnetismo)."},
{id:"s83",b:"sta",q:"Quale relazione lega la pressione alla funzione di partizione canonica?",
o:["P = −∂F/∂V = k<sub>B</sub>T·∂lnZ/∂V","P = ∂F/∂T","P = k<sub>B</sub>T·lnZ","P = U/V sempre"],c:0,
e:"Per il gas ideale: lnZ = N ln V + termini in T → P = Nk<sub>B</sub>T/V. L'equazione di stato «esce» dalla dipendenza di Z dal volume (via g(ε) o via i limiti dell'integrale spaziale)."},
{id:"s84",b:"sta",q:"Due comparti con gas ideale alla stessa T: nel canonico complessivo, la ripartizione più probabile delle N particelle si trova:",
o:["Massimizzando Z (o minimizzando F) rispetto a N₁: equivale a μ₁ = μ₂","Imponendo E₁ = E₂","Imponendo V₁ = V₂","Con N₁ = N₂ sempre"],c:0,
e:"Z<sub>tot</sub> = Σ<sub>N₁</sub> Z₁(N₁)Z₂(N−N₁): il termine massimo domina (metodo del punto sella). ∂F/∂N₁ = 0 → μ₁ = μ₂ → n₁ = n₂. Schema esatto del problema 1 del tema di luglio (Esercitazione 7)."},
{id:"s85",b:"sta",q:"L'entropia statistica S = −k<sub>B</sub>ΣP<sub>i</sub>lnP<sub>i</sub> è massima, a energia media fissata, proprio per:",
o:["La distribuzione canonica P<sub>i</sub> ∝ e^(−βE<sub>i</sub>): il canonico è la distribuzione di massima entropia","La distribuzione uniforme sempre","Una delta sullo stato fondamentale","La distribuzione di Poisson"],c:0,
e:"Massimizzare S con i vincoli ΣP = 1 e ⟨E⟩ fissata (moltiplicatori di Lagrange) dà il fattore di Boltzmann, con β = moltiplicatore dell'energia. Punto di vista «informazionale» utile all'orale."},
{id:"s86",b:"sta",q:"Il teorema di equipartizione si può enunciare in generale come ⟨x·∂H/∂x⟩ = k<sub>B</sub>T. Che cosa dà per il termine gravitazionale H ⊃ mgz (z ≥ 0)?",
o:["⟨mgz⟩ = k<sub>B</sub>T: un contributo INTERO, perché mgz è lineare (z·∂H/∂z = mgz)","⟨mgz⟩ = ½k<sub>B</sub>T","⟨mgz⟩ = 0","⟨mgz⟩ = 3k<sub>B</sub>T"],c:0,
e:"Il «½» vale solo per termini quadratici; per potenze diverse cambia il coefficiente. Coerente con U = (5/2)Nk<sub>B</sub>T del gas nel cilindro gravitazionale (Esercitazione 7): errore classico rispondere 3k<sub>B</sub>T/2 + ½."},
{id:"s87",b:"sta",q:"Le fluttuazioni relative dell'energia nel canonico scalano come:",
o:["ΔE/⟨E⟩ ∼ 1/√N: trascurabili per sistemi macroscopici","1/N²","√N","Costanti"],c:0,
e:"⟨ΔE²⟩ = k<sub>B</sub>T²c<sub>V</sub> ∝ N mentre ⟨E⟩ ∝ N. Per N ~ 10²³: fluttuazioni ~10⁻¹²: ecco perché fissare T (canonico) o fissare E (microcanonico) descrive lo stesso sistema."},
{id:"s88",b:"sta",q:"Quale di queste affermazioni sul fattore di Boltzmann e^(−ΔE/k<sub>B</sub>T) è corretta?",
o:["Confronta sempre un dislivello di energia con k<sub>B</sub>T ≈ 25 meV a temperatura ambiente","Contiene l'energia assoluta, non un dislivello","Vale solo per i gas","Diverge a bassa T"],c:0,
e:"Regola pratica universale: attivazioni, popolamenti, emissione termoionica (φ/k<sub>B</sub>T ≈ 25 → e⁻²⁵), popolazioni rotazionali, legge di Curie. Avere in mente k<sub>B</sub>T(300 K) = 25 meV risolve metà delle domande numeriche."},
{id:"s89",b:"sta",q:"Un gas di N particelle in 2D (superficie A) ha Z₁ = A·(2πmk<sub>B</sub>T)/h². Quale energia interna segue?",
o:["U = Nk<sub>B</sub>T: ½k<sub>B</sub>T per ciascuno dei 2 gradi di libertà traslazionali","U = (3/2)Nk<sub>B</sub>T","U = 2Nk<sub>B</sub>T","U = (5/2)Nk<sub>B</sub>T"],c:0,
e:"Z₁ ∝ T¹ → U = −N∂lnZ/∂β = Nk<sub>B</sub>T. L'equipartizione «conta i quadrati» nella hamiltoniana: in 2D sono p<sub>x</sub>², p<sub>y</sub>². Adattare i conti alla dimensionalità è un riflesso da allenare (compare con grafene e superfici)."},
{id:"s90",b:"sta",q:"Che cos'è l'ipotesi del «caos molecolare» (Stosszahlansatz) nel teorema H?",
o:["Le velocità di due particelle che stanno per urtarsi sono statisticamente scorrelate","Le molecole si muovono a caso senza urti","L'energia non si conserva negli urti","Il gas è sempre all'equilibrio"],c:0,
e:"È l'ingrediente che introduce la freccia del tempo: le correlazioni PRIMA dell'urto sono trascurate, quelle DOPO no. Da qui dH/dt ≤ 0 nonostante la dinamica microscopica reversibile (obiezioni di Loschmidt e Zermelo)."},
{id:"s91",b:"sta",q:"All'equilibrio, il teorema H seleziona come distribuzione stazionaria delle velocità:",
o:["La Maxwell–Boltzmann: l'unica per cui il termine d'urto si annulla (bilancio dettagliato)","Una gaussiana qualsiasi","La distribuzione uniforme","La Fermi–Dirac"],c:0,
