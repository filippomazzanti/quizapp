<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Struttura della Materia</title>
<style>
:root{
  --paper:#FBFAF7; --grid:rgba(56,92,160,.075); --card:#FFFFFF; --ink:#1E2733; --ink2:#5C6879;
  --line:#E2DFD5; --pen:#2447B8; --penbg:#EDF1FD; --pendark:#1A3488;
  --red:#C03A2E; --redbg:#FAEDEB; --ok:#2E7D4F; --okbg:#EBF4EE; --amber:#9A7118; --amberbg:#F8F1DF;
  --shadow:0 1px 3px rgba(30,39,51,.08),0 4px 14px rgba(30,39,51,.05);
}
@media (prefers-color-scheme: dark){:root{
  --paper:#141922; --grid:rgba(140,170,255,.055); --card:#1C2330; --ink:#E8EAF0; --ink2:#98A2B3;
  --line:#2A3342; --pen:#8AA7FF; --penbg:#243052; --pendark:#B7C7FF;
  --red:#FF8A7E; --redbg:#3D2724; --ok:#6BC795; --okbg:#1F3529; --amber:#D9AC55; --amberbg:#37301D;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --paper:#141922; --grid:rgba(140,170,255,.055); --card:#1C2330; --ink:#E8EAF0; --ink2:#98A2B3;
  --line:#2A3342; --pen:#8AA7FF; --penbg:#243052; --pendark:#B7C7FF;
  --red:#FF8A7E; --redbg:#3D2724; --ok:#6BC795; --okbg:#1F3529; --amber:#D9AC55; --amberbg:#37301D;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
:root[data-theme="light"]{
  --paper:#FBFAF7; --grid:rgba(56,92,160,.075); --card:#FFFFFF; --ink:#1E2733; --ink2:#5C6879;
  --line:#E2DFD5; --pen:#2447B8; --penbg:#EDF1FD; --pendark:#1A3488;
  --red:#C03A2E; --redbg:#FAEDEB; --ok:#2E7D4F; --okbg:#EBF4EE; --amber:#9A7118; --amberbg:#F8F1DF;
  --shadow:0 1px 3px rgba(30,39,51,.08),0 4px 14px rgba(30,39,51,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom))}
.serif,h1,h2{font-family:"STIX Two Text",Charter,"Iowan Old Style",Georgia,serif}
h1{font-size:26px;line-height:1.2;margin:0;text-wrap:balance;font-weight:700}
h2{font-size:20px;margin:0 0 6px;font-weight:700}
.sub{color:var(--ink2);font-size:13.5px;margin-top:4px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2);font-weight:600}
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.back{background:none;border:none;color:var(--pen);font:inherit;font-weight:600;font-size:15px;padding:6px 0;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.mbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);color:var(--ink);font:inherit}
.mbtn:active{transform:translateY(1px)}
.mbtn .t{font-weight:650;font-size:16.5px}
.mbtn .d{color:var(--ink2);font-size:13.5px;margin-top:2px}
.mbtn .n{margin-left:auto;flex-shrink:0}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.pill.pen{background:var(--penbg);color:var(--pendark)}
.pill.red{background:var(--redbg);color:var(--red)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.amber{background:var(--amberbg);color:var(--amber)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.qnum{font-variant-numeric:tabular-nums;font-weight:650;font-size:14px;color:var(--ink2)}
.progress{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--pen);border-radius:99px;transition:width .25s}
.qcard{padding:18px}
.qtext{font-size:17px;line-height:1.55;margin:6px 0 16px}
.qtext i, .opt i, .explain i{font-family:"STIX Two Text",Charter,Georgia,serif}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;min-height:48px;cursor:pointer;
  background:var(--paper);border:1.5px solid var(--line);border-radius:9px;color:var(--ink);font:inherit;font-size:15.5px;line-height:1.45}
.opt .lett{font-weight:700;color:var(--ink2);flex-shrink:0;font-family:Georgia,serif}
.opt.sel{border-color:var(--pen);background:var(--penbg)}
.opt.sel .lett{color:var(--pendark)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .lett{color:var(--ok)}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
.opt.wrong .lett{color:var(--red)}
.opt:disabled{cursor:default;opacity:1}
.opt.dim{opacity:.55}
.explain{margin-top:14px;padding:13px 14px;border-left:3px solid var(--red);background:var(--redbg);border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.55}
.explain.good{border-left-color:var(--ok);background:var(--okbg)}
.explain .label{display:block;margin-bottom:4px}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.bottombar .inner{display:flex;gap:10px;width:100%;max-width:608px}
.btn{flex:1;padding:13px 16px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  font:inherit;font-weight:650;font-size:15.5px;cursor:pointer;min-height:48px}
.btn.primary{background:var(--pen);border-color:var(--pen);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#10141C}
@media (prefers-color-scheme: dark){.btn.primary{color:#10141C}}
:root[data-theme="light"] .btn.primary{color:#fff}
.btn.ghost{flex:0 0 auto}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}
.chip{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink2);
  font:inherit;font-size:13px;font-weight:650;cursor:pointer;font-variant-numeric:tabular-nums}
.chip.cur{border-color:var(--pen);color:var(--pendark);background:var(--penbg)}
.chip.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.g{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.chip.s{background:var(--redbg);border-color:var(--red);color:var(--red)}
.chip.b{background:var(--amberbg);border-color:var(--amber);color:var(--amber)}
.score{display:flex;gap:10px;margin:16px 0}
.scorebox{flex:1;text-align:center;padding:14px 6px;border-radius:10px}
.scorebox .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;font-family:Georgia,serif}
.scorebox .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-top:2px}
.verdict{padding:14px 16px;margin:6px 0 18px}
.rev{margin-top:10px}
.rev .qcard{margin-bottom:12px}
.statrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.statrow:last-child{border-bottom:none}
.statrow .name{flex:0 0 150px;font-size:14.5px;font-weight:600}
.bar{flex:1;height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.statrow .pct{flex:0 0 78px;text-align:right;font-size:13.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
details.theory{margin-bottom:10px;overflow:hidden}
details.theory summary{padding:15px 16px;cursor:pointer;font-weight:650;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center;font-family:"STIX Two Text",Charter,Georgia,serif}
details.theory summary::after{content:"+";color:var(--pen);font-size:20px;font-weight:400}
details.theory[open] summary::after{content:"–"}
details.theory .body{padding:2px 16px 16px;font-size:14.5px;line-height:1.62;border-top:1px dashed var(--line)}
details.theory .body ul{margin:8px 0;padding-left:18px}
details.theory .body li{margin-bottom:7px}
details.theory .body b{color:var(--pendark)}
.hist td{padding:7px 10px 7px 0;font-size:14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.danger{color:var(--red);border-color:var(--red)}
.empty{padding:26px 18px;text-align:center;color:var(--ink2)}
.footer-note{margin-top:22px;text-align:center;color:var(--ink2);font-size:12.5px}
button:focus-visible,.opt:focus-visible,summary:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>
"use strict";
const BLOCKS={ato:"Fisica atomica",sta:"Meccanica statistica",tra:"Trasporto",sol:"Stato solido",mag:"Magnetismo"};
const DB=[
// ============ FISICA ATOMICA ============
{id:"a01",b:"ato",x:1,q:"Qual è il vantaggio dell'approssimazione di campo centrale nella descrizione di un atomo a molti elettroni?",
o:["Permette di trasformare il problema a molti elettroni in un insieme di problemi a un elettrone","Elimina la necessità di imporre il principio di esclusione di Pauli","Permette di ignorare completamente l'interazione elettrone–elettrone","Permette di ignorare l'interazione elettrone–nucleo"],c:0,
e:"Sostituendo la repulsione e–e con un potenziale medio a simmetria sferica V(r), l'hamiltoniana diventa separabile: ogni elettrone risolve un problema idrogenoide efficace. L'interazione e–e non è ignorata: è inglobata in media nel campo centrale (domanda reale d'esame)."},
{id:"a02",b:"ato",q:"Nel metodo di Hartree, che cosa significa che il calcolo deve essere «autoconsistente»?",
o:["Il potenziale medio deve riprodurre, iterando, le funzioni d'onda da cui è stato calcolato", "L'energia totale dell'atomo deve coincidere esattamente con la somma delle energie dei singoli orbitali", "Le funzioni d'onda ottenute devono essere autofunzioni esatte dell'hamiltoniana completa a molti elettroni", "Il potenziale efficace deve coincidere con quello coulombiano del nucleo nudo, senza contributi elettronici"],c:0,
e:"Si parte da ψ di prova, si calcola il potenziale medio che esse generano, si risolve Schrödinger nel nuovo potenziale e si itera finché le ψ in uscita coincidono con quelle in ingresso: campo medio autoconsistente."},
{id:"a03",b:"ato",q:"Che cosa aggiunge il metodo di Hartree–Fock rispetto al metodo di Hartree?",
o:["L'antisimmetria della funzione d'onda, imposta con il determinante di Slater", "La correzione relativistica di massa e velocità sui livelli degli elettroni interni", "L'interazione spin-orbita, che separa i livelli con lo stesso L ma J diverso", "Il moto del nucleo attorno al centro di massa comune con gli elettroni"],c:0,
e:"Hartree usa un semplice prodotto di orbitali; Hartree–Fock impone l'antisimmetria richiesta dal principio di Pauli scrivendo ψ come determinante di Slater, il che genera il termine di scambio nell'energia."},
{id:"a04",b:"ato",q:"A parità di n, perché in un atomo a molti elettroni si ha E(3s) &lt; E(3p) &lt; E(3d), mentre nell'idrogeno i tre livelli sono degeneri?",
o:["Gli orbitali con l basso penetrano verso il nucleo e vedono carica meno schermata", "Gli orbitali con l alto risentono di un'interazione spin-orbita molto più intensa", "La degenerazione viene rimossa dal moto di rinculo del nucleo attorno al centro di massa", "Gli orbitali s hanno energia cinetica media minore perché il termine centrifugo è nullo"],c:0,
e:"Con lo screening la degenerazione in l si rompe: il termine centrifugo ∝ l(l+1)/r² tiene lontani gli orbitali ad alto l, mentre gli s penetrano nelle shell interne e vedono Z<sub>eff</sub> più grande → energia più bassa."},
{id:"a05",b:"ato",q:"La legge di Moseley per le righe X caratteristiche afferma che:",
o:["1/λ ∝ (Z−a)², con a costante di schermo: la frequenza cresce quadraticamente", "1/λ ∝ Z, quindi la frequenza delle righe cresce linearmente con il numero atomico", "1/λ ∝ (Z−a)³, con esponente cubico valido per tutte le serie (K, L, M)", "La lunghezza d'onda delle righe X caratteristiche non dipende dall'elemento emettitore"],c:0,
e:"Le righe X (K<sub>α</sub>, L<sub>α</sub>…) nascono dal riempimento di lacune in shell profonde, dove l'elettrone vede carica efficace Z−a: livelli idrogenoidi ∝ (Z−a)² → √ν lineare in Z. Storicamente ha ordinato la tavola periodica."},
{id:"a06",b:"ato",q:"Quali termini spettroscopici derivano dalla configurazione 2p² del carbonio?",
o:["¹D, ³P, ¹S (il ³D è vietato dal principio di Pauli)", "¹D, ³D, ¹S, ³P", "¹P, ³P, ¹D, ³D, ¹S, ³S", "Soltanto ³P, gli altri sono vietati da Pauli"],c:0,
e:"Per due elettroni equivalenti (stesso n, l) la tabella dei 15 microstati dà solo ¹D₂, ³P₀,₁,₂, ¹S₀: il ³D richiederebbe due elettroni con gli stessi quattro numeri quantici. Con elettroni non equivalenti (es. 2p3p) tutti i termini sarebbero permessi."},
{id:"a07",b:"ato",q:"Qual è il termine fondamentale del carbonio (2p²)?",
o:["³P₀", "³P₂", "¹S₀", "¹D₂"],c:0,
e:"Prima regola di Hund: S massimo → tripletto ³P. Terza regola: subshell meno che semipiena → J minimo, quindi ³P₀. L'ordine dei livelli è ³P &lt; ¹D &lt; ¹S."},
{id:"a08",b:"ato",q:"In quale ordine si applicano le regole di Hund per trovare il termine fondamentale?",
o:["S massimo; a parità di S, L massimo; poi J minimo o massimo secondo il riempimento", "L massimo; poi, a parità di L, S massimo; infine J sempre massimo indipendentemente dal riempimento", "J massimo; poi L massimo a parità di J; infine S massimo", "S massimo; poi J sempre minimo; infine L massimo compatibile con Pauli"],c:0,
e:"1ª: massima molteplicità di spin (scambio + Pauli abbassano la repulsione). 2ª: L massimo. 3ª: lo spin-orbita ordina i J: J = |L−S| se la subshell è meno che semipiena, J = L+S se più che semipiena. Hund è affidabile solo per il termine fondamentale."},
{id:"a09",b:"ato",q:"Un atomo ha configurazione con subshell esattamente semipiena (es. 3d⁵). Che cosa prevede la teoria per il termine fondamentale?",
o:["L = 0, quindi il termine fondamentale è ⁶S₅/₂", "L massimo compatibile con Pauli e J = L + S", "Un singoletto ¹S₀, perché gli spin si accoppiano a due a due", "L = 2 con J = 1/2, per effetto dell'accoppiamento spin-orbita residuo"],c:0,
e:"Con spin tutti paralleli (S = 5/2) i cinque elettroni occupano m<sub>l</sub> = +2…−2: M<sub>L</sub> = 0 → L = 0, J = S = 5/2. Vale per Mn²⁺ e Fe³⁺: per loro il modello a ione libero funziona anche nei solidi (niente momento orbitale da «spegnere»)."},
{id:"a10",b:"ato",x:1,q:"Il sodio eccitato ha configurazione 1s²2s²2p⁶3d¹. Quali sono i termini spettroscopici possibili e le loro degenerazioni?",
o:["²D₃/₂ (degenerazione 4) e ²D₅/₂ (degenerazione 6)","²P₁/₂ (2) e ²P₃/₂ (4)","³D₁, ³D₂, ³D₃ (3, 5, 7)","¹D₂ (5)"],c:0,
e:"Un solo elettrone ottico in d: S = 1/2, L = 2 → J = 3/2 o 5/2. La degenerazione di ogni livello è 2J+1: quattro e sei stati (domanda reale d'esame)."},
{id:"a11",b:"ato",q:"Qual è la degenerazione di un livello atomico caratterizzato dal numero quantico J?",
o:["2J + 1", "2S + 1", "2L + 1", "J(J+1)"],c:0,
e:"Gli stati di un livello J si distinguono per m<sub>J</sub> = −J … +J: sono 2J+1. La molteplicità 2S+1 dell'apice del termine conta invece i possibili J solo quando L ≥ S."},
{id:"a12",b:"ato",q:"Quando si usa lo schema di accoppiamento jj al posto dello schema LS?",
o:["Per atomi pesanti (Z ≳ 50), dove lo spin-orbita supera la Coulomb residua", "Per atomi leggeri, dove l'interazione spin-orbita è del tutto trascurabile", "Solo per configurazioni con tutte le subshell chiuse e momento totale nullo", "Quando il campo magnetico esterno applicato è sufficientemente intenso"],c:0,
e:"⟨H<sub>SO</sub>⟩ cresce ~Z⁴: negli atomi pesanti (Sn, Au, Pb) supera ⟨V<sub>ee</sub>⟩ residua, quindi prima si accoppiano l<sub>i</sub>+s<sub>i</sub> = j<sub>i</sub> di ogni elettrone, poi J = Σj<sub>i</sub>. Nei leggeri vale LS (Russell–Saunders). Per Z intermedi gli stati non sono puri: le regole di selezione su S si indeboliscono."},
{id:"a13",b:"ato",q:"Il fattore di Landé di un termine di singoletto (S = 0) vale sempre:",
o:["g<sub>J</sub> = 1", "g<sub>J</sub> = 2", "g<sub>J</sub> = 0", "dipende da L"],c:0,
e:"Con S = 0 si ha J = L e la formula di Landé dà g<sub>J</sub> = 1: il magnetismo è puramente orbitale. È il caso dello Zeeman «normale» (3 righe), come nella transizione ¹D₂ → ¹P₁ del cadmio."},
{id:"a14",b:"ato",q:"Per un termine con L = 0 (es. ²S₁/₂ o ⁶S₅/₂), il fattore di Landé vale:",
o:["g<sub>J</sub> = 2", "g<sub>J</sub> = 1, come per tutti i termini di singoletto", "g<sub>J</sub> = 1/2", "g<sub>J</sub> = 0"],c:0,
e:"Con L = 0, J = S e la formula di Landé dà g<sub>J</sub> = 2 (= g<sub>s</sub>): contribuisce solo lo spin. Caso importante: ioni 3d con quenching, dove si usa proprio p<sub>eff</sub> = 2√(S(S+1))."},
{id:"a15",b:"ato",q:"Nell'effetto Zeeman normale (es. Cd, ¹D₂ → ¹P₁) quante righe si osservano e perché?",
o:["3 righe equispaziate: g<sub>J</sub> = 1 per entrambi i livelli e Δm<sub>J</sub> = 0", "9 righe distinte, una per ciascuna transizione permessa dalle regole di dipolo", "2 righe, perché la regola ΔS = 0 elimina metà delle transizioni", "5 righe, tante quanti i sottolivelli 2J+1 del livello superiore"],c:0,
e:"Nei singoletti g<sub>J</sub> = 1 per tutti i livelli: le 9 transizioni permesse si raggruppano in 3 energie E₀ e E₀ ± μ<sub>B</sub>B secondo Δm<sub>J</sub> = 0, ±1. Serve solo il magnetismo orbitale: spiegabile anche classicamente (Lorentz)."},
{id:"a16",b:"ato",q:"Perché l'effetto Zeeman «anomalo» (es. riga gialla del Na) produce più di 3 righe non equispaziate?",
o:["I due livelli hanno fattori di Landé diversi, quindi splitting diversi", "Il campo magnetico rompe la simmetria sferica del potenziale atomico", "Interviene l'effetto Stark residuo prodotto dal campo elettrico del reticolo", "Le regole di selezione ΔJ = 0, ±1 vengono violate dal campo intenso"],c:0,
e:"Con S ≠ 0, g<sub>J</sub> dipende dal termine: per Na, g(²S₁/₂) = 2 e g(²P₁/₂) = 2/3 → 4 righe non equispaziate. Lo spettro anomalo è la manifestazione diretta di J e g<sub>J</sub>: storicamente ha imposto l'esistenza dello spin."},
{id:"a17",b:"ato",q:"In regime di Paschen-Back (B<sub>ext</sub> ≫ B<sub>int</sub>) la correzione energetica al primo ordine è:",
o:["E⁽¹⁾ = (m<sub>l</sub> + 2m<sub>s</sub>)·μ<sub>B</sub>·B: L e S precedono indipendentemente attorno a B", "E⁽¹⁾ = g<sub>J</sub>·m<sub>J</sub>·μ<sub>B</sub>·B, con g<sub>J</sub> dato dalla formula di Landé", "E⁽¹⁾ = m<sub>J</sub>·μ<sub>B</sub>·B, con g = 1 per qualunque termine", "E⁽¹⁾ = 0: al primo ordine la correzione si annulla per simmetria"],c:0,
e:"Quando lo Zeeman supera lo spin-orbita, J non è più un buon numero quantico: H = (e/2m)B(L<sub>z</sub>+2S<sub>z</sub>) è già diagonale in m<sub>l</sub>, m<sub>s</sub>. Con Δm<sub>s</sub> = 0 lo spettro torna a 3 righe («ritorno al normale»)."},
{id:"a18",b:"ato",q:"Quali sono le regole di selezione di dipolo elettrico per le transizioni atomiche (schema LS)?",
o:["ΔS = 0; ΔL = 0, ±1 (no 0→0); ΔJ = 0, ±1 (no 0→0); parità che cambia", "ΔS = ±1; ΔL = 0; ΔJ qualsiasi; parità che si conserva nella transizione", "ΔS = 0; ΔL = ±2; ΔJ = ±1; parità che si conserva sempre", "Nessuna restrizione, se il campo magnetico esterno è nullo"],c:0,
e:"L'operatore di dipolo è dispari (cambia parità, Δl = ±1 sull'elettrone che salta) e non agisce sullo spin (ΔS = 0). In atomi pesanti (LS non puro) le righe «proibite» con ΔS ≠ 0 diventano debolmente visibili."},
{id:"a19",b:"ato",q:"Perché lo stato fondamentale dell'idrogeno non mostra effetto Stark lineare?",
o:["⟨100|z|100⟩ = 0 per parità: lo stato non degenere ha parità definita e nessun dipolo permanente", "Il campo elettrico non riesce ad accoppiarsi agli stati con momento angolare nullo", "L'effetto Stark si manifesta soltanto negli atomi a molti elettroni", "Lo schermo degli elettroni interni annulla il campo nella regione del nucleo"],c:0,
e:"z è dispari e |ψ₁₀₀|² è pari → l'elemento diagonale è nullo. Resta l'effetto quadratico E⁽²⁾ = −½αε² &lt; 0 (polarizzabilità): il fondamentale si abbassa sempre."},
{id:"a20",b:"ato",q:"Nell'effetto Stark lineare sulla shell n = 2 dell'idrogeno, quali stati si separano in energia?",
o:["Le combinazioni (ψ₂₀₀ ∓ ψ₂₁₀)/√2, con E = ±3eεa₀; ψ₂₁±₁ restano imperturbati", "Tutti e quattro gli stati, che si spostano della stessa quantità verso il basso", "Solo ψ₂₁₁ e ψ₂₁₋₁, gli unici con momento angolare non nullo lungo il campo", "Nessuno: anche per n = 2 l'effetto lineare si annulla per parità"],c:0,
e:"Nel sottospazio degenere sopravvive solo ⟨200|eεz|210⟩ = −3eεa₀ (m conservato, parità opposte). Gli stati «buoni» sono ibridi sp<sub>z</sub> con dipolo permanente d = 3ea₀ — possibile solo grazie alla degenerazione s-p dell'idrogeno."},
{id:"a21",b:"ato",q:"L'effetto Stark quadratico sullo stato fondamentale di un atomo:",
o:["Lo abbassa sempre: E⁽²⁾ &lt; 0 perché tutti i denominatori E₁−E<sub>n</sub> sono negativi", "Lo alza sempre, perché il campo aumenta l'energia potenziale dell'elettrone", "Lo lascia invariato, dato che il valor medio di z è nullo per parità", "Ha segno dipendente dall'orientazione del campo rispetto all'asse z"],c:0,
e:"Al secondo ordine E⁽²⁾ = −e²ε²Σ|⟨n|z|1⟩|²/(E<sub>n</sub>−E₁): ogni termine è negativo per il fondamentale. Fisicamente il campo induce un dipolo d = αε che si allinea: E = −½αε²."},
{id:"a22",b:"ato",q:"Nel metodo LCAO per H₂⁺, perché l'orbitale ψ₊ = (ψ<sub>A</sub> + ψ<sub>B</sub>)/√2 è legante?",
o:["L'interferenza costruttiva accumula carica tra i nuclei, dove il potenziale è più attrattivo", "Ha energia cinetica maggiore, che compensa l'aumento di energia potenziale", "Concentra la densità elettronica sui due nuclei, rafforzandone l'attrazione", "Ha momento angolare orbitale minore rispetto alla combinazione antisimmetrica"],c:0,
e:"|ψ₊|² ha un massimo tra i nuclei: la carica lì risente dell'attrazione di entrambi e scherma la repulsione p–p. ψ₋ ha un piano nodale a metà → i nuclei restano scoperti: antilegante (E₋(R) senza minimo)."},
{id:"a23",b:"ato",q:"Nel metodo di Heitler–London per H₂, quale integrale è il principale responsabile del legame covalente?",
o:["L'integrale di scambio K, senza analogo classico: favorisce il singoletto", "L'integrale di Coulomb J tra le densità di carica |ψ|² dei due elettroni", "L'integrale di sovrapposizione I fra gli orbitali dei due atomi", "La repulsione elettrostatica fra i due nuclei, che stabilizza il legame"],c:0,
e:"E<sub>±</sub> = 2E₁ₛ + (J ± K)/(1 ± I²) + repulsione nucleare: è K &lt; 0 a produrre il minimo per il singoletto. Senza scambio il legame quasi sparisce (D<sub>e</sub> ≈ 0,25 eV contro 4,75 sperimentale). Nota: nelle molecole vince il singoletto, al contrario di Hund negli atomi."},
{id:"a24",b:"ato",q:"Qual è la differenza tra i metodi MO-LCAO e Heitler–London per H₂?",
o:["MO pesa ugualmente parte covalente e ionica; HL usa solo la covalente", "HL include il termine ionico mentre MO lo trascura completamente", "Sono matematicamente identici, cambia soltanto la notazione degli orbitali", "MO si può applicare soltanto a molecole eteronucleari come NaCl"],c:0,
e:"φ<sub>MO</sub> = φ<sup>cov</sup> + φ<sup>ion</sup> a peso uguale (troppo ionico); φ<sub>HL</sub> è solo covalente. Combinando le configurazioni (interazione di configurazione) il peso ionico scende a ~20% e D<sub>e</sub> si avvicina al valore sperimentale."},
{id:"a25",b:"ato",q:"Su che cosa si fonda l'approssimazione di Born–Oppenheimer?",
o:["Sul rapporto m/M ≈ 10⁻³–10⁻⁵ tra masse elettroniche e nucleari", "Sulla simmetria sferica del potenziale molecolare attorno al centro di massa", "Sull'uguaglianza approssimata delle masse di elettroni e nuclei leggeri", "Sul fatto che i nuclei siano rigorosamente fermi nelle loro posizioni"],c:0,
e:"Ψ(R,r) ≈ F<sub>N</sub>(R)·ψ<sub>el</sub>(R;r): si risolve il problema elettronico a nuclei fissi per ogni R, poi i nuclei si muovono nel potenziale E<sub>el</sub>(R). Da qui vibrazioni (sviluppo armonico attorno a R₀) e rotazioni."},
{id:"a26",b:"ato",q:"Qual è la gerarchia delle scale di energia in una molecola biatomica?",
o:["Elettronica ≫ vibrazionale ≫ rotazionale", "Rotazionale ≫ vibrazionale ≫ elettronica", "Vibrazionale ≫ elettronica ≫ rotazionale", "Tutte e tre dello stesso ordine di grandezza"],c:0,
e:"Transizioni elettroniche nel visibile/UV, vibrazionali nell'IR, rotazionali nelle microonde/IR lontano. A temperatura ambiente k<sub>B</sub>T ≈ 25 meV: popolati termicamente molti livelli rotazionali, pochi vibrazionali, nessuno elettronico."},
{id:"a27",b:"ato",q:"Le regole di selezione per gli spettri rotovibrazionali di una molecola biatomica (stati Σ) sono:",
o:["Δv = ±1 e ΔK = ±1", "Δv = 0, ±2 e ΔK = 0", "Δv qualsiasi e ΔK = ±2", "Δv = ±1 e ΔK = 0 sempre permessa"],c:0,
e:"L'oscillatore armonico impone Δv = ±1; il fotone porta momento angolare → ΔK = ±1. Nascono le branche P (ΔK = −1) ed R (ΔK = +1) con il «buco» della riga Q al centro dello spettro IR."},
{id:"a28",b:"ato",q:"Il principio di Franck–Condon afferma che:",
o:["La transizione elettronica è «verticale»: i nuclei non fanno in tempo a muoversi", "Le transizioni avvengono solo fra gli stati vibrazionali fondamentali dei due livelli", "Le transizioni elettroniche richiedono ΔK = 0 sul numero quantico rotazionale", "L'energia di dissociazione misurata coincide sempre con D<sub>e</sub> del minimo"],c:0,
e:"Sul diagramma E(R) la transizione elettronica è una linea verticale (gli elettroni sono molto più rapidi dei nuclei): l'intensità verso ciascun v′ è ∝ |⟨χ<sub>v′</sub>|χ<sub>v</sub>⟩|². Spiega le progressioni vibrazionali negli spettri elettronici."},
{id:"a29",b:"ato",q:"Un'energia di ionizzazione bassa (come i ~5 eV degli alcalini) si spiega perché:",
o:["L'elettrone esterno è schermato dalle shell chiuse interne e vede Z<sub>eff</sub> ≈ 1–2", "Il nucleo degli alcalini contiene relativamente pochi protoni rispetto ai gas nobili", "L'elettrone esterno ha spin opposto a quello di tutti gli altri elettroni", "Gli alcalini hanno raggio atomico particolarmente piccolo lungo il periodo"],c:0,
e:"Le shell chiuse schermano quasi completamente il nucleo: l'elettrone di valenza è quasi idrogenoide con ⟨r⟩ ≈ n·a₀. All'estremo opposto i gas nobili (shell chiuse compatte) hanno le energie di ionizzazione massime: andamento periodico con Z."},
{id:"a30",b:"ato",q:"La costante di accoppiamento spin-orbita α in H<sub>SO</sub> = (2α/ħ²)L·S si può ricavare sperimentalmente:",
o:["Dalle separazioni tra i livelli J dello stesso termine: E(J)−E(J−1) ∝ J", "Dal numero di righe osservate nello spettro Zeeman in campo debole", "Dalla larghezza Doppler delle righe misurata ad alta temperatura", "Dalla legge di Moseley applicata alle righe X caratteristiche"],c:0,
e:"⟨L·S⟩ = (ħ²/2)[J(J+1)−L(L+1)−S(S+1)]: la spaziatura tra livelli adiacenti di un multipletto cresce linearmente con J. Dai dati (es. il ³P₀,₁,₂ dello Sn²⁺ all'appello di giugno: α = (E₃−E₁)/6) si ricava α in eV."},
// ============ MECCANICA STATISTICA ============
{id:"s01",b:"sta",x:1,q:"Come si applica il teorema di Liouville a un sistema isolato in equilibrio termodinamico?",
o:["La densità di probabilità nello spazio delle fasi resta costante lungo le traiettorie hamiltoniane, il che porta alla distribuzione microcanonica","La densità di probabilità si concentra nel tempo nello stato di energia minima","Il volume nello spazio delle fasi diminuisce per effetto delle collisioni","La distribuzione di equilibrio dipende dalla temperatura del bagno esterno"],c:0,
e:"dρ/dt = 0 lungo il flusso hamiltoniano: l'ensemble scorre come un fluido incomprimibile. All'equilibrio ρ è costante sulla superficie a energia fissata → equiprobabilità dei microstati (microcanonico). Un sistema isolato non ha bagno termico (domanda reale d'esame, sbagliata all'appello!)."},
{id:"s02",b:"sta",q:"Che cosa afferma l'ipotesi ergodica?",
o:["La media temporale di una grandezza lungo la traiettoria coincide", "Tutti i sistemi raggiungono l'equilibrio nello stesso tempo caratteristico", "L'energia si distribuisce equamente fra tutti i gradi di libertà", "L'entropia di un sistema isolato è sempre crescente nel tempo"],c:0,
e:"È il ponte che giustifica il metodo di Gibbs: invece di seguire la dinamica (impossibile per ~10²³ particelle) si media su infinite copie mentali del sistema compatibili con i vincoli macroscopici."},
{id:"s03",b:"sta",q:"Qual è il postulato fondamentale dell'ensemble microcanonico?",
o:["Tutti i microstati accessibili (compatibili con N, V, E) sono equiprobabili", "I microstati a energia minore sono sistematicamente più probabili", "La probabilità segue il fattore di Boltzmann e^(−E/k<sub>B</sub>T)", "Soltanto lo stato fondamentale risulta effettivamente occupato"],c:0,
e:"ρ = 1/Γ costante nel guscio E−Δ ≤ H ≤ E, zero fuori. Il fattore di Boltzmann appartiene al canonico (sistema + termostato), non al sistema isolato."},
{id:"s04",b:"sta",q:"La relazione di Boltzmann S = k<sub>B</sub> ln Γ lega l'entropia a:",
o:["Il numero di microstati accessibili al sistema isolato", "La temperatura assoluta del sistema all'equilibrio termico", "L'energia media posseduta dal sistema macroscopico", "Il volume occupato nello spazio delle configurazioni"],c:0,
e:"Γ conta i microstati nel guscio di energia (volume dello spazio delle fasi diviso ω₀ = h<sup>3N</sup>). Da S(E,V,N) seguono 1/T = ∂S/∂E, P = T·∂S/∂V, μ = −T·∂S/∂N."},
{id:"s05",b:"sta",q:"L'approssimazione di Stirling ln N! ≈ N ln N − N è giustificata quando:",
o:["N ≫ 1, ed è eccellente per N ~ 10²³", "N è piccolo, tipicamente inferiore a qualche decina", "N è pari, così che i fattoriali si semplifichino", "Il sistema è classico e non quantistico"],c:0,
e:"L'errore relativo va a zero come (ln N)/N. In meccanica statistica si usa sistematicamente per trasformare i fattoriali dei conteggi (Ω, Γ) in funzioni lisce di cui fare derivate — compare in quasi ogni problema d'esame con «Espressioni utili»."},
{id:"s06",b:"sta",q:"In che cosa consiste il paradosso di Gibbs e come si risolve?",
o:["Senza il fattore 1/N! l'entropia non è estensiva", "L'entropia diverge a T → 0 e si risolve", "Il calore specifico diventa negativo", "La pressione non risulta definita nell'ensemble microcanonico"],c:0,
e:"Dividendo per N! (particelle identiche indistinguibili) si ottiene l'entropia estensiva di Sackur–Tetrode: S = k<sub>B</sub>N ln[(V/N)(...)³ᐟ²] + cost. Il paradosso mostra che l'indistinguibilità ha conseguenze termodinamiche misurabili anche in regime classico."},
{id:"s07",b:"sta",q:"Quando NON va inserito il fattore di Gibbs 1/N! nella funzione di partizione?",
o:["Per oscillatori o dipoli localizzati su siti reticolari", "Per un gas di molecole identiche in un recipiente chiuso", "Per un gas di elettroni di conduzione dentro un metallo", "Non esistono eccezioni: il fattore va sempre inserito"],c:0,
e:"Particelle identiche ma ancorate a posizioni fisse (spin su reticolo, oscillatori di Einstein) sono distinguibili dall'indice del sito: Z<sub>N</sub> = Z₁<sup>N</sup>. Per il gas, dove le particelle si scambiano di posto, serve Z₁<sup>N</sup>/N!. Errore classico nei temi d'esame."},
{id:"s08",b:"sta",q:"Perché il volume elementare dello spazio delle fasi per grado di libertà è ω₀ = h?",
o:["Per il principio di indeterminazione: un microstato occupa almeno ΔqΔp ≈ h", "È una convenzione arbitraria, priva di effetti fisici osservabili", "Perché h è l'unità di misura dell'azione nel Sistema Internazionale", "Per via della quantizzazione della carica elettrica elementare"],c:0,
e:"Il confronto tra oscillatore classico (area della corona ellittica) e quantistico (livelli ħω) dà esattamente Ω/Γ = h. La scelta di ω₀ fissa la costante additiva di S: irrilevante per le derivate, ma necessaria per l'entropia assoluta."},
{id:"s09",b:"sta",q:"Nell'ensemble canonico la probabilità di trovare il sistema nel microstato i con energia E<sub>i</sub> è:",
o:["P<sub>i</sub> = e^(−E<sub>i</sub>/k<sub>B</sub>T)/Z, con Z = Σ e^(−E<sub>j</sub>/k<sub>B</sub>T)", "P<sub>i</sub> = 1/Γ, uguale per tutti gli stati accessibili", "P<sub>i</sub> ∝ E<sub>i</sub>, proporzionale all'energia dello stato", "P<sub>i</sub> = e^(+E<sub>i</sub>/k<sub>B</sub>T)/Z, con esponente positivo"],c:0,
e:"Il sistema scambia energia con un termostato a temperatura T: gli stati ad alta energia sono esponenzialmente sfavoriti. Z (funzione di partizione) normalizza e contiene tutta la termodinamica."},
{id:"s10",b:"sta",q:"Qual è il «ponte» tra la funzione di partizione canonica e la termodinamica?",
o:["F = −k<sub>B</sub>T ln Z<sub>N</sub> (energia libera di Helmholtz)", "S = k<sub>B</sub> ln Z<sub>N</sub>, in analogia con la formula di Boltzmann", "U = k<sub>B</sub>T ln Z<sub>N</sub>, cioè l'energia interna del sistema", "P = k<sub>B</sub>T·Z<sub>N</sub>/V, cioè l'equazione di stato"],c:0,
e:"Da F(T,V,N) = −k<sub>B</sub>T ln Z seguono S = −∂F/∂T, P = −∂F/∂V, μ = ∂F/∂N, U = F + TS = −∂lnZ/∂β. Nel microcanonico il ponte è S = k<sub>B</sub>lnΓ, nel grancanonico Ω = −PV = −k<sub>B</sub>T lnZ<sub>GC</sub>."},
{id:"s11",b:"sta",q:"L'espressione statistica generale dell'entropia (valida anche fuori dal microcanonico) è:",
o:["S = −k<sub>B</sub> Σ P<sub>i</sub> ln P<sub>i</sub>", "S = k<sub>B</sub> Σ P<sub>i</sub>², somma dei quadrati delle probabilità", "S = −k<sub>B</sub> ln P<sub>max</sub>, con la probabilità massima", "S = k<sub>B</sub> Σ E<sub>i</sub>P<sub>i</sub>/T, energia media divisa per T"],c:0,
e:"Formula di Gibbs–Shannon: per distribuzione uniforme (microcanonico) si riduce a k<sub>B</sub>lnΓ; con i pesi canonici dà S = (U−F)/T. Misura l'informazione mancante sul microstato."},
{id:"s12",b:"sta",q:"La funzione di partizione di un gas ideale monoatomico di N particelle è:",
o:["Z<sub>N</sub> = Z₁<sup>N</sup>/N!, con Z₁ = V(2πmk<sub>B</sub>T/h²)³ᐟ²", "Z<sub>N</sub> = Z₁<sup>N</sup> senza fattore di Gibbs", "Z<sub>N</sub> = N·Z₁, proporzionale al numero di particelle", "Z<sub>N</sub> = Z₁<sup>N</sup>·N!, con il fattoriale a moltiplicare"],c:0,
e:"Particelle indipendenti e indistinguibili: Z₁ si fattorizza (integrale gaussiano sui momenti × volume) e il fattore di Gibbs 1/N! garantisce l'estensività. Da qui U = (3/2)Nk<sub>B</sub>T, PV = Nk<sub>B</sub>T, μ = k<sub>B</sub>T ln(nλ³<sub>T</sub>)."},
{id:"s13",b:"sta",q:"Che cosa afferma il teorema di equipartizione dell'energia?",
o:["Ogni termine quadratico dell'hamiltoniana vale ½k<sub>B</sub>T", "Ogni particella possiede esattamente un'energia media pari a k<sub>B</sub>T", "L'energia totale si divide equamente fra tutte le particelle", "Ogni grado di libertà contribuisce con k<sub>B</sub>T intero"],c:0,
e:"Vale nel limite classico (livelli fittamente spaziati rispetto a k<sub>B</sub>T). Gas monoatomico: 3 termini cinetici → (3/2)k<sub>B</sub>T. Oscillatore 1D: cinetico + elastico → k<sub>B</sub>T (da cui Dulong–Petit 3Nk<sub>B</sub> in 3D)."},
{id:"s14",b:"sta",q:"Perché il calore specifico di un oscillatore quantistico va a zero per T → 0?",
o:["La spaziatura ħω ≫ k<sub>B</sub>T impedisce di popolare gli stati eccitati: c<sub>V</sub> crolla esponenzialmente", "Per via dell'energia di punto zero ħω/2, che resta comunque presente", "Perché a T = 0 l'oscillatore si ferma esattamente nella posizione di equilibrio", "Per l'indistinguibilità delle particelle che compongono il sistema"],c:0,
e:"È la discretizzazione dei livelli (non il punto zero) a violare l'equipartizione: U = ħω/2 + ħω/(e^(ħω/k<sub>B</sub>T)−1) → c<sub>V</sub> ∝ e^(−ħω/k<sub>B</sub>T) a bassa T, mentre ad alta T si ritrova c<sub>V</sub> = k<sub>B</sub>. Base del modello di Einstein per i solidi."},
{id:"s15",b:"sta",q:"Per N dipoli a due livelli ±ε in equilibrio a temperatura T, l'energia interna è:",
o:["U = −Nε·tanh(ε/k<sub>B</sub>T)", "U = −Nε per ogni T", "U = (3/2)Nk<sub>B</sub>T", "U = −Nε/(1+e^(ε/k<sub>B</sub>T))"],c:0,
e:"Z₁ = 2cosh(βε) → U = −∂lnZ/∂β = −Nε·tanh(ε/k<sub>B</sub>T). Limiti: T→0 tutti nel fondamentale (U→−Nε, ordine); T→∞ livelli equipopolati (U→0, disordine). Problema ricorrente: identico al tema d'esame di giugno (via microcanonico)."},
{id:"s16",b:"sta",q:"Che cos'è l'anomalia di Schottky?",
o:["Il massimo del calore specifico a k<sub>B</sub>T ∼ Δ tipico dei sistemi a due livelli", "La divergenza di c<sub>V</sub> in corrispondenza della transizione ferromagnetica", "L'annullarsi del calore specifico dei metalli a temperatura ambiente", "L'aumento lineare del calore specifico con T tipico dei metalli"],c:0,
e:"c(T) → 0 sia per T→0 (gap non superabile) sia per T→∞ (livelli saturati): in mezzo c'è un massimo largo a k<sub>B</sub>T ≈ 0,42Δ, dove lo scambio di energia col bagno è più efficace. Firma sperimentale della presenza di un gap."},
{id:"s17",b:"sta",q:"A quale condizione un sistema può trovarsi a temperatura assoluta negativa?",
o:["Lo spettro di energia deve avere un limite superiore", "Non è mai possibile: lo vieta il terzo principio della termodinamica", "Occorre che il sistema si trovi a pressione negativa", "Occorre che l'entropia del sistema sia esattamente nulla"],c:0,
e:"T &lt; 0 significa ∂S/∂E &lt; 0: più energia, meno microstati — possibile solo se E è limitata dall'alto. Stati più popolati ad alta energia (inversione): realizzato da Purcell–Pound sugli spin nucleari di LiF, ed è il principio di MASER e laser."},
{id:"s18",b:"sta",q:"La distribuzione di Maxwell dei moduli delle velocità w(v) ∝ v²e^(−mv²/2k<sub>B</sub>T) ha il massimo in:",
o:["v<sub>max</sub> = √(2k<sub>B</sub>T/m)", "v<sub>max</sub> = √(3k<sub>B</sub>T/m)", "v<sub>max</sub> = √(8k<sub>B</sub>T/πm)", "v<sub>max</sub> = 0"],c:0,
e:"dw/dv = 0 → v<sub>max</sub> = √(2k<sub>B</sub>T/m). Attenzione a non confondere: ⟨v⟩ = √(8k<sub>B</sub>T/πm) e √⟨v²⟩ = √(3k<sub>B</sub>T/m) (quest'ultima dall'equipartizione); v<sub>max</sub> &lt; ⟨v⟩ &lt; v<sub>qm</sub>. Il fattore v² viene dal volume 4πv²dv nello spazio delle velocità."},
{id:"s19",b:"sta",q:"La formula barometrica n(z) = n(0)e^(−mgz/k<sub>B</sub>T) si ottiene statisticamente:",
o:["Dal peso di Boltzmann e^(−βmgz) sull'energia potenziale", "Dall'equazione di Bernoulli applicata a un fluido in quiete", "Dal principio di esclusione di Pauli applicato alle molecole", "Dalla distribuzione microcanonica a energia totale fissata"],c:0,
e:"Nel canonico la densità spaziale segue e^(−βmgz); coincide con il bilancio meccanico dP/dz = −ρg per un gas ideale isotermo. Esempio classico di fattore di Boltzmann su un potenziale esterno."},
{id:"s20",b:"sta",q:"L'ensemble grancanonico descrive un sistema che scambia con il serbatoio:",
o:["Energia e particelle, con variabili naturali V, T, μ", "Soltanto energia, con variabili naturali N, V, T", "Soltanto volume, mantenendo N ed E rigorosamente fissi", "Nulla: è un sistema completamente isolato dall'esterno"],c:0,
e:"Z<sub>GC</sub> = Σ<sub>N</sub> z<sup>N</sup>Z<sub>N</sub> con fugacità z = e^(βμ). Il ponte è Ω = −PV = −k<sub>B</sub>T ln Z<sub>GC</sub>. È l'ensemble naturale per le statistiche quantistiche: fattorizza sugli stati di singola particella."},
{id:"s21",b:"sta",q:"La fugacità è definita come:",
o:["z = e^(μ/k<sub>B</sub>T)", "z = e^(−E/k<sub>B</sub>T)", "z = μ/k<sub>B</sub>T", "z = k<sub>B</sub>T/μ"],c:0,
e:"Compare nel grancanonico come «peso» per particella aggiunta. Limite classico: z ≪ 1 (μ grande e negativo) → le statistiche quantistiche si riducono a Maxwell–Boltzmann con ⟨n⟩ = z·e^(−ε/k<sub>B</sub>T) ≪ 1."},
{id:"s22",b:"sta",q:"L'occupazione media di uno stato per fermioni è n<sub>FD</sub>(ε) = 1/(e^((ε−μ)/k<sub>B</sub>T)+1). Quale proprietà la distingue?",
o:["n ≤ 1 sempre: il principio di Pauli vieta occupazioni multiple", "Diverge quando l'energia tende al potenziale chimico μ", "Vale soltanto a temperatura rigorosamente nulla", "È identica alla distribuzione di Maxwell–Boltzmann"],c:0,
e:"Il +1 al denominatore limita l'occupazione a 1. A T = 0 è un gradino: pieni tutti gli stati sotto μ(0) = ε<sub>F</sub>. A ε = μ vale esattamente 1/2 a qualunque temperatura."},
{id:"s23",b:"sta",q:"Per un gas di bosoni, il potenziale chimico deve soddisfare:",
o:["μ &lt; ε₀, sotto il livello più basso", "μ &gt; ε₀ sempre, cioè sopra l'energia dello stato fondamentale", "μ = 0 esattamente, come per i fotoni e i fononi", "μ &gt; 0, cioè sempre positivo a qualunque temperatura"],c:0,
e:"n<sub>BE</sub> = 1/(e^((ε−μ)/k<sub>B</sub>T)−1) richiede e^((ε−μ)/k<sub>B</sub>T) &gt; 1 per ogni ε: μ deve stare sotto lo spettro. Per fotoni e fononi (numero non conservato) μ = 0: la distribuzione diventa quella di Planck."},
{id:"s24",b:"sta",q:"Qual è la condizione per il limite classico delle statistiche quantistiche?",
o:["⟨n⟩ ≪ 1 per ogni stato: alta temperatura e bassa densità", "k<sub>B</sub>T ≪ ε<sub>F</sub>, cioè gas fortemente degenere", "Alta densità e bassa temperatura, come nei metalli", "Le particelle devono essere distinguibili sin dall'inizio"],c:0,
e:"Quando l'occupazione media di ogni stato è piccolissima, la probabilità di «doppia occupazione» è irrilevante e FD e BE collassano entrambe su MB (× fugacità). Equivalente: nλ³<sub>T</sub> ≪ 1 (distanza media ≫ lunghezza d'onda termica). Il principio di Pauli resta comunque valido."},
{id:"s25",b:"sta",q:"Una particella in buca infinita 1D (E<sub>n</sub> = εn²) è a contatto con un termostato. Nel limite T → 0:",
o:["U → ε e S → 0, in accordo col terzo principio", "U → 0 e S → k<sub>B</sub>ln2, con due stati equiprobabili", "U diverge, perché i livelli sono infinitamente fitti", "S tende a un valore residuo pari a k<sub>B</sub> per particella"],c:0,
e:"A bassa T domina il termine n = 1 della somma: il sistema si congela nello stato fondamentale (unico → S = 0). Problema identico al tema d'esame di maggio: chiedeva proprio il commento sul terzo principio."},
{id:"s26",b:"sta",q:"Stessa buca 1D nel limite di alta temperatura (k<sub>B</sub>T ≫ ε):",
o:["La somma diventa un integrale: Z ≈ (L/h)√(2πmk<sub>B</sub>T)", "La somma diverge e la funzione di partizione non esiste", "U resta bloccata al valore ε dello stato fondamentale", "S tende a zero, come previsto dal terzo principio"],c:0,
e:"Con molti livelli sotto k<sub>B</sub>T lo spettro appare continuo: si ritrova esattamente la Z classica della particella libera confinata in L, con U = ½k<sub>B</sub>T (un solo termine quadratico: p²/2m). Il limite classico emerge naturalmente ad alta T."},
{id:"s27",b:"sta",q:"Che cosa stabilisce il teorema H di Boltzmann?",
o:["La funzione H decresce nel tempo (dH/dt ≤ 0)", "L'energia totale si conserva in ciascun urto molecolare", "L'entropia di un sistema isolato resta rigorosamente costante", "Le collisioni fra molecole sono processi sempre reversibili"],c:0,
e:"Sotto l'ipotesi di caos molecolare, H = ∫f ln f decresce fino alla distribuzione di Maxwell–Boltzmann, dove dH/dt = 0. Poiché S ∝ −H, è la versione microscopica del secondo principio (con il celebre dibattito sulla reversibilità)."},
{id:"s28",b:"sta",q:"Per contare i microstati di M quanti distribuiti su 3N oscillatori si usa il metodo «palline e barriere»:",
o:["Γ = (M+3N−1)!/[M!(3N−1)!]", "Γ = (3N)<sup>M</sup>, cioè 3N scelte per ciascuno degli M quanti", "Γ = M!/(3N)!, rapporto fra i due fattoriali", "Γ = M·3N, prodotto di quanti e oscillatori"],c:0,
e:"I quanti sono indistinguibili e vanno in 3N «scatole»: si permutano M palline e 3N−1 barriere. Con Stirling si ottiene S(E) e da 1/T = ∂S/∂E l'energia di Planck E = (3/2)Nħω·coth(ħω/2k<sub>B</sub>T): stesso risultato del canonico."},
{id:"s29",b:"sta",q:"Due comparti di gas ideale alla stessa temperatura possono scambiare particelle. All'equilibrio chimico (μ₁ = μ₂) si ha:",
o:["N₁/V₁ = N₂/V₂: densità uguali", "N₁ = N₂ indipendentemente dai volumi", "P₁V₁ = P₂V₂", "U₁ = U₂"],c:0,
e:"Per il gas ideale μ = k<sub>B</sub>T ln(nλ³<sub>T</sub>) dipende solo da n e T: a T uguale, μ₁ = μ₂ ⟺ n₁ = n₂ (e quindi P₁ = P₂). Problema identico al tema d'esame di luglio: μ da F = −k<sub>B</sub>T ln Z e minimizzazione di F totale."},
{id:"s30",b:"sta",q:"Il potenziale chimico μ nell'ensemble canonico si calcola come:",
o:["μ = (∂F/∂N)<sub>T,V</sub>", "μ = (∂U/∂V)<sub>T,N</sub>", "μ = −(∂F/∂T)<sub>V,N</sub>", "μ = k<sub>B</sub>T sempre"],c:0,
e:"È il costo in energia libera per aggiungere una particella a T e V fissati. Per N grande: μ ≈ F(N+1)−F(N). Le altre derivate danno S = −∂F/∂T e P = −∂F/∂V."},
// ============ TRASPORTO ============
{id:"t01",b:"tra",q:"Quale di queste è una delle assunzioni del modello di Drude?",
o:["Fra due urti l'elettrone è libero e indipendente", "Gli elettroni urtano principalmente fra loro", "Gli urti sono elastici e conservano la direzione del moto", "Gli elettroni obbediscono alla statistica di Fermi–Dirac"],c:0,
e:"Le 4 assunzioni: (1) elettrone libero e indipendente tra gli urti; (2) urti istantanei con gli ioni, in generale anelastici; (3) probabilità d'urto dP = dt/τ; (4) equilibrio termico raggiunto solo tramite urti (dopo l'urto velocità termica isotropa). La statistica è classica (Maxwell–Boltzmann)."},
{id:"t02",b:"tra",x:1,q:"Nel modello di Drude, quale delle seguenti grandezze è riportata correttamente?",
o:["Coefficiente di Hall: R<sub>H</sub> = −1/ne","Potenza Joule per volume: P = (ne²τ/m)E³","Calore specifico elettronico: c<sub>V</sub> = (3/2)nk<sub>B</sub>(T/T<sub>F</sub>)","Velocità di deriva: v<sub>d</sub> = √(3k<sub>B</sub>T/m)"],c:0,
e:"R<sub>H</sub> = −1/ne, indipendente da τ e m: misura direttamente densità e segno dei portatori. La potenza Joule è σE², il c<sub>V</sub> con T/T<sub>F</sub> è di Sommerfeld (non Drude), e √(3k<sub>B</sub>T/m) è la velocità termica, non di deriva (domanda reale d'esame)."},
{id:"t03",b:"tra",q:"Qual è il rapporto tipico tra velocità di deriva e velocità termica in un metallo a temperatura ambiente?",
o:["v<sub>d</sub>/v<sub>T</sub> ≈ 10⁻⁸", "v<sub>d</sub> ≈ v<sub>T</sub>, cioè deriva e agitazione termica confrontabili", "v<sub>d</sub> ≫ v<sub>T</sub> già per campi elettrici ordinari", "v<sub>d</sub>/v<sub>T</sub> ≈ 10⁻², cioè circa l'un per cento"],c:0,
e:"v<sub>d</sub> = eEτ/m ≈ 10⁻³ m/s contro v<sub>T</sub> ≈ 10⁵ m/s (classica) o v<sub>F</sub> ≈ 10⁶ m/s (quantistica): il campo non accelera «tutti gli elettroni in massa», sposta appena il baricentro della distribuzione delle velocità."},
{id:"t04",b:"tra",q:"Per la statistica di Poisson degli urti di Drude, il valor medio del quadrato del tempo tra due urti è:",
o:["⟨t²⟩ = 2τ², non τ²: gli intervalli lunghi pesano di più", "⟨t²⟩ = τ², come suggerirebbe l'intuizione più immediata", "⟨t²⟩ = τ²/2, cioè metà del quadrato del tempo medio", "⟨t²⟩ = 4τ², quattro volte il quadrato del tempo medio"],c:0,
e:"Con densità di probabilità (1/τ)e^(−t/τ): ⟨t⟩ = τ ma ⟨t²⟩ = 2τ². Errore commesso dallo stesso Drude! Osservando in un istante casuale è più probabile cadere in un intervallo lungo (analogia del tram). Cruciale nel calcolo dell'effetto Joule."},
{id:"t05",b:"tra",q:"La potenza dissipata per effetto Joule per unità di volume in un conduttore ohmico è:",
o:["P = σE² = J·E", "P = σE, lineare nel campo elettrico applicato", "P = E²/n, inversamente proporzionale alla densità", "P = neE, prodotto di densità, carica e campo"],c:0,
e:"Dall'energia media guadagnata tra due urti ⟨ΔE⟩ = (e²E²/2m)⟨t²⟩ = e²E²τ²/m, moltiplicando per n urti/volume e dividendo per τ: P = (ne²τ/m)E² = σE². L'energia finisce al reticolo, che si scalda: bilancio in media negativo per l'elettrone."},
{id:"t06",b:"tra",q:"L'effetto Hall permette di misurare:",
o:["La densità dei portatori di carica e il loro segno", "Il tempo di rilassamento τ fra due urti successivi", "La massa efficace degli elettroni di conduzione", "La temperatura del reticolo cristallino del metallo"],c:0,
e:"R<sub>H</sub> = E<sub>H</sub>/(jB) = −1/ne non contiene né τ né m. Sorpresa storica: per Al, Be e altri R<sub>H</sub> è positivo → portatori positivi (lacune), inspiegabile classicamente, chiarito solo con la teoria delle bande."},
{id:"t07",b:"tra",q:"Un coefficiente di Hall positivo (es. alluminio) indica:",
o:["Conduzione dominata da lacune, spiegabile con le bande", "Un errore sperimentale sistematico nella misura della tensione", "Che nel metallo si muovono gli ioni positivi del reticolo", "Che il tempo di rilassamento τ assume valori negativi"],c:0,
e:"Nel modello di Drude R<sub>H</sub> = −1/ne dovrebbe essere sempre negativo. Bande quasi piene si comportano come portatori di carica +e (lacune) con massa efficace positiva: uno dei fallimenti di Drude che motivano la teoria a bande."},
{id:"t08",b:"tra",q:"La pulsazione di plasma di un metallo è:",
o:["ω<sub>p</sub> = √(ne²/mε₀)", "ω<sub>p</sub> = ne²/mε₀, senza radice quadrata", "ω<sub>p</sub> = √(ne/m), indipendente dalla costante dielettrica", "ω<sub>p</sub> = eB/m, cioè la frequenza di ciclotrone"],c:0,
e:"Dalla funzione dielettrica di Drude ε<sub>r</sub>(ω) = 1 − ω<sub>p</sub>²/ω² (per ωτ ≫ 1): è la frequenza propria delle oscillazioni collettive di densità di carica. Per i metalli ħω<sub>p</sub> ≈ 10–16 eV (ultravioletto)."},
{id:"t09",b:"tra",q:"Perché i metalli sono lucidi nel visibile ma diventano trasparenti nell'ultravioletto?",
o:["Per ω &lt; ω<sub>p</sub> si ha ε<sub>r</sub> &lt; 0 e riflessione totale; per ω &gt; ω<sub>p</sub>", "Per l'assorbimento risonante da parte dei fononi del reticolo", "Per via della struttura cristallina cubica dei metalli comuni", "Per l'effetto fotoelettrico che estrae elettroni dalla superficie"],c:0,
e:"Con ε<sub>r</sub> = 1 − ω<sub>p</sub>²/ω²: sotto ω<sub>p</sub> l'indice è immaginario → onda evanescente, riflessione ~totale (metalli lucenti); sopra ω<sub>p</sub> il metallo è trasparente. La soglia misurata (es. Al: 15,8 eV) conferma Drude."},
{id:"t10",b:"tra",q:"Che cos'è un plasmone?",
o:["Il quanto dell'oscillazione collettiva di densità", "Un fonone di frequenza particolarmente elevata nel reticolo", "Una quasiparticella di natura magnetica legata agli spin", "Un fotone rimasto intrappolato all'interno del metallo"],c:0,
e:"A ω = ω<sub>p</sub> (dove ε<sub>r</sub> = 0) il gas di elettroni oscilla rigidamente rispetto al fondo ionico. Si misura con EELS: gli elettroni trasmessi perdono energia in multipli di ħω<sub>p</sub>."},
{id:"t11",b:"tra",q:"La legge di Wiedemann–Franz afferma che:",
o:["k/(σT) = L è circa costante per tutti i metalli (numero di Lorenz)", "Il prodotto k·σ è costante e indipendente dal materiale", "Il rapporto k/σ è costante e indipendente dalla temperatura", "La conducibilità termica cresce come k = σT² con la temperatura"],c:0,
e:"Sommerfeld: L = (π²/3)(k<sub>B</sub>/e)² = 2,44·10⁻⁸ WΩ/K², in ottimo accordo. Drude otteneva L = (3/2)(k<sub>B</sub>/e)² «quasi giusto» per compensazione fortuita di due errori ×100: c<sub>V</sub> sovrastimato e v² sottostimata."},
{id:"t12",b:"tra",q:"Perché l'accordo di Drude con la legge di Wiedemann–Franz è considerato «fortuito»?",
o:["Sovrastima c<sub>V</sub> di ~100 e sottostima v² di ~100", "Perché la legge in realtà non è mai stata verificata sui metalli", "Perché la legge vale soltanto a temperature bassissime", "Perché k e σ non sono misurabili in modo indipendente"],c:0,
e:"k = (1/3)v²τc<sub>V</sub>: Drude usa c<sub>V</sub> = (3/2)nk<sub>B</sub> (giusto sarebbe ∼T/T<sub>F</sub> più piccolo) e v²<sub>T</sub> classica (giusta sarebbe v<sub>F</sub>² ∼100 volte maggiore). Il prodotto torna quasi esatto: classico esempio d'esame di «risultato giusto per ragioni sbagliate»."},
{id:"t13",b:"tra",q:"L'effetto Seebeck consiste in:",
o:["Un campo elettrico E = Q∇T da un gradiente di temperatura", "La deviazione trasversa degli elettroni in un campo magnetico", "L'emissione di elettroni da un metallo portato ad alta temperatura", "L'aumento della resistenza elettrica al crescere della temperatura"],c:0,
e:"Gli elettroni del lato caldo diffondono verso il lato freddo finché il campo che si crea bilancia la diffusione. Il potere termoelettrico Q ∝ c<sub>V</sub>: la stima classica sbaglia di ~100 (come c<sub>V</sub>), quella di Sommerfeld è corretta — coppia di conferme dell'espansione."},
{id:"t14",b:"tra",q:"Il raggio della sfera di Fermi per un gas di elettroni liberi 3D è:",
o:["k<sub>F</sub> = (3π²n)¹ᐟ³", "k<sub>F</sub> = (π²n)¹ᐟ², con esponente un mezzo", "k<sub>F</sub> = 3πn, lineare nella densità elettronica", "k<sub>F</sub> = (n/3π²)³, con esponente cubico"],c:0,
e:"Riempiendo con 2 elettroni per stato i k dentro una sfera: N = 2·(4πk<sub>F</sub>³/3)/(8π³/V) → k<sub>F</sub> = (3π²n)¹ᐟ³. Da qui ε<sub>F</sub> = ħ²k<sub>F</sub>²/2m ≈ 7 eV per Cu e v<sub>F</sub> = ħk<sub>F</sub>/m ≈ 10⁶ m/s."},
{id:"t15",b:"tra",q:"L'ordine di grandezza della temperatura di Fermi nei metalli è:",
o:["T<sub>F</sub> ≈ 10⁴–10⁵ K: sempre T ≪ T<sub>F</sub> in condizioni ordinarie", "T<sub>F</sub> ≈ 300 K, cioè dell'ordine della temperatura ambiente", "T<sub>F</sub> ≈ 10 K, raggiungibile solo con l'elio liquido", "T<sub>F</sub> ≈ 10⁸ K, tipica dei plasmi stellari"],c:0,
e:"ε<sub>F</sub> ≈ 2–10 eV e 1 eV ↔ 11600 K → T<sub>F</sub> ∼ 10⁴–10⁵ K (Cu: 81000 K). Il gas di elettroni è sempre fortemente degenere: giustifica l'espansione di Sommerfeld in potenze di T/T<sub>F</sub>."},
{id:"t16",b:"tra",q:"A T = 0 l'energia media per elettrone di un gas di Fermi è:",
o:["⟨ε⟩ = (3/5)ε<sub>F</sub>, ben diversa da zero", "⟨ε⟩ = 0", "⟨ε⟩ = ε<sub>F</sub>", "⟨ε⟩ = (3/2)k<sub>B</sub>T = 0 quindi tutti fermi"],c:0,
e:"U₀/N = ∫εg(ε)dε/N = (3/5)ε<sub>F</sub>: il principio di Pauli impedisce a tutti di stare sul fondo. Conseguenza: pressione di degenerazione P = (2/5)nε<sub>F</sub> anche a T = 0 (comparsa in un appello sul Cu)."},
{id:"t17",b:"tra",q:"La densità degli stati per elettroni liberi in 3D vale g(ε) ∝ √ε. Al livello di Fermi si ha la relazione utile:",
o:["g(ε<sub>F</sub>) = (3/2)N/ε<sub>F</sub>", "g(ε<sub>F</sub>) = N/ε<sub>F</sub>", "g(ε<sub>F</sub>) = (2/3)ε<sub>F</sub>/N", "g(ε<sub>F</sub>) = 3Nε<sub>F</sub>"],c:0,
e:"Da N = ∫₀^{ε_F} C√ε dε = (2/3)Cε<sub>F</sub>³ᐟ² segue g(ε<sub>F</sub>) = Cε<sub>F</sub>¹ᐟ² = (3/2)N/ε<sub>F</sub>. Scorciatoia preziosa nei problemi su c<sub>V</sub> = γT e χ di Pauli senza rifare tutti gli integrali."},
{id:"t18",b:"tra",q:"Come varia il potenziale chimico μ(T) di un metallo (g ∝ √ε) al crescere della temperatura?",
o:["Decresce quadraticamente: μ = ε<sub>F</sub>[1 − (π²/12)(T/T<sub>F</sub>)²]", "Cresce linearmente con la temperatura assoluta del metallo", "Resta esattamente pari a ε<sub>F</sub> a qualunque temperatura", "Decresce esponenzialmente al crescere della temperatura"],c:0,
e:"Con g crescente in ε, per tenere N costante μ deve scendere leggermente (l'area di f·g «sborda» più sopra che sotto). Effetto minuscolo: per Cu a 2500 K cala dello 0,1%. Caso generale g ∝ ε<sup>x</sup>: μ scende se x &gt; 0, sale se x &lt; 0, resta fermo se x = 0 (2D) — chiesto in un appello sul grafene."},
{id:"t19",b:"tra",q:"Nell'espansione di Sommerfeld compaiono solo potenze pari di k<sub>B</sub>T perché:",
o:["−∂f/∂ε è una campana simmetrica attorno a μ", "Perché la densità degli stati è una funzione pari dell'energia", "Perché il potenziale chimico è rigorosamente costante in T", "È soltanto una scelta arbitraria di troncamento della serie"],c:0,
e:"Si integra per parti (N = −∫K(ε)∂f/∂ε dε), si sviluppa K attorno a μ e si sfrutta la simmetria della campana −∂f/∂ε (larghezza ~k<sub>B</sub>T): sopravvivono i termini pari con coefficienti legati alla ζ di Riemann (a₁ = π²/6)."},
{id:"t20",b:"tra",q:"Il calore specifico elettronico di Sommerfeld è c<sub>V</sub> = γT con:",
o:["γ = (π²/3)k<sub>B</sub>²g(ε<sub>F</sub>): conta solo la densità di stati al livello di Fermi", "γ = (3/2)nk<sub>B</sub>, come nel modello classico di Drude", "γ = k<sub>B</sub>²T<sub>F</sub>, proporzionale alla temperatura di Fermi", "γ = ne²τ/m, la stessa espressione della conducibilità"],c:0,
e:"Solo gli elettroni entro ~k<sub>B</sub>T da ε<sub>F</sub> possono eccitarsi (Pauli blocca gli altri): frazione ~T/T<sub>F</sub> del totale. Rispetto a Drude: c<sub>V</sub> ridotto di ~10⁻² a temperatura ambiente — risolve il mistero del perché gli elettroni «non si vedono» nel calore specifico."},
{id:"t21",b:"tra",q:"Perché a temperatura ambiente il contributo elettronico al calore specifico di un metallo è trascurabile rispetto a Dulong–Petit?",
o:["Il principio di Pauli lascia attiva solo la frazione ~T/T<sub>F</sub>", "Gli elettroni non scambiano affatto energia con il reticolo", "La massa dell'elettrone è troppo piccola per immagazzinare calore", "Gli elettroni di conduzione sono troppo pochi rispetto agli ioni"],c:0,
e:"c<sub>e</sub>(300 K) ≈ 0,15 J/mol·K contro 3R ≈ 24,9 J/mol·K: rapporto ~6·10⁻³ (calcolo esatto del tema di giugno sul Cu). Un elettrone a metà del mare di Fermi non ha stati liberi vicini in cui saltare con soli k<sub>B</sub>T ≈ 25 meV."},
{id:"t22",b:"tra",q:"Perché a basse temperature si grafica c/T in funzione di T²?",
o:["Perché c = γT + AT³ (elettroni + fononi) diventa una retta", "Perché in questo modo il grafico risulta più compatto da leggere", "Perché il calore specifico dipende soltanto dal quadrato di T", "Per eliminare gli errori casuali di misura sulle temperature"],c:0,
e:"c/T = γ + AT²: l'intercetta a T → 0 isola il contributo elettronico γ (Sommerfeld), la pendenza quello reticolare di Debye. La temperatura di incrocio T* = √(γ/A) è di pochi K (3,2 K per Cu, chiesto all'appello di giugno)."},
{id:"t23",b:"tra",q:"Il rapporto γ<sub>sperimentale</sub>/γ<sub>teorico</sub> del calore specifico elettronico definisce:",
o:["La massa efficace m*/m: ingloba le interazioni con reticolo", "Il numero di elettroni di valenza per atomo del metallo", "La temperatura di Debye caratteristica del reticolo", "La carica efficace dei portatori nel modello a bande"],c:0,
e:"γ ∝ g(ε<sub>F</sub>) ∝ m: se l'esperimento dà γ diverso dal previsto per elettroni liberi, si interpreta come massa «rinormalizzata» m*. Nel tema di maggio: m*/m del potassio da α = c<sub>V</sub>/T sperimentale, poi confronto col valore da Drude."},
{id:"t24",b:"tra",q:"Nel modello semiclassico di Sommerfeld, l'effetto di un campo elettrico costante sulla sfera di Fermi è:",
o:["Una traslazione rigida di ⟨Δk⟩ = −eEτ/ħ, limitata dagli urti", "Una dilatazione uniforme della sfera verso energie maggiori", "Lo svuotamento completo della sfera di Fermi occupata", "Nessun effetto: tutti gli stati sono già completamente pieni"],c:0,
e:"ħk̇ = −eE trasla tutti i k; gli urti riportano indietro. Il risultato σ = ne²τ/m è identico a Drude, ma l'interpretazione cambia: partecipano solo gli elettroni a ε<sub>F</sub> (gli unici con stati liberi accanto), con velocità v<sub>F</sub>, non tutti con v<sub>T</sub>."},
{id:"t25",b:"tra",q:"L'equazione di Richardson–Dushman per la corrente termoionica di saturazione è:",
o:["J = A·T²·e^(−φ/k<sub>B</sub>T)", "J = A·T·e^(−φ/k<sub>B</sub>T), con dipendenza lineare da T", "J = A·e^(−T/φ), con temperatura e lavoro di estrazione invertiti", "J = A·T⁴, come nella legge di Stefan–Boltzmann"],c:0,
e:"Deriva dal conteggio degli elettroni con energia sopra il livello di vuoto (coda Boltzmann della FD, integrata sui momenti): A = 4πemk<sub>B</sub>²/h³ ≈ 120 A/cm²K². Il T² viene dai due integrali gaussiani trasversi × k<sub>B</sub>T longitudinale."},
{id:"t26",b:"tra",x:1,q:"Due catodi alla stessa temperatura hanno funzioni lavoro φ₁ = 2,0 eV e φ₂ = 4,0 eV. Quale emette più corrente termoionica?",
o:["Il materiale 1: J ∝ e^(−φ/k<sub>B</sub>T), quindi φ minore → corrente esponenzialmente maggiore","Il materiale 2: barriera più alta significa più energia disponibile","Uguale corrente: conta solo T","Dipende dal volume del catodo"],c:0,
e:"A parità di T il fattore dominante è l'esponenziale: con Δφ = 2 eV e k<sub>B</sub>T ≈ 0,2 eV il rapporto è e¹⁰ ≈ 2·10⁴. Per questo si usano ricoprimenti a bassa φ (Cs: 1,8 eV) sui filamenti (domanda reale d'esame)."},
{id:"t27",b:"tra",q:"Nel regime di carica spaziale del diodo termoionico, la corrente:",
o:["Cresce come ΔV³ᐟ² ed è indipendente da T", "È costante e coincide con la corrente di saturazione", "Cresce esponenzialmente al crescere della tensione applicata", "È rigorosamente nulla finché non si supera la tensione critica"],c:0,
e:"A tensioni basse la nuvola di elettroni davanti al catodo respinge i nuovi emessi (legge di Child–Langmuir I ∝ V³ᐟ²). Solo oltre V* tutti gli emessi vengono raccolti: I<sub>sat</sub>(T), che dipende fortemente da T via Richardson."},
{id:"t28",b:"tra",q:"Come si misura la funzione lavoro φ di un metallo con l'effetto termoionico?",
o:["Graficando ln(J<sub>sat</sub>/T²) contro 1/T: retta di pendenza −φ/k<sub>B</sub>", "Misurando la corrente di saturazione a una sola temperatura", "Dal valore assoluto della costante di Richardson A", "Dal potenziale di contatto fra il metallo e se stesso"],c:0,
e:"Linearizzazione di Richardson–Dushman: ln(J/T²) = ln A − φ/(k<sub>B</sub>T). Il termoionico è a tutti gli effetti una tecnica di misura di φ (≈ 4–5 eV per i metalli comuni)."},
{id:"t29",b:"tra",q:"Nel calcolo del termoionico si usa la statistica di Boltzmann al posto della Fermi–Dirac perché:",
o:["Le occupazioni sono minuscole e il +1 è trascurabile", "Ad alta temperatura il principio di Pauli smette di valere", "Gli elettroni emessi nel vuoto diventano distinguibili fra loro", "È un'approssimazione ingiustificata, adottata solo per comodità"],c:0,
e:"Sulla coda ad altissima energia della FD la probabilità di doppia occupazione è irrilevante: f ≈ e^((μ−ε)/k<sub>B</sub>T). Attenzione (nota d'esame): il limite classico riguarda le occupazioni, il principio di Pauli resta sempre valido."},
{id:"t30",b:"tra",q:"Per uscire dal metallo per effetto termoionico, un elettrone deve avere:",
o:["Energia superiore al livello di vuoto ε<sub>v</sub> = μ + φ: non basta superare μ", "Energia superiore al potenziale chimico μ del metallo", "Energia superiore all'energia termica k<sub>B</sub>T del reticolo", "Qualunque energia: conta soltanto la direzione della velocità"],c:0,
e:"La funzione lavoro φ = ε<sub>v</sub> − μ ≈ 4–5 eV è la barriera dal livello di Fermi al vuoto. Inoltre serve componente di velocità perpendicolare alla superficie sufficiente (v<sub>x</sub> nel conteggio del volume efficace v<sub>x</sub>Δt)."},
// ============ STATO SOLIDO ============
{id:"o01",b:"sol",q:"Che cos'è un reticolo di Bravais?",
o:["Un insieme di punti da cui il panorama è sempre identico", "Qualunque disposizione periodica di atomi in tre dimensioni", "L'insieme di tutti i piani cristallini paralleli fra loro", "La cella unitaria che si ripete per traslazione nel cristallo"],c:0,
e:"È un reticolo di punti matematici generato da tre vettori primitivi: ogni punto è equivalente a ogni altro. La struttura cristallina reale è Bravais + base (il motivo di atomi ripetuto in ogni punto). In 3D esistono 14 reticoli di Bravais."},
{id:"o02",b:"sol",q:"Quanti reticoli di Bravais distinti esistono in tre dimensioni?",
o:["14", "7", "32", "230"],c:0,
e:"14 reticoli, raggruppati in 7 sistemi cristallini (con i centraggi P, I, C, F). I 32 sono i gruppi puntuali, i 230 i gruppi spaziali (con assi vite e glide). In 2D: 5 reticoli di Bravais e 17 wallpaper groups."},
{id:"o03",b:"sol",q:"Il reticolo a nido d'ape (honeycomb, es. grafene) è un reticolo di Bravais?",
o:["No: i due siti adiacenti non sono equivalenti; è un reticolo esagonale", "Sì, coincide con il reticolo esagonale semplice bidimensionale", "Sì, si tratta di un reticolo obliquo con angolo di 120 gradi", "No, perché la struttura non possiede periodicità traslazionale"],c:0,
e:"Da un sito A i primi vicini puntano in direzioni diverse che da un sito B: il panorama non è identico → non è Bravais. Si descrive come triangolare (esagonale) + base {0, ⅓(a₁+a₂)}. Trappola classica dei quiz."},
{id:"o04",b:"sol",q:"Quale proprietà definisce una cella primitiva (unitaria)?",
o:["Contiene un solo punto reticolare e riempie lo spazio", "È unica, cioè determinata in modo univoco dal reticolo dato", "Manifesta sempre tutta la simmetria puntuale del reticolo", "Ha sempre forma cubica nei sistemi cristallini cubici"],c:0,
e:"Volume minimo, 1 punto reticolare, ma NON è unica (infinite scelte). La cella convenzionale può contenerne di più (FCC: 4, BCC: 2) ma mostra la simmetria cubica. L'unica primitiva che ha anche tutta la simmetria è la cella di Wigner–Seitz."},
{id:"o05",b:"sol",q:"Come si costruisce la cella di Wigner–Seitz?",
o:["Tracciando i piani bisettori dei segmenti verso i vicini", "Unendo con segmenti tutti i primi vicini del sito considerato", "Costruendo il parallelepipedo sui tre vettori primitivi", "Circoscrivendo una sfera al sito reticolare considerato"],c:0,
e:"Cella primitiva unica e con tutta la simmetria del reticolo. Esempi 3D: cubo per SC, ottaedro troncato per FCC, dodecaedro rombico per BCC. La prima zona di Brillouin è la Wigner–Seitz del reticolo reciproco."},
{id:"o06",b:"sol",q:"I numeri di coordinazione di SC, BCC e FCC sono rispettivamente:",
o:["6, 8, 12", "8, 6, 12", "6, 12, 8", "4, 8, 12"],c:0,
e:"SC: 6 primi vicini (a); BCC: 8 (√3a/2, i vertici visti dal centro); FCC: 12 (a/√2, il massimo possibile per sfere identiche — struttura compatta come hcp)."},
{id:"o07",b:"sol",q:"Il diamante ha reticolo FCC ma fattore di riempimento f ≈ 0,34, molto minore di quello dell'FCC compatto (0,74). Perché?",
o:["La coordinazione tetraedrica 4 imposta dai legami direzionali", "Perché gli atomi di carbonio hanno raggio particolarmente piccolo", "Perché il reticolo sottostante è in realtà cubico semplice", "Si tratta di un errore nella misura sperimentale della densità"],c:0,
e:"Diamante = FCC + base {0, (¼,¼,¼)a}: due FCC compenetrati. Ogni atomo ha solo 4 primi vicini tetraedrici (legami covalenti sp³): la struttura è «vuota» ma rigidissima. Stessa struttura per Si, Ge; con specie diverse sui due siti: zincoblenda (GaAs)."},
{id:"o08",b:"sol",q:"Gli indici di Miller (hkl) di una famiglia di piani individuano:",
o:["Il vettore reciproco K = hb₁+kb₂+lb₃ perpendicolare ai piani", "Le coordinate frazionarie di un atomo all'interno della cella", "Il numero di atomi contenuti in ciascun piano della famiglia", "La direzione preferenziale di crescita del cristallo singolo"],c:0,
e:"Doppia definizione equivalente: (hkl) = componenti del più corto vettore reciproco ⊥ ai piani, oppure reciproci delle intercette. La distanza interplanare è d<sub>hkl</sub> = 2π/|K|; per i cubici d = a/√(h²+k²+l²). [hkl] indica invece una direzione nello spazio diretto."},
{id:"o09",b:"sol",q:"I vettori primitivi del reticolo reciproco sono definiti da:",
o:["b₁ = 2π(a₂×a₃)/[a₁·(a₂×a₃)], cioè a<sub>i</sub>·b<sub>j</sub> = 2πδ<sub>ij</sub>", "b<sub>i</sub> = 1/a<sub>i</sub>, semplice reciproco dei moduli", "b<sub>i</sub> = 2πa<sub>i</sub>, paralleli ai vettori diretti", "b₁ = a₂×a₃, senza alcun fattore di normalizzazione"],c:0,
e:"Equivalente: e^(iG·R) = 1 per ogni R del reticolo diretto. Il reciproco è il duale del reticolo reale ed è un'entità fisica concreta: emerge nella diffrazione, nelle bande e nei fononi."},
{id:"o10",b:"sol",q:"Il reticolo reciproco dell'FCC è:",
o:["Un BCC (di lato 4π/a), e viceversa il reciproco del BCC è un FCC", "Un reticolo FCC più piccolo, di lato inversamente proporzionale", "Un reticolo cubico semplice, come per il cubico semplice stesso", "Un reticolo esagonale ruotato di trenta gradi rispetto al diretto"],c:0,
e:"FCC(a) ↔ BCC(4π/a) sono duali; il reciproco di SC è SC (2π/a). Conseguenza: la 1ª zona di Brillouin dell'FCC è l'ottaedro troncato (Wigner–Seitz del BCC), quella del BCC il dodecaedro rombico."},
{id:"o11",b:"sol",q:"Che cos'è la prima zona di Brillouin?",
o:["La cella di Wigner–Seitz del reticolo reciproco", "La cella primitiva del reticolo diretto del cristallo", "La sfera di Fermi che racchiude gli stati elettronici occupati", "Il volume dello spazio reciproco occupato da un singolo fonone"],c:0,
e:"Contiene tutti i k fisicamente inequivalenti (N valori discreti con Born–von Karman). Ai suoi bordi si aprono i gap delle bande e si riflettono le branche fononiche: è l'arena di tutta la fisica dello stato solido."},
{id:"o12",b:"sol",x:1,q:"Raggi X incidono su un cristallo. Come appare la figura di diffrazione su uno schermo lontano?",
o:["Punti luminosi nelle posizioni associate ai vettori G del reticolo reciproco che soddisfano Δk = G","Un'immagine in scala del reticolo diretto","Una distribuzione continua e uniforme","Anelli concentrici indipendenti dall'orientazione (per un cristallo singolo)"],c:0,
e:"Condizione di von Laue: interferenza costruttiva solo se il vettore di scattering q = k′−k coincide con un G del reciproco. La figura «fotografa» il reticolo reciproco, non quello diretto. Gli anelli compaiono solo con le polveri (domanda reale d'esame)."},
{id:"o13",b:"sol",q:"La legge di Bragg nλ = 2d·senθ è:",
o:["Equivalente alla condizione di von Laue Δk = G, letta", "Una legge del tutto indipendente e più generale di von Laue", "Una relazione valida soltanto per la diffrazione di neutroni", "Un'approssimazione valida soltanto per angoli di incidenza piccoli"],c:0,
e:"Le due formulazioni sono la stessa fisica: |Δk| = 2k·senθ = |G| = 2πn/d ⟺ nλ = 2d·senθ. Bragg è la lettura «per piani», Laue quella «per vettori reciproci»."},
{id:"o14",b:"sol",q:"Il fattore di struttura del reticolo BCC (visto come SC + base {0, ½½½}) produce:",
o:["Estinzione delle riflessioni con h+k+l dispari", "Estinzione delle riflessioni con h+k+l pari", "Nessuna estinzione: tutti i picchi restano visibili", "La sopravvivenza della sola riflessione"],c:0,
e:"F = f[1+e^(−iπ(h+k+l))] = 2f se h+k+l pari, 0 se dispari. Per FCC: sopravvivono solo h,k,l tutti pari o tutti dispari. Eliminando i picchi estinti si «riscopre» il reticolo reciproco corretto (BCC → reciproco FCC). Esercizio ricorrente con Si, diamante, CaF₂."},
{id:"o15",b:"sol",q:"Nella diffrazione da polveri (powder diffraction):",
o:["Si perde l'informazione direzionale, restano i d<sub>hkl</sub>", "Si misura direttamente la posizione degli atomi nella cella", "Serve necessariamente un cristallo singolo di grandi dimensioni", "La legge di Bragg cessa di valere e servono altre relazioni"],c:0,
e:"I microcristalli orientati a caso trasformano i punti di Laue in coni/anelli: la curva I(2θ) dà i d<sub>hkl</sub> e, con il fattore di struttura, la struttura (esercizi: Si, CaF₂, BaTiO₃). Dai rapporti √(h²+k²+l²) si riconosce il tipo di reticolo cubico."},
{id:"o16",b:"sol",q:"Il fattore di forma atomico f(q) è:",
o:["La trasformata di Fourier della densità elettronica atomica", "Il numero complessivo di atomi contenuti nella cella unitaria", "La carica elettrica totale del nucleo dell'atomo diffondente", "La sezione d'urto totale del processo di scattering elastico"],c:0,
e:"f<sub>s</sub>(q) = ∫ρ<sub>s</sub>(u)e^(−iq·u)d³u; per q → 0 tende a Z (numero di elettroni). Nel fattore di struttura F(G) = Σ<sub>s</sub> f<sub>s</sub>e^(−iG·r<sub>s</sub>) pesa i diversi atomi della base (es. BaTiO₃ con f<sub>Ba</sub> = 7f<sub>O</sub>)."},
{id:"o17",b:"sol",x:1,q:"Per una catena 1D di N atomi a passo a con condizioni periodiche, le lunghezze d'onda minima e massima dei modi sono:",
o:["λ<sub>min</sub> = 2a e λ<sub>max</sub> = Na = L","λ<sub>min</sub> = a e λ<sub>max</sub> = L","λ<sub>min</sub> = a e λ<sub>max</sub> = L/2","λ<sub>min</sub> = 2a e λ<sub>max</sub> = L/2"],c:0,
e:"k = 2πm/(Na): il modo più lungo è λ = L (m = 1), il più corto λ = 2a al bordo zona (k = π/a), dove atomi adiacenti oscillano in controfase — sotto 2a non c'è nulla da campionare tra gli atomi. Domanda reale d'esame (sbagliata all'appello: attento!)."},
{id:"o18",b:"sol",q:"La relazione di dispersione della catena monoatomica 1D è ω(k) = ω<sub>max</sub>|sin(ka/2)|. Nel limite k → 0:",
o:["ω ≈ v<sub>s</sub>k lineare: sono le onde sonore, con velocità v<sub>s</sub> = a√(C/m)", "ω tende al valore massimo ω<sub>max</sub> della branca acustica", "ω ∝ k², con dispersione quadratica come per la particella libera", "ω resta costante, indipendente dal vettore d'onda del modo"],c:0,
e:"A grandi lunghezze d'onda il reticolo appare continuo: dispersione lineare = modi acustici, pendenza = velocità del suono. Al bordo zona (k = π/a) la velocità di gruppo si annulla: onda stazionaria."},
{id:"o19",b:"sol",q:"Che cosa distingue i fononi ottici da quelli acustici in una catena biatomica?",
o:["Negli ottici i due atomi della base oscillano in controfase", "I modi ottici esistono soltanto nei cristalli metallici", "I modi acustici hanno energia maggiore di quelli ottici", "I modi ottici non trasportano energia attraverso il cristallo"],c:0,
e:"Due atomi per cella → 2 branche. Il gap si apre al bordo zona. I modi ottici, se gli atomi hanno cariche opposte, si accoppiano alla radiazione IR (da cui il nome). Modello di Einstein ≈ ottici (ω quasi costante), Debye ≈ acustici (lineari)."},
{id:"o20",b:"sol",q:"A che cosa servono le condizioni al contorno di Born–von Karman?",
o:["A rendere numerabili i modi, con k discreti (Δk = 2π/L)", "A eliminare dal conteggio i modi ottici di alta frequenza", "A imporre che il cristallo sia effettivamente infinito", "A fissare la temperatura di equilibrio del reticolo cristallino"],c:0,
e:"Chiudendo la catena ad anello (periodicità) si contano esattamente N modi per branca senza effetti di bordo. Da qui la densità di stati in k: g(k) = L/2π (1D), V/8π³ per stato in 3D (×2 per lo spin per gli elettroni)."},
{id:"o21",b:"sol",q:"Dal punto di vista statistico i fononi sono:",
o:["Bosoni con potenziale chimico nullo: il loro numero non è conservato", "Fermioni dotati di una propria energia di Fermi caratteristica", "Bosoni con μ &lt; 0 fissato dalla densità di quanti presenti", "Particelle classiche distinguibili l'una dall'altra"],c:0,
e:"La Z degli oscillatori reticolari coincide (tolto il punto zero) con una grancanonica di bosoni a μ = 0: occupazione di Planck n(ω) = 1/(e^(ħω/k<sub>B</sub>T)−1). Si creano e distruggono liberamente scaldando il cristallo."},
{id:"o22",b:"sol",q:"La legge di Dulong–Petit prevede per il calore specifico molare dei solidi:",
o:["c = 3R ≈ 24,9 J/(mol·K), indipendente da T e dal materiale", "c = (3/2)R, come per un gas ideale monoatomico", "c ∝ T³ a qualunque temperatura, anche molto elevata", "c = 0 per tutti i solidi cristallini ben ordinati"],c:0,
e:"Equipartizione su 3N oscillatori (cinetico + elastico = k<sub>B</sub>T ciascuno). Vale per T ≳ Θ<sub>D</sub>; a bassa T fallisce perché i modi con ħω &gt; k<sub>B</sub>T si congelano — serve la quantizzazione (Einstein, poi Debye)."},
{id:"o23",b:"sol",q:"Qual è la differenza tra i modelli di Einstein e di Debye per il calore specifico reticolare?",
o:["Einstein usa una sola ω, Debye una dispersione lineare", "Il modello di Einstein vale a bassa T e quello di Debye ad alta", "Il modello di Debye ignora del tutto la quantizzazione dei modi", "I due modelli sono equivalenti a qualunque temperatura"],c:0,
e:"L'esperimento dà c ∝ T³ a bassa T: sono i fononi acustici a bassa ω, sempre eccitabili, che Einstein non ha. Debye taglia a ω<sub>D</sub> per avere 3N modi totali (differenza chiave rispetto al corpo nero, dove i modi sono infiniti)."},
{id:"o24",b:"sol",q:"Per elettroni liberi, la densità degli stati g(ε) in 3D, 2D e 1D (banda parabolica) va rispettivamente come:",
o:["√ε, costante, 1/√ε", "ε, √ε, costante", "√ε, ε, ε²", "costante in tutti i casi"],c:0,
e:"g(ε) = g(k)/(dε/dk) con g(k) dal volume/superficie/lunghezza della «sfera» in k. Il caso 2D costante ha una conseguenza notevole: μ(T) resta fermo al 1° ordine. Nel grafene (dispersione lineare 2D) g ∝ ε: esercizio d'appello."},
{id:"o25",b:"sol",q:"Il teorema di Bloch afferma che in un potenziale periodico le autofunzioni hanno la forma:",
o:["ψ<sub>k</sub>(r) = e^(ik·r)u<sub>k</sub>(r), con u<sub>k</sub> periodica come il reticolo", "Onde piane pure e^(ik·r), come per l'elettrone libero", "Funzioni fortemente localizzate su ciascun sito atomico", "Gaussiane centrate sui siti del reticolo cristallino"],c:0,
e:"Onda piana modulata dalla periodicità: k è definito a meno di vettori G (si riporta tutto nella 1ª BZ) e nascono le bande ε<sub>n</sub>(k). Ai bordi zona la riflessione di Bragg apre i gap proibiti."},
{id:"o26",b:"sol",q:"La massa efficace di un elettrone in una banda è definita da:",
o:["1/m* = (1/ħ²)·d²ε/dk², cioè la curvatura della banda", "m* = ħk/v, sempre positiva per qualunque stato di banda", "m* = m, cioè la massa dell'elettrone libero nel vuoto", "m* = ħ²k²/2ε, rapporto fra momento ed energia dello stato"],c:0,
e:"L'elettrone risponde ai campi come una particella di massa m* dettata dalla curvatura locale di ε(k). Bande strette → m* grande. In cima alla banda m* &lt; 0: si descrive meglio come lacuna di carica +e — spiega gli Hall positivi."},
{id:"o27",b:"sol",q:"In un semimetallo a due bande paraboliche sovrapposte di Δ (masse m*<sub>C</sub>, m*<sub>V</sub>), la posizione di E<sub>F</sub> a T = 0 si trova imponendo:",
o:["n<sub>elettroni</sub> = n<sub>lacune</sub>, cioè la neutralità di carica", "E<sub>F</sub> = Δ/2 sempre, a metà della zona di sovrapposizione", "E<sub>F</sub> coincide con il massimo della banda di valenza", "E<sub>F</sub> si colloca dove la densità degli stati è minima"],c:0,
e:"Gli elettroni «versati» nella banda di conduzione lasciano altrettante lacune: ∫g<sub>C</sub> = ∫g<sub>V</sub> con g ∝ (m*)³ᐟ²√E. Con masse uguali E<sub>F</sub> = Δ/2. Problema del tema di luglio, con c<sub>V</sub> = γT ∝ √Δ·T come seguito."},
{id:"o28",b:"sol",q:"La frazione di riempimento dell'FCC (sfere rigide tangenti) è:",
o:["f = π/√18 ≈ 0,74, il massimo possibile per sfere identiche", "f ≈ 0,68, come per il reticolo cubico a corpo centrato", "f ≈ 0,52, come per il reticolo cubico semplice", "f ≈ 0,34, come per la struttura del diamante"],c:0,
e:"FCC e hcp sono le strutture compatte: 0,74 (congettura di Keplero). BCC: 0,68; SC: 0,52; diamante: 0,34. Nei quiz spesso chiedono anche il 2D: esagonale 0,907 &gt; quadrato 0,785."},
{id:"o29",b:"sol",q:"Quanti modi normali (per branca) ha un cristallo di N celle primitive con condizioni di Born–von Karman?",
o:["Esattamente N, uno per ogni k della prima zona", "Infiniti, perché il vettore d'onda varia", "3N per ciascuna branca, uno per grado di libertà", "Un numero che dipende dalla temperatura del cristallo"],c:0,
e:"I k permessi sono spaziati di 2π/L: nella 1ª BZ (larghezza 2π/a) ce ne stanno L/a = N. Con una base di p atomi: 3p branche in 3D (3 acustiche + 3p−3 ottiche) → 3pN modi totali = gradi di libertà."},
{id:"o30",b:"sol",q:"Nella catena biatomica 1D, che cosa accade al bordo della zona di Brillouin (k = π/a)?",
o:["Si apre un gap di frequenze proibite fra le due branche", "Le due branche si incrociano senza aprire alcun intervallo", "La frequenza diverge per entrambe le branche vibrazionali", "I modi diventano tutti puramente longitudinali al bordo"],c:0,
e:"A k = π/a: nella branca acustica oscillano solo le masse pesanti, nell'ottica solo le leggere; l'intervallo [√(2C/M), √(2C/m)] è proibito. Se le masse diventano uguali il gap si chiude e si ritrova la catena monoatomica (con cella dimezzata)."},
// ============ MAGNETISMO ============
{id:"m01",b:"mag",q:"Come si classificano dia-, para- e ferromagneti in base alla suscettività χ?",
o:["Dia: χ &lt; 0 piccola; para: χ &gt; 0 ∝ 1/T; ferro: χ enorme", "Dia: χ &gt; 0; para: χ &lt; 0; ferro: χ nulla in assenza di campo", "Tutti hanno χ &gt; 0 e si distinguono soltanto per il modulo", "Dia e para si distinguono soltanto per la temperatura critica"],c:0,
e:"Nell'esperimento del solenoide: i diamagneti sono debolmente espulsi (χ ∼ −10⁻⁵), i paramagneti debolmente attratti con χ = C/T (Curie), i ferromagneti attratti con forza ×10⁵ e mostrano isteresi e M spontanea."},
{id:"m02",b:"mag",q:"La forza su un campione magnetico sul bordo di un solenoide è:",
o:["F = μ·(dB/dz), proporzionale al gradiente del campo", "F = μ·B, proporzionale al campo e massima al centro del solenoide", "È sempre rigorosamente nulla per un materiale lineare", "È proporzionale a B² in ogni punto, anche a campo uniforme"],c:0,
