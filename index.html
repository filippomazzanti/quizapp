o:["λ = 2Z·J′/(μ₀nμ<sub>B</sub>²g²), cioè lo scambio con i Z vicini", "λ coincide con l'integrale di scambio J′ senza altri fattori", "λ = 1/J′, cioè l'inverso dell'integrale di scambio", "λ = μ₀nμ<sub>B</sub>²/k<sub>B</sub>T, dipendente dalla temperatura"],c:0,
e:"Sostituendo S<sub>j</sub> → ⟨S⟩ ∝ M: H<sub>i</sub> ≈ −μ<sub>i</sub>·(λμ₀M). Per il Fe (Z = 8): J′ ~ 10⁻² eV, coerente col calcolo microscopico. Il «mistero» del campo molecolare di Weiss è risolto (dispensa)."},
{id:"m96",b:"mag",q:"L'ossido di manganese MnO viene raffreddato sotto la sua temperatura di Néel. Quale ordinamento magnetico si stabilisce?",
o:["Due sottoreticoli con magnetizzazioni opposte", "La magnetizzazione spontanea diverge alla temperatura di Néel", "Il materiale diventa ferromagnetico con momento non nullo", "Gli spin si dispongono in modo completamente casuale"],c:0,
e:"χ(T) ha un MASSIMO a T<sub>N</sub> (non una divergenza) e sopra segue Curie–Weiss con θ NEGATIVA. L'ordine si vede con la diffrazione di neutroni (raddoppio della cella magnetica): collegamento col blocco diffrazione."},
{id:"m97",b:"mag",q:"Si misura la suscettività di due sali sopra la loro temperatura critica e si estrapola l'andamento di 1/χ. Quale indizio distingue un antiferromagnete da un paramagnete?",
o:["L'intercetta θ dell'estrapolazione di 1/χ: θ &lt; 0 per antiferro", "Il valore assoluto della suscettività misurata a temperatura fissa", "Il colore assunto dal campione al di sotto della transizione", "La densità del materiale confrontata con quella teorica"],c:0,
e:"1/χ = (T−θ)/C: la stessa retta di Curie–Weiss, ma il segno di θ rivela il segno dell'interazione di scambio media. Lettura standard dei dati χ(T) (dispensa, Esercitazione 17)."},
{id:"m98",b:"mag",q:"Si deve scegliere il materiale per il nucleo di un trasformatore che lavora a 50 Hz. Quali caratteristiche magnetiche servono?",
o:["DOLCE ciclo di isteresi strettissimo (basse perdite per ciclo)", "Duro, con elevato campo coercitivo e magnetizzazione residua", "Antiferromagnetico, con magnetizzazione totale nulla", "Diamagnetico, per espellere il flusso magnetico dal nucleo"],c:0,
e:"P<sub>persa</sub> = f·(area del ciclo): a 50 Hz ogni mJ di area conta. Per i magneti permanenti serve l'opposto (NdFeB, H<sub>c</sub> enormi). Collegare microstruttura (pinning) e applicazione è tipica domanda di commento (dispensa)."},
{id:"m99",b:"mag",q:"Un pezzo di ferro è rimasto magnetizzato e lo si vuole riportare allo stato neutro. Quali procedimenti sono efficaci?",
o:["Scaldarlo sopra T<sub>C</sub> o applicare cicli decrescenti", "Semplicemente aspettare che si smagnetizzi spontaneamente", "Raffreddarlo fino alla temperatura dell'elio liquido, 4 K", "Illuminarlo con radiazione ultravioletta ad alta intensità"],c:0,
e:"Entrambe le vie riportano i domini alla configurazione disordinata a M = 0 (il degauss dei vecchi monitor CRT!). La smagnetizzazione termica è la prova che l'ordine è di equilibrio sotto T<sub>C</sub> (dispensa)."},
{id:"m100",b:"mag",q:"Quale catena logica spiega il ferromagnetismo partendo dai principi primi?",
o:["Coulomb + Pauli → scambio → Heisenberg → Weiss → domini", "Interazione dipolare → allineamento dei momenti → isteresi", "Campo esterno applicato → ordinamento permanente degli spin", "Spin-orbita → interazione di scambio → legge di Curie"],c:0,
e:"La piramide completa del blocco magnetismo, dal microscopico al macroscopico: saperla percorrere in entrambe le direzioni è la preparazione ideale per l'orale (dispensa, Esercitazioni 17-18)."},

{id:"x01",b:"sta",x:1,q:"Nel conteggio microcanonico di un sistema quantistico di particelle identiche si fissano N ed E, e si contano le configurazioni di occupazione {n<sub>i</sub>} tali che Σn<sub>i</sub> = N e Σn<sub>i</sub>ε<sub>i</sub> = E. Quale delle seguenti condizioni è <b>errata</b>?",
o:["Per fermioni: n<sub>i</sub> = −1, 0, 1","Per bosoni: n<sub>i</sub> = 0, 1, 2, …","Tutti i microstati compatibili sono equiprobabili","Nel limite semiclassico di particelle indistinguibili, il conteggio va corretto del fattore 1/N!"],c:0,
e:"I numeri di occupazione non possono essere negativi: per i fermioni n<sub>i</sub> = 0 oppure 1 (principio di Pauli), mai −1. Le altre tre sono corrette: bosoni senza limite, equiprobabilità microcanonica, correzione di Gibbs. ⚠ Domanda uscita all'appello (era in forma «quale è ERRATA»: leggere bene la consegna)."},
{id:"x02",b:"sta",x:1,q:"In meccanica statistica, data la funzione di partizione canonica Z di un sistema a temperatura T, quale delle seguenti espressioni fornisce correttamente l'energia libera di Helmholtz F?",
o:["F = −k<sub>B</sub>T ln Z","F = k<sub>B</sub>T ln Z","F = k<sub>B</sub>T·Z","F = k<sub>B</sub> ln Z"],c:0,
e:"È il «ponte» tra statistica e termodinamica: F = −k<sub>B</sub>T lnZ, da cui S = −∂F/∂T, P = −∂F/∂V, μ = ∂F/∂N. Il segno meno è essenziale (F deve diminuire quando Z, cioè il numero di stati accessibili, cresce). ⚠ Domanda uscita all'appello."},
{id:"x03",b:"tra",x:1,q:"Un catodo metallico portato alla temperatura T = 1000 K emette corrente per effetto termoionico. Sapendo che il materiale ha coefficiente A = 1,2·10⁶ A·m⁻²K⁻² e funzione lavoro φ = 1,0 eV, quanto vale approssimativamente la densità di corrente a saturazione? (k<sub>B</sub> = 8,62·10⁻⁵ eV/K)",
o:["1,1·10⁷ A/m²","1,1·10⁴ A/m²","1,1·10⁻² A/m²","1,1·10¹² A/m²"],c:0,
e:"Richardson–Dushman: J = A·T²·e^(−φ/k<sub>B</sub>T). Qui k<sub>B</sub>T = 0,0862 eV → φ/k<sub>B</sub>T = 11,6 → e^(−11,6) ≈ 9,1·10⁻⁶; A·T² = 1,2·10⁶·10⁶ = 1,2·10¹² → J ≈ 1,1·10⁷ A/m². ⚠ Domanda uscita all'appello: l'esponenziale abbatte il prefattore di 5 ordini di grandezza."},
{id:"x04",b:"sol",x:1,q:"In una catena unidimensionale con un atomo per cella e costante reticolare a si osservano due modi vibrazionali: nel modo 1 tutti gli atomi si spostano nello stesso verso con lunghezza d'onda molto maggiore di a; nel modo 2 atomi adiacenti si spostano in versi opposti. Quali sono i rispettivi vettori d'onda?",
o:["k ≈ 0 (modo 1); k = π/a (modo 2)","k ≈ 0 (modo 1); k = a (modo 2)","k ≈ 0 (modo 1); k = 2π/a (modo 2)","k = −π/a (modo 1); k = π/a (modo 2)"],c:0,
e:"Spostamenti tutti concordi = grande lunghezza d'onda → k ≈ 0 (limite acustico). Atomi adiacenti in controfase → λ = 2a → k = 2π/λ = π/a, cioè il bordo della zona di Brillouin. Nota: k = 2π/a è FUORI dalla prima zona (equivale a k = 0). ⚠ Domanda uscita all'appello (con figura)."},
{id:"x05",b:"mag",x:1,q:"In un materiale ferromagnetico monodominio si ha M = 3,0·10⁴ A/m. Se la costante di Weiss vale λ = 200, qual è l'intensità del campo molecolare?",
o:["B<sub>m</sub> = 7,54 T","B<sub>m</sub> = 7,54·10⁻⁴ T","B<sub>m</sub> = 1,88·10⁻⁴ T","B<sub>m</sub> = 3,77·10⁻² T"],c:0,
e:"B<sub>m</sub> = μ₀λM = 4π·10⁻⁷ · 200 · 3,0·10⁴ ≈ 7,54 T. Il campo molecolare è enorme rispetto a quello dipolare: non è un vero campo magnetico ma l'equivalente dell'interazione di scambio. ⚠ Domanda uscita all'appello: attenzione a non dimenticare μ₀."},
{id:"x06",b:"sol",x:1,q:"Un cristallo bidimensionale ha reticolo rettangolare con passo b lungo x̂ e passo a lungo ŷ, con b &gt; a. Quali sono i vettori primitivi del reticolo reciproco?",
o:["b₁ = (2π/b)x̂ e b₂ = (2π/a)ŷ","b₁ = (2π/a)x̂ e b₂ = (2π/b)ŷ","b₁ = (π/b)x̂ e b₂ = (π/a)ŷ","b₁ = (b/2π)x̂ e b₂ = (a/2π)ŷ"],c:0,
e:"Da a<sub>i</sub>·b<sub>j</sub> = 2πδ<sub>ij</sub>: ogni vettore reciproco è parallelo al corrispondente diretto (reticolo ortogonale) con modulo 2π/passo. ⚠ Attenzione all'INVERSIONE: la direzione con passo maggiore nel reale dà il vettore più CORTO nel reciproco. Domanda uscita all'appello (con figura)."},
{id:"x07",b:"ato",x:1,q:"Un atomo di sodio nello stato fondamentale [Ne]3s¹ è posto in un campo magnetico intenso, in regime di Paschen–Back. In quanti sottolivelli si separa lo stato fondamentale?",
o:["In 2 sottolivelli","In 3 sottolivelli","In 4 sottolivelli","In 6 sottolivelli"],c:0,
e:"In Paschen–Back E ∝ (m<sub>l</sub> + 2m<sub>s</sub>). Per 3s¹: l = 0 → m<sub>l</sub> = 0; m<sub>s</sub> = ±½ → valori ±1: due sottolivelli. (Stesso risultato dello Zeeman debole, dove ²S₁/₂ ha 2J+1 = 2.) ⚠ Domanda uscita all'appello."},
{id:"x08",b:"mag",x:1,q:"Come sono correlate la funzione di Langevin e la funzione di Brillouin?",
o:["La funzione di Langevin è il limite classico della funzione di Brillouin per J → ∞","La funzione di Langevin considera effetti quantistici, mentre Brillouin descrive momenti classici continui","La funzione di Brillouin diventa quella di Langevin per J → 0, perché in quel limite scompare la quantizzazione","Le due funzioni coincidono per qualunque J, purché B e T siano gli stessi"],c:0,
e:"Brillouin somma sui 2J+1 orientamenti discreti; per J → ∞ la spaziatura tra i m<sub>J</sub> diventa trascurabile e si recupera l'integrale continuo sugli angoli di Langevin. Per J → 0 non c'è momento affatto. ⚠ Domanda uscita all'appello."},
{id:"x09",b:"ato",x:1,q:"Che cosa si intende per «interazione di Coulomb residua» rispetto all'approssimazione di campo centrale?",
o:["La parte dell'interazione elettrone-elettrone non già inclusa nel potenziale medio centrale","La parte di potenziale che contiene l'interazione elettrone-elettrone","L'interazione tra il nucleo e gli elettroni più esterni","L'interazione tra l'atomo e un campo elettrostatico esterno"],c:0,
e:"Il campo centrale assorbe la parte a simmetria sferica della repulsione e–e; ciò che avanza (la parte non sferica) è la Coulomb RESIDUA, che insieme allo spin-orbita determina i termini spettroscopici e l'accoppiamento LS o jj. ⚠ Domanda uscita all'appello: la distrazione C è vera ma non «residua»."},
{id:"x10",b:"tra",x:1,q:"Qual è la principale innovazione del modello di Sommerfeld rispetto a quello di Drude?",
o:["Introduce la statistica di Fermi–Dirac e il principio di esclusione di Pauli per gli elettroni di conduzione","Considera gli elettroni come un gas classico che obbedisce alla distribuzione di Maxwell–Boltzmann","Assume che tutti gli elettroni del metallo contribuiscano allo stesso modo alla conduzione","Considera il moto degli elettroni nel potenziale periodico del reticolo cristallino"],c:0,
e:"Sommerfeld tiene l'impianto di Drude (elettroni liberi, urti con tempo τ) e cambia SOLO la statistica: da MB a FD. Il potenziale periodico arriva dopo, con Bloch e la teoria delle bande. ⚠ Domanda uscita all'appello."},
{id:"x11",b:"ato",x:1,q:"Qual è l'idea di base del metodo di Hartree?",
o:["Sostituire le complicate interazioni tra gli elettroni con un'energia potenziale media efficace, che ogni elettrone sperimenta nella posizione considerata","Ignorare le interazioni tra gli elettroni e concentrarsi solo sull'interazione con il nucleo","Considerare la statistica delle funzioni d'onda totali: antisimmetria per i fermioni e simmetrizzazione per i bosoni","Descrivere gli elettroni usando un semplice potenziale di Coulomb come energia potenziale"],c:0,
e:"Campo medio autoconsistente: il problema a N corpi diventa N problemi a un corpo. L'opzione sull'antisimmetria descrive il passaggio successivo (Hartree–FOCK, con il determinante di Slater e il termine di scambio). ⚠ Domanda uscita all'appello."},
{id:"x12",b:"ato",x:1,q:"Quali termini spettrali possono risultare dalla configurazione elettronica np¹n′p¹, con n ≠ n′?",
o:["¹S, ³S, ¹P, ³P, ¹D, ³D","¹S, ¹P, ¹D","³P, ³F","¹S, ³P, ¹D"],c:0,
e:"Elettroni NON equivalenti (n diversi) → nessuna restrizione di Pauli: S = 0,1 e L = 0,1,2 si combinano liberamente, 6 termini (36 stati = 6×6 ✓). Per elettroni equivalenti (np²) resterebbero solo ¹S, ³P, ¹D. ⚠ Domanda uscita all'appello: distinguere equivalenti/non equivalenti è il punto."},
{id:"x13",b:"ato",x:1,q:"Qual è la differenza principale tra accoppiamento LS e accoppiamento jj negli atomi?",
o:["Nell'accoppiamento LS si sommano prima tutti i momenti orbitali tra loro e tutti gli spin tra loro; nell'accoppiamento jj si accoppiano prima l e s di ciascun elettrone","Nell'accoppiamento LS si considera solo lo spin, mentre nell'accoppiamento jj solo il momento orbitale","L'accoppiamento LS è tipico degli atomi pesanti, mentre jj è tipico degli atomi leggeri","Nell'accoppiamento LS il momento angolare totale J è sempre nullo, mentre in jj è sempre massimo"],c:0,
e:"LS (Russell–Saunders): L = Σl<sub>i</sub>, S = Σs<sub>i</sub>, poi J = L+S — valido quando la Coulomb residua batte lo spin-orbita (atomi LEGGERI). jj: j<sub>i</sub> = l<sub>i</sub>+s<sub>i</sub>, poi J = Σj<sub>i</sub> — atomi PESANTI (l'opzione C inverte i due casi). ⚠ Domanda uscita all'appello."},
{id:"x14",b:"sta",x:1,q:"In un sistema isolato (ensemble microcanonico) all'equilibrio termodinamico, tutti i microstati accessibili con energia compresa tra E ed E+ΔE:",
o:["Hanno la stessa probabilità di essere occupati","Hanno probabilità di occupazione diverse a seconda del numero di particelle","Hanno probabilità di occupazione inversamente proporzionale all'energia","Seguono la statistica di Maxwell–Boltzmann"],c:0,
e:"È il postulato fondamentale della meccanica statistica (equiprobabilità a priori), da cui S = k<sub>B</sub>lnΓ. Il peso di Boltzmann e^(−βE) vale per un sistema in contatto con un termostato (canonico), non per un sistema isolato. ⚠ Domanda uscita all'appello."},
{id:"x15",b:"sta",x:1,q:"La distribuzione di Maxwell–Boltzmann per un gas ideale classico si ottiene come limite delle distribuzioni quantistiche. Qual è la condizione fisica fondamentale perché questo limite sia valido?",
o:["Il gas si deve trovare in regime di bassa densità e alta temperatura","La temperatura deve essere vicina allo zero assoluto","La densità del gas deve essere molto alta","Le particelle devono avere spin intero"],c:0,
e:"Serve occupazione media ≪ 1 per ogni stato (e^((ε−μ)/k<sub>B</sub>T) ≫ 1), equivalente a nλ<sub>T</sub>³ ≪ 1: i pacchetti d'onda non si sovrappongono e l'indistinguibilità non produce effetti. Alta densità e bassa T portano invece alla degenerazione quantistica. ⚠ Domanda uscita all'appello."},
{id:"x16",b:"tra",x:1,q:"Da che cosa è originata la resistenza elettrica nel modello di Drude?",
o:["Dalle collisioni degli elettroni di conduzione con gli ioni del reticolo cristallino, che ne deviano il moto libero","Dalla massa degli elettroni, che si oppone alla loro accelerazione in presenza di un campo elettrico","Dalla repulsione elettrostatica tra gli elettroni liberi, che riduce il flusso di corrente","Dal principio di esclusione, che impedisce agli elettroni di occupare livelli già occupati"],c:0,
e:"Nel modello di Drude gli urti con gli ioni (tempo di rilassamento τ) limitano la velocità di deriva: σ = ne²τ/m. Nota storica: l'immagine è ingenua (nel reticolo perfetto gli elettroni non diffondono affatto — teorema di Bloch: diffondono fononi e difetti), ma è ciò che il modello assume. ⚠ Domanda uscita all'appello."},
{id:"x17",b:"tra",x:1,q:"In un metallo la densità elettronica è n = 8,5·10²⁸ m⁻³ e la resistività è ρ = 1,6·10⁻⁸ Ω·m. Quale risulta il tempo di rilassamento τ?",
o:["2,6·10⁻¹⁴ s","2,6·10⁻¹⁰ s","6,1·10⁻¹⁶ s","1,4·10⁻¹² s"],c:0,
e:"Da σ = ne²τ/m: τ = m/(ρne²) = 9,11·10⁻³¹ / (1,6·10⁻⁸ · 8,5·10²⁸ · (1,6·10⁻¹⁹)²) ≈ 2,6·10⁻¹⁴ s. Sono i dati del rame: il valore ~10⁻¹⁴ s (femtosecondi) è da tenere a memoria. ⚠ Domanda uscita all'appello."},
{id:"x18",b:"sol",x:1,q:"In un reticolo bidimensionale, quale delle seguenti aree NON può essere una cella unitaria (primitiva)?",
o:["Un'area che contiene due punti reticolari","Un parallelogramma costruito su due vettori primitivi del reticolo","Una regione di forma irregolare che, traslata per tutti i vettori del reticolo, ricopre il piano senza sovrapposizioni né vuoti","La cella di Wigner–Seitz costruita attorno a un punto reticolare"],c:0,
e:"La cella primitiva deve contenere esattamente UN punto reticolare (area = area primitiva): con due punti è una cella multipla (come la convenzionale dell'FCC, che ne contiene 4). La forma invece è libera: qualunque regione che tassella il piano va bene, anche irregolare. ⚠ Domanda uscita all'appello (con figura)."},
{id:"x19",b:"mag",x:1,q:"Quali condizioni sperimentali devono essere soddisfatte per misurare il momento magnetico di saturazione di una particella paramagnetica?",
o:["Applicare un campo magnetico esterno molto intenso e portare il sistema a temperatura molto bassa, così che l'energia di interazione magnetica sia molto maggiore di quella termica","Applicare un campo molto debole e portare il sistema a temperatura molto bassa, per non perturbare gli stati quantistici","Portare il sistema ad alta temperatura e applicare un campo intenso, sfruttando le fluttuazioni termiche per esplorare tutti gli stati di orientazione","Mantenere il sistema a temperatura ambiente con campo moderato, dove la funzione di Brillouin è lineare nel campo"],c:0,
e:"Serve a = g<sub>J</sub>μ<sub>B</sub>JB/k<sub>B</sub>T ≫ 1 perché B<sub>J</sub>(a) → 1. A temperatura ambiente con B = 10 T si ha a ≈ 10⁻²: si resta nel regime lineare di Curie (l'opzione D descrive proprio la misura di χ, non della saturazione). ⚠ Domanda uscita all'appello."},
];
// ============ GENERATORI NUMERICI (domande sempre nuove) ============
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const it=x=>String(x).replace(".",",");
const pw=(m,e)=>m+"·10<sup>"+(e<0?"−"+(-e):e)+"</sup>";
const GENS=[
{id:"g-tau",b:"tra",make(){
  const rho=rnd([1.6,2.2,2.8,4.2,5.6]), n=rnd([2.5,5.0,8.5,11.0,18.0]);
  const tau=9.109e-31/(rho*1e-8*n*1e28*2.566e-38); // s
  let e=-14, m=tau/1e-14; if(m<1){e=-15;m=tau/1e-15}
  const v=x=>it(x.toFixed(1));
  return{q:"Un metallo ha resistività ρ = "+pw(it(rho),-8)+" Ω·m e densità di elettroni n = "+pw(it(n),28)+" m⁻³. Nel modello di Drude, il tempo di rilassamento τ = m/(ρne²) vale circa:",
  o:[pw(v(m),e)+" s",pw(v(m),e+1)+" s",pw(v(m),e-1)+" s",pw(v(m*3.1),e)+" s"],
  e:"Da σ = ne²τ/m: τ = m/(ρne²) = 9,1·10⁻³¹/("+pw(it(rho),-8)+"·"+pw(it(n),28)+"·(1,6·10⁻¹⁹)²) ≈ "+pw(v(m),e)+" s. Ordine di grandezza da ricordare: 10⁻¹⁴–10⁻¹⁵ s (femtosecondi). Numerica ricorrente nei quiz reali."}}},
{id:"g-tf",b:"tra",make(){
  const ef=rnd([2.1,3.2,4.7,5.5,7.0,9.4]);
  const tf=ef*11604; const m=tf/1e4; const v=x=>it(x.toFixed(1));
  return{q:"Un metallo ha energia di Fermi ε<sub>F</sub> = "+it(ef)+" eV. La temperatura di Fermi T<sub>F</sub> = ε<sub>F</sub>/k<sub>B</sub> vale circa:",
  o:[pw(v(m),4)+" K",pw(v(m),3)+" K",pw(v(m),5)+" K",pw(v(m/3),4)+" K"],
  e:"Conversione chiave: 1 eV ↔ 11600 K (k<sub>B</sub> = 8,62·10⁻⁵ eV/K). T<sub>F</sub> = "+it(ef)+"·11600 ≈ "+pw(v(m),4)+" K ≫ 300 K: il gas di elettroni è sempre degenere e vale l'espansione di Sommerfeld in (T/T<sub>F</sub>)."}}},
{id:"g-deg",b:"ato",make(){
  const t=rnd([{t:"²D₅/₂",J:2.5,S:0.5},{t:"³P₂",J:2,S:1},{t:"⁴F₃/₂",J:1.5,S:1.5},{t:"²P₃/₂",J:1.5,S:0.5},{t:"⁶S₅/₂",J:2.5,S:2.5},{t:"⁵D₄",J:4,S:2},{t:"³F₄",J:4,S:1},{t:"⁸S₇/₂",J:3.5,S:3.5},{t:"⁴I₉/₂",J:4.5,S:1.5}]);
  const d=2*t.J+1; const wrong=[...new Set([2*t.J,2*t.S+1,d+2].map(Math.round))].filter(x=>x!==d&&x>0);
  while(wrong.length<3)wrong.push(d+wrong.length+2);
  return{q:"Qual è la degenerazione del livello atomico "+t.t+"?",
  o:[String(d),String(wrong[0]),String(wrong[1]),String(wrong[2])],
  e:"La degenerazione di un livello con momento angolare totale J è 2J+1 (i valori di m<sub>J</sub> da −J a +J). Qui J = "+it(t.J)+" → 2J+1 = "+d+". Non confondere con la molteplicità di spin 2S+1 scritta all'apice del termine."}}},
{id:"g-gj",b:"ato",make(){
  const L=[{t:"²S₁/₂",g:"2"},{t:"²P₁/₂",g:"2/3"},{t:"²P₃/₂",g:"4/3"},{t:"²D₃/₂",g:"4/5"},{t:"²D₅/₂",g:"6/5"},{t:"³P₂",g:"3/2"},{t:"⁴F₃/₂",g:"2/5"},{t:"⁸S₇/₂",g:"2"}];
  const t=rnd(L); const pool=["2","2/3","4/3","4/5","6/5","3/2","2/5","1"].filter(x=>x!==t.g);
  const w=[];while(w.length<3){const x=rnd(pool);if(!w.includes(x))w.push(x)}
  return{q:"Il fattore di Landé g<sub>J</sub> del termine "+t.t+" vale:",
  o:[t.g,w[0],w[1],w[2]],
  e:"g<sub>J</sub> = 1 + [J(J+1) − L(L+1) + S(S+1)] / [2J(J+1)]. Per "+t.t+" si ottiene g<sub>J</sub> = "+t.g+". Scorciatoie: singoletti (S=0) → g = 1; termini S (L=0) → g = 2. Il calcolo esplicito di g(²P₁/₂) = 2/3 spiega lo Zeeman anomalo del sodio."}}},
{id:"g-chain",b:"sol",make(){
  const N=rnd([50,100,200,400,1000]), a=rnd([0.2,0.25,0.3,0.4,0.5]);
  const lmin=2*a, lmax=N*a; const v=x=>it(+x.toFixed(2));
  return{q:"Una catena 1D ha N = "+N+" atomi a distanza a = "+it(a)+" nm, con condizioni al contorno periodiche. Le lunghezze d'onda minima e massima dei modi vibrazionali sono:",
  o:["λ<sub>min</sub> = "+v(lmin)+" nm, λ<sub>max</sub> = "+v(lmax)+" nm","λ<sub>min</sub> = "+v(a)+" nm, λ<sub>max</sub> = "+v(lmax)+" nm","λ<sub>min</sub> = "+v(lmin)+" nm, λ<sub>max</sub> = "+v(lmax/2)+" nm","λ<sub>min</sub> = "+v(a)+" nm, λ<sub>max</sub> = "+v(lmax/2)+" nm"],
  e:"k = 2πm/(Na): m = 1 → λ<sub>max</sub> = Na = L = "+v(lmax)+" nm; al bordo zona k = π/a → λ<sub>min</sub> = 2a = "+v(lmin)+" nm (atomi adiacenti in controfase). Domanda del quiz reale del II appello."}}},
{id:"g-dhkl",b:"sol",make(){
  const a=rnd([0.29,0.36,0.41,0.54]), hkl=rnd([{s:"(111)",v:3},{s:"(110)",v:2},{s:"(200)",v:4},{s:"(211)",v:6},{s:"(220)",v:8}]);
  const d=a/Math.sqrt(hkl.v); const v=x=>it(x.toFixed(3));
  return{q:"In un cristallo cubico con parametro reticolare a = "+it(a)+" nm, la distanza tra i piani "+hkl.s+" vale:",
  o:[v(d)+" nm",v(a/hkl.v)+" nm",v(a*Math.sqrt(hkl.v))+" nm",v(a/(hkl.v+1))+" nm"],
  e:"Per i reticoli cubici d<sub>hkl</sub> = a/√(h²+k²+l²) = "+it(a)+"/√"+hkl.v+" ≈ "+v(d)+" nm (equivalente a d = 2π/|G|). Maggiore d ⇔ minore angolo di Bragg: i piani a basso indice danno i primi picchi di diffrazione."}}},
{id:"g-zeeman",b:"ato",make(){
  const g=rnd([{s:"1",v:1},{s:"2",v:2},{s:"4/3",v:4/3}]), B=rnd([0.5,1,2,5]);
  const de=g.v*5.788e-5*B; let e=-5,m=de/1e-5; if(m>=10){e=-4;m=de/1e-4}
  const v=x=>it(x.toFixed(1));
  return{q:"Un livello con g<sub>J</sub> = "+g.s+" è immerso in un campo B = "+it(B)+" T. La separazione Zeeman tra due sottolivelli adiacenti (Δm<sub>J</sub> = 1) vale circa:",
  o:[pw(v(m),e)+" eV",pw(v(m),e+2)+" eV",pw(v(m),e-2)+" eV",pw(v(m*5),e)+" eV"],
  e:"ΔE = g<sub>J</sub>·μ<sub>B</sub>·B con μ<sub>B</sub> ≈ 5,8·10⁻⁵ eV/T → ΔE ≈ "+pw(v(m),e)+" eV. Scala da ricordare: lo Zeeman (~10⁻⁵–10⁻⁴ eV/T) è molto più piccolo di struttura fine (~10⁻³ eV) e livelli di Bohr (~eV): per questo si tratta come ultima perturbazione."}}},
{id:"g-curie",b:"mag",make(){
  const x0=rnd([1.2,2.4,6.2]), T2=rnd([75,100,150,600]);
  const x2=x0*300/T2; const v=x=>it(x.toFixed(2));
  return{q:"Un sale paramagnetico segue la legge di Curie e ha χ = "+pw(it(x0),-4)+" a 300 K. Quanto vale χ a "+T2+" K?",
  o:[pw(v(x2),-4),pw(v(x0*T2/300),-4),pw(it(x0),-4)+" (invariata)",pw(v(x0*Math.pow(300/T2,2)),-4)],
  e:"χ = C/T → χ₂ = χ₁·(T₁/T₂) = "+pw(it(x0),-4)+"·(300/"+T2+") ≈ "+pw(v(x2),-4)+". Raffreddando la suscettività aumenta (meno agitazione termica contro l'allineamento). Ricorda di verificare a ≪ 1 prima di usare Curie a bassa T."}}},
{id:"g-rich",b:"tra",make(){
  const d=rnd([{df:0.5,r:"10"},{df:1.0,r:"100"},{df:1.5,r:"1000"}]);
  const p1=rnd([1.8,2.0,2.5]); const p2=p1+d.df;
  return{q:"Due catodi sono alla stessa temperatura T = 2500 K (k<sub>B</sub>T ≈ 0,22 eV), con funzioni lavoro φ₁ = "+it(p1)+" eV e φ₂ = "+it(p2)+" eV. Il rapporto tra le correnti termoioniche J₁/J₂ è circa:",
  o:["~"+d.r+": il catodo 1 emette molto di più","~"+it(p2/p1<1.5?1.3:p2/p1).slice(0,4)+": poco più del rapporto delle φ","~1: alla stessa T emettono uguale","~1/"+d.r+": emette di più il catodo 2"],
  e:"Richardson–Dushman: J ∝ T²e^(−φ/k<sub>B</sub>T) → J₁/J₂ = e^((φ₂−φ₁)/k<sub>B</sub>T) = e^("+it(d.df)+"/0,22) ≈ "+d.r+". Piccole differenze di φ danno rapporti esponenzialmente grandi: per questo i filamenti si ricoprono di materiali a bassa φ (Cs: 1,8 eV)."}}},
{id:"g-weiss",b:"mag",make(){
  const t=rnd([{n:"il ferro",tc:1043},{n:"il nichel",tc:631},{n:"il cobalto",tc:1394},{n:"il gadolinio",tc:292}]);
  const B=1.488*t.tc; const m=B/1000;
  const v=x=>it(x.toFixed(1));
  return{q:"Per "+t.n+" (T<sub>C</sub> = "+t.tc+" K), il campo molecolare di Weiss B<sub>m</sub> ≈ k<sub>B</sub>T<sub>C</sub>/μ<sub>B</sub> vale circa:",
  o:[m>=1?pw(v(m),3)+" T":pw(v(B/100),2)+" T","~1 T, come il campo dipolare tra ioni vicini",m>=1?pw(v(m),0)+" T":pw(v(B/100),-1)+" T",m>=1?pw(v(m),6)+" T":pw(v(B/100),5)+" T"],
  e:"B<sub>m</sub> = k<sub>B</sub>T<sub>C</sub>/μ<sub>B</sub> = (8,6·10⁻⁵ · "+t.tc+")/(5,8·10⁻⁵) ≈ "+(B>=1000?pw(v(m),3):Math.round(B)+"")+" T: centinaia-migliaia di tesla, ~10³ volte il campo dipolare (~1 T). Nessuna interazione magnetica reale è così forte: il «campo molecolare» è in realtà l'interazione di scambio (elettrostatica + Pauli). Numerica ricorrente nei quiz."}}},
{id:"g-peff",b:"mag",make(){
  const t=rnd([{n:"V³⁺ (3d²)",u:2},{n:"Cr³⁺ (3d³)",u:3},{n:"Mn³⁺ (3d⁴)",u:4},{n:"Fe³⁺ (3d⁵)",u:5},{n:"Co²⁺ (3d⁷)",u:3},{n:"Ni²⁺ (3d⁸)",u:2},{n:"Cu²⁺ (3d⁹)",u:1}]);
  const S=t.u/2; const pv=2*Math.sqrt(S*(S+1));
  const v=x=>it(x.toFixed(2));
  return{q:"Il numero efficace di magnetoni di Bohr p<sub>eff</sub> per lo ione "+t.n+" in un sale (tenendo conto del quenching) vale:",
  o:[v(pv),v(Math.sqrt(S*(S+1))),v(2*S),v(2*pv)],
  e:"Ione 3d → campo cristallino &gt; spin-orbita → momento orbitale spento (L = 0): p<sub>eff</sub> = 2√(S(S+1)) = g<sub>s</sub>√(S(S+1)) con S = "+it(S)+" ("+t.u+" elettroni spaiati) → p<sub>eff</sub> ≈ "+v(pv)+". Usare J come per le terre rare è l'errore classico (per Cr³⁺ darebbe 0,77 contro 3,85 sperimentale)."}}},
{id:"g-ef",b:"tra",make(){
  const n=rnd([2.5,5.9,8.5,13.2,18.1]);
  const N=n*1e28, kF=Math.pow(3*Math.PI*Math.PI*N,1/3);
  const eF=(1.055e-34*1.055e-34*kF*kF)/(2*9.109e-31)/1.602e-19;
  const v=x=>it(x.toFixed(1));
  return{q:"Un metallo ha densità di elettroni di conduzione n = "+pw(it(n),28)+" m⁻³. Nel modello a elettroni liberi, quanto vale approssimativamente l'energia di Fermi? (ħ = 1,05·10⁻³⁴ J·s, m = 9,1·10⁻³¹ kg)",
  o:[v(eF)+" eV",v(2*eF)+" eV",v(eF/9.6)+" eV",v(eF/2)+" eV"],
  e:"Si parte da k<sub>F</sub> = (3π²n)<sup>1/3</sup> e si usa ε<sub>F</sub> = ħ²k<sub>F</sub>²/2m. Con n = "+pw(it(n),28)+" m⁻³ si ottiene ε<sub>F</sub> ≈ "+v(eF)+" eV. Errori tipici: dimenticare il fattore ½ (raddoppia il risultato) oppure omettere il coefficiente 3π² (lo divide per ≈ 9,6)."}}},
{id:"g-vf",b:"tra",make(){
  const ef=rnd([2.1,3.2,4.7,7.0,9.4]);
  const vF=Math.sqrt(2*ef*1.602e-19/9.109e-31);
  const v=x=>it(x.toFixed(2));
  return{q:"Gli elettroni di conduzione di un metallo hanno energia di Fermi ε<sub>F</sub> = "+it(ef)+" eV. Quanto vale la velocità degli elettroni sulla superficie di Fermi? (m = 9,1·10⁻³¹ kg)",
  o:[pw(v(vF/1e6),6)+" m/s",pw(v(vF/1e6/Math.SQRT2),6)+" m/s",pw(v(vF/1e6*2),6)+" m/s",pw(v(vF/1e6/10),5)+" m/s"],
  e:"Da ½mv<sub>F</sub>² = ε<sub>F</sub> segue v<sub>F</sub> = √(2ε<sub>F</sub>/m) ≈ "+pw(v(vF/1e6),6)+" m/s. È una velocità enorme che esiste anche a T = 0, imposta dal principio di Pauli: non va confusa con la velocità di deriva (~mm/s) né con quella termica classica."}}},
{id:"g-plasma",b:"tra",make(){
  const n=rnd([5.9,8.5,13.2,18.1]);
  const N=n*1e28;
  const wp=Math.sqrt(N*2.566e-38/(9.109e-31*8.854e-12));

  return{q:"Un metallo ha n = "+pw(it(n),28)+" m⁻³ elettroni di conduzione. Quanto vale l'energia del plasmone ħω<sub>p</sub>, e in quale regione dello spettro cade la soglia di trasparenza?",
  o:[v(E)+" eV, nell'ultravioletto",v(E/10)+" eV, nel visibile",v(E*10)+" eV, nei raggi X molli",v(E/100)+" eV, nell'infrarosso"],
  e:"ω<sub>p</sub> = √(ne²/mε₀) → ħω<sub>p</sub> ≈ "+v(E)+" eV. Sotto questa soglia ε<sub>r</sub> &lt; 0 e il metallo riflette (per questo è lucente); sopra diventa trasparente. Per i metalli la soglia cade sempre nell'ultravioletto, non nel visibile."}}},
{id:"g-cve",b:"tra",make(){
  const ef=rnd([2.1,3.2,4.7,7.0,9.4]), T=rnd([100,200,300]);
  const TF=ef*1.602e-19/1.381e-23;
  const ce=(Math.PI*Math.PI/2)*8.314*(T/TF);
  const v=x=>it(x.toFixed(3));
  return{q:"Un metallo ha energia di Fermi ε<sub>F</sub> = "+it(ef)+" eV. Usando c<sub>e</sub> = (π²/2)R·(T/T<sub>F</sub>), quanto vale il calore specifico elettronico molare a T = "+T+" K?",
  o:[v(ce)+" J/(mol·K)",v(ce*10)+" J/(mol·K)",it((3*8.314).toFixed(1))+" J/(mol·K)",v(ce/10)+" J/(mol·K)"],
  e:"T<sub>F</sub> = ε<sub>F</sub>/k<sub>B</sub> ≈ "+Math.round(TF)+" K, da cui c<sub>e</sub> ≈ "+v(ce)+" J/(mol·K). Va confrontato con il contributo reticolare di Dulong–Petit, 3R ≈ 24,9 J/(mol·K): quello elettronico è ~10⁻³ volte, perché solo la frazione T/T<sub>F</sub> di elettroni può eccitarsi (principio di Pauli)."}}},
{id:"g-tstar",b:"sol",make(){
  const ef=rnd([3.2,4.7,7.0]), TD=rnd([165,343,428]);
  const TF=ef*1.602e-19/1.381e-23;
  const ge=(Math.PI*Math.PI/2)*8.314/TF;
  const gr=(12*Math.pow(Math.PI,4)/5)*8.314/Math.pow(TD,3);
  const Ts=Math.sqrt(ge/gr);
  const v=x=>it(x.toFixed(2));
  return{q:"Un metallo ha ε<sub>F</sub> = "+it(ef)+" eV e temperatura di Debye Θ<sub>D</sub> = "+TD+" K. Sotto quale temperatura il contributo elettronico al calore specifico supera quello reticolare?",
  o:["T ≈ "+v(Ts)+" K","T ≈ "+v(Ts*10)+" K","T ≈ "+v(Ts/10)+" K","T ≈ "+TD+" K"],
  e:"Si eguagliano γ<sub>e</sub>T e γ<sub>r</sub>T³, cioè T* = √(γ<sub>e</sub>/γ<sub>r</sub>) con γ<sub>e</sub> = π²R/2T<sub>F</sub> e γ<sub>r</sub> = 12π⁴R/5Θ<sub>D</sub>³. Qui T* ≈ "+v(Ts)+" K: solo a pochi kelvin gli elettroni dominano, ed è lì che si misura γ dal grafico c/T contro T²."}}},
{id:"g-wf",b:"tra",make(){
  const rho=rnd([1.7,2.7,5.6,10.6]), T=rnd([200,300,400]);
  const k=2.44e-8*T/(rho*1e-8);
  const v=x=>it(x.toFixed(0));
  return{q:"Un metallo ha resistività ρ = "+pw(it(rho),-8)+" Ω·m alla temperatura T = "+T+" K. Secondo la legge di Wiedemann–Franz (L = 2,44·10⁻⁸ WΩ/K²), quanto vale la conducibilità termica?",
  o:[v(k)+" W/(m·K)",v(k/10)+" W/(m·K)",v(k*10)+" W/(m·K)",v(k/T)+" W/(m·K)"],
  e:"k = LσT = LT/ρ ≈ "+v(k)+" W/(m·K), valore tipico di un buon conduttore. La legge funziona perché lo stesso gas di elettroni trasporta carica e calore; nel numero di Lorenz si semplificano n, m e τ, restando solo costanti fondamentali."}}},
{id:"g-hall",b:"tra",make(){
  const n=rnd([2.5,5.9,8.5,13.2]);
  const RH=1/(n*1e28*1.602e-19);
  const v=x=>it(x.toFixed(2));
  return{q:"Su un metallo si misura un coefficiente di Hall R<sub>H</sub> = −"+pw(v(RH*1e11),-11)+" m³/C. Quanti portatori di carica per unità di volume ci sono, e di che segno sono?",
  o:[pw(it(n),28)+" m⁻³, negativi",pw(it(n),28)+" m⁻³, positivi",pw(it(n),26)+" m⁻³, negativi",pw(it(n*10),28)+" m⁻³, negativi"],
  e:"Da R<sub>H</sub> = −1/ne segue n = 1/(|R<sub>H</sub>|e) ≈ "+pw(it(n),28)+" m⁻³, circa un elettrone per atomo. Il segno negativo indica portatori di carica negativa: nei metalli in cui R<sub>H</sub> risulta positivo (Al, Be) la conduzione è dominata dalle lacune, fatto spiegabile solo con la teoria delle bande."}}},
{id:"g-bragg",b:"sol",make(){
  const a=rnd([0.36,0.41,0.54]), hkl=rnd([{s:"(111)",v:3},{s:"(200)",v:4},{s:"(220)",v:8}]);
  const lam=0.154, d=a/Math.sqrt(hkl.v);
  const th=Math.asin(lam/(2*d))*180/Math.PI;
  const v=x=>it(x.toFixed(1));
  return{q:"Un cristallo cubico di lato a = "+it(a)+" nm viene analizzato con raggi X di lunghezza d'onda λ = 0,154 nm. A quale angolo θ si osserva la riflessione del primo ordine sui piani "+hkl.s+"?",
  o:["θ ≈ "+v(th)+"°","θ ≈ "+v(2*th)+"°","θ ≈ "+v(th/2)+"°","θ ≈ "+v(90-th)+"°"],
  e:"d<sub>hkl</sub> = a/√(h²+k²+l²) = "+it(+d.toFixed(3))+" nm; da nλ = 2d·senθ con n = 1 si ricava θ ≈ "+v(th)+"°. Attenzione: l'angolo di Bragg si misura rispetto al PIANO, non rispetto alla normale, e l'angolo di deviazione del fascio vale 2θ."}}},
{id:"g-msat",b:"mag",make(){
  const t=rnd([{n:"Cr³⁺ (3d³)",S:1.5},{n:"Fe³⁺ (3d⁵)",S:2.5},{n:"Ni²⁺ (3d⁸)",S:1},{n:"Gd³⁺ (4f⁷)",S:3.5}]);
  const nio=rnd([1.2,2.8,5.0]);
  const M=nio*1e27*2*t.S*9.274e-24;
  const v=x=>it(x.toFixed(2));
  return{q:"Un sale paramagnetico contiene "+pw(it(nio),27)+" ioni "+t.n+" per m³. A temperatura criogenica e campo intenso tutti i momenti si allineano: quanto vale la magnetizzazione di saturazione? (μ<sub>B</sub> = 9,27·10⁻²⁴ J/T)",
  o:[pw(v(M/1e4),4)+" A/m",pw(v(M/1e4/2),4)+" A/m",pw(v(M/1e4*2),4)+" A/m",pw(v(M/1e4/Math.sqrt(t.S*(t.S+1))*t.S),4)+" A/m"],
  e:"Per gli ioni 3d il momento orbitale è spento (quenching), quindi g = 2, J = S e M<sub>sat</sub> = n·g·μ<sub>B</sub>·S = n·2μ<sub>B</sub>S ≈ "+pw(v(M/1e4),4)+" A/m. ⚠ Alla saturazione si usa S (momenti allineati), non √(S(S+1)) che vale invece nel regime lineare di Curie."}}},
{id:"g-schottky",b:"sta",make(){
  const D=rnd([0.5,1.2,4.0,25]);
  const Tm=0.417*D*1e-3*1.602e-19/1.381e-23;
  const v=x=>it(x.toFixed(1));
  return{q:"Un sistema a due livelli separati da un gap Δ = "+it(D)+" meV è in equilibrio con un termostato. A quale temperatura il calore specifico presenta il massimo (anomalia di Schottky)?",
  o:["T ≈ "+v(Tm)+" K","T ≈ "+v(Tm*2.4)+" K","T ≈ "+v(Tm/2.4)+" K","T ≈ "+v(Tm*10)+" K"],
  e:"Il massimo cade a k<sub>B</sub>T ≈ 0,42Δ, cioè T ≈ "+v(Tm)+" K. Il calore specifico si annulla sia a T → 0 (gap insuperabile) sia a T → ∞ (livelli equipopolati): il massimo intermedio è la firma sperimentale della presenza di un gap."}}},
{id:"g-boltz",b:"sta",make(){
  const D=rnd([25,50,100,200]), T=rnd([150,300,600]);
  const g=rnd([{s:"il livello alto degenere due volte",r:2},{s:"il livello alto degenere tre volte",r:3}]);
  const x=D/(0.08617*T), R=g.r*Math.exp(-x);
  const v=y=>it(Number(y.toPrecision(3)).toString().replace(".",","));
  return{q:"Due livelli di un atomo distano ΔE = "+D+" meV e hanno "+g.s+". Qual è il rapporto fra le popolazioni del livello alto e di quello basso a T = "+T+" K? (k<sub>B</sub> = 8,62·10⁻⁵ eV/K)",
  o:[v(R),v(Math.exp(-x)),v(g.r*Math.exp(x)),v(g.r*x)],
  e:"N₂/N₁ = (g₂/g₁)·e^(−ΔE/k<sub>B</sub>T). Con k<sub>B</sub>T = "+it((0.08617*T).toFixed(1))+" meV si ottiene "+v(R)+". Dimenticare le degenerazioni o invertire il segno nell'esponente sono gli errori più comuni; il rapporto deve sempre risultare minore di g₂/g₁."}}},
{id:"g-larmor",b:"mag",make(){
  const B=rnd([0.5,1.0,2.0,5.0]);
  const w=1.602e-19*B/(2*9.109e-31);
  const v=x=>it(x.toFixed(2));
  return{q:"Un atomo è immerso in un campo magnetico B = "+it(B)+" T. Con quale pulsazione precedono i suoi momenti magnetici orbitali attorno alla direzione del campo?",
  o:[pw(v(w/1e10),10)+" rad/s",pw(v(w/1e10*2),10)+" rad/s",pw(v(w/1e10/2),10)+" rad/s",pw(v(w/1e10/10),9)+" rad/s"],
  e:"Precessione di Larmor: ω<sub>L</sub> = eB/2m ≈ "+pw(v(w/1e10),10)+" rad/s. Il fattore 2 al denominatore vale per il momento ORBITALE (g<sub>l</sub> = 1); per lo spin, con g<sub>s</sub> ≈ 2, la pulsazione raddoppia. La precessione da sola non allinea i momenti: per farlo serve dissipazione."}}},
{id:"g-debyecv",b:"sol",make(){
  const TD=rnd([165,343,428,2200]), T=Math.round(TD/rnd([10,12,15]));
  const c=(12*Math.pow(Math.PI,4)/5)*8.314*Math.pow(T/TD,3);
  const v=x=>it(Number(x.toPrecision(3)).toString().replace(".",","));
  return{q:"Un solido ha temperatura di Debye Θ<sub>D</sub> = "+TD+" K. Quanto vale il calore specifico molare reticolare a T = "+T+" K, ben al di sotto di Θ<sub>D</sub>?",
  o:[v(c)+" J/(mol·K)",v(c*3)+" J/(mol·K)",v(c/3)+" J/(mol·K)",it((3*8.314).toFixed(1))+" J/(mol·K)"],
  e:"Nel limite T ≪ Θ<sub>D</sub> vale c = (12π⁴/5)R(T/Θ<sub>D</sub>)³ ≈ "+v(c)+" J/(mol·K). L'andamento cubico viene dai fononi acustici a bassa frequenza, sempre eccitabili; il valore di Dulong–Petit 3R = 24,9 J/(mol·K) si raggiunge invece solo per T ≳ Θ<sub>D</sub>."}}},
];
// ============ TEORIA (ripasso rapido) ============
const THEORY=[
{b:"ato",body:"<ul>"+
"<li><b>Campo centrale / Hartree</b>: repulsione e–e → potenziale medio autoconsistente V(r); Hartree–Fock aggiunge l'antisimmetria (determinante di Slater → scambio). Screening: gli orbitali s penetrano → E(3s) &lt; E(3p) &lt; E(3d).</li>"+
"<li><b>Moseley</b>: 1/λ ∝ (Z−a)² per le righe X (lacune in shell profonde).</li>"+
"<li><b>Termini <sup>2S+1</sup>L<sub>J</sub></b> — Hund: ① S max ② L max ③ J = |L−S| se subshell &lt; metà, J = L+S se &gt; metà. Elettroni equivalenti: tabella dei microstati (C 2p²: ¹D, ³P, ¹S; fond. ³P₀). Semipiena (3d⁵): L = 0 → ⁶S₅/₂. Degenerazione livello: 2J+1.</li>"+
"<li><b>LS vs jj</b>: LS per Z basso (V<sub>ee</sub> ≫ H<sub>SO</sub>); jj per Z ≳ 50 (Sn, Au, Pb). Regola degli intervalli: E(J)−E(J−1) ∝ J.</li>"+
"<li><b>Landé</b>: g<sub>J</sub> = 1 + [J(J+1)−L(L+1)+S(S+1)]/[2J(J+1)]; singoletti → 1; L = 0 → 2.</li>"+
"<li><b>Zeeman</b>: E = g<sub>J</sub>m<sub>J</sub>μ<sub>B</sub>B (μ<sub>B</sub>B ≈ 5,8·10⁻⁵ eV/T). Normale (singoletti): 3 righe. Anomalo (g diversi): più righe non equispaziate (Na: 4). <b>Paschen–Back</b> (B &gt; B<sub>int</sub>): E = (m<sub>l</sub>+2m<sub>s</sub>)μ<sub>B</sub>B, torna a 3 righe.</li>"+
"<li><b>Selezione dipolo</b>: ΔS = 0; ΔL = 0,±1 (no 0→0); ΔJ = 0,±1 (no 0→0); Δm<sub>J</sub> = 0,±1; parità cambia.</li>"+
"<li><b>Stark</b>: fondamentale → solo quadratico (E⁽²⁾ &lt; 0, polarizzabilità); n = 2 idrogeno → lineare ±3eεa₀ (ibridi sp<sub>z</sub> con dipolo permanente).</li>"+
"<li><b>Molecole</b>: LCAO ψ± → legante (carica tra i nuclei) / antilegante (nodo). Heitler–London: E± = 2E₁ₛ + (J±K)/(1±I²): lo <b>scambio K</b> fa il legame (singoletto). MO = cov+ionico a peso uguale; CI → ~20% ionico. <b>Born–Oppenheimer</b>: m/M ≪ 1, E<sub>el</sub>(R) potenziale per i nuclei. Scale: elettronica eV ≫ vibrazionale ħω₀ (0,1 eV, Δv = ±1) ≫ rotazionale ħ²/2I (meV, ΔK = ±1). Franck–Condon: transizioni verticali.</li>"+
"</ul>"},
{b:"sta",body:"<ul>"+
"<li><b>Liouville</b>: dρ/dt = 0 lungo il flusso → equilibrio con ρ costante sul guscio di energia. <b>Ergodicità</b>: media temporale = media d'ensemble. <b>Teorema H</b>: dH/dt ≤ 0 → irreversibilità.</li>"+
"<li><b>Microcanonico</b> (N,V,E): microstati equiprobabili, S = k<sub>B</sub>lnΓ, ω₀ = h per grado di libertà (Heisenberg). <b>Stirling</b>: ln N! ≈ N lnN − N. <b>Gibbs</b>: fattore 1/N! per indistinguibilità → S estensiva (Sackur–Tetrode). Attenzione: oscillatori/spin su reticolo = distinguibili, niente 1/N!.</li>"+
"<li><b>Canonico</b> (N,V,T): P<sub>i</sub> = e^(−βE<sub>i</sub>)/Z; F = −k<sub>B</sub>T lnZ; U = −∂lnZ/∂β; S = −k<sub>B</sub>ΣPlnP; μ = ∂F/∂N. Gas ideale: Z = [V(2πmk<sub>B</sub>T/h²)³ᐟ²]<sup>N</sup>/N!.</li>"+
"<li><b>Equipartizione</b>: ½k<sub>B</sub>T per termine quadratico (limite classico). Oscillatore quantistico: U = ħω/2 + ħω/(e^(βħω)−1); c<sub>V</sub> → 0 esponenzialmente (discretizzazione).</li>"+
"<li><b>Due livelli ±ε</b>: Z₁ = 2cosh(βε); U = −Nε·tanh(βε); <b>Schottky</b>: massimo di c a k<sub>B</sub>T ≈ 0,42Δ. <b>T negative</b>: spettro limitato sopra → inversione di popolazione (MASER).</li>"+
"<li><b>Maxwell</b>: w(v) ∝ v²e^(−βmv²/2); v<sub>max</sub> = √(2k<sub>B</sub>T/m) &lt; ⟨v⟩ &lt; √⟨v²⟩. Barometrica: n(z) ∝ e^(−βmgz).</li>"+
"<li><b>Grancanonico</b> (V,T,μ): fugacità z = e^(βμ); Ω = −PV = −k<sub>B</sub>TlnZ<sub>GC</sub>. <b>FD</b>: n = 1/(e^(β(ε−μ))+1) ≤ 1; f(μ) = ½. <b>BE</b>: n = 1/(e^(β(ε−μ))−1), μ &lt; ε₀; fotoni/fononi μ = 0. <b>Limite classico</b>: ⟨n⟩ ≪ 1 ⇔ nλ³<sub>T</sub> ≪ 1 → MB.</li>"+
"<li><b>Buca 1D</b> (E<sub>n</sub> = εn²): T→0: U→ε, S→0 (3° principio); T→∞: Z→(L/h)√(2πmk<sub>B</sub>T), U = ½k<sub>B</sub>T (classico). Gas bipartito: μ₁ = μ₂ ⟺ n₁ = n₂.</li>"+
"</ul>"},
{b:"tra",body:"<ul>"+
"<li><b>Drude</b> — 4 assunzioni: libero+indipendente; urti istantanei con gli ioni (anelastici); dP = dt/τ; termalizzazione solo negli urti. σ = ne²τ/m (τ ~ 10⁻¹⁴ s); dp/dt = F − p/τ; v<sub>d</sub> ≈ 10⁻³ m/s ≪ v<sub>T</sub> ≈ 10⁵ m/s.</li>"+
"<li><b>Poisson</b>: P(t) = e^(−t/τ)/τ; ⟨t⟩ = τ ma <b>⟨t²⟩ = 2τ²</b>. Joule: P = σE² = J·E (il reticolo assorbe). <b>Hall</b>: R<sub>H</sub> = −1/ne (Al positivo → lacune → bande).</li>"+
"<li><b>Plasma</b>: ε<sub>r</sub> = 1 − ω<sub>p</sub>²/ω², ω<sub>p</sub> = √(ne²/mε₀); ω &lt; ω<sub>p</sub> riflette (metalli lucenti), ω &gt; ω<sub>p</sub> trasparente; plasmoni ħω<sub>p</sub> ~ 10–16 eV (EELS).</li>"+
"<li><b>Wiedemann–Franz</b>: L = k/σT; Drude «giusto» per caso (c<sub>V</sub> ×100 troppo grande, v² ×100 troppo piccola); Sommerfeld: L = (π²/3)(k<sub>B</sub>/e)² = 2,44·10⁻⁸ WΩ/K². <b>Seebeck</b>: E = Q∇T, Q ∝ c<sub>V</sub>.</li>"+
"<li><b>Sommerfeld</b>: k<sub>F</sub> = (3π²n)¹ᐟ³; ε<sub>F</sub> = ħ²k<sub>F</sub>²/2m ≈ 2–10 eV; T<sub>F</sub> ~ 10⁴–10⁵ K; U₀/N = (3/5)ε<sub>F</sub>; P = (2/5)nε<sub>F</sub>. DOS: g(ε) ∝ √ε; <b>g(ε<sub>F</sub>) = (3/2)N/ε<sub>F</sub></b>.</li>"+
"<li><b>Espansione</b> (potenze pari: −∂f/∂ε simmetrica): μ(T) = ε<sub>F</sub>[1−(π²/12)(T/T<sub>F</sub>)²]; U = U₀+(π²/6)(k<sub>B</sub>T)²g(ε<sub>F</sub>); <b>c<sub>V</sub> = γT</b>, γ = (π²/3)k<sub>B</sub>²g(ε<sub>F</sub>): solo la frazione T/T<sub>F</sub> si eccita (Pauli). Grafico c/T vs T²: intercetta γ, pendenza Debye; γ<sub>exp</sub>/γ<sub>th</sub> = m*/m.</li>"+
"<li><b>Termoionico</b>: serve ε &gt; ε<sub>v</sub> = μ+φ (φ ≈ 4–5 eV); coda FD ≈ Boltzmann; <b>Richardson–Dushman J = AT²e^(−φ/k<sub>B</sub>T)</b>; misura di φ: ln(J/T²) vs 1/T. Carica spaziale: I ∝ V³ᐟ² indipendente da T. Conducibilità semiclassica: la sfera di Fermi trasla di −eEτ/ħ → σ identica a Drude ma conducono solo gli stati a ε<sub>F</sub>.</li>"+
"</ul>"},
{b:"sol",body:"<ul>"+
"<li><b>Bravais</b>: R = Σn<sub>i</sub>a<sub>i</sub>, panorama identico; 14 in 3D (5 in 2D). Struttura = Bravais + base (honeycomb = triangolare + 2). <b>Wigner–Seitz</b>: piani bisettori; unica, tutta la simmetria. Coordinazione: SC 6, BCC 8, FCC 12; f: 0,52 / 0,68 / 0,74; diamante (FCC+base ¼ diagonale): 4 vicini, f = 0,34.</li>"+
"<li><b>Miller (hkl)</b>: K = hb₁+kb₂+lb₃ ⊥ piani; intercette ∝ 1/h:1/k:1/l; <b>d = 2π/|K|</b>; cubici: d = a/√(h²+k²+l²).</li>"+
"<li><b>Reciproco</b>: b₁ = 2π(a₂×a₃)/V, a<sub>i</sub>·b<sub>j</sub> = 2πδ; SC↔SC, <b>FCC↔BCC</b>. 1ª BZ = W-S del reciproco.</li>"+
"<li><b>Diffrazione</b>: von Laue Δk = G ⟺ Bragg nλ = 2d·senθ. E<sub>diff</sub> ∝ TF della densità elettronica; <b>fattore di struttura</b> F(G) = Σf<sub>s</sub>e^(−iG·r<sub>s</sub>): BCC estingue h+k+l dispari; FCC richiede h,k,l stessa parità. Polveri: anelli, restano i d<sub>hkl</sub>.</li>"+
"<li><b>Catena 1D</b>: ω = ω<sub>max</sub>|sin(ka/2)|; k→0 lineare (suono); bordo zona: onda stazionaria, λ<sub>min</sub> = 2a, λ<sub>max</sub> = L. <b>Biatomica</b>: branca acustica (in fase) + ottica (controfase, IR), gap al bordo. Born–von Karman: N modi per branca. <b>Fononi = bosoni con μ = 0</b>.</li>"+
"<li><b>Calore specifico</b>: Dulong–Petit 3R ad alta T; Einstein (ω fissa) → crollo esponenziale; <b>Debye</b> (g(ω) ∝ ω², taglio ω<sub>D</sub>) → c ∝ T³. Nei metalli: c = γT + AT³.</li>"+
"<li><b>DOS elettroni</b>: g(ε) = g(k)/(dε/dk): 3D √ε, 2D costante (μ fermo!), 1D 1/√ε; grafene (lineare 2D): g ∝ ε. <b>Bloch</b>: ψ = e^(ikr)u(r) → bande, gap ai bordi BZ; <b>massa efficace</b> 1/m* = ε″(k)/ħ²; m* &lt; 0 in cima → lacune. Semimetallo 2 bande: n<sub>e</sub> = n<sub>l</sub> fissa E<sub>F</sub>.</li>"+
"</ul>"},
{b:"mag",body:"<ul>"+
"<li><b>Classificazione</b>: dia χ &lt; 0 piccola, indip. da T; para χ = C/T; ferro χ enorme, isteresi. F = ∇(μ·B): conta il gradiente. μ<sub>B</sub> = eħ/2m ≈ 5,8·10⁻⁵ eV/T. Einstein–de Haas: il ferromagnetismo è spin (γ = e/m).</li>"+
"<li><b>Larmor</b>: precessione ω<sub>L</sub> = eB/2m → diamagnetismo χ = −(μ₀ne²/6m)Σ⟨r²⟩. <b>Bohr–van Leeuwen</b>: classicamente M = 0 (dia e para si cancellano): il magnetismo è quantistico.</li>"+
"<li><b>Paramagnetismo</b>: E = g<sub>J</sub>m<sub>J</sub>μ<sub>B</sub>B → M = nμ<sub>B</sub>g<sub>J</sub>J·B<sub>J</sub>(a), a = g<sub>J</sub>μ<sub>B</sub>JB/k<sub>B</sub>T. a ≪ 1 (RT: ~10⁻³) → <b>Curie</b> χ = nμ₀⟨μ⟩²/3k<sub>B</sub>T, p<sub>eff</sub> = g<sub>J</sub>√(J(J+1)); a ≫ 1 → saturazione M<sub>sat</sub> = nμ<sub>B</sub>g<sub>J</sub>J (B alti + T criogeniche). B<sub>J</sub> → Langevin per J→∞; curve normalizzate distinte → J quantizzato.</li>"+
"<li><b>4f vs 3d</b>: terre rare → 4f interno schermato → ione libero, p<sub>eff</sub> = g<sub>J</sub>√(J(J+1)) (Gd³⁺ 7,94 ✓; eccezioni Sm, Eu: eccitato a ~k<sub>B</sub>T). Metalli 3d → campo cristallino &gt; SO → <b>quenching</b>: autostati reali, ⟨L<sub>z</sub>⟩ = 0, <b>p<sub>eff</sub> = 2√(S(S+1))</b> (Cr³⁺ 3,87 ✓); 3d⁵ ha già L = 0. Van Vleck: J = 0 ma χ &gt; 0 al 2° ordine.</li>"+
"<li><b>Pauli</b>: sottobande di spin shiftate ∓μ<sub>B</sub>B → χ<sub>P</sub> = μ₀μ<sub>B</sub>²g(ε<sub>F</sub>) = (T/T<sub>F</sub>)χ<sub>Curie</sub>: piccola e indip. da T. <b>Landau</b>: χ<sub>L</sub> = −⅓χ<sub>P</sub>.</li>"+
"<li><b>Ferro</b> — 4 fatti: isteresi; transizione a T<sub>C</sub>; Curie–Weiss χ = C/(T−T<sub>C</sub>); M spontanea. Campo molecolare B<sub>m</sub> = k<sub>B</sub>T<sub>C</sub>/μ<sub>B</sub> ~ 10³ T ≫ dipolare (~1 T) → <b>scambio</b> (elettrostatico + Pauli): H = −(2J′/ħ²)S<sub>i</sub>·S<sub>j</sub>; Weiss ⟺ Heisenberg in campo medio (λ ≈ 10³). <b>Bethe–Slater</b>: J′(d): Fe/Co/Ni &gt; 0, Mn &lt; 0 (Heusler: Mn distanziato → ferro). <b>Domini</b>: minimizzano l'energia magnetostatica; pareti di Bloch (scambio vs anisotropia); Barkhausen; duri (H<sub>c</sub> grande) vs dolci.</li>"+
"</ul>"},
];
// ============ STATO PERSISTENTE ============
const LSKEY="sdm_quiz_v1";
function defState(){return{seen:{},err:{},stats:{},hist:[]}}
let S=(function(){try{const x=JSON.parse(localStorage.getItem(LSKEY));return(x&&x.seen)?x:defState()}catch(e){return defState()}})();
function save(){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}}
function bst(b){return S.stats[b]||(S.stats[b]={n:0,r:0,w:0})}
function recRight(q){S.seen[q.id]=(S.seen[q.id]||0)+1;const st=bst(q.b);st.n++;st.r++;
  if(S.err[q.id]){S.err[q.id].k=(S.err[q.id].k||0)+1;if(S.err[q.id].k>=2)delete S.err[q.id]}save()}
function recWrong(q){S.seen[q.id]=(S.seen[q.id]||0)+1;const st=bst(q.b);st.n++;st.w++;
  S.err[q.id]={w:(S.err[q.id]?S.err[q.id].w:0)+1,k:0};save()}
function recBlank(q){S.seen[q.id]=(S.seen[q.id]||0)+1;bst(q.b).n++;
  if(!S.err[q.id])S.err[q.id]={w:0,k:0};else S.err[q.id].k=0;save()}

// ============ POOL E CAMPIONAMENTO ============
const app=document.getElementById("app");
const POOL=DB.map(x=>({id:x.id,b:x.b,x:x.x,src:x})).concat(GENS.map(g=>({id:g.id,b:g.b,gen:g})));
const NEXAM=POOL.filter(p=>p.x).length;
function inst(p){
  const base=p.gen?p.gen.make():{q:p.src.q,o:p.src.o.slice(),c:p.src.c,e:p.src.e};
  const c0=base.c||0, idx=base.o.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=idx[i];idx[i]=idx[j];idx[j]=t}
  return{id:p.id,b:p.b,x:p.x,q:base.q,o:idx.map(i=>base.o[i]),c:idx.indexOf(c0),e:base.e}}
function sample(block,n,excl){
  excl=excl||[];
  const cand=POOL.filter(p=>(block==="all"||(block==="exam"?p.x:p.b===block))&&excl.indexOf(p.id)<0)
    .map(p=>({p:p,w:((S.seen[p.id]||0)+Math.random()*2.5)*(p.gen?0.28:1)}))
    .sort((a,b)=>a.w-b.w).map(x=>x.p);
  return cand.slice(0,n)}
const LETT=["A","B","C","D"];
function h(html){app.innerHTML=html;window.scrollTo(0,0)}
function pillB(b){return '<span class="pill pen">'+BLOCKS[b]+'</span>'}
function pillX(q){return q.x?' <span class="pill amber">già uscita all’appello</span>':''}

// ============ HOME ============
function renderHome(){
  const nerr=Object.keys(S.err).length;
  let tot=0,r=0,w=0;for(const b in S.stats){tot+=S.stats[b].n;r+=S.stats[b].r;w+=S.stats[b].w}
  const acc=(r+w)>0?Math.round(100*r/(r+w)):null;
  h('<div class="topbar"><div><h1>Struttura della Materia</h1>'+
  '<div class="sub">Quiz a crocette in stile appello · teoria ed esercitazioni</div></div></div>'+
  (tot>0?'<div class="sub" style="margin-bottom:4px">'+tot+' risposte date'+(acc!==null?' · precisione '+acc+'%':'')+'</div>':'')+
  '<div class="menu">'+
  '<button class="mbtn" onclick="startEsame()"><div><div class="t">Simulazione d’appello</div><div class="d">10 domande, 2 per blocco, come il quiz reale: puoi lasciare in bianco, correzione alla consegna</div></div><span class="n pill pen">10</span></button>'+
  '<button class="mbtn" onclick="startTrain(\'exam\')"><div><div class="t">Domande d’appello</div><div class="d">Solo le crocette realmente uscite negli appelli precedenti, trascritte dai questionari</div></div><span class="n pill amber">'+NEXAM+'</span></button>'+
  '<button class="mbtn" onclick="renderTrainMenu()"><div><div class="t">Allenamento libero</div><div class="d">Domande a raffica con correzione immediata, tutte o per singolo blocco</div></div></button>'+
  '<button class="mbtn" onclick="startErr()"><div><div class="t">Ripasso errori</div><div class="d">Le domande sbagliate tornano finché non le azzecchi 2 volte</div></div>'+
  (nerr>0?'<span class="n pill red">'+nerr+'</span>':'<span class="n pill ok">0</span>')+'</button>'+
  '<button class="mbtn" onclick="renderTheory()"><div><div class="t">Teoria lampo</div><div class="d">Schede di ripasso per blocco: formule e concetti che finiscono nei quiz</div></div></button>'+
  '<button class="mbtn" onclick="renderStats()"><div><div class="t">Statistiche</div><div class="d">Precisione per blocco e storico delle simulazioni</div></div></button>'+
  '</div><div class="footer-note">'+POOL.length+' domande in archivio: '+GENS.length+' generatori numerici a valori sempre nuovi e '+NEXAM+' crocette realmente uscite agli appelli.<br>I progressi restano salvati su questo dispositivo.</div>')}

// ============ SIMULAZIONE D'APPELLO ============
let sess=null;
function startEsame(){
  let qs=[];for(const b in BLOCKS)qs=qs.concat(sample(b,2));
  for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=qs[i];qs[i]=qs[j];qs[j]=t}
  sess={mode:"esame",qs:qs.map(inst),ans:qs.map(()=>null),i:0};renderExamQ()}
function renderExamQ(){
  const k=sess.i,q=sess.qs[k],a=sess.ans[k],n=sess.qs.length;
  let chips='<div class="chips">';
  for(let j=0;j<n;j++)chips+='<button class="chip'+(j===k?' cur':(sess.ans[j]!==null?' done':''))+'" onclick="jumpQ('+j+')">'+(j+1)+'</button>';
  chips+='</div>';
  let opts='<div class="opts">';
  q.o.forEach((o,j)=>{opts+='<button class="opt'+(a===j?' sel':'')+'" onclick="selOpt('+j+')"><span class="lett">'+LETT[j]+'</span><span>'+o+'</span></button>'});
  opts+='</div>';
  h('<div class="topbar"><button class="back" onclick="quitExam()">← Esci</button><span class="qnum">Domanda '+(k+1)+' / '+n+'</span></div>'+
  '<div class="progress"><i style="width:'+Math.round(100*(k+1)/n)+'%"></i></div>'+
  '<div class="card qcard">'+pillB(q.b)+pillX(q)+'<div class="qtext">'+q.q+'</div>'+opts+
  '<div class="sub" style="margin-top:10px">Tocca di nuovo la risposta scelta per deselezionarla (lascia in bianco).</div></div>'+chips+
  '<div class="bottombar"><div class="inner">'+
  '<button class="btn ghost" onclick="prevQ()" '+(k===0?'disabled':'')+'>←</button>'+
  (k<n-1?'<button class="btn primary" onclick="nextQ()">Avanti</button>':'<button class="btn primary" onclick="grade()">Consegna</button>')+
  '</div></div>')}
function selOpt(j){sess.ans[sess.i]=(sess.ans[sess.i]===j?null:j);renderExamQ()}
function jumpQ(j){sess.i=j;renderExamQ()}
function nextQ(){if(sess.i<sess.qs.length-1)sess.i++;renderExamQ()}
function prevQ(){if(sess.i>0)sess.i--;renderExamQ()}
function quitExam(){if(confirm("Uscire dalla simulazione? Le risposte andranno perse."))renderHome()}
function grade(){
  const bl=sess.ans.filter(a=>a===null).length;
  if(bl>0&&!confirm("Hai "+bl+" domande in bianco. Consegnare comunque?"))return;
  let g=0,s=0,b=0;
  sess.qs.forEach((q,k)=>{const a=sess.ans[k];
    if(a===null){b++;recBlank(q)}else if(a===q.c){g++;recRight(q)}else{s++;recWrong(q)}});
  S.hist.unshift({d:Date.now(),g:g,s:s,b:b});S.hist=S.hist.slice(0,15);save();
  renderResult(g,s,b)}
function renderResult(g,s,b){
  const verd=g>=8?["ok","Livello da appello superato. Così all’esame porti a casa il quiz."]:
    g>=6?["amber","Quasi: la sufficienza è vicina, ma gli errori qui sotto vanno chiusi."]:
    ["red","C’è da lavorare: errori e bianche sono finiti nel Ripasso errori."];
  let rev='<div class="rev"><div class="label" style="margin-bottom:8px">Correzione</div>';
  sess.qs.forEach((q,k)=>{const a=sess.ans[k];const okq=a===q.c;
    let opts='<div class="opts">';
    q.o.forEach((o,j)=>{let cl="opt dim";if(j===q.c)cl="opt right";else if(a===j)cl="opt wrong";
      opts+='<div class="'+cl+'"><span class="lett">'+LETT[j]+'</span><span>'+o+'</span></div>'});
    opts+='</div>';
    rev+='<div class="card qcard"><div class="qhead"><span class="qnum">'+(k+1)+'.'+(q.x?' <span class="pill amber">d’appello</span>':'')+'</span>'+
    (a===null?'<span class="pill amber">In bianco</span>':okq?'<span class="pill ok">Giusta</span>':'<span class="pill red">Sbagliata</span>')+'</div>'+
    '<div class="qtext" style="font-size:15.5px">'+q.q+'</div>'+opts+
    (okq?'':'<div class="explain"><span class="label">Ripasso</span>'+q.e+'</div>')+'</div>'});
  rev+='</div>';
  h('<div class="topbar"><h2>Esito simulazione</h2></div>'+
  '<div class="score">'+
  '<div class="scorebox" style="background:var(--okbg);color:var(--ok)"><div class="v">'+g+'</div><div class="k">Giuste</div></div>'+
  '<div class="scorebox" style="background:var(--redbg);color:var(--red)"><div class="v">'+s+'</div><div class="k">Sbagliate</div></div>'+
  '<div class="scorebox" style="background:var(--amberbg);color:var(--amber)"><div class="v">'+b+'</div><div class="k">Bianche</div></div></div>'+
  '<div class="card verdict"><b>'+g+'/10.</b> '+verd[1]+'</div>'+rev+
  '<div class="bottombar"><div class="inner"><button class="btn ghost" onclick="renderHome()">Home</button>'+
  '<button class="btn primary" onclick="startEsame()">Nuova simulazione</button></div></div>')}

// ============ ALLENAMENTO / RIPASSO ERRORI ============
let tr=null;
function renderTrainMenu(){
  let btns='<button class="mbtn" onclick="startTrain(\'all\')"><div><div class="t">Tutti i blocchi</div><div class="d">Mix completo, pesato sulle domande che hai visto meno</div></div></button>';
  for(const b in BLOCKS){const st=S.stats[b];
    btns+='<button class="mbtn" onclick="startTrain(\''+b+'\')"><div><div class="t">'+BLOCKS[b]+'</div>'+
    '<div class="d">'+POOL.filter(p=>p.b===b).length+' domande'+(st&&(st.r+st.w)>0?' · precisione '+Math.round(100*st.r/(st.r+st.w))+'%':'')+'</div></div></button>'}
  h('<div class="topbar"><button class="back" onclick="renderHome()">← Home</button></div>'+
  '<h2>Allenamento libero</h2><div class="sub">Correzione immediata dopo ogni risposta.</div>'+
  '<div class="menu">'+btns+'</div>')}
function startTrain(block){tr={mode:"train",block:block,n:0,r:0,last:[]};trainNext()}
function startErr(){
  const ids=Object.keys(S.err);
  if(ids.length===0){h('<div class="topbar"><button class="back" onclick="renderHome()">← Home</button></div>'+
    '<div class="card empty"><h2>Nessun errore da ripassare</h2><div class="sub" style="margin-top:6px">Le domande sbagliate (o lasciate in bianco) compariranno qui e usciranno solo dopo 2 risposte giuste di fila.</div></div>');return}
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=ids[i];ids[i]=ids[j];ids[j]=t}
  tr={mode:"err",queue:ids,n:0,r:0};trainNext()}
function trainNext(){
  let p=null;
  if(tr.mode==="err"){
    while(tr.queue.length&&!POOL.some(x=>x.id===tr.queue[0]))tr.queue.shift();
    if(tr.queue.length===0){
      h('<div class="topbar"><h2>Ripasso completato</h2></div>'+
      '<div class="card verdict">Giro finito: <b>'+tr.r+'/'+tr.n+'</b>. Restano <b>'+Object.keys(S.err).length+'</b> domande nel mazzo errori (ne escono dopo 2 giuste di fila).</div>'+
      '<div class="bottombar"><div class="inner"><button class="btn ghost" onclick="renderHome()">Home</button>'+
      (Object.keys(S.err).length>0?'<button class="btn primary" onclick="startErr()">Altro giro</button>':'<button class="btn primary" onclick="startEsame()">Simulazione</button>')+
      '</div></div>');return}
    const nid=tr.queue.shift();p=POOL.find(x=>x.id===nid)}
  else{p=sample(tr.block,1,tr.last)[0]||sample(tr.block,1)[0];tr.last.push(p.id);if(tr.last.length>8)tr.last.shift()}
  tr.q=inst(p);tr.answered=false;renderTrainQ(null)}
function renderTrainQ(picked){
  const q=tr.q,done=picked!==null;
  const title=tr.mode==="err"?"Ripasso errori":(tr.block==="exam"?"Domande d’appello":"Allenamento");
  const sub=tr.mode==="err"?(tr.queue.length+1)+" rimaste in questo giro":BLOCKS[q.b]?"":"";
  let opts='<div class="opts">';
  q.o.forEach((o,j)=>{
    let cl="opt";
    if(done){if(j===q.c)cl="opt right";else if(j===picked)cl="opt wrong";else cl="opt dim"}
    opts+='<button class="'+cl+'" '+(done?'disabled':'onclick="answerTrain('+j+')"')+'><span class="lett">'+LETT[j]+'</span><span>'+o+'</span></button>'});
  opts+='</div>';
  const okq=done&&picked===q.c;
  h('<div class="topbar"><button class="back" onclick="renderHome()">← Fine</button>'+
  '<span class="qnum">'+title+' · '+tr.r+'/'+tr.n+(tr.mode==="err"?' · '+(tr.queue.length+1)+' nel giro':'')+'</span></div>'+
  '<div class="card qcard">'+pillB(q.b)+pillX(q)+(S.err[q.id]&&tr.mode==="err"?' <span class="pill red">sbagliata '+(S.err[q.id].w||1)+'×</span>':'')+
  '<div class="qtext">'+q.q+'</div>'+opts+
  (done?'<div class="explain'+(okq?' good':'')+'"><span class="label">'+(okq?'Esatto':'Ripasso')+'</span>'+q.e+'</div>':'')+
  '</div>'+
  '<div class="bottombar"><div class="inner">'+
  (done?'<button class="btn primary" onclick="trainNext()">Prossima</button>':'<button class="btn ghost" onclick="skipTrain()">Salta</button>')+
  '</div></div>')}
function answerTrain(j){
  if(tr.answered)return;tr.answered=true;tr.n++;
  const ok=j===tr.q.c;if(ok){tr.r++;recRight(tr.q)}else recWrong(tr.q);
  renderTrainQ(j)}
function skipTrain(){trainNext()}

// ============ TEORIA E STATISTICHE ============
function renderTheory(){
  let s='';THEORY.forEach(t=>{s+='<details class="theory card"><summary>'+BLOCKS[t.b]+'</summary><div class="body">'+t.body+'</div></details>'});
  h('<div class="topbar"><button class="back" onclick="renderHome()">← Home</button></div>'+
  '<h2>Teoria lampo</h2><div class="sub" style="margin-bottom:14px">Il minimo indispensabile per il quiz: formule e trappole. Per lo scritto usa le schede complete.</div>'+s)}
function renderStats(){
  let rows='';
  for(const b in BLOCKS){const st=S.stats[b]||{n:0,r:0,w:0};const t=st.r+st.w;
    const pct=t>0?Math.round(100*st.r/t):0;
    rows+='<div class="statrow"><span class="name">'+BLOCKS[b]+'</span><span class="bar"><i style="width:'+(t>0?pct:0)+'%"></i></span><span class="pct">'+(t>0?pct+'% di '+t:'—')+'</span></div>'}
  let hist='';
  if(S.hist.length){hist='<h2 style="margin-top:22px">Simulazioni</h2><div class="card" style="padding:6px 16px"><table class="hist" style="width:100%;border-collapse:collapse">';
    S.hist.forEach(x=>{const d=new Date(x.d);
      hist+='<tr><td>'+d.getDate()+'/'+(d.getMonth()+1)+' '+String(d.getHours()).padStart(2,"0")+':'+String(d.getMinutes()).padStart(2,"0")+'</td>'+
      '<td><b>'+x.g+'/10</b></td><td><span class="pill ok">'+x.g+'</span> <span class="pill red">'+x.s+'</span> <span class="pill amber">'+x.b+'</span></td></tr>'});
    hist+='</table></div>'}
  const nerr=Object.keys(S.err).length;
  h('<div class="topbar"><button class="back" onclick="renderHome()">← Home</button></div>'+
  '<h2>Statistiche</h2><div class="sub">Precisione per blocco (sulle risposte date).</div>'+
  '<div class="card" style="padding:6px 16px;margin-top:10px">'+rows+'</div>'+
  '<div class="sub" style="margin-top:12px">Nel mazzo errori: <b>'+nerr+'</b> domande.</div>'+hist+
  '<div style="margin-top:26px;text-align:center"><button class="btn danger" style="flex:none" onclick="resetAll()">Azzera tutti i dati</button></div>')}
function resetAll(){if(confirm("Azzerare progressi, errori e statistiche?")){S=defState();save();renderHome()}}
renderHome();
</script>

    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
