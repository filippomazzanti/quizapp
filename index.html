o:["Z = Σ<sub>i</sub> g<sub>i</sub>e^(−βE<sub>i</sub>): ogni livello pesa per il numero dei suoi stati", "Z = Σ e^(−βg<sub>i</sub>E<sub>i</sub>), con g<sub>i</sub> nell'esponente", "Z = Π g<sub>i</sub>, prodotto di tutte le degenerazioni", "Non compare affatto: nella somma conta solo l'energia"],c:0,
e:"La somma corre sugli STATI, non sui livelli: raggruppando per energia spunta g<sub>i</sub>. Dimenticare la degenerazione (es. 2J+1, spin, molteplicità orbitali) è tra gli errori più frequenti nei problemi d'esame (Esercitazione 7)."},
{id:"s69",b:"sta",q:"Passando al continuo, la somma sugli stati si trasforma in Z = ∫g(E)e^(−βE)dE. Che cosa serve per farlo correttamente?",
o:["La densità degli stati g(E) del sistema", "Soltanto il fattore di Boltzmann e^(−βE) dei singoli livelli", "La funzione d'onda esatta di tutte le particelle del sistema", "Il valore del potenziale chimico μ alla temperatura data"],c:0,
e:"g(E) traduce il conteggio quantistico (livelli discreti) nel linguaggio degli integrali: costruirla (1D, 2D, 3D, dispersioni varie) è LO strumento che ricompare in trasporto, fononi, fotoni e magnetismo (Esercitazioni 7, 10, 14)."},
// ---- Statistica: indistinguibili (Es. 10) e completamenti ----
{id:"s70",b:"sta",q:"Il principio di Pauli in forma completa afferma che:",
o:["Funzione d'onda simmetrica per i bosoni, antisimmetrica per i fermioni", "Due particelle qualsiasi non possono mai avere la stessa energia", "Gli elettroni di uno stesso atomo non possono occupare lo stesso orbitale", "Vale soltanto per gli elettroni e non per le altre particelle"],c:0,
e:"La versione «divulgativa» (niente doppi stati) è il corollario fermionico. Il legame spin-statistica governa tutto: occupazioni n = 0,1 per fermioni, n qualsiasi per bosoni (Esercitazione 10)."},
{id:"s71",b:"sta",q:"Per due particelle di spin ½ (fermioni), gli stati permessi combinano:",
o:["Spaziale simmetrica × singoletto, o antisimmetrica × tripletto", "Soltanto la combinazione con parte spaziale antisimmetrica di spin", "Spaziale simmetrica moltiplicata per lo stato di tripletto di spin", "Qualunque combinazione di parte spaziale e parte di spin"],c:0,
e:"ψ<sub>tot</sub> antisimmetrica: (S)×(A) o (A)×(S). Il conteggio degli stati con pesi 1 e 3 spiega perché Ω<sub>FD</sub> = 4Ω<sub>BE</sub> nell'esercizio dei due livelli degeneri (Esercitazione 10, «tipico aiuto da tema d'esame»)."},
{id:"s72",b:"sta",q:"Nel conteggio classico (Maxwell–Boltzmann) di 2 particelle di spin s, lo spin entra come:",
o:["Un fattore di degenerazione (2s+1)² sul conteggio spaziale", "Non entra in alcun modo nel conteggio classico dei microstati", "Un fattore (2s+1), lineare nella molteplicità di spin", "Un termine di interazione diretta fra le due particelle"],c:0,
e:"Classicamente lo spin è solo un'etichetta che moltiplica gli stati. Il confronto Ω<sub>MB</sub> vs Ω<sub>BE</sub>/Ω<sub>FD</sub> mostra che MB conta «troppo» o «troppo poco»: l'indistinguibilità quantistica non è riducibile al 1/N! (Esercitazione 10)."},
{id:"s73",b:"sta",q:"Le somme utili Σᵢ i = n(n+1)/2 e Σᵢ i² = n(n+1)(2n+1)/6 compaiono tipicamente:",
o:["Nei conteggi di microstati con degenerazioni crescenti", "Nel calcolo degli integrali gaussiani sui momenti delle particelle", "Nella derivazione della legge di Curie per i paramagneti", "Nello sviluppo in serie della funzione di Brillouin"],c:0,
e:"Nell'esercizio delle due particelle su livelli E = nε con degenerazione 2n+1, Ω(E) diventa un polinomio in N tramite queste somme. Vanno sapute USARE più che ricordare (Esercitazione 10)."},
{id:"s74",b:"sta",q:"Una particella quantistica in buca 1D ha E<sub>n</sub> = εn² con ε = π²ħ²/2mL². La Z canonica non è sommabile in forma chiusa: come la si studia?",
o:["Nei due limiti: T → 0 (domina n = 1) e T → ∞ (somma → integrale", "Soltanto per via numerica, sommando esplicitamente la serie", "Con la teoria delle perturbazioni applicata ai livelli della buca", "Passando all'ensemble grancanonico con potenziale chimico"],c:0,
e:"È il modello del tema d'esame di maggio: chiedeva U e S in entrambi i limiti, con commento su terzo principio (S → 0) ed equipartizione (U → ½k<sub>B</sub>T). Tecnica dei limiti asintotici: sempre presente negli scritti (Esercitazione 7)."},
{id:"s75",b:"sta",q:"Nel limite T → ∞ della buca 1D, l'entropia cresce come:",
o:["S ≈ k<sub>B</sub>[ln((L/h)√(2πmk<sub>B</sub>T)) + ½]: logaritmica in T", "S ∝ T, cioè linearmente nella temperatura assoluta", "S ∝ √T, con dipendenza dalla radice della temperatura", "Resta costante, indipendente dalla temperatura del bagno"],c:0,
e:"Con Z ≈ (L/h)√(2πmk<sub>B</sub>T) e S = k<sub>B</sub>(lnZ + βU): il conteggio classico riemerge con la SUA costante corretta (grazie a ω₀ = h). Il quantistico contiene il classico come caso limite (Esercitazione 7)."},
{id:"s76",b:"sta",q:"L'equivalenza «somma → integrale» per una somma su livelli discreti è lecita quando:",
o:["La spaziatura fra i livelli è ≪ k<sub>B</sub>T", "Sempre, qualunque sia la spaziatura fra i livelli energetici", "Soltanto a temperatura rigorosamente nulla, T = 0", "Quando i livelli energetici sono fortemente degeneri"],c:0,
e:"Criterio operativo che decide OGNI limite di alta temperatura: buca (ε ≪ k<sub>B</sub>T), rotazioni molecolari (B ≪ k<sub>B</sub>T), oscillatori (ħω ≪ k<sub>B</sub>T). Quando fallisce, compaiono i congelamenti quantistici dei gradi di libertà."},
{id:"s77",b:"sta",q:"L'energia libera F = U − TS è minima all'equilibrio per un sistema:",
o:["A T e V fissati, cioè in contatto con un termostato", "In un sistema isolato, con energia totale E fissata", "A pressione e temperatura fissate, come nelle reazioni chimiche", "Sempre, qualunque siano i vincoli imposti al sistema"],c:0,
e:"Per sistemi isolati il criterio è S massima; a T fissata il fattore e^(−βF) pesa i macrostati: vince il minimo di F. A bassa T domina U (ordine), ad alta T domina −TS (disordine): transizioni di fase in una riga."},
{id:"s78",b:"sta",q:"Perché la capacità termica di TUTTI i sistemi si annulla per T → 0?",
o:["Per il terzo principio: S → costante, quindi c → 0", "Perché l'energia interna del sistema si annulla allo zero assoluto", "È falso: nei metalli il calore specifico resta costante", "Per l'indistinguibilità delle particelle a bassa temperatura"],c:0,
e:"Sotto la scala del primo stato eccitato non c'è nulla da eccitare. Ogni sistema lo fa a modo suo: esponenziale (gap: Einstein, Schottky), T³ (fononi acustici), T lineare (elettroni). Riconoscere il meccanismo dal comportamento di c(T) è materia d'orale."},
{id:"s79",b:"sta",q:"⟨n⟩ per un modo di fotoni (o fononi) a frequenza ω è n = 1/(e^(βħω)−1) SENZA potenziale chimico. Perché μ = 0?",
o:["Il numero di fotoni/fononi non è conservato", "Perché sono particelle prive di massa a riposo", "Perché si propagano alla velocità della luce nel mezzo", "Per pura convenzione, per semplificare i calcoli"],c:0,
e:"Se N non è vincolato, l'equilibrio si trova minimizzando F rispetto a N: μ = 0. È la distribuzione di Planck: caso particolare di BE. Vale per ogni quasiparticella non conservata (fononi, magnoni…) (Esercitazioni 8-10)."},
{id:"s80",b:"sta",q:"La radiazione di corpo nero e i fononi di Debye differiscono soprattutto perché:",
o:["I modi elettromagnetici sono infiniti, quelli reticolari 3N", "I fotoni non seguono la statistica di Bose–Einstein ma quella classica", "I fononi hanno potenziale chimico μ diverso da zero", "La legge del corpo nero vale soltanto a bassa temperatura"],c:0,
e:"Stessa g(ω) ∝ ω² e stessa statistica, ma il reticolo ha gradi di libertà finiti: l'integrale si ferma a ω<sub>D</sub>. Per questo il solido raggiunge Dulong–Petit mentre il corpo nero non satura mai (legge di Stefan T⁴) (Esercitazione 8)."},
{id:"s81",b:"sta",q:"Il valor medio dell'energia nel canonico si scrive in termini di Z come:",
o:["U = −∂lnZ/∂β = k<sub>B</sub>T²·∂lnZ/∂T", "U = lnZ/β, rapporto fra logaritmo e inverso della temperatura", "U = −Z/β, cioè la partizione divisa per beta col segno meno", "U = ∂Z/∂T, derivata diretta della funzione di partizione"],c:0,
e:"Identità operativa fondamentale: derivare lnZ genera i momenti dell'energia. Anche c<sub>V</sub> = ∂U/∂T = k<sub>B</sub>β²·∂²lnZ/∂β²: fluttuazioni di E e calore specifico sono la stessa cosa (⟨ΔE²⟩ = k<sub>B</sub>T²c<sub>V</sub>)."},
{id:"s82",b:"sta",q:"Un sistema con hamiltoniana indipendente da una coordinata (es. gas libero: H non dipende da q) ha Z che fattorizza. Quale conseguenza ha per il magnetismo classico?",
o:["Con la sostituzione p → p + eA la Z classica non cambia", "Il magnetismo classico risulta fortissimo, ben oltre il misurato", "La funzione di partizione diverge in presenza di campo magnetico", "Nessuna conseguenza: il risultato classico resta corretto"],c:0,
e:"L'integrale sui momenti è su tutto ℝ³: la traslazione di eA non cambia nulla → F indipendente da B → M = −∂F/∂B = 0. Il magnetismo esiste solo perché i livelli sono quantizzati (Esercitazione 9 e dispense di magnetismo)."},
{id:"s83",b:"sta",q:"Quale relazione lega la pressione alla funzione di partizione canonica?",
o:["P = −∂F/∂V = k<sub>B</sub>T·∂lnZ/∂V", "P = ∂F/∂T, derivata rispetto alla temperatura assoluta", "P = k<sub>B</sub>T·lnZ, proporzionale al logaritmo della partizione", "P = U/V, cioè densità di energia interna"],c:0,
e:"Per il gas ideale: lnZ = N ln V + termini in T → P = Nk<sub>B</sub>T/V. L'equazione di stato «esce» dalla dipendenza di Z dal volume (via g(ε) o via i limiti dell'integrale spaziale)."},
{id:"s84",b:"sta",q:"Due comparti con gas ideale alla stessa T: nel canonico complessivo, la ripartizione più probabile delle N particelle si trova:",
o:["Massimizzando Z rispetto a N₁, cioè imponendo μ₁ = μ₂", "Imponendo l'uguaglianza delle energie interne dei due comparti", "Imponendo che i due comparti abbiano lo stesso volume", "Con N₁ = N₂, indipendentemente dai volumi dei comparti"],c:0,
e:"Z<sub>tot</sub> = Σ<sub>N₁</sub> Z₁(N₁)Z₂(N−N₁): il termine massimo domina (metodo del punto sella). ∂F/∂N₁ = 0 → μ₁ = μ₂ → n₁ = n₂. Schema esatto del problema 1 del tema di luglio (Esercitazione 7)."},
{id:"s85",b:"sta",q:"L'entropia statistica S = −k<sub>B</sub>ΣP<sub>i</sub>lnP<sub>i</sub> è massima, a energia media fissata, proprio per:",
o:["La distribuzione canonica P<sub>i</sub> ∝ e^(−βE<sub>i</sub>)", "La distribuzione uniforme su tutti gli stati accessibili", "Una delta di Dirac concentrata sullo stato fondamentale", "La distribuzione di Poisson sugli intervalli di energia"],c:0,
e:"Massimizzare S con i vincoli ΣP = 1 e ⟨E⟩ fissata (moltiplicatori di Lagrange) dà il fattore di Boltzmann, con β = moltiplicatore dell'energia. Punto di vista «informazionale» utile all'orale."},
{id:"s86",b:"sta",q:"Il teorema di equipartizione si può enunciare in generale come ⟨x·∂H/∂x⟩ = k<sub>B</sub>T. Che cosa dà per il termine gravitazionale H ⊃ mgz (z ≥ 0)?",
o:["⟨mgz⟩ = k<sub>B</sub>T: un contributo INTERO, perché mgz è lineare", "⟨mgz⟩ = ½k<sub>B</sub>T, come per i termini quadratici", "⟨mgz⟩ = 0, perché il valor medio della quota è nullo", "⟨mgz⟩ = 3k<sub>B</sub>T, uno per ciascuna direzione spaziale"],c:0,
e:"Il «½» vale solo per termini quadratici; per potenze diverse cambia il coefficiente. Coerente con U = (5/2)Nk<sub>B</sub>T del gas nel cilindro gravitazionale (Esercitazione 7): errore classico rispondere 3k<sub>B</sub>T/2 + ½."},
{id:"s87",b:"sta",q:"Le fluttuazioni relative dell'energia nel canonico scalano come:",
o:["ΔE/⟨E⟩ ∼ 1/√N: trascurabili per sistemi macroscopici", "1/N², quindi ancora più rapidamente trascurabili", "√N, cioè crescenti col numero di particelle del sistema", "Costanti, indipendenti dalle dimensioni del sistema"],c:0,
e:"⟨ΔE²⟩ = k<sub>B</sub>T²c<sub>V</sub> ∝ N mentre ⟨E⟩ ∝ N. Per N ~ 10²³: fluttuazioni ~10⁻¹²: ecco perché fissare T (canonico) o fissare E (microcanonico) descrive lo stesso sistema."},
{id:"s88",b:"sta",q:"Quale di queste affermazioni sul fattore di Boltzmann e^(−ΔE/k<sub>B</sub>T) è corretta?",
o:["Confronta un dislivello di energia con k<sub>B</sub>T ≈ 25 meV", "Contiene l'energia assoluta dello stato, non un dislivello", "Vale soltanto per i gas e non per i sistemi condensati", "Diverge a bassa temperatura, rendendo il calcolo inutile"],c:0,
e:"Regola pratica universale: attivazioni, popolamenti, emissione termoionica (φ/k<sub>B</sub>T ≈ 25 → e⁻²⁵), popolazioni rotazionali, legge di Curie. Avere in mente k<sub>B</sub>T(300 K) = 25 meV risolve metà delle domande numeriche."},
{id:"s89",b:"sta",q:"Un gas di N particelle in 2D (superficie A) ha Z₁ = A·(2πmk<sub>B</sub>T)/h². Quale energia interna segue?",
o:["U = Nk<sub>B</sub>T: ½k<sub>B</sub>T per ciascuno dei 2 gradi di libertà traslazionali", "U = (3/2)Nk<sub>B</sub>T, come per il gas ideale in tre dimensioni", "U = 2Nk<sub>B</sub>T, con due gradi di libertà da k<sub>B</sub>T ciascuno", "U = (5/2)Nk<sub>B</sub>T, come per un gas biatomico"],c:0,
e:"Z₁ ∝ T¹ → U = −N∂lnZ/∂β = Nk<sub>B</sub>T. L'equipartizione «conta i quadrati» nella hamiltoniana: in 2D sono p<sub>x</sub>², p<sub>y</sub>². Adattare i conti alla dimensionalità è un riflesso da allenare (compare con grafene e superfici)."},
{id:"s90",b:"sta",q:"Che cos'è l'ipotesi del «caos molecolare» (Stosszahlansatz) nel teorema H?",
o:["Le velocità di due particelle che stanno per urtarsi sono scorrelate", "Le molecole si muovono in modo del tutto casuale senza mai urtarsi", "L'energia cinetica totale non si conserva durante gli urti molecolari", "Il gas si trova sempre e comunque in condizioni di equilibrio"],c:0,
e:"È l'ingrediente che introduce la freccia del tempo: le correlazioni PRIMA dell'urto sono trascurate, quelle DOPO no. Da qui dH/dt ≤ 0 nonostante la dinamica microscopica reversibile (obiezioni di Loschmidt e Zermelo)."},
{id:"s91",b:"sta",q:"All'equilibrio, il teorema H seleziona come distribuzione stazionaria delle velocità:",
o:["La Maxwell–Boltzmann: l'unica per cui il termine d'urto si annulla", "Una qualunque distribuzione gaussiana delle velocità", "La distribuzione uniforme su tutte le velocità possibili", "La distribuzione di Fermi–Dirac per particelle identiche"],c:0,
e:"dH/dt = 0 ⟺ f(v₁)f(v₂) = f(v₁′)f(v₂′) per ogni urto: la soluzione con i vincoli di energia e quantità di moto è la maxwelliana. Collega dinamica (urti) e statistica (canonico)."},
{id:"s92",b:"sta",q:"La costante β = 1/k<sub>B</sub>T che compare nel canonico si identifica fisicamente perché:",
o:["Due sistemi in contatto termico condividono lo stesso β", "È una definizione arbitraria, introdotta solo per comodità", "Deriva dalla legge di Ohm applicata al flusso di calore", "Coincide con la frequenza media degli urti fra le particelle"],c:0,
e:"Massimizzando i microstati totali di due sistemi che scambiano energia: ∂lnΓ₁/∂E₁ = ∂lnΓ₂/∂E₂ ≡ β. Il confronto col gas ideale (termometro) fissa β = 1/k<sub>B</sub>T. Domanda ricorrente all'orale («beta statistica»)."},
{id:"s93",b:"sta",q:"Un oscillatore 3D isotropo all'equilibrio termico classico ha energia media:",
o:["3k<sub>B</sub>T: sei termini quadratici (3 cinetici + 3 elastici)", "(3/2)k<sub>B</sub>T, come per un gas monoatomico libero", "6k<sub>B</sub>T, cioè k<sub>B</sub>T per ciascun termine quadratico", "k<sub>B</sub>T, come per un singolo oscillatore unidimensionale"],c:0,
e:"Ogni direzione contribuisce con k<sub>B</sub>T (½ cinetico + ½ potenziale). Moltiplicando per N atomi: U = 3Nk<sub>B</sub>T → c = 3Nk<sub>B</sub> = 3R per mole: Dulong–Petit, il punto di partenza di tutta la teoria dei solidi (Esercitazione 8)."},
{id:"s94",b:"sta",q:"Perché i gradi di libertà rotazionali delle molecole biatomiche contribuiscono con k<sub>B</sub>T (2 × ½) e non (3/2)k<sub>B</sub>T?",
o:["Il momento d'inerzia attorno all'asse molecolare è quasi nullo", "Le molecole biatomiche non ruotano attorno a due dei tre assi principali", "Per la conservazione della parità della funzione d'onda totale", "Perché l'energia rotazionale non è quadratica nei momenti"],c:0,
e:"I due assi trasversi sono eccitabili (I grande, quanti piccoli), quello longitudinale no. Il congelamento quantistico dei gradi di libertà spiega i «gradini» del calore specifico dei gas biatomici (5/2 R a RT)."},
{id:"s95",b:"sta",q:"Nella statistica del paramagnete, l'uso della distribuzione di Maxwell–Boltzmann per gli ioni magnetici è giustificato perché:",
o:["Gli ioni sono localizzati e diluiti, quindi distinguibili", "Gli ioni magnetici si comportano come bosoni identici", "La temperatura è sempre sufficientemente alta da giustificarlo", "Il campo magnetico applicato rende classico il sistema di spin"],c:0,
e:"Ogni ione è etichettato dal suo sito nella matrice: Z<sub>N</sub> = Z₁<sup>N</sup>. La quantizzazione resta nei LIVELLI (m<sub>J</sub> discreti), ma la statistica di occupazione è di Boltzmann (Esercitazioni 9 e 17)."},
{id:"s96",b:"sta",q:"Il rapporto delle popolazioni di due livelli separati da ΔE all'equilibrio è:",
o:["N₂/N₁ = (g₂/g₁)·e^(−ΔE/k<sub>B</sub>T): Boltzmann pesato", "N₂/N₁ = ΔE/k<sub>B</sub>T, lineare nel rapporto delle energie", "N₂/N₁ = 1 sempre, indipendentemente dalla temperatura", "N₂/N₁ = e^(+ΔE/k<sub>B</sub>T), con esponente positivo"],c:0,
e:"Base di: intensità delle righe spettrali, popolamenti rotazionali (massimo a K intermedio per il fattore 2K+1!), MASER, e del criterio ΔE vs k<sub>B</sub>T per «quali livelli contano» (Esercitazioni 7, 9, 17)."},
{id:"s97",b:"sta",q:"Il paradosso di Gibbs scompare naturalmente nel conteggio quantistico perché:",
o:["Le particelle identiche sono indistinguibili per principio", "La quantizzazione elimina del tutto il concetto di entropia", "Il volume dello spazio delle fasi è discreto e non continuo", "I gas quantistici non possono in alcun modo mescolarsi"],c:0,
e:"Il fattore 1/N!, ad hoc nel classico, è automatico in FD/BE (la funzione d'onda è simmetrizzata). MB con 1/N! è il limite corretto di entrambe: la meccanica quantistica «ripara» la termodinamica classica."},
{id:"s98",b:"sta",q:"Per un sistema a due livelli con degenerazioni g₀ = 1 e g₁ = 2 (gap Δ), la Z di singola particella è:",
o:["Z₁ = 1 + 2e^(−βΔ)", "Z₁ = 3e^(−βΔ)", "Z₁ = 1 + e^(−2βΔ)", "Z₁ = 2 + e^(−βΔ)"],c:0,
e:"Somma sugli stati: 1 dal fondamentale + 2 dal livello eccitato. A T → ∞: popolazioni 1/3–2/3 (non ½–½!) e S → Nk<sub>B</sub>ln3. Le degenerazioni cambiano i limiti: trappola da tema d'esame."},
{id:"s99",b:"sta",q:"L'energia interna di un paramagnete J = ½ in campo B (livelli ±μ<sub>B</sub>B) all'equilibrio è U = −Nμ<sub>B</sub>B·tanh(μ<sub>B</sub>B/k<sub>B</sub>T). Il lavoro magnetico e il calore scambiati si distinguono perché:",
o:["dU = TdS − μ₀MdH: variando B si scambiano entrambi", "Non si ha mai scambio di calore in un processo magnetico", "Il lavoro magnetico compiuto sul sistema è sempre rigorosamente nullo", "L'energia interna dipende soltanto dalla temperatura del sale"],c:0,
e:"Base della smagnetizzazione adiabatica: magnetizzo a T costante (cedo calore), poi riduco B a S costante → T crolla. Tecnica standard per raggiungere i mK con i sali paramagnetici (Esercitazioni 9 e 17)."},
{id:"s100",b:"sta",q:"Nella smagnetizzazione adiabatica di un sale paramagnetico, la temperatura scende perché:",
o:["A S costante il rapporto μB/k<sub>B</sub>T deve restare invariato: riducendo B", "Perché il campo magnetico raffredda direttamente gli spin del sale", "Perché l'entropia del sistema di spin aumenta durante il processo", "Perché si compie lavoro meccanico sul sistema di spin nucleari"],c:0,
e:"S dipende da B/T (dal rapporto a): l'isoentropica è B/T = cost. Limite pratico: le interazioni residue tra spin (campo interno) fermano la discesa. Applicazione da orale della statistica del paramagnete."},
// ---- Trasporto: Drude e Joule (Es. 11, dispensa) ----
{id:"t31",b:"tra",q:"La densità di elettroni di conduzione di un metallo si stima come n = ρ<sub>m</sub>N<sub>A</sub>Z′/M (Z′ = valenza). Per il rame dà:",
o:["n ≈ 8,5·10²⁸ m⁻³, circa un elettrone per atomo", "n ≈ 10²³ m⁻³, come in un gas rarefatto a bassa pressione", "n ≈ 10³⁵ m⁻³, densità tipica della materia nucleare", "n ≈ 10¹⁹ m⁻³, come nei semiconduttori drogati"],c:0,
e:"Ogni atomo di Cu cede ~1 elettrone 4s. Il «gas» di Drude è 1000 volte più denso di un gas reale: per questo la statistica classica fallirà (serve Fermi–Dirac). Numero da ricordare per le stime."},
{id:"t32",b:"tra",q:"L'esperimento di Tolman–Stewart (1916) dimostrò che:",
o:["I portatori di carica nei metalli sono gli elettroni", "Che la resistenza elettrica cresce con la temperatura del metallo", "Che in alcuni metalli la conduzione avviene tramite lacune", "Che la carica elettrica è quantizzata in multipli di e"],c:0,
e:"L'inerzia dei portatori genera un impulso di corrente al frenamento: e/m compatibile con l'elettrone. Accordo buono per alcalini e nobili; anomalie altrove (segno!) anticipano lacune e teoria delle bande (dispensa di trasporto)."},
{id:"t33",b:"tra",q:"Nel modello di Drude gli urti avvengono «con gli ioni». Che cosa mostra l'esperimento a basse temperature?",
o:["Il cammino libero medio può diventare centimetrico", "Che il cammino libero medio resta sempre dell'ordine di 1 nm", "Che gli urti avvengono soprattutto fra elettrone ed elettrone", "Che il tempo di rilassamento non dipende dalla temperatura"],c:0,
e:"A RT ℓ = v·τ ≈ 1 nm ~ passo reticolare (plausibile per Drude); ma in cristalli puri e freddi ℓ ~ cm! Il teorema di Bloch spiegherà: un reticolo PERFETTO non diffonde; diffondono fononi e impurezze."},
{id:"t34",b:"tra",q:"L'equazione del moto media degli elettroni di Drude con forza esterna F è:",
o:["dp/dt = F − p/τ: gli urti agiscono come un attrito viscoso", "dp/dt = F, come per una particella completamente libera", "dp/dt = −p/τ soltanto, senza il termine di forza esterna", "dp/dt = F + p/τ, con il termine d'attrito di segno positivo"],c:0,
e:"Il termine −p/τ rappresenta la perdita media di quantità di moto negli urti (probabilità dt/τ). A regime stazionario p = Fτ → v<sub>d</sub> = −eEτ/m → legge di Ohm. Con B si ottiene l'effetto Hall dalla stessa equazione."},
{id:"t35",b:"tra",q:"Dopo un urto, secondo Drude, l'elettrone riparte con:",
o:["Velocità termica isotropa, dettata dalla T locale", "Con la stessa velocità che possedeva subito prima dell'urto", "Con velocità esattamente nulla, ripartendo sempre da fermo", "Con la velocità di deriva imposta dal campo elettrico esterno"],c:0,
e:"Assunzione 4: gli urti sono l'UNICO meccanismo di termalizzazione. La memoria della deriva si perde a ogni urto (⟨v<sub>T</sub>⟩<sub>dir</sub> = 0): il campo la ricostruisce nel tempo medio τ (Esercitazione 11)."},
{id:"t36",b:"tra",q:"L'energia media guadagnata da un elettrone tra due urti in campo E è ⟨ΔE⟩ = (eE)²⟨t²⟩/2m. Il termine con v<sub>T</sub>·cosθ non contribuisce perché:",
o:["La media sulle direzioni iniziali isotrope lo annulla", "Perché è numericamente molto piccolo rispetto agli altri", "Perché la velocità termica degli elettroni è praticamente nulla", "Perché il campo elettrico applicato è sufficientemente debole"],c:0,
e:"⟨v<sub>T</sub>⟩<sub>dir</sub> = 0 componente per componente. Sopravvive solo il termine quadratico nel campo: con ⟨t²⟩ = 2τ² si ottiene P = σE², l'effetto Joule microscopico (Esercitazione 11, problema 1.2 di Ashcroft–Mermin)."},
{id:"t37",b:"tra",q:"La probabilità che un elettrone NON subisca urti per un tempo t è:",
o:["P(t) = e^(−t/τ): decadimento esponenziale", "P(t) = 1 − t/τ, con decadimento lineare nel tempo", "P(t) = (t/τ)e^(−t/τ), con un massimo a tempo finito", "P(t) = costante, indipendente dal tempo trascorso"],c:0,
e:"Dal limite (1−Δt/τ)^(t/Δt) → e^(−t/τ). La densità di probabilità dell'intervallo tra urti è (1/τ)e^(−t/τ): eventi rari e indipendenti, stessa statistica dei decadimenti radioattivi (Esercitazione 11, problema 1.1)."},
{id:"t38",b:"tra",q:"Il «paradosso del tram» applicato agli urti di Drude spiega perché:",
o:["L'intervallo osservato dura in media 2τ, non τ", "Che il tempo di rilassamento dipende dalla velocità dell'elettrone", "Che gli urti successivi sono statisticamente correlati fra loro", "Che il tempo medio fra due urti vale in realtà τ/2"],c:0,
e:"È il modo intuitivo di capire ⟨t²⟩ = 2τ²: l'errore di Drude (usare τ² nell'effetto Joule) veniva proprio da qui. Aneddoto che il docente usa per la statistica di Poisson (dispensa di trasporto)."},
{id:"t39",b:"tra",q:"Nel bilancio energetico elettrone–reticolo (urti anelastici), in media:",
o:["Il reticolo assorbe ΔE ≈ mv<sub>d</sub>² per urto: il conduttore si scalda", "L'elettrone guadagna sistematicamente energia a ogni urto", "Il reticolo cede in media energia al gas di elettroni", "Non si ha alcuno scambio netto di energia fra i due sistemi"],c:0,
e:"Se l'elettrone arriva «col vento» (v<sub>T</sub>+v<sub>d</sub>) cede di più di quanto riprenda quando arriva controvento: la somma dei due casi dà −mv<sub>d</sub>² &lt; 0 per il gas. L'energia del generatore finisce nel reticolo (Esercitazione 11)."},
{id:"t40",b:"tra",q:"Nella geometria di Hall (B lungo z, corrente lungo x), il campo di Hall E<sub>y</sub> nasce perché:",
o:["La forza di Lorentz accumula carica sui bordi finché j<sub>y</sub> = 0", "Il campo magnetico accelera gli elettroni lungo y indefinitamente", "La resistenza longitudinale cresce al crescere del campo B", "Gli ioni del reticolo si spostano trasversalmente al moto"],c:0,
e:"Equilibrio trasverso: −eE<sub>y</sub> = −ev<sub>d</sub>B → E<sub>y</sub> = v<sub>d</sub>B → R<sub>H</sub> = E<sub>y</sub>/(j<sub>x</sub>B) = −1/ne. La tensione di Hall si misura a corrente trasversa nulla (dispensa di trasporto)."},
{id:"t41",b:"tra",q:"La conducibilità AC di Drude è σ(ω) = σ₀/(1−iωτ). Che cosa succede per ωτ ≫ 1?",
o:["σ diventa quasi puramente immaginaria: gli elettroni rispondono", "La conducibilità diverge, come in un conduttore perfetto ideale", "La conducibilità resta reale e costante come in corrente continua", "La corrente si annulla esattamente per qualunque campo applicato"],c:0,
e:"Ad alta frequenza gli urti non fanno in tempo: risposta inerziale (sfasata di 90°). In questo regime la funzione dielettrica diventa ε<sub>r</sub> = 1 − ω<sub>p</sub>²/ω²: il ponte tra Drude e l'ottica dei metalli."},
{id:"t42",b:"tra",q:"Il valore misurato di ħω<sub>p</sub> per l'alluminio (≈ 15,8 eV) conferma il modello di Drude perché:",
o:["Coincide con √(ne²/mε₀) calcolata con n = 3 elettroni per atomo", "Perché risulta identica per tutti i metalli, semplici e nobili", "Perché è molto minore del valore previsto dalla teoria", "Perché dipende dalla temperatura esattamente come previsto"],c:0,
e:"Per Al (trivalente) il calcolo dà ~15,8 eV: accordo eccellente. Per i metalli nobili l'accordo peggiora (elettroni d legati che schermano): limite del modello a elettroni liberi (dispensa di trasporto)."},
{id:"t43",b:"tra",q:"Come si misura sperimentalmente l'energia dei plasmoni?",
o:["Con l'EELS, dalle perdite in multipli di ħω<sub>p</sub>", "Con misure di effetto Hall in campo magnetico intenso", "Con la diffrazione di raggi X ad alto angolo sul cristallo", "Misurando la resistività elettrica in funzione della frequenza"],c:0,
e:"Lo spettro delle perdite mostra picchi a ħω<sub>p</sub>, 2ħω<sub>p</sub>…: ogni plasmone eccitato è un quanto di oscillazione collettiva. Tecnica citata anche per la spettroscopia dei solidi (dispensa di trasporto)."},
{id:"t44",b:"tra",q:"La conducibilità termica elettronica nel modello cinetico è k = (1/3)v²τ·c<sub>V</sub> (per unità di volume). Drude la combina con σ e trova L ≈ giusto. Dove si annidano i DUE errori compensanti?",
o:["c<sub>V</sub> troppo grande di ~100 e v² troppo piccola di ~100", "Entrambe le grandezze sono sovrastimate dello stesso fattore", "Il tempo di rilassamento τ viene sbagliato per due volte", "Non c'è alcun errore: il calcolo di Drude è del tutto corretto"],c:0,
e:"Il caso più celebre di «giusto per caso» della fisica: (3/2)nk<sub>B</sub> vs γT e v<sub>T</sub> vs v<sub>F</sub>. Sommerfeld sistema entrambi e trova L = (π²/3)(k<sub>B</sub>/e)², ancora in accordo — stavolta per ragioni giuste (dispensa)."},
{id:"t45",b:"tra",q:"Il potere termoelettrico Q (Seebeck) nel modello di Drude viene ~100 volte troppo grande perché:",
o:["Q ∝ c<sub>V</sub> per elettrone, e Drude usa il valore classico", "Perché il potere termoelettrico non dipende dal calore specifico", "Perché le misure sperimentali dell'epoca erano poco accurate", "Perché il gradiente termico distrugge il gas di elettroni liberi"],c:0,
e:"Q<sub>Drude</sub> = −k<sub>B</sub>/2e ≈ −43 μV/K vs ~−1 μV/K misurato: stesso fattore ~100 del calore specifico — e stavolta niente compensazione! Q (e i suoi segni anomali → lacune) è un test spietato dei modelli (dispensa)."},
{id:"t46",b:"tra",q:"Nel modello di Sommerfeld le condizioni al contorno di Born–von Karman quantizzano i k come:",
o:["k<sub>j</sub> = (2π/L)n<sub>j</sub>, un stato ogni (2π/L)³", "k<sub>j</sub> = (π/L)n<sub>j</sub>, con n positivi soltanto", "I valori di k restano continui", "k<sub>j</sub> = n<sub>j</sub>/L, senza il fattore due pi greco"],c:0,
e:"Onde piane periodiche sul cubo L³. Il conteggio nello spazio k (con il fattore 2 di spin) è LA mossa iniziale di ogni problema: sfera di Fermi, DOS, Debye, Richardson (dispensa ed Esercitazione 12)."},
{id:"t47",b:"tra",q:"La velocità di Fermi nei metalli vale v<sub>F</sub> ≈ 10⁶ m/s ≈ c/300. Che cosa la rende notevole?",
o:["Esiste anche a T = 0, imposta dal principio di Pauli", "È la velocità di deriva raggiunta in campo elettrico intenso", "Dipende linearmente dalla temperatura assoluta del metallo", "Coincide con la velocità termica prevista dalla teoria classica"],c:0,
e:"Gli elettroni al livello di Fermi si muovono velocissimi anche nello stato fondamentale: pura conseguenza dell'esclusione. La v² che entra in Wiedemann–Franz è questa, non la termica (dispensa)."},
{id:"t48",b:"tra",q:"Nella derivazione «per configurazioni» della distribuzione classica, la condizione p(ε₁)p(ε₂) = q(ε₁+ε₂) sugli urti porta a:",
o:["p(ε) ∝ e^(−ε/k<sub>B</sub>T): l'esponenziale è l'unica funzione", "p(ε) ∝ ε², cioè quadratica nell'energia della particella", "p(ε) costante, uguale per tutte le energie accessibili", "p(ε) ∝ 1/ε, inversamente proporzionale all'energia"],c:0,
e:"Se l'occupazione dipende solo dall'energia e gli urti conservano ε₁+ε₂, il vincolo funzionale impone l'esponenziale: eleganza della derivazione di Maxwell–Boltzmann nelle dispense di trasporto."},
{id:"t49",b:"tra",q:"Aggiungendo il fattore di riduzione (1−n) ai processi d'urto (stato d'arrivo occupato = processo bloccato) si ottiene all'equilibrio:",
o:["La distribuzione di Fermi–Dirac", "Ancora la distribuzione classica di Maxwell–Boltzmann", "La distribuzione di Planck", "Una distribuzione uniforme su tutti gli stati accessibili"],c:0,
e:"Bilancio dettagliato con blocco di Pauli: n/(1−n) = e^(−(ε−μ)/k<sub>B</sub>T) → n<sub>FD</sub>. Con il fattore di accrescimento (1+n) si ottiene invece BE: derivazione delle dispense, alternativa al grancanonico."},
{id:"t50",b:"tra",q:"A T = 0 la distribuzione di Fermi–Dirac è un gradino. A T &gt; 0:",
o:["Si «smussa» solo in una finestra di larghezza ~k<sub>B</sub>T attorno a μ", "Diventa una gaussiana centrata sull'energia di Fermi del metallo", "Si sposta rigidamente verso energie via via più alte al crescere di T", "Diventa esponenziale decrescente su tutto lo spettro di energie"],c:0,
e:"k<sub>B</sub>T/ε<sub>F</sub> ~ 10⁻²: la stragrande maggioranza del mare di Fermi resta congelata. Tutta la fisica (c<sub>V</sub>, χ<sub>Pauli</sub>, trasporto) vive in quella finestrella: il concetto più importante del blocco (dispensa)."},
{id:"t51",b:"tra",q:"L'ordine di grandezza corretto di τ, ℓ e v<sub>d</sub> per il rame a temperatura ambiente (E ~ V/m) è:",
o:["τ ~ 10⁻¹⁴ s, ℓ ~ 1–100 nm, v<sub>d</sub> ~ mm/s", "τ ~ 10⁻⁶ s, ℓ ~ mm, v<sub>d</sub> ~ km/s", "τ ~ 10⁻¹⁴ s, ℓ ~ m, v<sub>d</sub> ~ v<sub>F</sub> ~ 10⁶ m/s", "τ ~ 1 s, ℓ ~ nm, v<sub>d</sub> ~ nm/s"],c:0,
e:"τ = m/ρne² ≈ 2,7·10⁻¹⁴ s (numerica ricorrente!); ℓ = v<sub>F</sub>τ ≈ 30 nm; v<sub>d</sub> = eEτ/m ≈ mm/s. Avere questi ordini in testa evita metà degli errori nelle crocette numeriche."},
{id:"t52",b:"tra",q:"Perché la resistività di un metallo CRESCE con la temperatura?",
o:["Aumentano le vibrazioni reticolari e τ diminuisce", "Diminuisce il numero di portatori di carica disponibili", "Aumenta la massa efficace degli elettroni di conduzione", "Cresce il campo elettrico interno che si oppone alla corrente"],c:0,
e:"σ = ne²τ/m con n costante (metallo): tutta la dipendenza è in τ(T). Nei semiconduttori invece n(T) esponenziale domina e ρ DIMINUISCE con T: distinzione classica da quiz."},
{id:"t53",b:"tra",q:"Nel tema d'esame sul potassio si confrontano m*/m ottenuta dal calore specifico e dalla resistività di Drude. I due valori differiscono perché:",
o:["γ misura la densità di stati a ε<sub>F</sub> (proprietà di equilibrio)", "Perché uno dei due esperimenti è certamente sbagliato", "Perché la massa efficace non è una grandezza ben definita", "Perché m* dipende dal volume del campione utilizzato"],c:0,
e:"La «massa efficace termica» ingloba interazioni e-fonone ed e-e; quella «di trasporto» mescola m* e τ. Il commento sulle motivazioni intrinseche della differenza era richiesto esplicitamente nel tema di maggio."},
{id:"t54",b:"tra",q:"L'espansione di Sommerfeld è un'espansione in potenze di quale parametro piccolo?",
o:["(k<sub>B</sub>T/ε<sub>F</sub>) = T/T<sub>F</sub> ~ 10⁻² a temperatura ambiente", "La costante di struttura fine e²/ħc ≈ 1/137", "L'inverso del numero di particelle, cioè 1/N", "Il rapporto ħω/k<sub>B</sub>T fra quanto ed energia termica"],c:0,
e:"Il gas è degenere: la finestra termica k<sub>B</sub>T è minuscola rispetto a ε<sub>F</sub>. I termini successivi vanno come (T/T<sub>F</sub>)²: già il primo ordine è accuratissimo. Se T ~ T<sub>F</sub> il modello va abbandonato (Esercitazione 12)."},
// ---- Trasporto: Sommerfeld (Es. 12) e termoionico (Es. 13) ----
{id:"t55",b:"tra",q:"Nell'espansione di Sommerfeld il primo passo è integrare per parti N = ∫f·g dε. Perché i termini di bordo si annullano?",
o:["K(ε) → 0 per ε → −∞ e f → 0 per ε → +∞", "Per via della simmetria pari della densità degli stati", "Perché il potenziale chimico μ si annulla in quel limite", "In realtà non si annullano affatto"],c:0,
e:"Resta N = −∫K(ε)(∂f/∂ε)dε: tutta l'azione si concentra dove ∂f/∂ε ≠ 0, cioè nella campana attorno a μ. Primo dei «9 passi» della derivazione da sapere per l'orale (Esercitazione 12)."},
{id:"t56",b:"tra",q:"Nella derivazione di Sommerfeld, la funzione −∂f/∂ε ha un ruolo centrale perché:",
o:["È una campana simmetrica di larghezza ~k<sub>B</sub>T centrata in μ", "È una funzione costante su tutto l'intervallo delle energie", "Coincide esattamente con la densità degli stati g(ε) del metallo", "Rappresenta la probabilità di occupazione dei singoli stati"],c:0,
e:"La simmetria uccide i termini dispari del Taylor (→ solo potenze PARI di T); la normalizzazione a 1 rende lo sviluppo sistematico, con coefficienti a<sub>n</sub> legati alla ζ di Riemann (a₁ = π²/6) (Esercitazione 12)."},
{id:"t57",b:"tra",q:"Il risultato di Sommerfeld per N a primo ordine è N ≈ ∫^μ g dε + (π²/6)(k<sub>B</sub>T)²g′(μ). Da qui, imponendo N costante:",
o:["μ(T) = ε<sub>F</sub> − (π²/6)(k<sub>B</sub>T)²·g′(ε<sub>F</sub>)/g(ε<sub>F</sub>)", "μ(T) = ε<sub>F</sub> a qualunque temperatura del metallo", "μ(T) cresce linearmente con la temperatura assoluta", "μ(T) = ε<sub>F</sub>/2 per qualunque valore di temperatura"],c:0,
e:"Formula generale valida per QUALSIASI g(ε): con g ∝ √ε dà il celebre −(π²/12)(T/T<sub>F</sub>)²; con g ∝ ε (grafene) −(π²/6); con g costante (2D) μ fermo; con g decrescente μ SALE. Chiave dell'appello sul grafene (Esercitazione 14)."},
{id:"t58",b:"tra",q:"Il calore specifico elettronico si può stimare qualitativamente così: frazione di elettroni eccitabili ~g(ε<sub>F</sub>)k<sub>B</sub>T, energia ~k<sub>B</sub>T ciascuno. Quindi:",
o:["ΔU ~ g(ε<sub>F</sub>)(k<sub>B</sub>T)², quindi c<sub>V</sub> ∝ T", "c<sub>V</sub> ∝ T³, come il contributo reticolare di Debye", "c<sub>V</sub> ∝ e^(−ε<sub>F</sub>/k<sub>B</sub>T), esponenzialmente soppresso", "c<sub>V</sub> indipendente da T, come nel modello classico"],c:0,
e:"La stima «a mano» riproduce la fisica: conta solo la finestra termica attorno a ε<sub>F</sub>. Saperla fare vale mezzo esame orale: mostra di aver capito il perché, non solo la formula (Esercitazione 12)."},
{id:"t59",b:"tra",q:"Il «box» di relazioni utili del gas di Fermi 3D collega n, k<sub>F</sub>, ε<sub>F</sub>, g(ε<sub>F</sub>). Quale catena è corretta?",
o:["n = k<sub>F</sub>³/3π² ; ε<sub>F</sub> = ħ²k<sub>F</sub>²/2m ; g = (3/2)n/ε<sub>F</sub>", "n = k<sub>F</sub>²/2π ; ε<sub>F</sub> = ħk<sub>F</sub>/m ; g = n·ε<sub>F</sub> (caso 2D)", "n = k<sub>F</sub>/π ; ε<sub>F</sub> = ħ²k<sub>F</sub>²/m ; g = n/2ε<sub>F</sub>", "n = 3π²k<sub>F</sub>³ ; ε<sub>F</sub> = ħ²k<sub>F</sub>/2m ; g = ε<sub>F</sub>/n"],c:0,
e:"Le tre relazioni-cerniera di ogni problema su metalli: dalle prime due si passa da n (misurabile) a ε<sub>F</sub>; la terza collega la DOS al livello di Fermi senza integrali. Impararle come riflesso (Esercitazione 12)."},
{id:"t60",b:"tra",q:"L'energia interna del gas di Fermi ha U(T=0) = (3/5)Nε<sub>F</sub> ≠ 0. Quale osservabile ne segue direttamente?",
o:["La pressione di degenerazione P = (2/5)nε<sub>F</sub> ~ 10¹⁰ Pa", "La resistività residua che sopravvive allo zero assoluto", "Il calore latente di fusione del metallo cristallino", "La suscettività magnetica che segue la legge di Curie"],c:0,
e:"P = −∂U/∂V con ε<sub>F</sub> ∝ V^(−2/3). Per Cu: ~4·10¹⁰ Pa, bilanciata dall'attrazione ionica. Nell'appello 2023: ΔP per Δε<sub>F</sub>/ε<sub>F</sub> = 10⁻⁶ ≈ 1 atm! (Esercitazione 14)."},
{id:"t61",b:"tra",q:"Nel grafene (2D, dispersione lineare) la densità di stati è g(ε) ∝ ε. Il problema d'appello mostra che μ(T) si può calcolare ESATTAMENTE:",
o:["μ = ε<sub>F</sub>√(1 − (πk<sub>B</sub>T)²/3ε<sub>F</sub>²), che al primo ordine coincide", "μ = ε<sub>F</sub> costante, indipendente dalla temperatura", "μ = ε<sub>F</sub>(1 + T²), crescente col quadrato di T", "μ cresce esponenzialmente al crescere della temperatura"],c:0,
e:"Con g ∝ ε l'integrale di FD si fa in forma chiusa: raro caso esattamente risolubile che VALIDA l'espansione di Sommerfeld. Condizione di degenerazione: √(πn)ħv<sub>F</sub> ≫ k<sub>B</sub>T, ampiamente vera (Esercitazione 14, appello 2019)."},
{id:"t62",b:"tra",q:"Se la densità di stati è DECRESCENTE in energia (es. g ∝ 1/√ε), il potenziale chimico con la temperatura:",
o:["SALE: μ(T) &gt; ε<sub>F</sub>, per compensare gli stati «persi» sotto e mantenerne il numero", "Scende come sempre, secondo l'espansione di Sommerfeld", "Resta fermo al valore ε<sub>F</sub> a ogni temperatura", "Diverge non appena la temperatura diventa diversa da zero"],c:0,
e:"μ(T) = ε<sub>F</sub> − (π²/6)(k<sub>B</sub>T)²g′/g: il segno segue −g′. Graficamente: l'area sotto f·g deve restare N; se g cala, la coda termica «pesa meno» sopra e μ deve salire. Chiesto esplicitamente in un appello (Esercitazione 14)."},
{id:"t63",b:"tra",q:"Nel diodo termoionico, la curva I(ΔV) mostra due regimi. Quello di saturazione è raggiunto quando:",
o:["Tutti gli elettroni emessi dal catodo vengono raccolti", "La carica spaziale davanti al catodo domina il comportamento", "Il catodo esaurisce progressivamente gli elettroni disponibili", "La differenza di potenziale applicata si annulla completamente"],c:0,
e:"Sotto V*: nube di carica spaziale, I ∝ ΔV^{3/2} indipendente da T (Child–Langmuir). Sopra V*: I<sub>sat</sub>(T) ∝ T²e^(−φ/k<sub>B</sub>T). Il grafico con i due regimi è da saper disegnare (Esercitazione 13)."},
{id:"t64",b:"tra",q:"Nel calcolo di Richardson–Dushman, il conteggio degli elettroni usa la densità nello spazio dei momenti ñ(p) = 2/h³ e il «volume efficace»:",
o:["S·v<sub>x</sub>Δt, con gli elettroni diretti verso la superficie", "L'intero volume del metallo che costituisce il catodo caldo", "Il volume racchiuso dalla sfera di Fermi nello spazio k", "S·v<sub>F</sub>Δt, calcolato per tutti gli elettroni del metallo"],c:0,
e:"J = (2e/h³)∫dp<sub>y</sub>dp<sub>z</sub>∫<sub>ε&gt;ε_v</sub> v<sub>x</sub>f(ε)dp<sub>x</sub>: l'integrale in p<sub>x</sub> dà k<sub>B</sub>T, i due trasversi le gaussiane 2πmk<sub>B</sub>T → il fattore T² (Esercitazione 13)."},
{id:"t65",b:"tra",q:"La costante di Richardson teorica vale A = 4πemk<sub>B</sub>²/h³ ≈ 120 A/(cm²K²). Il confronto con l'esperimento:",
o:["Buono per i metalli semplici, con deviazioni spiegabili", "È sempre perfetto, per qualunque materiale e temperatura", "Fallisce di circa dieci ordini di grandezza sui metalli", "Non è mai stato verificato sperimentalmente in modo diretto"],c:0,
e:"Il modello assume P<sub>trasmissione</sub> = 1 sopra barriera: quantisticamente c'è riflessione anche con E &gt; φ. L'esponenziale però domina: il fit di φ resta affidabilissimo (Esercitazione 13)."},
{id:"t66",b:"tra",q:"Con due elettrodi di funzioni lavoro diverse (φ<sub>griglia</sub> &lt; φ<sub>catodo</sub>) si osserva corrente anche a ΔV ≈ 0 o leggermente negativa. Perché?",
o:["Il potenziale di contatto accelera comunque gli elettroni", "Per effetto tunnel degli elettroni attraverso la barriera di vuoto", "Per via della nube di carica spaziale presente davanti al catodo", "È soltanto un artefatto dovuto alla strumentazione di misura"],c:0,
e:"I livelli di Fermi si allineano: la differenza φ<sub>M</sub>−φ<sub>G</sub> appare come campo nel vuoto. Il «regime strano V &lt; 0» dell'esercitazione: capirlo richiede il diagramma a bande dei due elettrodi (Esercitazione 13)."},
{id:"t67",b:"tra",q:"Per abbassare la temperatura di lavoro dei filamenti termoemettitori si usano:",
o:["Ricoprimenti a bassa funzione lavoro su metalli refrattari", "Metalli caratterizzati da una funzione lavoro decisamente più alta", "Campioni di spessore molto maggiore rispetto a quelli standard", "Campi magnetici intensi applicati in prossimità del catodo caldo"],c:0,
e:"J ∝ e^(−φ/k<sub>B</sub>T): abbassare φ di 2 eV guadagna fattori ~10⁴ a parità di T. Il tungsteno (T<sub>fus</sub> ≈ 3700 K) regge le temperature; il ricoprimento fa l'emissione (Esercitazione 13)."},
{id:"t68",b:"tra",q:"Le tecniche a fascio elettronico (SEM, TEM, LEED, EELS) dipendono dal termoionico perché:",
o:["Il cannone elettronico è un catodo caldo (o a emissione di campo)", "Perché utilizzano fasci di ioni pesanti e non di elettroni", "Perché funzionano soltanto a temperatura ambiente", "Perché misurano direttamente la funzione lavoro del campione"],c:0,
e:"Contesto applicativo citato nell'esercitazione: la fisica «vecchia» del diodo termoionico vive in ogni microscopio elettronico e spettrometro di superficie (Esercitazione 13)."},
{id:"t69",b:"tra",q:"Nel modello semiclassico, un campo E applicato a elettroni di Bloch fa evolvere k secondo:",
o:["ħ·dk/dt = −eE, con traslazione uniforme di tutti i k", "dk/dt = 0: il vettore d'onda resta fisso nel tempo", "ħ·dk/dt = −eE − p/τ, con attrito su ogni singolo elettrone", "Il vettore d'onda k salta in modo discontinuo fra stati"],c:0,
e:"La sfera di Fermi trasla rigidamente finché gli urti (fononi, difetti) la riportano centrata: lo stato stazionario è uno spostamento δk = −eEτ/ħ. Il risultato σ = ne²τ/m è identico a Drude, ma ora si sa CHI conduce (Esercitazione 13)."},
{id:"t70",b:"tra",q:"Perché in un metallo solo gli elettroni vicino alla superficie di Fermi partecipano alla conduzione?",
o:["Solo loro hanno stati vuoti adiacenti in cui spostarsi", "Perché sono gli elettroni più veloci di tutto il metallo", "Perché possiedono una carica efficace maggiore degli altri", "Perché il campo elettrico penetra solo in superficie"],c:0,
e:"La traslazione della sfera è possibile solo «ai bordi»: gli stati interni restano compensati (per ogni k c'è −k). Stessa logica di c<sub>V</sub> e χ<sub>Pauli</sub>: la fisica dei metalli è fisica della superficie di Fermi."},
{id:"t71",b:"tra",q:"La superficie di Fermi di un gas 1D di densità n₁ è composta da:",
o:["Due punti a ±k<sub>F</sub> con k<sub>F</sub> = πn₁/2: il «mare» è un segmento", "Un cerchio di raggio k<sub>F</sub> centrato sull'origine", "Una sfera di raggio k<sub>F</sub> nello spazio reciproco", "Un solo punto collocato nell'origine, cioè a k = 0"],c:0,
e:"N = 2·(2k<sub>F</sub>)/(2π/L) → k<sub>F</sub> = πn₁/2 (fattore 2 di spin e ±k). In 2D: cerchio con k<sub>F</sub> = √(2πn₂). Le geometrie 1D/2D sono un problema d'appello (01/07/2025, Esercitazione 14)."},
{id:"t72",b:"tra",q:"In un metallo 1D a T = 0, i processi elastici di scattering sugli stati di Fermi permettono solo:",
o:["Soltanto q = 2k<sub>F</sub>, cioè il backscattering", "Tutti i valori di q compresi fra zero e due volte k<sub>F</sub>", "Soltanto q = 0, cioè lo scattering in avanti senza deviazione", "Soltanto q = k<sub>F</sub>, cioè metà del diametro del mare"],c:0,
e:"Conservando |k| = k<sub>F</sub>, in 1D l'unico salto possibile è attraversare il mare. La suscettività elettronica χ⁰(q) DIVERGE a q = 2k<sub>F</sub>: instabilità di Peierls (distorsione spontanea del reticolo 1D) (Esercitazione 14)."},
{id:"t73",b:"tra",q:"In 2D la risposta elettronica statica χ⁰(q) a T = 0 è:",
o:["Costante per q ≤ 2k<sub>F</sub>, poi decrescente senza divergenze", "Divergente a q = 2k<sub>F</sub>, esattamente come nel caso 1D", "Rigorosamente nulla per qualunque valore del vettore q", "Crescente con q, fino a divergere per grandi vettori d'onda"],c:0,
e:"Sul cerchio di Fermi ci sono corde di ogni lunghezza ≤ 2k<sub>F</sub>: nessun q è «speciale» abbastanza da divergere. Confronto 1D vs 2D chiesto nell'appello 2025 (Esercitazione 14)."},
{id:"t74",b:"tra",q:"Il grafico di ln(J<sub>sat</sub>/T²) contro 1/T per un catodo dà una retta. Pendenza e intercetta forniscono:",
o:["Pendenza = −φ/k<sub>B</sub> (funzione lavoro); intercetta = ln A", "Pendenza pari a φ e intercetta pari alla temperatura assoluta", "Pendenza −1/τ e intercetta pari alla conducibilità elettrica", "Pendenza ε<sub>F</sub> e intercetta pari al potenziale chimico μ"],c:0,
e:"Linearizzazione standard di Richardson–Dushman: è LA tecnica di misura di φ. Tipica domanda sia da quiz sia da punto (d) di un problema con dati sperimentali (Esercitazione 13)."},
{id:"t75",b:"tra",q:"La condizione ε &gt; ε<sub>v</sub> per l'emissione termoionica riguarda in realtà solo:",
o:["La componente del moto PERPENDICOLARE alla superficie", "L'energia totale posseduta dall'elettrone nel metallo", "Lo stato di spin dell'elettrone che tenta di uscire", "La posizione dell'elettrone all'interno del reticolo cristallino"],c:0,
e:"La barriera è lungo x: le componenti trasverse restano libere (e danno le gaussiane → T²). Distinzione sottile che cambia il conteggio: nel calcolo si separa ε = ε<sub>x</sub> + ε<sub>⊥</sub> (Esercitazione 13)."},
{id:"t76",b:"tra",q:"Perché il calore specifico elettronico γT domina su quello reticolare AT³ solo sotto pochi kelvin?",
o:["T* = √(γ/A): con γ ~ mJ/mol·K² e A dato da Debye", "Perché gli elettroni si congelano ad alta temperatura", "Perché i fononi scompaiono a bassa temperatura", "L'affermazione è falsa: il contributo elettronico domina sempre"],c:0,
e:"A temperatura ambiente i fononi (∝T³ fino a ~Θ<sub>D</sub>, poi 3R) dominano di un fattore ~100. Solo quando il T³ crolla, la retta γT emerge: per il Cu T* = 3,2 K (calcolato nel tema di giugno)."},
{id:"t77",b:"tra",q:"Se un metallo avesse esattamente g(ε) costante (2D ideale), il suo potenziale chimico con T:",
o:["Resterebbe fermo a ε<sub>F</sub> al primo ordine: g′(ε<sub>F</sub>) = 0 annulla la correzione di Sommerfeld", "Scenderebbe come T², esattamente come nel caso tridimensionale", "Salirebbe come T², compensando gli stati persi a bassa energia", "Divergerebbe non appena la temperatura diventa diversa da zero"],c:0,
e:"μ(T) = ε<sub>F</sub> − (π²/6)(k<sub>B</sub>T)²g′/g: tutto sta nella pendenza della DOS. Il 2D parabolico è il caso «neutro» (esattamente: μ = k<sub>B</sub>T·ln(e^{ε_F/k_BT}−1), correzioni esponenzialmente piccole) (Esercitazione 14)."},
// ---- Trasporto: completamenti ----
{id:"t78",b:"tra",q:"Il numero di Lorenz secondo Sommerfeld vale:",
o:["L = (π²/3)(k<sub>B</sub>/e)² ≈ 2,44·10⁻⁸ WΩ/K², in ottimo accordo", "L = (3/2)(k<sub>B</sub>/e)², come nel modello classico di Drude", "L = k<sub>B</sub>/e, rapporto fra costante di Boltzmann e carica", "L = (π²/3)(e/k<sub>B</sub>)², con carica ed energia invertite"],c:0,
e:"Nel rapporto k/σT si cancellano n, m e τ: restano solo costanti fondamentali. La correzione rispetto a Drude (3/2 → π²/3, con v<sub>F</sub> e c<sub>V</sub> giusti) rende l'accordo non più fortuito (dispensa di trasporto)."},
{id:"t79",b:"tra",q:"La forma «locale» della legge di Ohm è:",
o:["E = ρJ (o J = σE): campi e densità di corrente punto per punto", "ΔV = RI è l'unica forma valida della legge di Ohm", "J = σE², con dipendenza quadratica dal campo applicato", "E = J/ne, indipendente dal tempo di rilassamento"],c:0,
e:"R = ρL/S segue integrando su un conduttore cilindrico. La forma locale è quella che si deriva microscopicamente (Drude) e vale per geometrie qualsiasi (dispensa di trasporto)."},
{id:"t80",b:"tra",q:"Quali sono i principali SUCCESSI del modello di Drude?",
o:["Ohm, Hall (per metalli semplici), Wiedemann–Franz (fortuito)", "Il calore specifico elettronico e la suscettività magnetica", "Il segno del coefficiente di Hall per tutti i metalli noti", "La superconduttività a bassa temperatura nei metalli semplici"],c:0,
e:"Fallimenti: c<sub>V</sub> (×100), Seebeck (×100), χ paramagnetica, R<sub>H</sub> positivi, ρ(T). La diagnosi comune: la statistica classica sbaglia CHI partecipa. Elenco successi/fallimenti = domanda d'orale garantita."},
{id:"t81",b:"tra",q:"Per ω &lt; ω<sub>p</sub> l'onda elettromagnetica nel metallo è evanescente. Che cosa significa?",
o:["Il vettore d'onda è immaginario e l'onda decade", "L'onda accelera all'interno del metallo superando la velocità c", "L'onda si propaga indisturbata senza alcuna attenuazione", "L'energia viene assorbita completamente e convertita in calore"],c:0,
e:"ε<sub>r</sub> &lt; 0 → n immaginario. La luce visibile penetra solo ~decine di nm (skin depth ottico): il resto torna indietro — specchi metallici. Sopra ω<sub>p</sub> (UV) il metallo diventa una finestra (dispensa)."},
{id:"t82",b:"tra",q:"A T = 0 l'energia interna del gas di Fermi è U₀ = (3/5)Nε<sub>F</sub>, enorme rispetto al valore classico U = 0. L'origine è:",
o:["Il principio di Pauli riempie gli stati fino a ε<sub>F</sub>", "L'interazione coulombiana repulsiva fra gli elettroni di conduzione", "Il moto di agitazione termica del reticolo cristallino ionico", "È soltanto un artefatto matematico privo di realtà fisica"],c:0,
e:"Energia di punto zero del gas fermionico: ~4 eV/elettrone nel Cu, contro k<sub>B</sub>T ≈ 25 meV. Da qui pressione di degenerazione, rigidità dei metalli, e perfino la stabilità delle nane bianche (Esercitazioni 12, 14)."},
{id:"t83",b:"tra",q:"Il grafico di g(ε)·f(ε) a T = 0 e a T &gt; 0 (aree A e B attorno a μ) serve a spiegare all'orale:",
o:["Perché μ(T) scende quando la densità di stati cresce", "La legge di Ohm nella sua forma locale J = σE puntuale", "Il paradosso di Gibbs sull'entropia di mescolamento dei gas", "L'effetto Hall e il segno dei portatori di carica nei metalli"],c:0,
e:"Argomento grafico standard (citato tra le domande d'orale ricorrenti): la coda termica sposta il bilancio degli stati occupati; per N fisso μ deve muoversi CONTRO la pendenza di g (dispensa ed Esercitazione 12)."},
{id:"t84",b:"tra",q:"La lunghezza d'onda di Fermi λ<sub>F</sub> = 2π/k<sub>F</sub> per un metallo vale circa:",
o:["~0,5 nm, paragonabile alla distanza interatomica", "~1 μm, cioè dell'ordine della lunghezza d'onda della luce", "~1 pm, cioè mille volte più piccola di un atomo", "~1 mm, cioè su scala direttamente osservabile a occhio"],c:0,
e:"k<sub>F</sub> ≈ 1,4·10¹⁰ m⁻¹ per Cu. Il fatto che λ<sub>F</sub> ~ passo reticolare non è un caso: n ~ 1 elettrone/atomo lega d = n^(−1/3) a k<sub>F</sub> = (3π²n)^(1/3) (Esercitazione 14, punto f)."},
{id:"t85",b:"tra",q:"I coefficienti dell'espansione di Sommerfeld a<sub>n</sub> = (2−2^(2−2n))ζ(2n) coinvolgono la funzione ζ di Riemann. Il primo vale:",
o:["a₁ = π²/6: da cui i fattori π²/6 e π²/12 nei risultati per U e μ", "a₁ = 1, cioè un coefficiente puramente numerico unitario", "a₁ = π, cioè direttamente la costante pi greco", "a₁ = π⁴/90, che corrisponde alla zeta di Riemann in 4"],c:0,
e:"ζ(2) = π²/6 (problema di Basilea). a₂ ∝ ζ(4) = π⁴/90 governa il termine (T/T<sub>F</sub>)⁴, quasi sempre trascurabile. Riconoscere «da dove viene il π²» fa buona impressione all'orale (Esercitazione 12)."},
{id:"t86",b:"tra",q:"La densità degli stati completa per elettroni liberi 3D (con spin) è:",
o:["g(ε) = (V/2π²)(2m/ħ²)³ᐟ²·√ε", "g(ε) = (V/π²)(2m/ħ²)·ε, lineare nell'energia", "g(ε) = V·√ε/ħ, con dipendenza dalla sola costante di Planck", "g(ε) = (V/4π)(m/ħ²)³·ε²"],c:0,
e:"Dal conteggio nello spazio k: N(k) = (V/3π²)k³ → g(k) = Vk²/π² → g(ε) = g(k)/(dε/dk). Il fattore 2 di spin è già incluso: dimenticarlo (o metterlo due volte) è la trappola numero uno (Esercitazioni 12, 14)."},
{id:"t87",b:"tra",x:1,q:"«Dalla distribuzione di Fermi, a ε = ε<sub>F</sub> il numero medio di occupazione è ½». Quale lettura è corretta?",
o:["Uno stato quantico con energia pari a ε<sub>F</sub> ha probabilità media di occupazione del 50%, a qualunque T","Metà delle particelle sta sopra ε<sub>F</sub> e metà sotto, sempre","Tutti gli stati sotto ε<sub>F</sub> sono occupati a metà","ε<sub>F</sub> coincide con l'energia media"],c:0,
e:"f(μ) = ½ è una proprietà PUNTUALE della distribuzione, non un'affermazione sulle popolazioni globali (che dipendono da g(ε)). Domanda del quiz reale del II appello: le altre letture sono le distrazioni classiche."},
{id:"t88",b:"tra",q:"Perché il modello di Sommerfeld NON si applica ai semiconduttori?",
o:["Lì i portatori sono pochi (n ~ 10¹⁶–10¹⁹ cm⁻³) e non degeneri", "Perché nei semiconduttori non esistono affatto elettroni liberi", "Perché la statistica di Fermi–Dirac non vale nei solidi cristallini", "In realtà si applica in modo del tutto identico ai due casi"],c:0,
e:"La degenerazione richiede n·λ<sub>T</sub>³ ≫ 1: vero nei metalli (T<sub>F</sub> ~ 10⁵ K), falso nei semiconduttori standard (livello di Fermi nel gap, code di Boltzmann). Il criterio va sempre CONTROLLATO, non assunto."},
{id:"t89",b:"tra",q:"L'energia di Fermi dipende dalla densità come:",
o:["ε<sub>F</sub> ∝ n²ᐟ³ (in 3D): compressioni piccole producono variazioni misurabili", "ε<sub>F</sub> ∝ n³, con dipendenza cubica dalla densità elettronica", "ε<sub>F</sub> ∝ n¹ᐟ², cioè con la radice della densità in 3D", "ε<sub>F</sub> è indipendente dalla densità di elettroni del metallo"],c:0,
e:"Da k<sub>F</sub> = (3π²n)^(1/3) e ε<sub>F</sub> = ħ²k<sub>F</sub>²/2m. In 2D: ε<sub>F</sub> ∝ n; in 1D: ∝ n². La scalabilità con la dimensione ricorre negli appelli su grafene e fili quantici (Esercitazione 14)."},
{id:"t90",b:"tra",q:"Misurando R<sub>H</sub> di un metallo alcalino si ricava n, che risulta ≈ 1 elettrone per atomo. Questo conferma:",
o:["Che gli elettroni di valenza si liberano tutti nel gas di conduzione", "Che nel metallo la corrente è trasportata dagli ioni positivi", "Che il tempo di rilassamento è isotropo in tutte le direzioni", "Che il campo magnetico non penetra all'interno del campione"],c:0,
e:"R<sub>H</sub> = −1/ne è un CONTATORE di portatori indipendente da τ e m. Per Na, K: accordo ~1-2%; per i polivalenti compaiono le anomalie di banda (dispensa di trasporto)."},
{id:"t91",b:"tra",q:"Nei metalli, chi trasporta la maggior parte del calore?",
o:["Gli elettroni di conduzione, con k<sub>el</sub> ≫ k<sub>fononi</sub>", "I fononi, cioè le vibrazioni quantizzate del reticolo cristallino", "I fotoni infrarossi emessi e riassorbiti dal reticolo", "Gli ioni del reticolo, che migrano lungo il gradiente termico"],c:0,
e:"È il presupposto di Wiedemann–Franz: stesso gas trasporta carica e calore. Negli isolanti restano solo i fononi (k tipicamente 10–100 volte minore). Il legame rame-pentola-manico è fisica di Sommerfeld quotidiana."},
{id:"t92",b:"tra",q:"Se v<sub>d</sub> ~ mm/s, perché la lampadina si accende «istantaneamente» quando chiudo l'interruttore?",
o:["Il segnale è il campo elettromagnetico, che viaggia a ~c", "Perché gli elettroni percorrono il filo alla velocità di Fermi", "Perché la corrente elettrica è in realtà costituita da fotoni", "Perché la velocità di deriva è in realtà enorme, prossima a c"],c:0,
e:"Distinzione tra velocità dei portatori e velocità del segnale: il campo mette in moto TUTTO il gas quasi simultaneamente. Chiarisce anche perché v<sub>d</sub> minuscola basta: n è enorme (J = nev<sub>d</sub>)."},
{id:"t93",b:"tra",q:"Nel passaggio ✳ della derivazione di U(T) di Sommerfeld, il termine proporzionale a (μ−ε<sub>F</sub>) si cancella con un pezzo dell'integrale. Il risultato netto è:",
o:["U(T) = U₀ + (π²/6)(k<sub>B</sub>T)²g(ε<sub>F</sub>): la correzione dipende SOLO da g(ε<sub>F</sub>)", "U(T) dipende in modo determinante dallo spostamento di μ(T)", "U(T) = U₀ esattamente, senza alcuna correzione termica", "U(T) = U₀ − (π²/6)(k<sub>B</sub>T)²g(ε<sub>F</sub>), con segno negativo"],c:0,
e:"La cancellazione (via N costante) è il passaggio «magico» della derivazione: c<sub>V</sub> = (π²/3)k<sub>B</sub>²T·g(ε<sub>F</sub>) esce pulito. Rifare i 9 passi una volta con carta e penna vale più di dieci letture (Esercitazione 12)."},
{id:"t94",b:"tra",q:"Una termocoppia sfrutta l'effetto Seebeck:",
o:["Due metalli diversi con giunzioni a temperature diverse", "Un solo metallo genera corrente se scaldato in modo uniforme", "Occorre applicare anche un campo magnetico esterno intenso", "Funziona soltanto a temperature criogeniche, sotto i 10 K"],c:0,
e:"In un circuito di un solo metallo i contributi si cancellano: servono Q diversi (Q<sub>A</sub>−Q<sub>B</sub>). Applicazione classica citata a lezione: il termometro «a fili» dei laboratori (dispensa)."},
{id:"t95",b:"tra",q:"Perché gli urti di Drude devono essere ANELASTICI (in generale)?",
o:["Devono termalizzare il gas, cedendo energia al reticolo", "Per conservare la quantità di moto totale del sistema elettronico", "Perché gli ioni del reticolo sono considerati rigorosamente fermi", "Non è necessario: nel modello gli urti sono perfettamente elastici"],c:0,
e:"Nel regime stazionario l'energia pompata dal campo (σE² per volume) deve uscire dal gas: è l'assunzione 4 (equilibrio SOLO via urti) a garantire il bilancio — e a produrre Joule (Esercitazione 11)."},
{id:"t96",b:"tra",q:"L'ordine di grandezza della corrente termoionica di saturazione a T ≈ 2500 K con φ ≈ 4,5 eV è:",
o:["~1 A/cm²: utilizzabile ma piccola rispetto alle correnti di conduzione", "~10⁶ A/cm², paragonabile alle correnti di conduzione nei metalli", "~1 pA/cm², cioè praticamente non misurabile con strumenti comuni", "~1 A per singolo elettrone emesso dalla superficie del catodo"],c:0,
e:"J = 120·T²·e^(−φ/k<sub>B</sub>T) A/cm² con φ/k<sub>B</sub>T ≈ 21 → e⁻²¹ ≈ 10⁻⁹: J ~ 1 A/cm². L'esponenziale mangia tutto: per questo φ e T comandano (Esercitazione 13)."},
{id:"t97",b:"tra",q:"Nella conduzione di Sommerfeld, la corrente si scrive J = −ne⟨Δv⟩ con ⟨Δv⟩ = −eEτ/m. Il τ che vi compare riguarda:",
o:["Gli urti degli elettroni ALLA superficie di Fermi (con fononi e impurezze)", "Tutti gli elettroni del metallo indistintamente, come in Drude", "Soltanto gli elettroni lenti che si trovano al centro della sfera", "Gli ioni del reticolo cristallino che vibrano attorno ai siti"],c:0,
e:"Formalmente identico a Drude, ma il tempo di rilassamento «giusto» è quello degli stati a ε<sub>F</sub> (v = v<sub>F</sub>, ℓ = v<sub>F</sub>τ ~ 10–100 nm). Il successo numerico di Drude si spiega: usava il τ sbagliato con la v sbagliata (Esercitazione 13)."},
{id:"t98",b:"tra",q:"Qual è la differenza concettuale tra ε<sub>F</sub> (energia di Fermi) e μ (potenziale chimico)?",
o:["ε<sub>F</sub> ≡ μ(T = 0): a T &gt; 0 il potenziale chimico si sposta leggermente", "Sono due grandezze fisicamente indipendenti l'una dall'altra", "Il potenziale chimico è sempre nullo all'interno dei metalli", "L'energia di Fermi dipende da T mentre μ resta costante"],c:0,
e:"Definizione pulita da dare all'orale: ε<sub>F</sub> è il bordo del mare a T = 0; μ(T) = ε<sub>F</sub>[1−(π²/12)(T/T<sub>F</sub>)²]. A 2500 K per Cu lo shift è 0,1%: si usano come sinonimi, sapendo perché (Esercitazione 12)."},
{id:"t99",b:"tra",q:"Il cammino libero medio degli elettroni a ε<sub>F</sub> nel rame a temperatura ambiente è ℓ = v<sub>F</sub>τ ≈ 30–40 nm, cioè ~100 passi reticolari. Che cosa implica?",
o:["Gli elettroni NON urtano con gli ioni del reticolo perfetto", "Che il modello di Drude fornisce una descrizione già esatta", "Che gli elettroni risultano localizzati su un singolo atomo del reticolo", "Che il cammino libero medio non è una grandezza misurabile"],c:0,
e:"Con la v giusta (v<sub>F</sub>, non v<sub>T</sub>) il ℓ diventa 100 volte il passo reticolare: la visione di Drude «palla nei birilli» muore qui. La periodicità perfetta è trasparente (teorema di Bloch); diffonde solo il disordine."},
{id:"t100",b:"tra",q:"Nel problema del semimetallo a due bande (tema di luglio), il calore specifico c<sub>V</sub> = γT con γ ∝ g<sub>tot</sub>(E<sub>F</sub>) risulta ∝ √Δ. Che cosa succede per Δ → 0?",
o:["Il contributo elettronico si annulla: senza sovrapposizione non ci sono portatori né stati a E<sub>F</sub>", "Il coefficiente γ diverge per sovrapposizione nulla fra le bande", "Il coefficiente γ resta finito e indipendente dalla sovrapposizione", "Il calore specifico diventa costante e pari a quello di Dulong–Petit"],c:0,
e:"n<sub>e</sub> = n<sub>l</sub> → E<sub>F</sub> nella zona di sovrapposizione; g(E<sub>F</sub>) ∝ √Δ. Il limite Δ → 0 (semimetallo → semiconduttore a gap nullo) spegne il γT: interpretazione fisica chiesta come ultimo punto del problema."},
// ---- Solido: spazio reale (Es. 15) ----
{id:"o31",b:"sol",q:"La classificazione completa dei cristalli 3D conta:",
o:["7 sistemi, 14 Bravais, 32 gruppi puntuali, 230 spaziali", "14 sistemi cristallini, 7 reticoli e 230 gruppi puntuali", "32 reticoli di Bravais raggruppati in 7 sistemi cristallini", "10 gruppi spaziali distinti, uno per ciascun sistema"],c:0,
e:"Traslazioni → 14 Bravais; simmetrie puntuali (rotazioni, riflessioni, inversioni) → 32; aggiungendo assi vite e piani glide → 230 gruppi spaziali (73 simmorfici). La gerarchia va saputa a grandi linee (Esercitazione 15)."},
{id:"o32",b:"sol",q:"In due dimensioni esistono:",
o:["5 reticoli di Bravais (obliquo, rettangolare, rettangolare centrato", "14 reticoli di Bravais, esattamente come nel caso tridimensionale", "3 reticoli soltanto: quadrato, esagonale e rettangolare", "10 reticoli di Bravais e 32 gruppi puntuali bidimensionali"],c:0,
e:"La lista 2D serve per grafene, superfici e problemi d'esame «giocattolo». I 17 gruppi del piano sono quelli dei mosaici (Esercitazione 15)."},
{id:"o33",b:"sol",q:"La cella convenzionale dell'FCC contiene:",
o:["4 punti reticolari (8 vertici/8 + 6 facce/2), contro 1 della primitiva", "1 punto reticolare, esattamente come la cella primitiva", "2 punti reticolari, come nella cella del cubico a corpo centrato", "14 punti reticolari, uno per ciascun reticolo di Bravais"],c:0,
e:"8·(1/8) + 6·(1/2) = 4. Si usa perché rende evidente la simmetria cubica: i vettori primitivi (metà diagonali di faccia) la nascondono. BCC: 2 punti (Esercitazione 15)."},
{id:"o34",b:"sol",q:"I vettori primitivi standard dell'FCC di lato a sono:",
o:["Le semi-diagonali delle facce, (a/2)(x̂+ŷ) e cicliche", "I tre spigoli del cubo convenzionale, cioè a·x̂", "Le semi-diagonali di corpo, cioè (a/2)(x̂+ŷ+ẑ) e permutazioni", "Non esistono vettori primitivi per un reticolo a facce centrate"],c:0,
e:"Generano tutti i punti (vertici + centri faccia) con volume a³/4 (= a³/4 punti per cella convenzionale ✓). Il BCC usa invece combinazioni con la diagonale di corpo (Esercitazione 15)."},
{id:"o35",b:"sol",q:"Le distanze dei primi vicini in SC, BCC e FCC (lato a) sono rispettivamente:",
o:["a; (√3/2)a; a/√2", "a; a/2; a", "a/2; a; 2a", "a; (√2/2)a; (√3/2)a"],c:0,
e:"SC: lungo gli spigoli. BCC: dal centro al vertice = metà diagonale di corpo = √3a/2 ≈ 0,87a. FCC: metà diagonale di faccia = a/√2 ≈ 0,71a. Servono per raggio atomico e fattore di riempimento (Esercitazione 15)."},
{id:"o36",b:"sol",q:"I fattori di riempimento (sfere rigide) di SC, BCC, FCC valgono:",
o:["0,52; 0,68; 0,74", "0,74; 0,68; 0,52", "0,34; 0,52; 0,68", "0,90; 0,74; 0,68"],c:0,
e:"f = (volume sfere)/(volume cella) con r = metà distanza primi vicini. FCC (e hcp) = massimo assoluto π/√18 ≈ 0,74. Esercizio standard «8 punti» dell'Esercitazione 15."},
{id:"o37",b:"sol",q:"Nel confronto 2D, il reticolo esagonale (triangolare) impacchetta meglio del quadrato:",
o:["f<sub>ex</sub> = π/(2√3) ≈ 0,907 contro f<sub>q</sub> = π/4 ≈ 0,785", "f = 0,785 per l'esagonale contro 0,907 per il quadrato", "Sono esattamente uguali: entrambi valgono circa 0,85", "Vince il reticolo quadrato, che impacchetta più densamente"],c:0,
e:"Ogni disco esagonale ha 6 vicini contro 4: è il modo più denso di riempire il piano (arance del fruttivendolo). Calcolo con area cella = |a₁×a₂| (Esercitazione 15)."},
{id:"o38",b:"sol",q:"La struttura kagome si descrive come:",
o:["Reticolo di Bravais esagonale con base di 3 atomi (0", "Un reticolo di Bravais a sé stante, il quattordicesimo", "Un reticolo quadrato con una base di due atomi distinti", "Un reticolo a nido d'ape con base di due atomi equivalenti"],c:0,
e:"Triangoli con i vertici condivisi: 4 primi vicini a distanza a/2, tre sottoreticoli. Problema «14 punti» assegnato per casa nell'Esercitazione 15 — buon test di tutto il formalismo Bravais+base."},
{id:"o39",b:"sol",q:"Nel reticolo a nido d'ape (grafene), il numero di coordinazione è:",
o:["3: ogni atomo ha tre primi vicini (dell'altro sottoreticolo)", "6, come nel reticolo quadrato bidimensionale", "4, come nella struttura tetraedrica del diamante", "12, come nelle strutture compatte FCC e hcp"],c:0,
e:"I tre vicini di un sito A sono tutti B e viceversa: struttura bipartita. Non è il massimo impacchettamento: è la chimica sp² a imporre 3 legami a 120° (Esercitazione 15)."},
{id:"o40",b:"sol",q:"Nella struttura del diamante, la distanza tra i primi vicini vale:",
o:["(√3/4)a ≈ 0,43a: dal sito (0,0,0) al sito (¼,¼,¼)a", "a/√2, come la distanza fra primi vicini nell'FCC", "a/2, cioè metà del lato della cella convenzionale", "(√3/2)a, come nel reticolo cubico a corpo centrato"],c:0,
e:"Un quarto della diagonale di corpo. Da qui r = √3a/8 e f = √3π/16 ≈ 0,34: la struttura più «vuota» tra quelle comuni, tenuta insieme dai legami covalenti tetraedrici (Esercitazione 15)."},
{id:"o41",b:"sol",q:"La zincoblenda (GaAs, ZnS) differisce dal diamante perché:",
o:["I due sottoreticoli ospitano specie atomiche diverse", "Possiede un reticolo di Bravais esagonale anziché cubico", "Ha numero di coordinazione pari a 6 invece che a 4", "Non è affatto una struttura cubica ma tetragonale"],c:0,
e:"Stessa geometria (FCC + base a ¼ diagonale), atomi diversi sui due siti: Ga su uno, As sull'altro. È la struttura dei semiconduttori III-V; la differenza si vede nel fattore di struttura (f<sub>Ga</sub> ≠ f<sub>As</sub>: alcune estinzioni saltano)."},
{id:"o42",b:"sol",q:"Il rapporto c/a ideale della struttura hcp (sfere rigide compatte) è:",
o:["c/a = √(8/3) ≈ 1,633, con 12 primi vicini", "c/a = 1, cioè cella con altezza pari al lato di base", "c/a = 2, cioè cella allungata lungo l'asse verticale", "c/a = √2, come il rapporto delle diagonali del quadrato"],c:0,
e:"Impacchettamento ABAB…: la geometria del tetraedro fissa c/a. Metalli reali deviano poco (Zn parecchio): la coordinazione resta ~12 come nell'FCC (che è ABCABC…) (Esercitazione 15)."},
{id:"o43",b:"sol",q:"Il volume della cella esagonale semplice (lati a, a, c) è:",
o:["V = (√3/2)a²c", "V = a²c, come per una cella a base quadrata", "V = (1/2)a²c, cioè metà del prisma a base quadrata", "V = √3·a³, indipendente dall'altezza c della cella"],c:0,
e:"Base a rombo 120°: area |a₁×a₂| = (√3/2)a². Necessario per il reticolo reciproco (b ∝ 1/V) e per le densità: esercizio d'obbligo prima di affrontare grafite o hcp (Esercitazioni 15-16)."},
{id:"o44",b:"sol",q:"Le celle di Wigner–Seitz di BCC e FCC sono rispettivamente:",
o:["Ottaedro troncato (BCC) e dodecaedro rombico (FCC)", "Dodecaedro rombico (BCC) e ottaedro troncato (FCC)", "Due cubi", "Due sfere"],c:0,
e:"⚠ Attenzione all'incrocio: BCC → ottaedro troncato; FCC → dodecaedro rombico. E poiché i reciproci si scambiano (FCC↔BCC), la 1ª zona di Brillouin dell'FCC è l'ottaedro troncato. Trappola da quiz frequentissima (Esercitazioni 15-16)."},
{id:"o45",b:"sol",q:"Le notazioni (hkl), [hkl], {hkl}, ⟨hkl⟩ indicano rispettivamente:",
o:["Piani; direzione diretta; piani equivalenti; direzioni equivalenti", "Direzione; piano; punto reticolare; vettore del reticolo reciproco duale", "Sono tutte notazioni equivalenti fra loro, usate indifferentemente", "Piano; piano; direzione; direzione, a coppie sinonime"],c:0,
e:"Convenzione internazionale: parentesi tonde = piani, quadre = direzioni, graffe/angolari = classi di equivalenza. Nei cubici [hkl] ⊥ (hkl), ma NON in generale (Esercitazione 16)."},
{id:"o46",b:"sol",q:"Come si trovano gli indici di Miller di un piano dalle intercette p, q, r sugli assi cristallini?",
o:["Si prendono i reciproci 1/p, 1/q, 1/r e si riducono ai più piccoli interi", "Si usano direttamente le intercette p, q, r sui tre assi cristallini", "Si sommano fra loro le intercette misurate lungo i tre assi", "Si moltiplicano le intercette per il volume della cella unitaria"],c:0,
e:"Piano che taglia a 1, ½, ⅓ → (1 2 3). Intercetta all'infinito → indice 0 (piano parallelo all'asse). Segni negativi con la barra sopra. Meccanismo da eseguire al volo nei quiz (Esercitazione 16)."},
{id:"o47",b:"sol",q:"Nei reticoli cubici, la famiglia di piani con distanza interplanare MASSIMA è quella:",
o:["A indici più bassi, es. (100) o (111) a seconda del reticolo", "A indici più alti, corrispondenti a vettori reciproci grandi", "La famiglia (220), indipendentemente dal tipo di reticolo", "Tutte le famiglie hanno la stessa distanza interplanare"],c:0,
e:"d ∝ 1/√(h²+k²+l²): piani «radi» = indici bassi = angoli di Bragg piccoli = primi picchi del diffrattogramma. Nel powder del Si il primo picco è il (111) — con le estinzioni FCC a decidere chi appare (Esercitazione 16)."},
{id:"o48",b:"sol",q:"Un reticolo 2D obliquo ha a₁ = 0,4x̂ e a₂ = 0,1x̂+0,2ŷ (nm). Il reciproco si costruisce imponendo:",
o:["Imponendo b<sub>i</sub>·a<sub>j</sub> = 2πδ<sub>ij</sub>, due equazioni per ciascun b", "Ponendo b<sub>i</sub> = 2π/a<sub>i</sub> componente per componente", "Imponendo che ogni b<sub>i</sub> sia perpendicolare al corrispondente a<sub>i</sub>", "Non è possibile: il reticolo reciproco esiste solo in 3D"],c:0,
e:"In 2D niente prodotti vettoriali: si risolve il sistema (b₁ ⊥ a₂ con b₁·a₁ = 2π, ecc.). Il reciproco di un obliquo è obliquo, RUOTATO rispetto al diretto. Problema 1 svolto dell'Esercitazione 16."},
{id:"o49",b:"sol",q:"Il reticolo reciproco dell'esagonale semplice è:",
o:["Ancora esagonale, ma ruotato di 30° attorno all'asse c", "Un reticolo cubico semplice di lato inversamente proporzionale", "Un reticolo obliquo generico, privo di simmetria esagonale", "Ancora esagonale e con lo stesso orientamento del diretto"],c:0,
e:"La rotazione di 30° è il dettaglio che frega: le direzioni Γ→M e Γ→K della zona di Brillouin non coincidono con a₁, a₂. Fondamentale per grafene e grafite (Esercitazione 16, problema 3)."},
{id:"o50",b:"sol",q:"La prima zona di Brillouin dell'esagonale è un prisma esagonale con punti di alta simmetria:",
o:["Γ (centro), M (centro spigolo), K (vertice), più A, L", "Soltanto i due punti Γ al centro e X al bordo della zona", "I punti Γ, X, W, come nella zona di Brillouin dell'FCC", "Non possiede punti di alta simmetria degni di nota"],c:0,
e:"Nomenclatura standard delle bande: nel grafene i celebri coni di Dirac stanno nei punti K. Saper disegnare l'esagono con Γ, M, K è richiesto negli esercizi (Esercitazione 16)."},
{id:"o51",b:"sol",q:"Per un cristallo cubico semplice, i rapporti |K|/|K₁₀₀| dei primi vettori del reticolo reciproco sono:",
o:["1, √2, √3, 2, √5…, cioè le radici di h²+k²+l²", "1, 2, 3, 4…, cioè i numeri interi in successione", "1, √3, √5…, cioè le radici dei soli numeri dispari", "Tutti uguali a 1, perché il reticolo è isotropo"],c:0,
e:"Dai moduli √(h²+k²+l²)·(2π/a): la sequenza dei picchi di diffrazione. Per BCC mancano i dispari (estinzioni), per FCC restano solo parità concordi: la SEQUENZA dei picchi identifica il reticolo (Esercitazione 16, problema B)."},
{id:"o52",b:"sol",q:"La densità di un cristallo si calcola dalla struttura come:",
o:["ρ = (n·M)/(N<sub>A</sub>·V<sub>cella</sub>): n unità di formula per cella convenzionale", "ρ = M/V<sub>cella</sub>, senza il numero di unità di formula", "ρ = n·N<sub>A</sub>/V<sub>cella</sub>, senza la massa molare", "Non è calcolabile senza una misura sperimentale diretta"],c:0,
e:"Verifica incrociata classica dei problemi di diffrazione: dal parametro a (via Bragg) e dalla densità misurata si conferma il numero di unità per cella (es. CaF₂: 4 unità → ρ ≈ 3200 kg/m³ ✓) (Esercitazione 16, problema g)."},
{id:"o53",b:"sol",q:"Perché la cella primitiva di un reticolo con base NON può essere più piccola della cella del Bravais sottostante?",
o:["La base viaggia intera con ogni punto reticolare", "Può esserlo, se gli atomi della base sono abbastanza piccoli", "Perché gli atomi della base si respingono elettrostaticamente", "La domanda è mal posta: la cella primitiva non è definita"],c:0,
e:"Errore comune: contare gli atomi come punti reticolari. Nel grafene la cella primitiva contiene SEMPRE 2 atomi; nel kagome 3. Il reticolo è un'astrazione geometrica, la base è la materia (Esercitazione 15)."},
{id:"o54",b:"sol",q:"Quali reticoli di Bravais cubici esistono?",
o:["Solo P, I ed F: il cubico a basi centrate non è nuovo", "P, I, F e anche C, cioè il cubico a basi centrate", "Soltanto P ed F, mentre il corpo centrato è tetragonale", "Uno soltanto, il cubico semplice, da cui derivano gli altri"],c:0,
e:"Un cubico C si riduce a un tetragonale più piccolo: non è un reticolo nuovo. I centraggi ammissibili variano da sistema a sistema (i 14 Bravais nascono proprio da questo conteggio) (Esercitazione 15)."},
// ---- Solido: diffrazione (Es. 16) ----
{id:"o55",b:"sol",q:"Nella diffrazione di von Laue, l'ampiezza diffusa è proporzionale a:",
o:["La trasformata di Fourier della densità elettronica", "La somma di tutte le distanze interatomiche del cristallo", "Il numero totale di elettroni contenuti nel campione", "Il volume del cristallo elevato al quadrato"],c:0,
e:"Ogni elettrone ridiffonde l'onda con la propria fase: la diffrazione È un'analisi di Fourier del cristallo. Scomponendo r<sub>j</sub> = R<sub>n</sub> + r<sub>base</sub>: (somma reticolare) × (fattore di struttura) (Esercitazione 16)."},
{id:"o56",b:"sol",q:"La somma reticolare Σ<sub>n</sub> e^(−iq·R<sub>n</sub>) è non trascurabile solo quando:",
o:["q coincide con un vettore G del reticolo reciproco", "Il vettore di scattering q è sufficientemente piccolo", "Il vettore q risulta perpendicolare al fascio incidente", "Mai: la somma reticolare è sempre trascurabile"],c:0,
e:"Se q ≠ G le fasi si distribuiscono sul cerchio unitario e si cancellano (N ~ 10²³ termini!); se q = G interferenza costruttiva totale. È la condizione di Laue: la definizione operativa del reticolo reciproco (Esercitazione 16)."},
{id:"o57",b:"sol",q:"Il fattore di forma atomico f(q) per q → 0 tende a:",
o:["Z, il numero di elettroni dell'atomo", "Zero, perché le fasi dei diversi elettroni si cancellano", "Uno, indipendentemente dalla specie atomica considerata", "Infinito, perché la densità elettronica non è normalizzabile"],c:0,
e:"f(q) = ∫ρ(u)e^(−iq·u)d³u → ∫ρ = Z. A q crescenti f decade (interferenza interna alla nuvola): per questo i picchi ad alto angolo sono deboli. Nei problemi tipo BaTiO₃ si usano rapporti f<sub>Ba</sub> = 7f<sub>O</sub> ecc. (Esercitazione 16)."},
{id:"o58",b:"sol",q:"Perché nell'esperimento di diffrazione X si vede il reticolo RECIPROCO e non quello diretto?",
o:["Lo schermo lontano registra le direzioni k′ = k+G", "Per un difetto intrinseco degli strumenti di rivelazione", "In realtà si vede il reticolo diretto fortemente ingrandito", "Perché i raggi X non interagiscono affatto"],c:0,
e:"La misura è nello spazio dei momenti: reticoli grandi nello spazio reale danno pattern fitti nello spazio reciproco e viceversa (dualità di Fourier). Ricostruire il reticolo diretto richiede l'antitrasformata — e le fasi perdute (Esercitazione 16)."},
{id:"o59",b:"sol",q:"Il fattore di struttura del silicio (FCC + base di 2 a ¼ diagonale) modula i picchi FCC con il fattore [1+e^(−iπ(h+k+l)/2)]. Risultato:",
o:["Pieni per h+k+l = 4n, dimezzati se dispari, estinti se 4n+2", "Tutti i picchi consentiti dall'FCC sopravvivono con pari intensità", "Restano soltanto i picchi con somma degli indici dispari", "Il silicio non produce alcun picco di diffrazione misurabile"],c:0,
e:"|1+e^(−iπm/2)|²: m = 4n → 4; m dispari → 2; m = 4n+2 → 0. Nel powder del Si: I(111)/I(220) = 1/2 (calcolato nel problema 6 dell'Esercitazione 16). Il diamante «cancella» ulteriori picchi dell'FCC."},
{id:"o60",b:"sol",q:"Nella diffrazione da polveri di un cubico, per indicizzare i picchi si usa:",
o:["sen²θ ∝ h²+k²+l², da cui i rapporti fra i picchi", "La larghezza a metà altezza dei picchi di diffrazione", "L'intensità assoluta misurata per ciascun picco osservato", "Il colore assunto dal campione policristallino in polvere"],c:0,
e:"Da Bragg: senθ = λ√(h²+k²+l²)/2a. Sequenze: SC 1,2,3,4,5,6,8…; BCC 2,4,6,8…; FCC 3,4,8,11… Le assenze sistematiche identificano il Bravais; poi da un picco si ricava a (problema CaF₂, Esercitazione 16)."},
{id:"o61",b:"sol",q:"Perché il fattore di struttura del BCC (F = 0 per h+k+l dispari) «ricostruisce» il reciproco giusto?",
o:["Eliminando i punti estinti dal reciproco SC resta un FCC", "È soltanto una coincidenza numerica priva di significato", "Non esiste alcun legame fra estinzioni e reticolo reciproco", "Perché un reticolo a corpo centrato non diffrange affatto"],c:0,
e:"Doppio controllo di coerenza: si può descrivere il BCC come Bravais puro (reciproco FCC) o come SC+base (SC reciproco × estinzioni). I due percorsi DEVONO coincidere — e coincidono (Esercitazione 16, problema 5)."},
{id:"o62",b:"sol",q:"Per il CaF₂ (powder, Cu K<sub>α</sub>), dai primi 4 angoli di Bragg si ricava a ≈ 0,545 nm. Quale verifica indipendente chiede il problema?",
o:["Confrontare la densità calcolata (4 unità CaF₂ per cella FCC)", "Misurare la temperatura di fusione del composto cristallino", "Contare quanti picchi risultano mancanti nel diffrattogramma", "Non è possibile alcuna verifica indipendente del risultato"],c:0,
e:"ρ = 4M/(N<sub>A</sub>a³): chiude il cerchio tra diffrazione e proprietà macroscopiche. Schema di problema completo: indicizzare → a → densità (Esercitazione 16, problema g)."},
{id:"o63",b:"sol",q:"Nella perovskite BaTiO₃ (SC + base di 5 atomi), le intensità relative dei picchi dipendono da:",
o:["Le somme pesate dei fattori di forma con le fasi della base", "Soltanto dal tipo di reticolo di Bravais sottostante alla struttura", "Soltanto dalla lunghezza d'onda della radiazione impiegata", "Dal volume complessivo del campione policristallino analizzato"],c:0,
e:"Nessuna estinzione totale (base complessa), ma forti modulazioni: il problema h dell'Esercitazione 16 calcola [200]:[111]:[110]:[100] = 169:49:81:9. L'intensità dei picchi «legge» la base."},
{id:"o64",b:"sol",q:"Che lunghezza d'onda serve per fare diffrazione su un cristallo (a ~ 0,3–0,5 nm)?",
