e:"dH/dt = 0 ⟺ f(v₁)f(v₂) = f(v₁′)f(v₂′) per ogni urto: la soluzione con i vincoli di energia e quantità di moto è la maxwelliana. Collega dinamica (urti) e statistica (canonico)."},
{id:"s92",b:"sta",q:"La costante β = 1/k<sub>B</sub>T che compare nel canonico si identifica fisicamente perché:",
o:["Due sistemi in contatto termico all'equilibrio condividono lo stesso β: è la variabile coniugata dell'energia scambiata","È una definizione arbitraria","Deriva dalla legge di Ohm","Coincide con la frequenza degli urti"],c:0,
e:"Massimizzando i microstati totali di due sistemi che scambiano energia: ∂lnΓ₁/∂E₁ = ∂lnΓ₂/∂E₂ ≡ β. Il confronto col gas ideale (termometro) fissa β = 1/k<sub>B</sub>T. Domanda ricorrente all'orale («beta statistica»)."},
{id:"s93",b:"sta",q:"Un oscillatore 3D isotropo all'equilibrio termico classico ha energia media:",
o:["3k<sub>B</sub>T: sei termini quadratici (3 cinetici + 3 elastici)","(3/2)k<sub>B</sub>T","6k<sub>B</sub>T","k<sub>B</sub>T"],c:0,
e:"Ogni direzione contribuisce con k<sub>B</sub>T (½ cinetico + ½ potenziale). Moltiplicando per N atomi: U = 3Nk<sub>B</sub>T → c = 3Nk<sub>B</sub> = 3R per mole: Dulong–Petit, il punto di partenza di tutta la teoria dei solidi (Esercitazione 8)."},
{id:"s94",b:"sta",q:"Perché i gradi di libertà rotazionali delle molecole biatomiche contribuiscono con k<sub>B</sub>T (2 × ½) e non (3/2)k<sub>B</sub>T?",
o:["La rotazione attorno all'asse molecolare ha momento d'inerzia ~nullo: il suo quanto ħ²/2I è gigantesco e resta congelato","Le molecole non ruotano mai attorno a due assi","Per la conservazione della parità","Perché l'energia rotazionale non è quadratica"],c:0,
e:"I due assi trasversi sono eccitabili (I grande, quanti piccoli), quello longitudinale no. Il congelamento quantistico dei gradi di libertà spiega i «gradini» del calore specifico dei gas biatomici (5/2 R a RT)."},
{id:"s95",b:"sta",q:"Nella statistica del paramagnete, l'uso della distribuzione di Maxwell–Boltzmann per gli ioni magnetici è giustificato perché:",
o:["Gli ioni sono localizzati e diluiti: distinguibili per posizione e senza sovrapposizione quantistica","Gli ioni sono bosoni","La temperatura è sempre alta","Il campo magnetico rende classico il sistema"],c:0,
e:"Ogni ione è etichettato dal suo sito nella matrice: Z<sub>N</sub> = Z₁<sup>N</sup>. La quantizzazione resta nei LIVELLI (m<sub>J</sub> discreti), ma la statistica di occupazione è di Boltzmann (Esercitazioni 9 e 17)."},
{id:"s96",b:"sta",q:"Il rapporto delle popolazioni di due livelli separati da ΔE all'equilibrio è:",
o:["N₂/N₁ = (g₂/g₁)·e^(−ΔE/k<sub>B</sub>T): Boltzmann pesato con le degenerazioni","N₂/N₁ = ΔE/k<sub>B</sub>T","N₂/N₁ = 1 sempre","N₂/N₁ = e^(+ΔE/k<sub>B</sub>T)"],c:0,
e:"Base di: intensità delle righe spettrali, popolamenti rotazionali (massimo a K intermedio per il fattore 2K+1!), MASER, e del criterio ΔE vs k<sub>B</sub>T per «quali livelli contano» (Esercitazioni 7, 9, 17)."},
{id:"s97",b:"sta",q:"Il paradosso di Gibbs scompare naturalmente nel conteggio quantistico perché:",
o:["Le particelle identiche sono indistinguibili per principio: gli stati che differiscono per permutazioni sono UN solo stato","La quantizzazione elimina l'entropia","Il volume è discreto","I gas quantistici non si mescolano"],c:0,
e:"Il fattore 1/N!, ad hoc nel classico, è automatico in FD/BE (la funzione d'onda è simmetrizzata). MB con 1/N! è il limite corretto di entrambe: la meccanica quantistica «ripara» la termodinamica classica."},
{id:"s98",b:"sta",q:"Per un sistema a due livelli con degenerazioni g₀ = 1 e g₁ = 2 (gap Δ), la Z di singola particella è:",
o:["Z₁ = 1 + 2e^(−βΔ)","Z₁ = 3e^(−βΔ)","Z₁ = 1 + e^(−2βΔ)","Z₁ = 2 + e^(−βΔ)"],c:0,
e:"Somma sugli stati: 1 dal fondamentale + 2 dal livello eccitato. A T → ∞: popolazioni 1/3–2/3 (non ½–½!) e S → Nk<sub>B</sub>ln3. Le degenerazioni cambiano i limiti: trappola da tema d'esame."},
{id:"s99",b:"sta",q:"L'energia interna di un paramagnete J = ½ in campo B (livelli ±μ<sub>B</sub>B) all'equilibrio è U = −Nμ<sub>B</sub>B·tanh(μ<sub>B</sub>B/k<sub>B</sub>T). Il lavoro magnetico e il calore scambiati si distinguono perché:",
o:["dU = TdS − μ₀MdH: variare B a T fissa fa entrambi; il calore è legato al riordino delle popolazioni","Non c'è mai scambio di calore","Il lavoro magnetico è sempre nullo","U dipende solo da T"],c:0,
e:"Base della smagnetizzazione adiabatica: magnetizzo a T costante (cedo calore), poi riduco B a S costante → T crolla. Tecnica standard per raggiungere i mK con i sali paramagnetici (Esercitazioni 9 e 17)."},
{id:"s100",b:"sta",q:"Nella smagnetizzazione adiabatica di un sale paramagnetico, la temperatura scende perché:",
o:["A S costante il rapporto μB/k<sub>B</sub>T deve restare invariato: riducendo B, T scende proporzionalmente","Il campo magnetico raffredda direttamente gli spin","L'entropia aumenta","Si compie lavoro sul sistema"],c:0,
e:"S dipende da B/T (dal rapporto a): l'isoentropica è B/T = cost. Limite pratico: le interazioni residue tra spin (campo interno) fermano la discesa. Applicazione da orale della statistica del paramagnete."},
// ---- Trasporto: Drude e Joule (Es. 11, dispensa) ----
{id:"t31",b:"tra",q:"La densità di elettroni di conduzione di un metallo si stima come n = ρ<sub>m</sub>N<sub>A</sub>Z′/M (Z′ = valenza). Per il rame dà:",
o:["n ≈ 8,5·10²⁸ m⁻³: circa un elettrone per atomo, un gas densissimo","n ≈ 10²³ m⁻³, come un gas rarefatto","n ≈ 10³⁵ m⁻³","n ≈ 10¹⁹ m⁻³ come nei semiconduttori"],c:0,
e:"Ogni atomo di Cu cede ~1 elettrone 4s. Il «gas» di Drude è 1000 volte più denso di un gas reale: per questo la statistica classica fallirà (serve Fermi–Dirac). Numero da ricordare per le stime."},
{id:"t32",b:"tra",q:"L'esperimento di Tolman–Stewart (1916) dimostrò che:",
o:["I portatori di carica nei metalli sono gli elettroni: frenando bruscamente una bobina si misura e/m dei portatori","La resistenza cresce con T","Esistono le lacune","La carica è quantizzata"],c:0,
e:"L'inerzia dei portatori genera un impulso di corrente al frenamento: e/m compatibile con l'elettrone. Accordo buono per alcalini e nobili; anomalie altrove (segno!) anticipano lacune e teoria delle bande (dispensa di trasporto)."},
{id:"t33",b:"tra",q:"Nel modello di Drude gli urti avvengono «con gli ioni». Che cosa mostra l'esperimento a basse temperature?",
o:["Il cammino libero medio può diventare centimetrico: gli elettroni NON urtano con gli ioni del reticolo perfetto, ma con difetti e vibrazioni","Che ℓ resta sempre ~1 nm","Che gli urti sono con gli altri elettroni","Che τ non dipende da T"],c:0,
e:"A RT ℓ = v·τ ≈ 1 nm ~ passo reticolare (plausibile per Drude); ma in cristalli puri e freddi ℓ ~ cm! Il teorema di Bloch spiegherà: un reticolo PERFETTO non diffonde; diffondono fononi e impurezze."},
{id:"t34",b:"tra",q:"L'equazione del moto media degli elettroni di Drude con forza esterna F è:",
o:["dp/dt = F − p/τ: gli urti agiscono come un attrito viscoso","dp/dt = F","dp/dt = −p/τ soltanto","dp/dt = F + p/τ"],c:0,
e:"Il termine −p/τ rappresenta la perdita media di quantità di moto negli urti (probabilità dt/τ). A regime stazionario p = Fτ → v<sub>d</sub> = −eEτ/m → legge di Ohm. Con B si ottiene l'effetto Hall dalla stessa equazione."},
{id:"t35",b:"tra",q:"Dopo un urto, secondo Drude, l'elettrone riparte con:",
o:["Velocità termica di modulo dettato dalla T LOCALE e direzione casuale isotropa: è così che il gas termalizza","La stessa velocità di prima","Velocità nulla esattamente","Velocità di deriva v<sub>d</sub>"],c:0,
e:"Assunzione 4: gli urti sono l'UNICO meccanismo di termalizzazione. La memoria della deriva si perde a ogni urto (⟨v<sub>T</sub>⟩<sub>dir</sub> = 0): il campo la ricostruisce nel tempo medio τ (Esercitazione 11)."},
{id:"t36",b:"tra",q:"L'energia media guadagnata da un elettrone tra due urti in campo E è ⟨ΔE⟩ = (eE)²⟨t²⟩/2m. Il termine con v<sub>T</sub>·cosθ non contribuisce perché:",
o:["La media sulle direzioni iniziali (isotrope) lo annulla: ∫cosθ·senθ dθ = 0","È piccolo","La velocità termica è nulla","Il campo è debole"],c:0,
e:"⟨v<sub>T</sub>⟩<sub>dir</sub> = 0 componente per componente. Sopravvive solo il termine quadratico nel campo: con ⟨t²⟩ = 2τ² si ottiene P = σE², l'effetto Joule microscopico (Esercitazione 11, problema 1.2 di Ashcroft–Mermin)."},
{id:"t37",b:"tra",q:"La probabilità che un elettrone NON subisca urti per un tempo t è:",
o:["P(t) = e^(−t/τ): decadimento esponenziale (processo di Poisson senza memoria)","P(t) = 1 − t/τ per ogni t","P(t) = (t/τ)e^(−t/τ)","P(t) = costante"],c:0,
e:"Dal limite (1−Δt/τ)^(t/Δt) → e^(−t/τ). La densità di probabilità dell'intervallo tra urti è (1/τ)e^(−t/τ): eventi rari e indipendenti, stessa statistica dei decadimenti radioattivi (Esercitazione 11, problema 1.1)."},
{id:"t38",b:"tra",q:"Il «paradosso del tram» applicato agli urti di Drude spiega perché:",
o:["Osservando in un istante a caso, l'intervallo tra l'ultimo e il prossimo urto dura in media 2τ, non τ: si campionano di preferenza gli intervalli lunghi","τ dipende dalla velocità","Gli urti sono correlati","⟨t⟩ = τ/2"],c:0,
e:"È il modo intuitivo di capire ⟨t²⟩ = 2τ²: l'errore di Drude (usare τ² nell'effetto Joule) veniva proprio da qui. Aneddoto che il docente usa per la statistica di Poisson (dispensa di trasporto)."},
{id:"t39",b:"tra",q:"Nel bilancio energetico elettrone–reticolo (urti anelastici), in media:",
o:["Il reticolo assorbe ΔE ≈ mv<sub>d</sub>² per urto: il conduttore si scalda (Joule) mentre il gas elettronico resta stazionario","L'elettrone guadagna sempre energia","Il reticolo cede energia agli elettroni","Non c'è scambio netto"],c:0,
e:"Se l'elettrone arriva «col vento» (v<sub>T</sub>+v<sub>d</sub>) cede di più di quanto riprenda quando arriva controvento: la somma dei due casi dà −mv<sub>d</sub>² &lt; 0 per il gas. L'energia del generatore finisce nel reticolo (Esercitazione 11)."},
{id:"t40",b:"tra",q:"Nella geometria di Hall (B lungo z, corrente lungo x), il campo di Hall E<sub>y</sub> nasce perché:",
o:["La forza di Lorentz accumula carica sui bordi finché il campo trasverso non bilancia esattamente la deviazione: a regime j<sub>y</sub> = 0","Il campo B accelera gli elettroni lungo y indefinitamente","La resistenza aumenta con B","Gli ioni si spostano"],c:0,
e:"Equilibrio trasverso: −eE<sub>y</sub> = −ev<sub>d</sub>B → E<sub>y</sub> = v<sub>d</sub>B → R<sub>H</sub> = E<sub>y</sub>/(j<sub>x</sub>B) = −1/ne. La tensione di Hall si misura a corrente trasversa nulla (dispensa di trasporto)."},
{id:"t41",b:"tra",q:"La conducibilità AC di Drude è σ(ω) = σ₀/(1−iωτ). Che cosa succede per ωτ ≫ 1?",
o:["σ diventa quasi puramente immaginaria: gli elettroni rispondono come particelle libere e la dissipazione crolla","σ diverge","σ resta reale e costante","La corrente si annulla esattamente"],c:0,
e:"Ad alta frequenza gli urti non fanno in tempo: risposta inerziale (sfasata di 90°). In questo regime la funzione dielettrica diventa ε<sub>r</sub> = 1 − ω<sub>p</sub>²/ω²: il ponte tra Drude e l'ottica dei metalli."},
{id:"t42",b:"tra",q:"Il valore misurato di ħω<sub>p</sub> per l'alluminio (≈ 15,8 eV) conferma il modello di Drude perché:",
o:["Coincide con √(ne²/mε₀) calcolata con n = 3 elettroni per atomo: il conteggio dei portatori è giusto","È uguale per tutti i metalli","È molto minore del previsto","Dipende dalla temperatura come previsto"],c:0,
e:"Per Al (trivalente) il calcolo dà ~15,8 eV: accordo eccellente. Per i metalli nobili l'accordo peggiora (elettroni d legati che schermano): limite del modello a elettroni liberi (dispensa di trasporto)."},
{id:"t43",b:"tra",q:"Come si misura sperimentalmente l'energia dei plasmoni?",
o:["Con l'EELS: gli elettroni trasmessi attraverso un film sottile perdono energia in multipli interi di ħω<sub>p</sub>","Con l'effetto Hall","Con la diffrazione X","Misurando la resistività"],c:0,
e:"Lo spettro delle perdite mostra picchi a ħω<sub>p</sub>, 2ħω<sub>p</sub>…: ogni plasmone eccitato è un quanto di oscillazione collettiva. Tecnica citata anche per la spettroscopia dei solidi (dispensa di trasporto)."},
{id:"t44",b:"tra",q:"La conducibilità termica elettronica nel modello cinetico è k = (1/3)v²τ·c<sub>V</sub> (per unità di volume). Drude la combina con σ e trova L ≈ giusto. Dove si annidano i DUE errori compensanti?",
o:["c<sub>V</sub> classico è ~100 volte troppo GRANDE e v²<sub>T</sub> è ~100 volte troppo PICCOLA rispetto a v<sub>F</sub>²","Entrambi troppo grandi","τ sbagliato due volte","Nessun errore: il calcolo è corretto"],c:0,
e:"Il caso più celebre di «giusto per caso» della fisica: (3/2)nk<sub>B</sub> vs γT e v<sub>T</sub> vs v<sub>F</sub>. Sommerfeld sistema entrambi e trova L = (π²/3)(k<sub>B</sub>/e)², ancora in accordo — stavolta per ragioni giuste (dispensa)."},
{id:"t45",b:"tra",q:"Il potere termoelettrico Q (Seebeck) nel modello di Drude viene ~100 volte troppo grande perché:",
o:["Q ∝ c<sub>V</sub> per elettrone, e Drude usa il valore classico (3/2)k<sub>B</sub> invece del valore quantistico soppresso di T/T<sub>F</sub>","Q non dipende da c<sub>V</sub>","La misura era sbagliata","Il gradiente termico distrugge il gas elettronico"],c:0,
e:"Q<sub>Drude</sub> = −k<sub>B</sub>/2e ≈ −43 μV/K vs ~−1 μV/K misurato: stesso fattore ~100 del calore specifico — e stavolta niente compensazione! Q (e i suoi segni anomali → lacune) è un test spietato dei modelli (dispensa)."},
{id:"t46",b:"tra",q:"Nel modello di Sommerfeld le condizioni al contorno di Born–von Karman quantizzano i k come:",
o:["k<sub>j</sub> = (2π/L)n<sub>j</sub>: un stato ogni (2π/L)³ nello spazio k, cioè V/8π³ stati per unità di volume di k (×2 spin)","k<sub>j</sub> = (π/L)n<sub>j</sub> con n &gt; 0 soltanto","k continui senza restrizioni","k<sub>j</sub> = n<sub>j</sub>/L"],c:0,
e:"Onde piane periodiche sul cubo L³. Il conteggio nello spazio k (con il fattore 2 di spin) è LA mossa iniziale di ogni problema: sfera di Fermi, DOS, Debye, Richardson (dispensa ed Esercitazione 12)."},
{id:"t47",b:"tra",q:"La velocità di Fermi nei metalli vale v<sub>F</sub> ≈ 10⁶ m/s ≈ c/300. Che cosa la rende notevole?",
o:["Esiste anche a T = 0: è imposta dal principio di Pauli, mentre classicamente a T → 0 tutto si fermerebbe","È la velocità di deriva in campo forte","Dipende linearmente da T","È uguale alla velocità termica classica"],c:0,
e:"Gli elettroni al livello di Fermi si muovono velocissimi anche nello stato fondamentale: pura conseguenza dell'esclusione. La v² che entra in Wiedemann–Franz è questa, non la termica (dispensa)."},
{id:"t48",b:"tra",q:"Nella derivazione «per configurazioni» della distribuzione classica, la condizione p(ε₁)p(ε₂) = q(ε₁+ε₂) sugli urti porta a:",
o:["p(ε) ∝ e^(−ε/k<sub>B</sub>T): l'esponenziale è l'unica funzione che trasforma somme in prodotti","p(ε) ∝ ε²","p(ε) costante","p(ε) ∝ 1/ε"],c:0,
e:"Se l'occupazione dipende solo dall'energia e gli urti conservano ε₁+ε₂, il vincolo funzionale impone l'esponenziale: eleganza della derivazione di Maxwell–Boltzmann nelle dispense di trasporto."},
{id:"t49",b:"tra",q:"Aggiungendo il fattore di riduzione (1−n) ai processi d'urto (stato d'arrivo occupato = processo bloccato) si ottiene all'equilibrio:",
o:["La distribuzione di Fermi–Dirac","Ancora Maxwell–Boltzmann","La distribuzione di Planck","Una distribuzione uniforme"],c:0,
e:"Bilancio dettagliato con blocco di Pauli: n/(1−n) = e^(−(ε−μ)/k<sub>B</sub>T) → n<sub>FD</sub>. Con il fattore di accrescimento (1+n) si ottiene invece BE: derivazione delle dispense, alternativa al grancanonico."},
{id:"t50",b:"tra",q:"A T = 0 la distribuzione di Fermi–Dirac è un gradino. A T &gt; 0:",
o:["Si «smussa» solo in una finestra di larghezza ~k<sub>B</sub>T attorno a μ: il 99% degli elettroni non se ne accorge","Diventa una gaussiana","Si sposta rigidamente verso energie più alte","Diventa esponenziale ovunque"],c:0,
e:"k<sub>B</sub>T/ε<sub>F</sub> ~ 10⁻²: la stragrande maggioranza del mare di Fermi resta congelata. Tutta la fisica (c<sub>V</sub>, χ<sub>Pauli</sub>, trasporto) vive in quella finestrella: il concetto più importante del blocco (dispensa)."},
{id:"t51",b:"tra",q:"L'ordine di grandezza corretto di τ, ℓ e v<sub>d</sub> per il rame a temperatura ambiente (E ~ V/m) è:",
o:["τ ~ 10⁻¹⁴ s, ℓ ~ 1–100 nm, v<sub>d</sub> ~ mm/s","τ ~ 10⁻⁶ s, ℓ ~ mm, v<sub>d</sub> ~ km/s","τ ~ 10⁻¹⁴ s, ℓ ~ m, v<sub>d</sub> ~ v<sub>F</sub>","τ ~ 1 s, ℓ ~ nm, v<sub>d</sub> ~ nm/s"],c:0,
e:"τ = m/ρne² ≈ 2,7·10⁻¹⁴ s (numerica ricorrente!); ℓ = v<sub>F</sub>τ ≈ 30 nm; v<sub>d</sub> = eEτ/m ≈ mm/s. Avere questi ordini in testa evita metà degli errori nelle crocette numeriche."},
{id:"t52",b:"tra",q:"Perché la resistività di un metallo CRESCE con la temperatura?",
o:["Aumentano le vibrazioni reticolari (fononi) su cui gli elettroni diffondono: τ diminuisce","Diminuisce il numero di portatori","Aumenta la massa efficace","Cresce il campo elettrico interno"],c:0,
e:"σ = ne²τ/m con n costante (metallo): tutta la dipendenza è in τ(T). Nei semiconduttori invece n(T) esponenziale domina e ρ DIMINUISCE con T: distinzione classica da quiz."},
{id:"t53",b:"tra",q:"Nel tema d'esame sul potassio si confrontano m*/m ottenuta dal calore specifico e dalla resistività di Drude. I due valori differiscono perché:",
o:["γ misura la densità di stati a ε<sub>F</sub> (proprietà di equilibrio), mentre ρ dipende anche da τ e dai meccanismi di scattering","Uno dei due esperimenti è sbagliato","La massa efficace non esiste","m* dipende dal volume del campione"],c:0,
e:"La «massa efficace termica» ingloba interazioni e-fonone ed e-e; quella «di trasporto» mescola m* e τ. Il commento sulle motivazioni intrinseche della differenza era richiesto esplicitamente nel tema di maggio."},
{id:"t54",b:"tra",q:"L'espansione di Sommerfeld è un'espansione in potenze di quale parametro piccolo?",
o:["(k<sub>B</sub>T/ε<sub>F</sub>) = T/T<sub>F</sub> ~ 10⁻² a temperatura ambiente","e²/ħc","1/N","ħω/k<sub>B</sub>T"],c:0,
e:"Il gas è degenere: la finestra termica k<sub>B</sub>T è minuscola rispetto a ε<sub>F</sub>. I termini successivi vanno come (T/T<sub>F</sub>)²: già il primo ordine è accuratissimo. Se T ~ T<sub>F</sub> il modello va abbandonato (Esercitazione 12)."},
// ---- Trasporto: Sommerfeld (Es. 12) e termoionico (Es. 13) ----
{id:"t55",b:"tra",q:"Nell'espansione di Sommerfeld il primo passo è integrare per parti N = ∫f·g dε. Perché i termini di bordo si annullano?",
o:["K(ε) = ∫g → 0 per ε → −∞ (niente stati) e f → 0 esponenzialmente per ε → +∞","Per simmetria della densità di stati","Perché μ = 0","Non si annullano: si trascurano"],c:0,
e:"Resta N = −∫K(ε)(∂f/∂ε)dε: tutta l'azione si concentra dove ∂f/∂ε ≠ 0, cioè nella campana attorno a μ. Primo dei «9 passi» della derivazione da sapere per l'orale (Esercitazione 12)."},
{id:"t56",b:"tra",q:"Nella derivazione di Sommerfeld, la funzione −∂f/∂ε ha un ruolo centrale perché:",
o:["È una campana simmetrica di larghezza ~k<sub>B</sub>T centrata in μ, che a T = 0 diventa δ(ε−μ): «seleziona» gli elettroni attivi","È costante in energia","Coincide con la densità di stati","È la probabilità di occupazione"],c:0,
e:"La simmetria uccide i termini dispari del Taylor (→ solo potenze PARI di T); la normalizzazione a 1 rende lo sviluppo sistematico, con coefficienti a<sub>n</sub> legati alla ζ di Riemann (a₁ = π²/6) (Esercitazione 12)."},
{id:"t57",b:"tra",q:"Il risultato di Sommerfeld per N a primo ordine è N ≈ ∫^μ g dε + (π²/6)(k<sub>B</sub>T)²g′(μ). Da qui, imponendo N costante:",
o:["μ(T) = ε<sub>F</sub> − (π²/6)(k<sub>B</sub>T)²·g′(ε<sub>F</sub>)/g(ε<sub>F</sub>): il potenziale chimico si sposta secondo la PENDENZA della DOS","μ(T) = ε<sub>F</sub> sempre","μ(T) cresce linearmente in T","μ(T) = ε<sub>F</sub>/2 a ogni T"],c:0,
e:"Formula generale valida per QUALSIASI g(ε): con g ∝ √ε dà il celebre −(π²/12)(T/T<sub>F</sub>)²; con g ∝ ε (grafene) −(π²/6); con g costante (2D) μ fermo; con g decrescente μ SALE. Chiave dell'appello sul grafene (Esercitazione 14)."},
{id:"t58",b:"tra",q:"Il calore specifico elettronico si può stimare qualitativamente così: frazione di elettroni eccitabili ~g(ε<sub>F</sub>)k<sub>B</sub>T, energia ~k<sub>B</sub>T ciascuno. Quindi:",
o:["ΔU ~ g(ε<sub>F</sub>)(k<sub>B</sub>T)² → c<sub>V</sub> ∝ g(ε<sub>F</sub>)k<sub>B</sub>²T: stessa struttura del risultato esatto (manca solo il π²/3)","c<sub>V</sub> ∝ T³","c<sub>V</sub> ∝ e^(−ε_F/k_BT)","c<sub>V</sub> indipendente da T"],c:0,
e:"La stima «a mano» riproduce la fisica: conta solo la finestra termica attorno a ε<sub>F</sub>. Saperla fare vale mezzo esame orale: mostra di aver capito il perché, non solo la formula (Esercitazione 12)."},
{id:"t59",b:"tra",q:"Il «box» di relazioni utili del gas di Fermi 3D collega n, k<sub>F</sub>, ε<sub>F</sub>, g(ε<sub>F</sub>). Quale catena è corretta?",
o:["n = k<sub>F</sub>³/3π² ; ε<sub>F</sub> = ħ²k<sub>F</sub>²/2m ; g(ε<sub>F</sub>) = (3/2)n/ε<sub>F</sub>","n = k<sub>F</sub>²/2π ; ε<sub>F</sub> = ħk<sub>F</sub>/m ; g = n·ε<sub>F</sub>","n = k<sub>F</sub>/π ; ε<sub>F</sub> = ħ²k<sub>F</sub>²/m ; g = n/2ε<sub>F</sub>","n = 3π²k<sub>F</sub>³ ; ε<sub>F</sub> = ħ²k<sub>F</sub>/2m ; g = ε<sub>F</sub>/n"],c:0,
e:"Le tre relazioni-cerniera di ogni problema su metalli: dalle prime due si passa da n (misurabile) a ε<sub>F</sub>; la terza collega la DOS al livello di Fermi senza integrali. Impararle come riflesso (Esercitazione 12)."},
{id:"t60",b:"tra",q:"L'energia interna del gas di Fermi ha U(T=0) = (3/5)Nε<sub>F</sub> ≠ 0. Quale osservabile ne segue direttamente?",
o:["La pressione di degenerazione P = (2/5)nε<sub>F</sub> ~ 10¹⁰ Pa: il metallo «spinge» anche a T = 0","La resistività residua","Il calore latente","La suscettività di Curie"],c:0,
e:"P = −∂U/∂V con ε<sub>F</sub> ∝ V^(−2/3). Per Cu: ~4·10¹⁰ Pa, bilanciata dall'attrazione ionica. Nell'appello 2023: ΔP per Δε<sub>F</sub>/ε<sub>F</sub> = 10⁻⁶ ≈ 1 atm! (Esercitazione 14)."},
{id:"t61",b:"tra",q:"Nel grafene (2D, dispersione lineare) la densità di stati è g(ε) ∝ ε. Il problema d'appello mostra che μ(T) si può calcolare ESATTAMENTE:",
o:["μ = ε<sub>F</sub>√(1 − (πk<sub>B</sub>T)²/3ε<sub>F</sub>²), che al primo ordine coincide con l'espansione di Sommerfeld","μ = ε<sub>F</sub> costante","μ = ε<sub>F</sub>(1 + T²)","μ cresce esponenzialmente"],c:0,
e:"Con g ∝ ε l'integrale di FD si fa in forma chiusa: raro caso esattamente risolubile che VALIDA l'espansione di Sommerfeld. Condizione di degenerazione: √(πn)ħv<sub>F</sub> ≫ k<sub>B</sub>T, ampiamente vera (Esercitazione 14, appello 2019)."},
{id:"t62",b:"tra",q:"Se la densità di stati è DECRESCENTE in energia (es. g ∝ 1/√ε), il potenziale chimico con la temperatura:",
o:["SALE: μ(T) &gt; ε<sub>F</sub>, per compensare gli stati «persi» sotto e mantenerne il numero","Scende come sempre","Resta fermo","Diverge"],c:0,
e:"μ(T) = ε<sub>F</sub> − (π²/6)(k<sub>B</sub>T)²g′/g: il segno segue −g′. Graficamente: l'area sotto f·g deve restare N; se g cala, la coda termica «pesa meno» sopra e μ deve salire. Chiesto esplicitamente in un appello (Esercitazione 14)."},
{id:"t63",b:"tra",q:"Nel diodo termoionico, la curva I(ΔV) mostra due regimi. Quello di saturazione è raggiunto quando:",
o:["Tutti gli elettroni emessi dal catodo vengono raccolti: I dipende solo da T (Richardson), non più da ΔV","La carica spaziale domina","Il catodo si esaurisce","ΔV = 0"],c:0,
e:"Sotto V*: nube di carica spaziale, I ∝ ΔV^{3/2} indipendente da T (Child–Langmuir). Sopra V*: I<sub>sat</sub>(T) ∝ T²e^(−φ/k<sub>B</sub>T). Il grafico con i due regimi è da saper disegnare (Esercitazione 13)."},
{id:"t64",b:"tra",q:"Nel calcolo di Richardson–Dushman, il conteggio degli elettroni usa la densità nello spazio dei momenti ñ(p) = 2/h³ e il «volume efficace»:",
o:["S·v<sub>x</sub>Δt: escono solo gli elettroni abbastanza vicini alla superficie e diretti verso di essa","L'intero volume del metallo","Il volume della sfera di Fermi","S·v<sub>F</sub>Δt per tutti"],c:0,
e:"J = (2e/h³)∫dp<sub>y</sub>dp<sub>z</sub>∫<sub>ε&gt;ε_v</sub> v<sub>x</sub>f(ε)dp<sub>x</sub>: l'integrale in p<sub>x</sub> dà k<sub>B</sub>T, i due trasversi le gaussiane 2πmk<sub>B</sub>T → il fattore T² (Esercitazione 13)."},
{id:"t65",b:"tra",q:"La costante di Richardson teorica vale A = 4πemk<sub>B</sub>²/h³ ≈ 120 A/(cm²K²). Il confronto con l'esperimento:",
o:["È buono per metalli semplici (alcalini, nobili); deviazioni si spiegano con la probabilità di riflessione alla barriera e la struttura a bande","È sempre perfetto","Fallisce di 10 ordini di grandezza","Non è mai stato fatto"],c:0,
e:"Il modello assume P<sub>trasmissione</sub> = 1 sopra barriera: quantisticamente c'è riflessione anche con E &gt; φ. L'esponenziale però domina: il fit di φ resta affidabilissimo (Esercitazione 13)."},
{id:"t66",b:"tra",q:"Con due elettrodi di funzioni lavoro diverse (φ<sub>griglia</sub> &lt; φ<sub>catodo</sub>) si osserva corrente anche a ΔV ≈ 0 o leggermente negativa. Perché?",
o:["Il potenziale di contatto tra i due metalli accelera comunque gli elettroni verso la griglia","Per effetto tunnel attraverso il vuoto","Per la carica spaziale","È un artefatto strumentale"],c:0,
e:"I livelli di Fermi si allineano: la differenza φ<sub>M</sub>−φ<sub>G</sub> appare come campo nel vuoto. Il «regime strano V &lt; 0» dell'esercitazione: capirlo richiede il diagramma a bande dei due elettrodi (Esercitazione 13)."},
{id:"t67",b:"tra",q:"Per abbassare la temperatura di lavoro dei filamenti termoemettitori si usano:",
o:["Ricoprimenti a bassa funzione lavoro (es. ossidi, Cs con φ ≈ 1,8 eV) su metalli refrattari come W","Metalli con φ più alta","Campioni più spessi","Campi magnetici intensi"],c:0,
e:"J ∝ e^(−φ/k<sub>B</sub>T): abbassare φ di 2 eV guadagna fattori ~10⁴ a parità di T. Il tungsteno (T<sub>fus</sub> ≈ 3700 K) regge le temperature; il ricoprimento fa l'emissione (Esercitazione 13)."},
{id:"t68",b:"tra",q:"Le tecniche a fascio elettronico (SEM, TEM, LEED, EELS) dipendono dal termoionico perché:",
o:["Il cannone elettronico è un catodo caldo (o a emissione di campo): l'intensità e la stabilità del fascio derivano da Richardson","Usano ioni, non elettroni","Funzionano solo a temperatura ambiente","Misurano direttamente φ"],c:0,
e:"Contesto applicativo citato nell'esercitazione: la fisica «vecchia» del diodo termoionico vive in ogni microscopio elettronico e spettrometro di superficie (Esercitazione 13)."},
{id:"t69",b:"tra",q:"Nel modello semiclassico, un campo E applicato a elettroni di Bloch fa evolvere k secondo:",
o:["ħ·dk/dt = −eE: tutti i k traslano uniformemente nello spazio reciproco","dk/dt = 0: k è fisso","ħ·dk/dt = −eE−p/τ per ogni elettrone","k salta in modo discontinuo"],c:0,
e:"La sfera di Fermi trasla rigidamente finché gli urti (fononi, difetti) la riportano centrata: lo stato stazionario è uno spostamento δk = −eEτ/ħ. Il risultato σ = ne²τ/m è identico a Drude, ma ora si sa CHI conduce (Esercitazione 13)."},
{id:"t70",b:"tra",q:"Perché in un metallo solo gli elettroni vicino alla superficie di Fermi partecipano alla conduzione?",
o:["Solo loro hanno stati vuoti adiacenti in cui spostarsi; quelli profondi sono bloccati da Pauli","Perché sono più veloci","Perché hanno carica maggiore","Perché il campo penetra solo in superficie"],c:0,
e:"La traslazione della sfera è possibile solo «ai bordi»: gli stati interni restano compensati (per ogni k c'è −k). Stessa logica di c<sub>V</sub> e χ<sub>Pauli</sub>: la fisica dei metalli è fisica della superficie di Fermi."},
{id:"t71",b:"tra",q:"La superficie di Fermi di un gas 1D di densità n₁ è composta da:",
o:["Due punti a ±k<sub>F</sub> con k<sub>F</sub> = πn₁/2: il «mare» è un segmento","Un cerchio di raggio k<sub>F</sub>","Una sfera","Un solo punto a k = 0"],c:0,
e:"N = 2·(2k<sub>F</sub>)/(2π/L) → k<sub>F</sub> = πn₁/2 (fattore 2 di spin e ±k). In 2D: cerchio con k<sub>F</sub> = √(2πn₂). Le geometrie 1D/2D sono un problema d'appello (01/07/2025, Esercitazione 14)."},
{id:"t72",b:"tra",q:"In un metallo 1D a T = 0, i processi elastici di scattering sugli stati di Fermi permettono solo:",
o:["q = 2k<sub>F</sub> (backscattering da +k<sub>F</sub> a −k<sub>F</sub>): in 1D la superficie di Fermi sono due punti","Tutti i q ≤ 2k<sub>F</sub>","Solo q = 0","Solo q = k<sub>F</sub>"],c:0,
e:"Conservando |k| = k<sub>F</sub>, in 1D l'unico salto possibile è attraversare il mare. La suscettività elettronica χ⁰(q) DIVERGE a q = 2k<sub>F</sub>: instabilità di Peierls (distorsione spontanea del reticolo 1D) (Esercitazione 14)."},
{id:"t73",b:"tra",q:"In 2D la risposta elettronica statica χ⁰(q) a T = 0 è:",
o:["Costante per q ≤ 2k<sub>F</sub> e poi decrescente, SENZA divergenza: il backscattering perfetto è una peculiarità 1D","Divergente a q = 2k<sub>F</sub> come in 1D","Nulla per ogni q","Crescente con q"],c:0,
e:"Sul cerchio di Fermi ci sono corde di ogni lunghezza ≤ 2k<sub>F</sub>: nessun q è «speciale» abbastanza da divergere. Confronto 1D vs 2D chiesto nell'appello 2025 (Esercitazione 14)."},
{id:"t74",b:"tra",q:"Il grafico di ln(J<sub>sat</sub>/T²) contro 1/T per un catodo dà una retta. Pendenza e intercetta forniscono:",
o:["Pendenza = −φ/k<sub>B</sub> (funzione lavoro); intercetta = ln A (costante di Richardson)","Pendenza = φ, intercetta = T","Pendenza = −1/τ, intercetta = σ","Pendenza = ε<sub>F</sub>, intercetta = μ"],c:0,
e:"Linearizzazione standard di Richardson–Dushman: è LA tecnica di misura di φ. Tipica domanda sia da quiz sia da punto (d) di un problema con dati sperimentali (Esercitazione 13)."},
{id:"t75",b:"tra",q:"La condizione ε &gt; ε<sub>v</sub> per l'emissione termoionica riguarda in realtà solo:",
o:["La componente del moto PERPENDICOLARE alla superficie: p<sub>x</sub>²/2m &gt; μ + φ nel modello a barriera 1D","L'energia totale dell'elettrone","Lo spin dell'elettrone","La posizione dell'elettrone nel reticolo"],c:0,
e:"La barriera è lungo x: le componenti trasverse restano libere (e danno le gaussiane → T²). Distinzione sottile che cambia il conteggio: nel calcolo si separa ε = ε<sub>x</sub> + ε<sub>⊥</sub> (Esercitazione 13)."},
{id:"t76",b:"tra",q:"Perché il calore specifico elettronico γT domina su quello reticolare AT³ solo sotto pochi kelvin?",
o:["T* = √(γ/A): con γ ~ mJ/mol·K² e A dato da Debye, l'incrocio cade a ~1–4 K","Perché gli elettroni si congelano ad alta T","Perché i fononi spariscono a bassa T… ma sopra T*","L'affermazione è falsa"],c:0,
e:"A temperatura ambiente i fononi (∝T³ fino a ~Θ<sub>D</sub>, poi 3R) dominano di un fattore ~100. Solo quando il T³ crolla, la retta γT emerge: per il Cu T* = 3,2 K (calcolato nel tema di giugno)."},
{id:"t77",b:"tra",q:"Se un metallo avesse esattamente g(ε) costante (2D ideale), il suo potenziale chimico con T:",
o:["Resterebbe fermo a ε<sub>F</sub> al primo ordine: g′(ε<sub>F</sub>) = 0 annulla la correzione di Sommerfeld","Scenderebbe come T²","Salirebbe come T²","Divergerebbe"],c:0,
e:"μ(T) = ε<sub>F</sub> − (π²/6)(k<sub>B</sub>T)²g′/g: tutto sta nella pendenza della DOS. Il 2D parabolico è il caso «neutro» (esattamente: μ = k<sub>B</sub>T·ln(e^{ε_F/k_BT}−1), correzioni esponenzialmente piccole) (Esercitazione 14)."},
// ---- Trasporto: completamenti ----
{id:"t78",b:"tra",q:"Il numero di Lorenz secondo Sommerfeld vale:",
o:["L = (π²/3)(k<sub>B</sub>/e)² ≈ 2,44·10⁻⁸ WΩ/K², in ottimo accordo con l'esperimento","L = (3/2)(k<sub>B</sub>/e)²","L = k<sub>B</sub>/e","L = (π²/3)(e/k<sub>B</sub>)²"],c:0,
e:"Nel rapporto k/σT si cancellano n, m e τ: restano solo costanti fondamentali. La correzione rispetto a Drude (3/2 → π²/3, con v<sub>F</sub> e c<sub>V</sub> giusti) rende l'accordo non più fortuito (dispensa di trasporto)."},
{id:"t79",b:"tra",q:"La forma «locale» della legge di Ohm è:",
o:["E = ρJ (o J = σE): campi e densità di corrente punto per punto, da cui ΔV = RI integrando sulla geometria","ΔV = RI è l'unica forma valida","J = σE² ","E = J/ne"],c:0,
e:"R = ρL/S segue integrando su un conduttore cilindrico. La forma locale è quella che si deriva microscopicamente (Drude) e vale per geometrie qualsiasi (dispensa di trasporto)."},
{id:"t80",b:"tra",q:"Quali sono i principali SUCCESSI del modello di Drude?",
o:["Ohm, Hall (per metalli semplici), Wiedemann–Franz (fortuito), soglia di plasma: le proprietà legate al trasporto di carica","Il calore specifico e la suscettività","Il segno di R<sub>H</sub> per tutti i metalli","La superconduttività"],c:0,
e:"Fallimenti: c<sub>V</sub> (×100), Seebeck (×100), χ paramagnetica, R<sub>H</sub> positivi, ρ(T). La diagnosi comune: la statistica classica sbaglia CHI partecipa. Elenco successi/fallimenti = domanda d'orale garantita."},
{id:"t81",b:"tra",q:"Per ω &lt; ω<sub>p</sub> l'onda elettromagnetica nel metallo è evanescente. Che cosa significa?",
o:["Il vettore d'onda è immaginario: l'ampiezza decade esponenzialmente in una lunghezza ~c/ω<sub>p</sub> e l'energia viene riflessa","L'onda accelera","L'onda si propaga senza attenuazione","L'energia è assorbita completamente in calore"],c:0,
e:"ε<sub>r</sub> &lt; 0 → n immaginario. La luce visibile penetra solo ~decine di nm (skin depth ottico): il resto torna indietro — specchi metallici. Sopra ω<sub>p</sub> (UV) il metallo diventa una finestra (dispensa)."},
{id:"t82",b:"tra",q:"A T = 0 l'energia interna del gas di Fermi è U₀ = (3/5)Nε<sub>F</sub>, enorme rispetto al valore classico U = 0. L'origine è:",
o:["Il principio di Pauli: gli elettroni riempiono stati fino a ε<sub>F</sub> anche senza agitazione termica","L'interazione coulombiana","Il moto del reticolo","Un artefatto matematico"],c:0,
e:"Energia di punto zero del gas fermionico: ~4 eV/elettrone nel Cu, contro k<sub>B</sub>T ≈ 25 meV. Da qui pressione di degenerazione, rigidità dei metalli, e perfino la stabilità delle nane bianche (Esercitazioni 12, 14)."},
{id:"t83",b:"tra",q:"Il grafico di g(ε)·f(ε) a T = 0 e a T &gt; 0 (aree A e B attorno a μ) serve a spiegare all'orale:",
o:["Perché μ(T) scende: con g crescente l'area «guadagnata» sopra μ supererebbe quella persa sotto, e μ si abbassa per compensare","La legge di Ohm","Il paradosso di Gibbs","L'effetto Hall"],c:0,
e:"Argomento grafico standard (citato tra le domande d'orale ricorrenti): la coda termica sposta il bilancio degli stati occupati; per N fisso μ deve muoversi CONTRO la pendenza di g (dispensa ed Esercitazione 12)."},
{id:"t84",b:"tra",q:"La lunghezza d'onda di Fermi λ<sub>F</sub> = 2π/k<sub>F</sub> per un metallo vale circa:",
o:["~0,5 nm: paragonabile alla distanza interatomica (e infatti d ≈ 0,5λ<sub>F</sub> — appello 2023)","~1 μm","~1 pm","~1 mm"],c:0,
e:"k<sub>F</sub> ≈ 1,4·10¹⁰ m⁻¹ per Cu. Il fatto che λ<sub>F</sub> ~ passo reticolare non è un caso: n ~ 1 elettrone/atomo lega d = n^(−1/3) a k<sub>F</sub> = (3π²n)^(1/3) (Esercitazione 14, punto f)."},
{id:"t85",b:"tra",q:"I coefficienti dell'espansione di Sommerfeld a<sub>n</sub> = (2−2^(2−2n))ζ(2n) coinvolgono la funzione ζ di Riemann. Il primo vale:",
o:["a₁ = π²/6: da cui i fattori π²/6 e π²/12 nei risultati per U e μ","a₁ = 1","a₁ = π","a₁ = π⁴/90"],c:0,
e:"ζ(2) = π²/6 (problema di Basilea). a₂ ∝ ζ(4) = π⁴/90 governa il termine (T/T<sub>F</sub>)⁴, quasi sempre trascurabile. Riconoscere «da dove viene il π²» fa buona impressione all'orale (Esercitazione 12)."},
{id:"t86",b:"tra",q:"La densità degli stati completa per elettroni liberi 3D (con spin) è:",
o:["g(ε) = (V/2π²)(2m/ħ²)³ᐟ²·√ε","g(ε) = (V/π²)(2m/ħ²)·ε","g(ε) = V·√ε/ħ","g(ε) = (V/4π)(m/ħ²)³·ε²"],c:0,
e:"Dal conteggio nello spazio k: N(k) = (V/3π²)k³ → g(k) = Vk²/π² → g(ε) = g(k)/(dε/dk). Il fattore 2 di spin è già incluso: dimenticarlo (o metterlo due volte) è la trappola numero uno (Esercitazioni 12, 14)."},
{id:"t87",b:"tra",x:1,q:"«Dalla distribuzione di Fermi, a ε = ε<sub>F</sub> il numero medio di occupazione è ½». Quale lettura è corretta?",
o:["Uno stato quantico con energia pari a ε<sub>F</sub> ha probabilità media di occupazione del 50%, a qualunque T","Metà delle particelle sta sopra ε<sub>F</sub> e metà sotto, sempre","Tutti gli stati sotto ε<sub>F</sub> sono occupati a metà","ε<sub>F</sub> coincide con l'energia media"],c:0,
e:"f(μ) = ½ è una proprietà PUNTUALE della distribuzione, non un'affermazione sulle popolazioni globali (che dipendono da g(ε)). Domanda del quiz reale del II appello: le altre letture sono le distrazioni classiche."},
{id:"t88",b:"tra",q:"Perché il modello di Sommerfeld NON si applica ai semiconduttori?",
o:["Lì i portatori sono pochi (n ~ 10¹⁶–10¹⁹ cm⁻³) e non degeneri: e^((ε−μ)/k<sub>B</sub>T) ≫ 1, statistica di Boltzmann","Perché i semiconduttori non hanno elettroni","Perché la FD non vale nei cristalli","Si applica identico"],c:0,
e:"La degenerazione richiede n·λ<sub>T</sub>³ ≫ 1: vero nei metalli (T<sub>F</sub> ~ 10⁵ K), falso nei semiconduttori standard (livello di Fermi nel gap, code di Boltzmann). Il criterio va sempre CONTROLLATO, non assunto."},
{id:"t89",b:"tra",q:"L'energia di Fermi dipende dalla densità come:",
o:["ε<sub>F</sub> ∝ n²ᐟ³ (in 3D): compressioni piccole producono variazioni misurabili (ΔP ≈ 1 atm per Δn/n = 10⁻⁶ nel Cu)","ε<sub>F</sub> ∝ n³","ε<sub>F</sub> ∝ n¹ᐟ²  in 3D","ε<sub>F</sub> indipendente da n"],c:0,
e:"Da k<sub>F</sub> = (3π²n)^(1/3) e ε<sub>F</sub> = ħ²k<sub>F</sub>²/2m. In 2D: ε<sub>F</sub> ∝ n; in 1D: ∝ n². La scalabilità con la dimensione ricorre negli appelli su grafene e fili quantici (Esercitazione 14)."},
{id:"t90",b:"tra",q:"Misurando R<sub>H</sub> di un metallo alcalino si ricava n, che risulta ≈ 1 elettrone per atomo. Questo conferma:",
o:["Che gli elettroni di valenza si liberano tutti nel gas di conduzione (Z′ = 1 per gli alcalini)","Che gli ioni conducono","Che τ è isotropo","Che il campo B non penetra"],c:0,
e:"R<sub>H</sub> = −1/ne è un CONTATORE di portatori indipendente da τ e m. Per Na, K: accordo ~1-2%; per i polivalenti compaiono le anomalie di banda (dispensa di trasporto)."},
{id:"t91",b:"tra",q:"Nei metalli, chi trasporta la maggior parte del calore?",
o:["Gli elettroni di conduzione: k<sub>el</sub> ≫ k<sub>fononi</sub> (per questo i buoni conduttori elettrici sono anche ottimi conduttori termici)","I fononi","I fotoni","Gli ioni che migrano"],c:0,
e:"È il presupposto di Wiedemann–Franz: stesso gas trasporta carica e calore. Negli isolanti restano solo i fononi (k tipicamente 10–100 volte minore). Il legame rame-pentola-manico è fisica di Sommerfeld quotidiana."},
{id:"t92",b:"tra",q:"Se v<sub>d</sub> ~ mm/s, perché la lampadina si accende «istantaneamente» quando chiudo l'interruttore?",
o:["Il segnale è il campo elettromagnetico, che si propaga a ~c nel circuito: gli elettroni ovunque iniziano a derivare quasi subito","Perché gli elettroni viaggiano a v<sub>F</sub> lungo il filo","Perché la corrente è fatta di fotoni","Perché v<sub>d</sub> in realtà è enorme"],c:0,
e:"Distinzione tra velocità dei portatori e velocità del segnale: il campo mette in moto TUTTO il gas quasi simultaneamente. Chiarisce anche perché v<sub>d</sub> minuscola basta: n è enorme (J = nev<sub>d</sub>)."},
{id:"t93",b:"tra",q:"Nel passaggio ✳ della derivazione di U(T) di Sommerfeld, il termine proporzionale a (μ−ε<sub>F</sub>) si cancella con un pezzo dell'integrale. Il risultato netto è:",
o:["U(T) = U₀ + (π²/6)(k<sub>B</sub>T)²g(ε<sub>F</sub>): la correzione dipende SOLO da g(ε<sub>F</sub>), non dallo spostamento di μ","U(T) dipende fortemente da μ(T)","U(T) = U₀ esattamente","U(T) = U₀ − (π²/6)(k<sub>B</sub>T)²g(ε<sub>F</sub>)"],c:0,
e:"La cancellazione (via N costante) è il passaggio «magico» della derivazione: c<sub>V</sub> = (π²/3)k<sub>B</sub>²T·g(ε<sub>F</sub>) esce pulito. Rifare i 9 passi una volta con carta e penna vale più di dieci letture (Esercitazione 12)."},
{id:"t94",b:"tra",q:"Una termocoppia sfrutta l'effetto Seebeck:",
o:["Due metalli diversi con giunzioni a temperature diverse generano una f.e.m. ∝ ΔT: si misura T da una tensione","Un metallo solo genera corrente se scaldato uniformemente","Serve un campo magnetico esterno","Funziona solo a T criogeniche"],c:0,
e:"In un circuito di un solo metallo i contributi si cancellano: servono Q diversi (Q<sub>A</sub>−Q<sub>B</sub>). Applicazione classica citata a lezione: il termometro «a fili» dei laboratori (dispensa)."},
{id:"t95",b:"tra",q:"Perché gli urti di Drude devono essere ANELASTICI (in generale)?",
o:["Devono termalizzare il gas: portare l'energia degli elettroni accelerati al reticolo, altrimenti E li scalderebbe indefinitamente","Per conservare la quantità di moto","Perché gli ioni sono fermi","Non serve: sono elastici"],c:0,
e:"Nel regime stazionario l'energia pompata dal campo (σE² per volume) deve uscire dal gas: è l'assunzione 4 (equilibrio SOLO via urti) a garantire il bilancio — e a produrre Joule (Esercitazione 11)."},
{id:"t96",b:"tra",q:"L'ordine di grandezza della corrente termoionica di saturazione a T ≈ 2500 K con φ ≈ 4,5 eV è:",
o:["~1 A/cm²: utilizzabile ma piccola rispetto alle correnti di conduzione","~10⁶ A/cm²","~1 pA/cm²","~1 A per elettrone"],c:0,
e:"J = 120·T²·e^(−φ/k<sub>B</sub>T) A/cm² con φ/k<sub>B</sub>T ≈ 21 → e⁻²¹ ≈ 10⁻⁹: J ~ 1 A/cm². L'esponenziale mangia tutto: per questo φ e T comandano (Esercitazione 13)."},
{id:"t97",b:"tra",q:"Nella conduzione di Sommerfeld, la corrente si scrive J = −ne⟨Δv⟩ con ⟨Δv⟩ = −eEτ/m. Il τ che vi compare riguarda:",
o:["Gli urti degli elettroni ALLA superficie di Fermi (con fononi e impurezze): sono gli unici stati che si spostano","Tutti gli elettroni indistintamente, come in Drude","Solo gli elettroni lenti al centro della sfera","Gli ioni del reticolo"],c:0,
e:"Formalmente identico a Drude, ma il tempo di rilassamento «giusto» è quello degli stati a ε<sub>F</sub> (v = v<sub>F</sub>, ℓ = v<sub>F</sub>τ ~ 10–100 nm). Il successo numerico di Drude si spiega: usava il τ sbagliato con la v sbagliata (Esercitazione 13)."},
{id:"t98",b:"tra",q:"Qual è la differenza concettuale tra ε<sub>F</sub> (energia di Fermi) e μ (potenziale chimico)?",
o:["ε<sub>F</sub> ≡ μ(T = 0): a T &gt; 0 il potenziale chimico si sposta leggermente, ma nei metalli μ ≈ ε<sub>F</sub> con precisione ~10⁻⁴","Sono grandezze indipendenti","μ è sempre zero nei metalli","ε<sub>F</sub> dipende da T, μ no"],c:0,
e:"Definizione pulita da dare all'orale: ε<sub>F</sub> è il bordo del mare a T = 0; μ(T) = ε<sub>F</sub>[1−(π²/12)(T/T<sub>F</sub>)²]. A 2500 K per Cu lo shift è 0,1%: si usano come sinonimi, sapendo perché (Esercitazione 12)."},
{id:"t99",b:"tra",q:"Il cammino libero medio degli elettroni a ε<sub>F</sub> nel rame a temperatura ambiente è ℓ = v<sub>F</sub>τ ≈ 30–40 nm, cioè ~100 passi reticolari. Che cosa implica?",
o:["Gli elettroni NON urtano con gli ioni del reticolo perfetto: lo scattering è dovuto a fononi e difetti (coerente con Bloch)","Il modello di Drude è esatto","Gli elettroni sono localizzati su un atomo","ℓ non è misurabile"],c:0,
e:"Con la v giusta (v<sub>F</sub>, non v<sub>T</sub>) il ℓ diventa 100 volte il passo reticolare: la visione di Drude «palla nei birilli» muore qui. La periodicità perfetta è trasparente (teorema di Bloch); diffonde solo il disordine."},
{id:"t100",b:"tra",q:"Nel problema del semimetallo a due bande (tema di luglio), il calore specifico c<sub>V</sub> = γT con γ ∝ g<sub>tot</sub>(E<sub>F</sub>) risulta ∝ √Δ. Che cosa succede per Δ → 0?",
o:["Il contributo elettronico si annulla: senza sovrapposizione non ci sono portatori né stati a E<sub>F</sub>","γ diverge","γ resta finito","c<sub>V</sub> diventa costante"],c:0,
e:"n<sub>e</sub> = n<sub>l</sub> → E<sub>F</sub> nella zona di sovrapposizione; g(E<sub>F</sub>) ∝ √Δ. Il limite Δ → 0 (semimetallo → semiconduttore a gap nullo) spegne il γT: interpretazione fisica chiesta come ultimo punto del problema."},
// ---- Solido: spazio reale (Es. 15) ----
{id:"o31",b:"sol",q:"La classificazione completa dei cristalli 3D conta:",
o:["7 sistemi cristallini, 14 reticoli di Bravais, 32 gruppi puntuali, 230 gruppi spaziali","14 sistemi, 7 reticoli, 230 gruppi puntuali","32 reticoli di Bravais","10 gruppi spaziali"],c:0,
e:"Traslazioni → 14 Bravais; simmetrie puntuali (rotazioni, riflessioni, inversioni) → 32; aggiungendo assi vite e piani glide → 230 gruppi spaziali (73 simmorfici). La gerarchia va saputa a grandi linee (Esercitazione 15)."},
{id:"o32",b:"sol",q:"In due dimensioni esistono:",
o:["5 reticoli di Bravais (obliquo, rettangolare, rettangolare centrato, quadrato, esagonale) e 17 wallpaper groups","14 reticoli come in 3D","3 reticoli","10 reticoli e 32 gruppi"],c:0,
e:"La lista 2D serve per grafene, superfici e problemi d'esame «giocattolo». I 17 gruppi del piano sono quelli dei mosaici (Esercitazione 15)."},
{id:"o33",b:"sol",q:"La cella convenzionale dell'FCC contiene:",
o:["4 punti reticolari (8 vertici/8 + 6 facce/2), contro 1 della primitiva","1 punto reticolare","2 punti reticolari","14 punti reticolari"],c:0,
e:"8·(1/8) + 6·(1/2) = 4. Si usa perché rende evidente la simmetria cubica: i vettori primitivi (metà diagonali di faccia) la nascondono. BCC: 2 punti (Esercitazione 15)."},
{id:"o34",b:"sol",q:"I vettori primitivi standard dell'FCC di lato a sono:",
o:["a₁ = (a/2)(x̂+ŷ), a₂ = (a/2)(ŷ+ẑ), a₃ = (a/2)(ẑ+x̂): le semi-diagonali delle facce","a₁ = a·x̂, a₂ = a·ŷ, a₃ = a·ẑ","Le diagonali di corpo (a/2)(x̂+ŷ+ẑ)","Non esistono vettori primitivi per l'FCC"],c:0,
e:"Generano tutti i punti (vertici + centri faccia) con volume a³/4 (= a³/4 punti per cella convenzionale ✓). Il BCC usa invece combinazioni con la diagonale di corpo (Esercitazione 15)."},
{id:"o35",b:"sol",q:"Le distanze dei primi vicini in SC, BCC e FCC (lato a) sono rispettivamente:",
o:["a; (√3/2)a; a/√2","a; a/2; a","a/2; a; 2a","a; (√2/2)a; (√3/2)a"],c:0,
e:"SC: lungo gli spigoli. BCC: dal centro al vertice = metà diagonale di corpo = √3a/2 ≈ 0,87a. FCC: metà diagonale di faccia = a/√2 ≈ 0,71a. Servono per raggio atomico e fattore di riempimento (Esercitazione 15)."},
{id:"o36",b:"sol",q:"I fattori di riempimento (sfere rigide) di SC, BCC, FCC valgono:",
o:["0,52; 0,68; 0,74","0,74; 0,68; 0,52","0,34; 0,52; 0,68","0,90; 0,74; 0,68"],c:0,
e:"f = (volume sfere)/(volume cella) con r = metà distanza primi vicini. FCC (e hcp) = massimo assoluto π/√18 ≈ 0,74. Esercizio standard «8 punti» dell'Esercitazione 15."},
{id:"o37",b:"sol",q:"Nel confronto 2D, il reticolo esagonale (triangolare) impacchetta meglio del quadrato:",
o:["f<sub>ex</sub> = π/(2√3) ≈ 0,907 contro f<sub>q</sub> = π/4 ≈ 0,785","f<sub>ex</sub> = 0,785 contro 0,907","Sono uguali","Il quadrato vince"],c:0,
e:"Ogni disco esagonale ha 6 vicini contro 4: è il modo più denso di riempire il piano (arance del fruttivendolo). Calcolo con area cella = |a₁×a₂| (Esercitazione 15)."},
{id:"o38",b:"sol",q:"La struttura kagome si descrive come:",
o:["Reticolo di Bravais esagonale con base di 3 atomi (0, a₁/2, a₂/2)","Un reticolo di Bravais a sé","Quadrato con base di 2","Honeycomb con base di 2"],c:0,
e:"Triangoli con i vertici condivisi: 4 primi vicini a distanza a/2, tre sottoreticoli. Problema «14 punti» assegnato per casa nell'Esercitazione 15 — buon test di tutto il formalismo Bravais+base."},
{id:"o39",b:"sol",q:"Nel reticolo a nido d'ape (grafene), il numero di coordinazione è:",
o:["3: ogni atomo ha tre primi vicini (dell'altro sottoreticolo)","6","4","12"],c:0,
e:"I tre vicini di un sito A sono tutti B e viceversa: struttura bipartita. Non è il massimo impacchettamento: è la chimica sp² a imporre 3 legami a 120° (Esercitazione 15)."},
{id:"o40",b:"sol",q:"Nella struttura del diamante, la distanza tra i primi vicini vale:",
o:["(√3/4)a ≈ 0,43a: dal sito (0,0,0) al sito (¼,¼,¼)a","a/√2","a/2","(√3/2)a"],c:0,
e:"Un quarto della diagonale di corpo. Da qui r = √3a/8 e f = √3π/16 ≈ 0,34: la struttura più «vuota» tra quelle comuni, tenuta insieme dai legami covalenti tetraedrici (Esercitazione 15)."},
{id:"o41",b:"sol",q:"La zincoblenda (GaAs, ZnS) differisce dal diamante perché:",
o:["I due sottoreticoli FCC compenetrati ospitano specie atomiche diverse","Ha un reticolo esagonale","Ha coordinazione 6","Non è una struttura cubica"],c:0,
e:"Stessa geometria (FCC + base a ¼ diagonale), atomi diversi sui due siti: Ga su uno, As sull'altro. È la struttura dei semiconduttori III-V; la differenza si vede nel fattore di struttura (f<sub>Ga</sub> ≠ f<sub>As</sub>: alcune estinzioni saltano)."},
{id:"o42",b:"sol",q:"Il rapporto c/a ideale della struttura hcp (sfere rigide compatte) è:",
o:["c/a = √(8/3) ≈ 1,633, con 12 primi vicini","c/a = 1","c/a = 2","c/a = √2"],c:0,
e:"Impacchettamento ABAB…: la geometria del tetraedro fissa c/a. Metalli reali deviano poco (Zn parecchio): la coordinazione resta ~12 come nell'FCC (che è ABCABC…) (Esercitazione 15)."},
{id:"o43",b:"sol",q:"Il volume della cella esagonale semplice (lati a, a, c) è:",
o:["V = (√3/2)a²c","V = a²c","V = (1/2)a²c","V = √3·a³"],c:0,
e:"Base a rombo 120°: area |a₁×a₂| = (√3/2)a². Necessario per il reticolo reciproco (b ∝ 1/V) e per le densità: esercizio d'obbligo prima di affrontare grafite o hcp (Esercitazioni 15-16)."},
{id:"o44",b:"sol",q:"Le celle di Wigner–Seitz di BCC e FCC sono rispettivamente:",
o:["Ottaedro troncato (BCC) e dodecaedro rombico (FCC)","Dodecaedro rombico (BCC) e ottaedro troncato (FCC)","Due cubi","Due sfere"],c:0,
e:"⚠ Attenzione all'incrocio: BCC → ottaedro troncato; FCC → dodecaedro rombico. E poiché i reciproci si scambiano (FCC↔BCC), la 1ª zona di Brillouin dell'FCC è l'ottaedro troncato. Trappola da quiz frequentissima (Esercitazioni 15-16)."},
{id:"o45",b:"sol",q:"Le notazioni (hkl), [hkl], {hkl}, ⟨hkl⟩ indicano rispettivamente:",
o:["Famiglia di piani; direzione nello spazio diretto; piani equivalenti per simmetria; direzioni equivalenti","Direzione; piano; punto; vettore reciproco","Sono tutte equivalenti","Piano; piano; direzione; direzione"],c:0,
e:"Convenzione internazionale: parentesi tonde = piani, quadre = direzioni, graffe/angolari = classi di equivalenza. Nei cubici [hkl] ⊥ (hkl), ma NON in generale (Esercitazione 16)."},
{id:"o46",b:"sol",q:"Come si trovano gli indici di Miller di un piano dalle intercette p, q, r sugli assi cristallini?",
o:["Si prendono i reciproci 1/p, 1/q, 1/r e si riducono ai più piccoli interi","Si usano direttamente p, q, r","Si sommano le intercette","Si moltiplicano per il volume della cella"],c:0,
e:"Piano che taglia a 1, ½, ⅓ → (1 2 3). Intercetta all'infinito → indice 0 (piano parallelo all'asse). Segni negativi con la barra sopra. Meccanismo da eseguire al volo nei quiz (Esercitazione 16)."},
{id:"o47",b:"sol",q:"Nei reticoli cubici, la famiglia di piani con distanza interplanare MASSIMA è quella:",
o:["A indici più bassi, es. (100) o (111) a seconda del reticolo: d = a/√(h²+k²+l²) decresce con gli indici","A indici più alti","(220) sempre","Tutte uguali"],c:0,
e:"d ∝ 1/√(h²+k²+l²): piani «radi» = indici bassi = angoli di Bragg piccoli = primi picchi del diffrattogramma. Nel powder del Si il primo picco è il (111) — con le estinzioni FCC a decidere chi appare (Esercitazione 16)."},
{id:"o48",b:"sol",q:"Un reticolo 2D obliquo ha a₁ = 0,4x̂ e a₂ = 0,1x̂+0,2ŷ (nm). Il reciproco si costruisce imponendo:",
o:["b<sub>i</sub>·a<sub>j</sub> = 2πδ<sub>ij</sub>: due equazioni lineari per ciascun b<sub>i</sub> nel piano","b<sub>i</sub> = 2π/a<sub>i</sub> componente per componente","b<sub>i</sub> ⊥ a<sub>i</sub>","Il reciproco 2D non esiste"],c:0,
e:"In 2D niente prodotti vettoriali: si risolve il sistema (b₁ ⊥ a₂ con b₁·a₁ = 2π, ecc.). Il reciproco di un obliquo è obliquo, RUOTATO rispetto al diretto. Problema 1 svolto dell'Esercitazione 16."},
{id:"o49",b:"sol",q:"Il reticolo reciproco dell'esagonale semplice è:",
o:["Ancora esagonale, ma ruotato di 30° attorno all'asse c, con |b| = 4π/(√3a)","Cubico","Obliquo generico","Esagonale con lo stesso orientamento"],c:0,
e:"La rotazione di 30° è il dettaglio che frega: le direzioni Γ→M e Γ→K della zona di Brillouin non coincidono con a₁, a₂. Fondamentale per grafene e grafite (Esercitazione 16, problema 3)."},
{id:"o50",b:"sol",q:"La prima zona di Brillouin dell'esagonale è un prisma esagonale con punti di alta simmetria:",
o:["Γ (centro), M (centro spigolo), K (vertice), più A, L, H sul piano superiore","Solo Γ e X","Γ, X, W come nell'FCC","Non ha punti di simmetria"],c:0,
e:"Nomenclatura standard delle bande: nel grafene i celebri coni di Dirac stanno nei punti K. Saper disegnare l'esagono con Γ, M, K è richiesto negli esercizi (Esercitazione 16)."},
{id:"o51",b:"sol",q:"Per un cristallo cubico semplice, i rapporti |K|/|K₁₀₀| dei primi vettori del reticolo reciproco sono:",
o:["1, √2, √3, 2, √5…: le radici di h²+k²+l²","1, 2, 3, 4…","1, √3, √5…solo dispari","Tutti uguali a 1"],c:0,
e:"Dai moduli √(h²+k²+l²)·(2π/a): la sequenza dei picchi di diffrazione. Per BCC mancano i dispari (estinzioni), per FCC restano solo parità concordi: la SEQUENZA dei picchi identifica il reticolo (Esercitazione 16, problema B)."},
{id:"o52",b:"sol",q:"La densità di un cristallo si calcola dalla struttura come:",
o:["ρ = (n·M)/(N<sub>A</sub>·V<sub>cella</sub>): n unità di formula per cella convenzionale, M massa molare","ρ = M/V<sub>cella</sub>","ρ = n·N<sub>A</sub>/V<sub>cella</sub>","Non è calcolabile senza esperimento"],c:0,
e:"Verifica incrociata classica dei problemi di diffrazione: dal parametro a (via Bragg) e dalla densità misurata si conferma il numero di unità per cella (es. CaF₂: 4 unità → ρ ≈ 3200 kg/m³ ✓) (Esercitazione 16, problema g)."},
{id:"o53",b:"sol",q:"Perché la cella primitiva di un reticolo con base NON può essere più piccola della cella del Bravais sottostante?",
o:["La base viaggia intera con ogni punto reticolare: la periodicità è quella del Bravais, la base definisce solo il contenuto","Può esserlo se gli atomi sono piccoli","Perché gli atomi si respingono","La domanda non ha senso"],c:0,
e:"Errore comune: contare gli atomi come punti reticolari. Nel grafene la cella primitiva contiene SEMPRE 2 atomi; nel kagome 3. Il reticolo è un'astrazione geometrica, la base è la materia (Esercitazione 15)."},
{id:"o54",b:"sol",q:"Quali reticoli di Bravais cubici esistono?",
o:["Solo P (semplice), I (corpo centrato), F (facce centrate): il «cubico a basi centrate» non è un nuovo Bravais","P, I, F e C (basi centrate)","Solo P ed F","Uno solo"],c:0,
e:"Un cubico C si riduce a un tetragonale più piccolo: non è un reticolo nuovo. I centraggi ammissibili variano da sistema a sistema (i 14 Bravais nascono proprio da questo conteggio) (Esercitazione 15)."},
// ---- Solido: diffrazione (Es. 16) ----
{id:"o55",b:"sol",q:"Nella diffrazione di von Laue, l'ampiezza diffusa è proporzionale a:",
o:["La trasformata di Fourier della densità elettronica: E ∝ Σ<sub>j</sub> e^(−iq·r<sub>j</sub>) con q = k′−k","La somma delle distanze interatomiche","Il numero totale di elettroni","Il volume del cristallo al quadrato"],c:0,
e:"Ogni elettrone ridiffonde l'onda con la propria fase: la diffrazione È un'analisi di Fourier del cristallo. Scomponendo r<sub>j</sub> = R<sub>n</sub> + r<sub>base</sub>: (somma reticolare) × (fattore di struttura) (Esercitazione 16)."},
{id:"o56",b:"sol",q:"La somma reticolare Σ<sub>n</sub> e^(−iq·R<sub>n</sub>) è non trascurabile solo quando:",
o:["q coincide con un vettore G del reticolo reciproco: tutti i termini valgono 1 e la somma vale N","q è piccolo","q è perpendicolare al fascio","Mai: è sempre trascurabile"],c:0,
e:"Se q ≠ G le fasi si distribuiscono sul cerchio unitario e si cancellano (N ~ 10²³ termini!); se q = G interferenza costruttiva totale. È la condizione di Laue: la definizione operativa del reticolo reciproco (Esercitazione 16)."},
{id:"o57",b:"sol",q:"Il fattore di forma atomico f(q) per q → 0 tende a:",
o:["Z, il numero di elettroni dell'atomo: a piccoli angoli l'atomo diffonde «come un punto» con tutta la sua carica","Zero","Uno","Infinito"],c:0,
e:"f(q) = ∫ρ(u)e^(−iq·u)d³u → ∫ρ = Z. A q crescenti f decade (interferenza interna alla nuvola): per questo i picchi ad alto angolo sono deboli. Nei problemi tipo BaTiO₃ si usano rapporti f<sub>Ba</sub> = 7f<sub>O</sub> ecc. (Esercitazione 16)."},
{id:"o58",b:"sol",q:"Perché nell'esperimento di diffrazione X si vede il reticolo RECIPROCO e non quello diretto?",
o:["Lo schermo lontano registra le direzioni k′ = k+G: le posizioni dei punti mappano i G, non le posizioni atomiche","Per un difetto degli strumenti","Si vede il reticolo diretto ingrandito","Perché i raggi X non interagiscono con gli elettroni"],c:0,
e:"La misura è nello spazio dei momenti: reticoli grandi nello spazio reale danno pattern fitti nello spazio reciproco e viceversa (dualità di Fourier). Ricostruire il reticolo diretto richiede l'antitrasformata — e le fasi perdute (Esercitazione 16)."},
{id:"o59",b:"sol",q:"Il fattore di struttura del silicio (FCC + base di 2 a ¼ diagonale) modula i picchi FCC con il fattore [1+e^(−iπ(h+k+l)/2)]. Risultato:",
o:["Picchi pieni per h+k+l = 4n, picchi con intensità ½ per h+k+l dispari, estinti per h+k+l = 4n+2","Tutti i picchi FCC sopravvivono uguali","Restano solo i picchi con h+k+l dispari","Il silicio non diffrange"],c:0,
e:"|1+e^(−iπm/2)|²: m = 4n → 4; m dispari → 2; m = 4n+2 → 0. Nel powder del Si: I(111)/I(220) = 1/2 (calcolato nel problema 6 dell'Esercitazione 16). Il diamante «cancella» ulteriori picchi dell'FCC."},
{id:"o60",b:"sol",q:"Nella diffrazione da polveri di un cubico, per indicizzare i picchi si usa:",
o:["sen²θ ∝ h²+k²+l²: i rapporti tra i sen²θ dei picchi danno la sequenza degli indici e il tipo di reticolo","La larghezza dei picchi","L'intensità assoluta","Il colore del campione"],c:0,
e:"Da Bragg: senθ = λ√(h²+k²+l²)/2a. Sequenze: SC 1,2,3,4,5,6,8…; BCC 2,4,6,8…; FCC 3,4,8,11… Le assenze sistematiche identificano il Bravais; poi da un picco si ricava a (problema CaF₂, Esercitazione 16)."},
{id:"o61",b:"sol",q:"Perché il fattore di struttura del BCC (F = 0 per h+k+l dispari) «ricostruisce» il reciproco giusto?",
o:["Eliminando dal reciproco SC i punti estinti restano esattamente i vettori del reticolo FCC: il reciproco del BCC","È una coincidenza numerica","Non c'è alcun legame","Perché il BCC non diffrange mai"],c:0,
e:"Doppio controllo di coerenza: si può descrivere il BCC come Bravais puro (reciproco FCC) o come SC+base (SC reciproco × estinzioni). I due percorsi DEVONO coincidere — e coincidono (Esercitazione 16, problema 5)."},
{id:"o62",b:"sol",q:"Per il CaF₂ (powder, Cu K<sub>α</sub>), dai primi 4 angoli di Bragg si ricava a ≈ 0,545 nm. Quale verifica indipendente chiede il problema?",
o:["Confrontare la densità calcolata (4 unità CaF₂ per cella FCC) con quella misurata, ρ ≈ 3200 kg/m³","Misurare la temperatura di fusione","Contare i picchi mancanti","Nessuna verifica possibile"],c:0,
e:"ρ = 4M/(N<sub>A</sub>a³): chiude il cerchio tra diffrazione e proprietà macroscopiche. Schema di problema completo: indicizzare → a → densità (Esercitazione 16, problema g)."},
{id:"o63",b:"sol",q:"Nella perovskite BaTiO₃ (SC + base di 5 atomi), le intensità relative dei picchi dipendono da:",
o:["Le somme pesate dei fattori di forma con le fasi della base: F(G) = Σf<sub>s</sub>e^(−iG·r<sub>s</sub>), con f<sub>Ba</sub> &gt; f<sub>Ti</sub> &gt; f<sub>O</sub>","Solo dal reticolo di Bravais","Solo dalla lunghezza d'onda","Dal volume del campione"],c:0,
e:"Nessuna estinzione totale (base complessa), ma forti modulazioni: il problema h dell'Esercitazione 16 calcola [200]:[111]:[110]:[100] = 169:49:81:9. L'intensità dei picchi «legge» la base."},
{id:"o64",b:"sol",q:"Che lunghezza d'onda serve per fare diffrazione su un cristallo (a ~ 0,3–0,5 nm)?",
o:["λ ≲ 2d: raggi X di ~0,05–0,25 nm (o elettroni/neutroni di pari λ di de Broglie)","Luce visibile (500 nm)","Microonde","Qualunque λ"],c:0,
e:"Da Bragg: senθ = nλ/2d ≤ 1. La riga Cu K<sub>α</sub> (λ = 0,154 nm) è lo standard dei laboratori. La luce visibile «non vede» i piani atomici: serve λ dell'ordine del passo reticolare."},
{id:"o65",b:"sol",q:"Elettroni e neutroni si usano in diffrazione al posto dei raggi X quando:",
o:["Servono sensibilità diverse: gli elettroni (carichi) sondano superfici (LEED), i neutroni vedono nuclei leggeri e strutture magnetiche","Mai: solo i fotoni diffrangono","I cristalli sono troppo grandi","Serve maggiore intensità luminosa"],c:0,
e:"Stessa fisica di Laue/Bragg con la λ di de Broglie. Elettroni: forte interazione → pochi strati atomici (superfici). Neutroni: interagiscono coi nuclei e i momenti magnetici → idrogeno e antiferromagneti."},
{id:"o66",b:"sol",q:"La condizione di Laue Δk = G si può visualizzare geometricamente con:",
o:["La costruzione di Ewald: sfera di raggio k centrata sull'origine del fascio; diffrazione dove la sfera interseca punti del reticolo reciproco","Il cerchio di Mohr","Il diagramma di Feynman","La costruzione di Wigner–Seitz"],c:0,
e:"Ruotando il cristallo (o usando polveri = tutte le orientazioni) si portano più punti G sulla sfera: ecco perché i metodi sperimentali (Laue, rotating crystal, powder) esistono. Visualizzazione utile per l'orale."},
{id:"o67",b:"sol",q:"Un'onda elettronica con k al bordo della zona di Brillouin (k = G/2) subisce:",
o:["Riflessione di Bragg da parte dei piani reticolari: si formano onde stazionarie e si apre il gap di banda","Assorbimento totale","Nessun effetto","Accelerazione"],c:0,
e:"La condizione di Laue con q = G è soddisfatta «internamente»: l'onda avanti e quella riflessa interferiscono in due combinazioni (nodi sui/tra gli ioni) con energie diverse → gap. Diffrazione e bande sono la stessa fisica (Esercitazione 16)."},
{id:"o68",b:"sol",q:"La distanza interplanare d<sub>hkl</sub> = 2π/|K<sub>hkl</sub>| si dimostra:",
o:["Proiettando un vettore reticolare sulla normale û = K/|K| e usando K·R = 2πm: i piani sono equispaziati di 2π/|K|","Misurando al microscopio","Solo per via numerica","Con la legge di Curie"],c:0,
e:"Ogni piano della famiglia raccoglie i punti con K·R = 2πm (m intero): la spaziatura tra valori successivi di m è 2π/|K|. Dimostrazione da due righe che il docente chiede spesso (Esercitazione 16, problema 2)."},
{id:"o69",b:"sol",q:"Nel powder pattern, l'ELIMINAZIONE sistematica di certi picchi (assenze) rivela:",
o:["Il centraggio del reticolo (P, I, F) e gli elementi con glide/vite: la simmetria si legge nelle assenze","La temperatura del campione","Il colore del cristallo","La massa molare"],c:0,
e:"BCC: spariscono h+k+l dispari; FCC: parità miste; assi vite e glide aggiungono altre assenze specifiche. La cristallografia deduce il gruppo spaziale proprio dal catalogo delle assenze (Esercitazione 16)."},
{id:"o70",b:"sol",q:"Per il grafene (triangolare + base di 2), il fattore di struttura nei punti K del reciproco:",
o:["Ha i contributi dei due sottoreticoli con fasi e^(−iG·r<sub>B</sub>) diverse: alcune riflessioni sono modulate rispetto al triangolare puro","È identico al triangolare semplice","È nullo ovunque","Non è definito in 2D"],c:0,
e:"F(G) = f[1+e^(−iG·r_B)] con r<sub>B</sub> = ⅓(a₁+a₂): la fase distingue le classi di G. Problema per casa (d) dell'Esercitazione 16 — lo stesso conto che rende speciali i punti di Dirac."},
{id:"o71",b:"sol",q:"L'esperimento di diffrazione misura |F(G)|², non F(G). Quale conseguenza fondamentale ha?",
o:["Si perdono le FASI: la ricostruzione diretta della densità elettronica è impossibile (problema della fase cristallografico)","Nessuna: il modulo basta sempre","Le intensità diventano negative","La legge di Bragg non vale più"],c:0,
e:"I ∝ |F|²: due strutture diverse possono dare moduli uguali. Si aggira con modelli, sostituzioni isomorfe, diffrazione anomala. Nota concettuale che impreziosisce una risposta d'orale."},
{id:"o72",b:"sol",q:"Nella powder diffraction, un picco a θ piccolo corrisponde a:",
o:["Piani a GRANDE distanza d (indici bassi): senθ = λ/2d","Piani ravvicinati","Grandi vettori G","Difetti del cristallo"],c:0,
e:"Relazione inversa d ↔ θ. Il primo picco del pattern è la famiglia più spaziata permessa dalle estinzioni: (111) per FCC/diamante, (110) per BCC. Ordinare i picchi = ordinare i d<sub>hkl</sub> (Esercitazione 16)."},
{id:"o73",b:"sol",q:"Per il tetragonale (a = b ≠ c), la distanza interplanare vale:",
o:["1/d² = (h²+k²)/a² + l²/c²","d = a/√(h²+k²+l²) come nel cubico","d = c/√(h²+k²)","1/d = h/a + k/b + l/c"],c:0,
e:"Caso generale: d = 2π/|hb₁+kb₂+lb₃| col reciproco del reticolo specifico. Il problema per casa B dell'Esercitazione 16 chiede proprio le formule per triclino, monoclino, ortorombico centrato, tetragonale I."},
{id:"o74",b:"sol",q:"Perché il vetro (amorfo) non produce picchi di Bragg ma aloni diffusi?",
o:["Senza periodicità non esiste reticolo reciproco: la trasformata della densità è continua, con massimi larghi alle distanze tipiche primo-vicino","Perché è trasparente","Perché assorbe i raggi X","Produce picchi identici al cristallo"],c:0,
e:"I picchi di Bragg SONO il reticolo reciproco: niente ordine a lungo raggio → niente delta di Dirac in q. L'alone a q ~ 2π/d<sub>medio</sub> racconta solo l'ordine locale. Confronto istruttivo cristallo/amorfo."},
{id:"o75",b:"sol",q:"Nei quiz compare spesso la figura di una cella con atomi ai vertici e uno al centro di una faccia sola. È una cella di Bravais?",
o:["No: il centraggio su UNA faccia (base-centered su cubico) non rispetta la simmetria cubica; è un reticolo tetragonale/ortorombico travestito","Sì, è l'FCC","Sì, è il BCC","È il reticolo esagonale"],c:0,
e:"I centraggi ammessi dipendono dal sistema: cubico solo P, I, F. Riconoscere celle «fasulle» o ridondanti è un tipo di domanda con figura frequente nei quiz (Esercitazione 15)."},
{id:"o76",b:"sol",q:"Le condizioni di von Laue e di Bragg usano il fatto che lo scattering sia ELASTICO, cioè:",
o:["|k′| = |k|: il fotone cambia direzione ma non energia (il reticolo assorbe solo momento G, non energia)","Il fotone perde metà energia","L'elettrone atomico viene espulso","La temperatura resta costante"],c:0,
e:"Con |k′| = |k| la condizione q = G diventa 2k·G = G² (equivalente a Bragg). Lo scattering anelastico (Compton, fononi) sta FUORI dai picchi di Bragg e ne fa il fondo diffuso."},
{id:"o77",b:"sol",q:"Aumentando la temperatura, i picchi di Bragg:",
o:["Restano nella stessa posizione (a parte la dilatazione) ma si INDEBOLISCONO: le vibrazioni termiche riducono la coerenza (fattore di Debye–Waller)","Si spostano verso angoli piccoli senza indebolirsi","Diventano più intensi","Spariscono già a 300 K"],c:0,
e:"⟨u²⟩ cresce con T: l'intensità scala come e^(−G²⟨u²⟩/3). I fononi non spostano i picchi (la periodicità MEDIA resta): li attenuano e alimentano il fondo diffuso. Nota utile per collegare diffrazione e vibrazioni."},
// ---- Solido: fononi, Debye, bande (Es. 8, 10, 14) ----
{id:"o78",b:"sol",q:"Per la catena 1D monoatomica, la relazione di dispersione si ricava dalle equazioni del moto mη̈<sub>ν</sub> = −k<sub>el</sub>(2η<sub>ν</sub>−η<sub>ν+1</sub>−η<sub>ν−1</sub>) cercando soluzioni:",
o:["A onda piana η<sub>ν</sub> ∝ e^(i(Kνa−ωt)): l'identità trigonometrica dà ω² = (4k<sub>el</sub>/m)sen²(Ka/2)","Costanti nel tempo","Esponenziali crescenti","Puramente casuali"],c:0,
e:"L'ansatz di onda reticolare trasforma il sistema di N equazioni accoppiate in una relazione algebrica ω(K). Con estremi fissi: modi stazionari sin(Kνa), K = πJ/N. Derivazione richiesta nei problemi (Esercitazione 10)."},
{id:"o79",b:"sol",q:"La velocità del suono nella catena 1D è:",
o:["v<sub>s</sub> = a√(k<sub>el</sub>/m): la pendenza di ω(K) per K → 0","v<sub>s</sub> = ω<sub>max</sub>·a","v<sub>s</sub> = √(k<sub>el</sub>a)","Infinita"],c:0,
e:"ω ≈ √(4k<sub>el</sub>/m)·(Ka/2) = v<sub>s</sub>K: il continuo elastico emerge dal reticolo a grandi λ. Al bordo zona la velocità di gruppo dω/dK si annulla: onda stazionaria riflessa alla Bragg."},
{id:"o80",b:"sol",q:"La densità di stati dei modi della catena 1D, g(ε) = (2N/π)/√(ε<sub>max</sub>²−ε²), diverge a ε → ε<sub>max</sub>. Come si chiama e perché avviene?",
o:["Singolarità di van Hove: dove la dispersione si appiattisce (dω/dK → 0) gli stati si accumulano","Divergenza di Debye: errore del modello","Catastrofe ultravioletta","Non ha nome: è un artefatto"],c:0,
e:"g(ε) = g(K)/|dε/dK|: le zone piatte della dispersione «impilano» modi alla stessa energia. Le van Hove segnano i bordi banda in ogni cristallo (anche elettronico). ⚠ g(ε) va sempre espressa SENZA K residui (Esercitazione 10)."},
{id:"o81",b:"sol",q:"L'energia della catena 1D a bassa temperatura dà c<sub>V</sub> ∝ T. Perché è «il Debye in una dimensione»?",
o:["Con dispersione lineare g(ω) è costante in 1D: l'integrale di Planck dà U ∝ T², c ∝ T (in 3D g ∝ ω² → c ∝ T³)","Perché tutti i modi sono congelati","È il comportamento di Einstein","c ∝ T vale solo per gli elettroni"],c:0,
e:"Il conto (serie geometrica + ζ(2) = π²/6) è nell'Esercitazione 10: la potenza di T dipende dalla dimensionalità attraverso g(ω) ∝ ω^(d−1). Schema unificante: fotoni, fononi, dimensioni diverse."},
{id:"o82",b:"sol",q:"Nel modello di Debye, la frequenza di taglio ω<sub>D</sub> è fissata imponendo:",
o:["Che il numero totale di modi sia 3N: ∫g(ω)dω = 3N","Che ω<sub>D</sub> = ω<sub>plasma</sub>","Che l'energia sia finita a T = 0","Che la velocità del suono diverga"],c:0,
e:"Il solido ha gradi di libertà finiti (a differenza del campo e.m.): il taglio a ω<sub>D</sub> (equivalente: sfera di Debye nello spazio K) garantisce il conteggio. Da ω<sub>D</sub>: Θ<sub>D</sub> = ħω<sub>D</sub>/k<sub>B</sub> (Cu: 343 K) (Esercitazione 8)."},
{id:"o83",b:"sol",q:"Il calore specifico reticolare di Debye si comporta come:",
o:["c ∝ T³ per T ≪ Θ<sub>D</sub> e c → 3Nk<sub>B</sub> (Dulong–Petit) per T ≫ Θ<sub>D</sub>","c ∝ T a bassa T e T³ ad alta","c costante a tutte le T","c ∝ e^(−Θ_D/T) a bassa T"],c:0,
e:"A bassa T solo i modi acustici con ħω ≲ k<sub>B</sub>T sono eccitati: il loro numero cresce come T³ (volume della sfera ω ≤ k<sub>B</sub>T/ħ). Il γ<sub>reticolare</sub> = (12π⁴/5)R/Θ<sub>D</sub>³ è il coefficiente del T³ usato nei temi (appello di giugno)."},
{id:"o84",b:"sol",q:"La temperatura di Debye Θ<sub>D</sub> di un materiale è alta quando:",
o:["I legami sono rigidi e gli atomi leggeri (v<sub>s</sub> alta): es. diamante Θ<sub>D</sub> ≈ 2200 K","Gli atomi sono pesanti e i legami molli","Il materiale è un metallo","La densità è bassa"],c:0,
e:"ω<sub>D</sub> ~ v<sub>s</sub>·k<sub>D</sub> con v<sub>s</sub> = √(rigidezza/massa). Il diamante resta «quantistico» (c &lt; 3R) fino a T altissime; il piombo (Θ<sub>D</sub> ≈ 105 K) è già classico a RT. Spiega le violazioni storiche di Dulong–Petit."},
{id:"o85",b:"sol",q:"Nella catena biatomica, il rapporto tra le ampiezze dei due atomi nel modo ottico a K = 0 è:",
o:["u₁/u₂ = −m₂/m₁: oscillano in controfase mantenendo fermo il centro di massa","u₁/u₂ = 1: oscillano insieme","u₁/u₂ = 0","Indeterminato"],c:0,
e:"Nel modo acustico a K → 0 tutti si muovono insieme (traslazione); nell'ottico i due sottoreticoli oscillano l'uno contro l'altro. Con cariche opposte (NaCl) il modo ottico ha un dipolo oscillante: accoppiamento con l'IR."},
{id:"o86",b:"sol",q:"Quante branche fononiche ha un cristallo 3D con p atomi nella base?",
o:["3p totali: 3 acustiche e 3p−3 ottiche","p","3 sempre","6p"],c:0,
e:"Ogni atomo della base porta 3 gradi di libertà per cella. Es. NaCl (p = 2): 3 acustiche + 3 ottiche; silicio (p = 2): idem. Le acustiche esistono SEMPRE (traslazioni rigide a costo nullo)."},
{id:"o87",b:"sol",q:"Perché i modi acustici hanno ω → 0 per K → 0?",
o:["Una traslazione rigida dell'intero cristallo non costa energia elastica: la simmetria impone il modo «soffice»","Per la viscosità del reticolo","È un'approssimazione grossolana","Perché il cristallo è infinito"],c:0,
e:"Teorema generale (modi di Goldstone della traslazione rotta): la branca acustica parte da zero con pendenza v<sub>s</sub>. Gli ottici invece partono da ω finita: distinguerli su un grafico è domanda da quiz con figura."},
{id:"o88",b:"sol",q:"La quantizzazione dei modi normali della catena porta a scrivere l'energia come E = Σ<sub>J</sub>(n<sub>J</sub>+½)ħω<sub>J</sub>. I quanti n<sub>J</sub> sono:",
o:["I fononi: bosoni con μ = 0, occupazione di Planck 1/(e^(βħω)−1)","Elettroni di conduzione","Fotoni intrappolati","Stati di spin"],c:0,
e:"La Z della catena fattorizza come prodotto di oscillatori indipendenti = grancanonica di bosoni a μ = 0 (numero non conservato). «Fonone» = quanto di modo normale collettivo, NON vibrazione di un singolo atomo (Esercitazione 10)."},
{id:"o89",b:"sol",q:"Il teorema di Bloch vale perché l'hamiltoniana del cristallo:",
o:["Commuta con tutte le traslazioni reticolari T<sub>R</sub>: gli autostati si scelgono comuni, con autovalore e^(ik·R)","È separabile in coordinate cartesiane","Non dipende dal potenziale","È invariante per rotazioni"],c:0,
e:"[H, T<sub>R</sub>] = 0 → ψ(r+R) = e^(ik·R)ψ(r), cioè ψ = e^(ikr)u(r) con u periodica. k è il «numero quantico della traslazione», definito modulo G: tutto vive nella 1ª zona di Brillouin."},
{id:"o90",b:"sol",q:"In un cristallo, il quasi-momento ħk dell'elettrone di Bloch differisce dal momento vero perché:",
o:["È conservato solo modulo ħG: il reticolo può assorbire «pacchetti» ħG nei processi d'urto (umklapp)","È sempre nullo","Coincide esattamente col momento","Non ha alcun significato fisico"],c:0,
e:"ψ<sub>k</sub> non è autostato di p̂ (u(r) modula l'onda). Nei processi elettone-fonone e nella diffrazione il bilancio è k′ = k + q + G: i processi umklapp (G ≠ 0) sono cruciali per la resistività termica."},
{id:"o91",b:"sol",q:"Ai bordi della zona di Brillouin le bande elettroniche presentano gap perché:",
o:["L'onda di Bloch soddisfa la condizione di Bragg: le due onde stazionarie concentrano densità sui massimi o sui minimi del potenziale, con energie diverse","Il potenziale diverge","Gli elettroni si respingono","La massa diventa infinita"],c:0,
e:"ψ₊ ∝ cos(πx/a) (densità sugli ioni, energia più bassa) e ψ₋ ∝ sin(πx/a) (densità tra gli ioni, più alta): ΔE = 2|V<sub>G</sub>|. Metallo o isolante dipende da come le bande così formate si riempiono."},
{id:"o92",b:"sol",q:"Un solido è isolante (a T = 0) quando:",
o:["Le bande occupate sono completamente piene e separate da un gap dalla prima banda vuota: 2 elettroni per cella (o numero pari) possono bastare","Ha pochi elettroni","Le bande sono strette","Il reticolo è amorfo"],c:0,
e:"Banda piena → corrente nulla (somma su k simmetrica, nessuno stato libero adiacente). Metallo: banda parzialmente piena (numero dispari di elettroni per cella, o bande sovrapposte — caso dei metalli bivalenti e semimetalli)."},
{id:"o93",b:"sol",q:"Il semimetallo del tema d'esame (bande C e V sovrapposte di Δ) è metallico perché:",
o:["La sovrapposizione trasferisce elettroni dalla banda V alla C: coesistono elettroni e lacune anche a T = 0","Il gap è molto grande","Tutti gli stati sono vuoti","Le masse efficaci sono uguali"],c:0,
e:"Senza sovrapposizione (Δ &lt; 0) sarebbe un isolante a bande piene. Con Δ &gt; 0 la carica si ripartisce (n<sub>e</sub> = n<sub>l</sub>) e g(E<sub>F</sub>) ≠ 0: piccole densità di portatori «di banda» — bismuto e grafite reali (tema di luglio)."},
{id:"o94",b:"sol",q:"La massa efficace negativa in cima a una banda si reinterpreta come:",
o:["Una LACUNA: quasiparticella di carica +e e massa positiva, che spiega R<sub>H</sub> &gt; 0","Un errore del modello","Un elettrone che viaggia indietro nel tempo","Un fonone"],c:0,
e:"Una banda quasi piena si descrive con i pochi stati vuoti: rispondono ai campi come cariche positive. Q e R<sub>H</sub> positivi (Al, Be, Zn) — inspiegabili per Drude — diventano naturali (collegamento trasporto-bande)."},
{id:"o95",b:"sol",q:"L'approssimazione armonica per le vibrazioni reticolari consiste nel:",
o:["Troncare lo sviluppo del potenziale al secondo ordine attorno alle posizioni di equilibrio: oscillatori accoppiati esattamente risolubili coi modi normali","Trascurare del tutto le vibrazioni","Considerare solo il primo vicino","Usare la meccanica classica"],c:0,
e:"I termini cubici e oltre (anarmonici) sono responsabili di dilatazione termica, interazione fonone-fonone e conducibilità termica finita del reticolo: l'armonico puro non prevede nessuna delle tre. Da citare come limite del modello."},
{id:"o96",b:"sol",q:"Il numero di modi nella prima zona di Brillouin per una catena di N celle è N. Con base biatomica i gradi di libertà totali (1D) sono 2N:",
o:["N nella branca acustica + N nell'ottica: il conteggio dei gradi di libertà torna sempre","2N nella sola acustica","N in totale","Dipende dalla temperatura"],c:0,
e:"Regola di conservazione dei gradi di libertà: (celle)×(atomi per cella)×(dimensioni). Utile come CHECK in ogni problema: se i modi non tornano, l'errore è nel conteggio dei k o delle branche (Esercitazione 10)."},
{id:"o97",b:"sol",q:"Perché il contributo elettronico e quello fononico al calore specifico si scrivono c = γT + AT³ e non si «mescolano»?",
o:["Sono sottosistemi quasi indipendenti a bassa T: gli elettroni al livello di Fermi e i fononi acustici si sommano additivamente","È un'approssimazione ingiustificata","Perché elettroni e fononi non interagiscono mai","Il T³ è elettronico e il T lineare fononico"],c:0,
e:"L'interazione e-fonone rinormalizza i parametri (m*) ma non la forma delle leggi. ⚠ Attenzione all'attribuzione: LINEARE = elettroni, CUBICO = fononi. Il grafico c/T vs T² li separa (temi d'esame di giugno e maggio)."},
{id:"o98",b:"sol",q:"La densità di stati elettronica 2D (banda parabolica, con spin) vale:",
o:["g₂D = m/(πħ²) per unità di area, indipendente dall'energia","g₂D ∝ √ε","g₂D ∝ 1/ε","g₂D ∝ ε³ᐟ²"],c:0,
e:"N(K) = 2·πK²/(2π/L)² → g(ε) costante. Conseguenze: μ(T) fermo, c<sub>V</sub> e χ con forme peculiari. Con dispersione LINEARE (grafene) g ∝ ε: le due «firme 2D» da non confondere (Esercitazione 14)."},
{id:"o99",b:"sol",q:"Il metodo generale per costruire g(ε) in qualunque dimensione è:",
o:["Contare N(K) (volume della «sfera» in K per la densità di punti k, ×2 spin), poi g(ε) = (dN/dK)/(dε/dK)","Misurarla sperimentalmente soltanto","Usare sempre la formula 3D","Integrare la distribuzione di Fermi"],c:0,
e:"Ricetta esplicita dell'Esercitazione 14 («fonte primaria di esercizi»): funziona per parabole, coni di Dirac, catene 1D, fononi. Errore tipico: dimenticare lo spin o lasciare K dentro g(ε)."},
{id:"o100",b:"sol",q:"Perché i modi con λ &lt; 2a non esistono nella catena discreta?",
o:["Tra due atomi non c'è materia da modulare: un'onda con λ &lt; 2a è identica (sui siti) a un'onda con λ &gt; 2a dentro la prima zona","Perché l'energia sarebbe infinita","Esistono ma non si vedono","Per la conservazione della carica"],c:0,
e:"η<sub>ν</sub> = e^(iKνa) è campionata solo sui siti: K e K+2π/a danno gli stessi spostamenti (aliasing). Tutta l'informazione sta in −π/a &lt; K ≤ π/a: la zona di Brillouin è lo «schermo» del campionamento reticolare (Esercitazione 10)."},
// ---- Magnetismo: fenomenologia e teorie classiche (dispensa) ----
{id:"m31",b:"mag",q:"Nell'esperimento del dinamometro sul bordo del solenoide, un materiale DIAMAGNETICO:",
o:["È debolmente respinto verso l'esterno (forza uscente dal campo), con F ∝ gradiente di B²","È attratto fortemente verso l'interno","Non sente alcuna forza","Oscilla"],c:0,
e:"Il momento indotto è OPPOSTO a B (Lenz microscopica): il materiale cerca il campo debole. Paramagneti: debolmente attratti; ferromagneti: attratti con forza ~10⁵ volte maggiore. L'esperimento classifica le tre famiglie (dispensa)."},
{id:"m32",b:"mag",q:"L'ossigeno liquido resta sospeso tra i poli di un magnete. Perché?",
o:["La molecola O₂ ha un tripletto di spin nel fondamentale (S = 1): paramagnetismo forte, esaltato dalla bassa temperatura (χ ∝ 1/T)","È diamagnetico","È ferromagnetico","Per la tensione superficiale"],c:0,
e:"Caso famoso: il riempimento degli orbitali molecolari π* dà due elettroni spaiati (regola di Hund molecolare). A 90 K la legge di Curie moltiplica χ: dimostrazione spettacolare da lezione (dispensa)."},
{id:"m33",b:"mag",q:"Le relazioni tra i vettori magnetici nei mezzi lineari sono:",
o:["B = μ₀(H+M), M = χ<sub>m</sub>H, B = μ₀μ<sub>r</sub>H con μ<sub>r</sub> = 1+χ<sub>m</sub>","B = μ₀H−M e χ = μ<sub>r</sub>","M = B/μ₀ sempre","H = χM"],c:0,
