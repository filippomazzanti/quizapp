o:["λ ≲ 2d: raggi X di ~0,05–0,25 nm (o elettroni/neutroni di pari λ di de Broglie)", "Luce visibile, con lunghezza d'onda attorno ai 500 nm", "Microonde, con lunghezza d'onda dell'ordine del centimetro", "Qualunque lunghezza d'onda, purché l'intensità sia sufficiente"],c:0,
e:"Da Bragg: senθ = nλ/2d ≤ 1. La riga Cu K<sub>α</sub> (λ = 0,154 nm) è lo standard dei laboratori. La luce visibile «non vede» i piani atomici: serve λ dell'ordine del passo reticolare."},
{id:"o65",b:"sol",q:"Elettroni e neutroni si usano in diffrazione al posto dei raggi X quando:",
o:["Servono sensibilità diverse: superfici, nuclei leggeri, magnetismo", "Mai: soltanto i fotoni possono dare luogo a fenomeni di diffrazione", "Perché i cristalli disponibili sono troppo grandi per i raggi X", "Perché occorre un'intensità luminosa molto maggiore sul campione"],c:0,
e:"Stessa fisica di Laue/Bragg con la λ di de Broglie. Elettroni: forte interazione → pochi strati atomici (superfici). Neutroni: interagiscono coi nuclei e i momenti magnetici → idrogeno e antiferromagneti."},
{id:"o66",b:"sol",q:"La condizione di Laue Δk = G si può visualizzare geometricamente con:",
o:["La costruzione di Ewald, con la sfera di raggio k", "Il cerchio di Mohr, usato per gli stati di tensione", "Il diagramma di Feynman del processo di scattering", "La costruzione di Wigner–Seitz nello spazio diretto"],c:0,
e:"Ruotando il cristallo (o usando polveri = tutte le orientazioni) si portano più punti G sulla sfera: ecco perché i metodi sperimentali (Laue, rotating crystal, powder) esistono. Visualizzazione utile per l'orale."},
{id:"o67",b:"sol",q:"Un'onda elettronica con k al bordo della zona di Brillouin (k = G/2) subisce:",
o:["Riflessione di Bragg, con onde stazionarie e apertura del gap", "Assorbimento totale dell'onda da parte del reticolo cristallino", "Nessun effetto particolare rispetto agli altri valori di k", "Una accelerazione dell'elettrone dovuta al potenziale periodico"],c:0,
e:"La condizione di Laue con q = G è soddisfatta «internamente»: l'onda avanti e quella riflessa interferiscono in due combinazioni (nodi sui/tra gli ioni) con energie diverse → gap. Diffrazione e bande sono la stessa fisica (Esercitazione 16)."},
{id:"o68",b:"sol",q:"La distanza interplanare d<sub>hkl</sub> = 2π/|K<sub>hkl</sub>| si dimostra:",
o:["Proiettando R sulla normale û = K/|K| e usando K·R = 2πm", "Misurando direttamente le distanze al microscopio elettronico", "Soltanto per via numerica, con un calcolo al calcolatore", "Applicando la legge di Curie ai piani cristallini paralleli"],c:0,
e:"Ogni piano della famiglia raccoglie i punti con K·R = 2πm (m intero): la spaziatura tra valori successivi di m è 2π/|K|. Dimostrazione da due righe che il docente chiede spesso (Esercitazione 16, problema 2)."},
{id:"o69",b:"sol",q:"Nel powder pattern, l'ELIMINAZIONE sistematica di certi picchi (assenze) rivela:",
o:["Il centraggio del reticolo e gli elementi con glide o vite", "La temperatura alla quale è stato misurato il campione in polvere", "Il colore e il grado di trasparenza del cristallo analizzato", "La massa molare del composto che costituisce il cristallo"],c:0,
e:"BCC: spariscono h+k+l dispari; FCC: parità miste; assi vite e glide aggiungono altre assenze specifiche. La cristallografia deduce il gruppo spaziale proprio dal catalogo delle assenze (Esercitazione 16)."},
{id:"o70",b:"sol",q:"Per il grafene (triangolare + base di 2), il fattore di struttura nei punti K del reciproco:",
o:["Ha i contributi dei due sottoreticoli con fasi diverse", "È del tutto identico a quello del reticolo triangolare semplice", "Risulta nullo per qualunque vettore del reticolo reciproco", "Non è definito, perché la struttura è bidimensionale"],c:0,
e:"F(G) = f[1+e^(−iG·r_B)] con r<sub>B</sub> = ⅓(a₁+a₂): la fase distingue le classi di G. Problema per casa (d) dell'Esercitazione 16 — lo stesso conto che rende speciali i punti di Dirac."},
{id:"o71",b:"sol",q:"L'esperimento di diffrazione misura |F(G)|², non F(G). Quale conseguenza fondamentale ha?",
o:["Si perdono le fasi, quindi la densità non è ricostruibile", "Nessuna conseguenza: il modulo quadro contiene tutta l'informazione", "Le intensità misurate possono assumere valori negativi", "La legge di Bragg cessa di valere per i picchi più intensi"],c:0,
e:"I ∝ |F|²: due strutture diverse possono dare moduli uguali. Si aggira con modelli, sostituzioni isomorfe, diffrazione anomala. Nota concettuale che impreziosisce una risposta d'orale."},
{id:"o72",b:"sol",q:"Nella powder diffraction, un picco a θ piccolo corrisponde a:",
o:["Piani a GRANDE distanza d (indici bassi): senθ = λ/2d", "Piani molto ravvicinati, corrispondenti a indici elevati", "Vettori del reticolo reciproco di modulo particolarmente grande", "Difetti e imperfezioni presenti nel cristallo analizzato"],c:0,
e:"Relazione inversa d ↔ θ. Il primo picco del pattern è la famiglia più spaziata permessa dalle estinzioni: (111) per FCC/diamante, (110) per BCC. Ordinare i picchi = ordinare i d<sub>hkl</sub> (Esercitazione 16)."},
{id:"o73",b:"sol",q:"Per il tetragonale (a = b ≠ c), la distanza interplanare vale:",
o:["1/d² = (h²+k²)/a² + l²/c²", "d = a/√(h²+k²+l²) come nel cubico", "d = c/√(h²+k²)", "1/d = h/a + k/b + l/c"],c:0,
e:"Caso generale: d = 2π/|hb₁+kb₂+lb₃| col reciproco del reticolo specifico. Il problema per casa B dell'Esercitazione 16 chiede proprio le formule per triclino, monoclino, ortorombico centrato, tetragonale I."},
{id:"o74",b:"sol",q:"Perché il vetro (amorfo) non produce picchi di Bragg ma aloni diffusi?",
o:["Senza periodicità non esiste reticolo reciproco", "Perché il vetro è trasparente alla radiazione elettromagnetica", "Perché il vetro assorbe completamente i raggi X incidenti", "In realtà produce picchi identici a quelli di un cristallo"],c:0,
e:"I picchi di Bragg SONO il reticolo reciproco: niente ordine a lungo raggio → niente delta di Dirac in q. L'alone a q ~ 2π/d<sub>medio</sub> racconta solo l'ordine locale. Confronto istruttivo cristallo/amorfo."},
{id:"o75",b:"sol",q:"Nei quiz compare spesso la figura di una cella con atomi ai vertici e uno al centro di una faccia sola. È una cella di Bravais?",
o:["No: il centraggio su una faccia rompe la simmetria cubica", "Sì, corrisponde esattamente al reticolo cubico a facce centrate", "Sì, corrisponde esattamente al reticolo cubico a corpo centrato", "Sì, è il modo convenzionale di disegnare il reticolo esagonale"],c:0,
e:"I centraggi ammessi dipendono dal sistema: cubico solo P, I, F. Riconoscere celle «fasulle» o ridondanti è un tipo di domanda con figura frequente nei quiz (Esercitazione 15)."},
{id:"o76",b:"sol",q:"Le condizioni di von Laue e di Bragg usano il fatto che lo scattering sia ELASTICO, cioè:",
o:["|k′| = |k|: cambia la direzione ma non l'energia", "Il fotone cede metà della propria energia al reticolo cristallino", "Un elettrone atomico viene espulso dall'atomo diffondente", "La temperatura del campione resta rigorosamente costante"],c:0,
e:"Con |k′| = |k| la condizione q = G diventa 2k·G = G² (equivalente a Bragg). Lo scattering anelastico (Compton, fononi) sta FUORI dai picchi di Bragg e ne fa il fondo diffuso."},
{id:"o77",b:"sol",q:"Aumentando la temperatura, i picchi di Bragg:",
o:["Restano in posizione ma si indeboliscono (Debye–Waller)", "Si spostano verso angoli più piccoli senza cambiare intensità", "Diventano progressivamente più intensi al crescere di T", "Spariscono completamente già a temperatura ambiente"],c:0,
e:"⟨u²⟩ cresce con T: l'intensità scala come e^(−G²⟨u²⟩/3). I fononi non spostano i picchi (la periodicità MEDIA resta): li attenuano e alimentano il fondo diffuso. Nota utile per collegare diffrazione e vibrazioni."},
// ---- Solido: fononi, Debye, bande (Es. 8, 10, 14) ----
{id:"o78",b:"sol",q:"Per la catena 1D monoatomica, la relazione di dispersione si ricava dalle equazioni del moto mη̈<sub>ν</sub> = −k<sub>el</sub>(2η<sub>ν</sub>−η<sub>ν+1</sub>−η<sub>ν−1</sub>) cercando soluzioni:",
o:["A onda piana η<sub>ν</sub> ∝ e^(i(Kνa−ωt)): l'identità trigonometrica dà ω² =", "Costanti nel tempo, cioè spostamenti statici degli atomi", "Esponenzialmente crescenti, tipiche di un sistema instabile", "Puramente casuali, senza alcuna relazione di fase fra atomi"],c:0,
e:"L'ansatz di onda reticolare trasforma il sistema di N equazioni accoppiate in una relazione algebrica ω(K). Con estremi fissi: modi stazionari sin(Kνa), K = πJ/N. Derivazione richiesta nei problemi (Esercitazione 10)."},
{id:"o79",b:"sol",q:"La velocità del suono nella catena 1D è:",
o:["v<sub>s</sub> = a√(k<sub>el</sub>/m), pendenza di ω(K) a K → 0", "v<sub>s</sub> = ω<sub>max</sub>·a, prodotto della frequenza massima per il passo", "v<sub>s</sub> = √(k<sub>el</sub>a), radice del prodotto costante-passo", "Infinita, perché il reticolo trasmette istantaneamente"],c:0,
e:"ω ≈ √(4k<sub>el</sub>/m)·(Ka/2) = v<sub>s</sub>K: il continuo elastico emerge dal reticolo a grandi λ. Al bordo zona la velocità di gruppo dω/dK si annulla: onda stazionaria riflessa alla Bragg."},
{id:"o80",b:"sol",q:"La densità di stati dei modi della catena 1D, g(ε) = (2N/π)/√(ε<sub>max</sub>²−ε²), diverge a ε → ε<sub>max</sub>. Come si chiama e perché avviene?",
o:["Singolarità di van Hove: dove la dispersione si appiattisce", "Divergenza di Debye, dovuta a un errore del modello continuo", "Catastrofe ultravioletta, come nel problema del corpo nero", "Non ha un nome: si tratta di un artefatto del calcolo"],c:0,
e:"g(ε) = g(K)/|dε/dK|: le zone piatte della dispersione «impilano» modi alla stessa energia. Le van Hove segnano i bordi banda in ogni cristallo (anche elettronico). ⚠ g(ε) va sempre espressa SENZA K residui (Esercitazione 10)."},
{id:"o81",b:"sol",q:"L'energia della catena 1D a bassa temperatura dà c<sub>V</sub> ∝ T. Perché è «il Debye in una dimensione»?",
o:["In 1D con dispersione lineare g(ω) è costante", "Perché a bassa temperatura tutti i modi risultano congelati", "È in realtà il comportamento previsto dal modello di Einstein", "L'andamento lineare in T vale soltanto per gli elettroni"],c:0,
e:"Il conto (serie geometrica + ζ(2) = π²/6) è nell'Esercitazione 10: la potenza di T dipende dalla dimensionalità attraverso g(ω) ∝ ω^(d−1). Schema unificante: fotoni, fononi, dimensioni diverse."},
{id:"o82",b:"sol",q:"Nel modello di Debye, la frequenza di taglio ω<sub>D</sub> è fissata imponendo:",
o:["Che il numero totale di modi sia 3N: ∫g(ω)dω = 3N", "Che ω<sub>D</sub> coincida con la frequenza di plasma del metallo", "Che l'energia interna resti finita allo zero assoluto", "Che la velocità del suono diverga al bordo della zona"],c:0,
e:"Il solido ha gradi di libertà finiti (a differenza del campo e.m.): il taglio a ω<sub>D</sub> (equivalente: sfera di Debye nello spazio K) garantisce il conteggio. Da ω<sub>D</sub>: Θ<sub>D</sub> = ħω<sub>D</sub>/k<sub>B</sub> (Cu: 343 K) (Esercitazione 8)."},
{id:"o83",b:"sol",q:"Il calore specifico reticolare di Debye si comporta come:",
o:["c ∝ T³ per T ≪ Θ<sub>D</sub> e c → 3Nk<sub>B</sub> (Dulong–Petit) per T ≫ Θ<sub>D</sub>", "c ∝ T a bassa temperatura e c ∝ T³ ad alta temperatura", "c resta costante a tutte le temperature, come per Dulong–Petit", "c ∝ e^(−Θ<sub>D</sub>/T) a bassa temperatura, come per Einstein"],c:0,
e:"A bassa T solo i modi acustici con ħω ≲ k<sub>B</sub>T sono eccitati: il loro numero cresce come T³ (volume della sfera ω ≤ k<sub>B</sub>T/ħ). Il γ<sub>reticolare</sub> = (12π⁴/5)R/Θ<sub>D</sub>³ è il coefficiente del T³ usato nei temi (appello di giugno)."},
{id:"o84",b:"sol",q:"La temperatura di Debye Θ<sub>D</sub> di un materiale è alta quando:",
o:["I legami sono rigidi e gli atomi leggeri (v<sub>s</sub> alta)", "Gli atomi sono pesanti e i legami fra loro particolarmente molli", "Il materiale è un metallo con elevata densità di elettroni liberi", "La densità del materiale è particolarmente bassa"],c:0,
e:"ω<sub>D</sub> ~ v<sub>s</sub>·k<sub>D</sub> con v<sub>s</sub> = √(rigidezza/massa). Il diamante resta «quantistico» (c &lt; 3R) fino a T altissime; il piombo (Θ<sub>D</sub> ≈ 105 K) è già classico a RT. Spiega le violazioni storiche di Dulong–Petit."},
{id:"o85",b:"sol",q:"Nella catena biatomica, il rapporto tra le ampiezze dei due atomi nel modo ottico a K = 0 è:",
o:["u₁/u₂ = −m₂/m₁: oscillano in controfase mantenendo fermo il centro di massa", "u₁/u₂ = 1, cioè i due atomi oscillano esattamente insieme", "u₁/u₂ = 0, cioè uno dei due atomi resta fermo nella sua posizione", "Il rapporto resta indeterminato, dipende dalle condizioni iniziali"],c:0,
e:"Nel modo acustico a K → 0 tutti si muovono insieme (traslazione); nell'ottico i due sottoreticoli oscillano l'uno contro l'altro. Con cariche opposte (NaCl) il modo ottico ha un dipolo oscillante: accoppiamento con l'IR."},
{id:"o86",b:"sol",q:"Quante branche fononiche ha un cristallo 3D con p atomi nella base?",
o:["3p in totale: 3 acustiche e 3p−3 ottiche", "p, cioè una branca per ciascun atomo contenuto nella base", "3 sempre, indipendentemente dal numero di atomi della base", "6p, cioè il doppio dei gradi di libertà di ciascun atomo"],c:0,
e:"Ogni atomo della base porta 3 gradi di libertà per cella. Es. NaCl (p = 2): 3 acustiche + 3 ottiche; silicio (p = 2): idem. Le acustiche esistono SEMPRE (traslazioni rigide a costo nullo)."},
{id:"o87",b:"sol",q:"Perché i modi acustici hanno ω → 0 per K → 0?",
o:["Una traslazione rigida dell'intero cristallo non costa energia elastica", "Per via della viscosità interna del reticolo cristallino ionico", "È soltanto un'approssimazione grossolana del modello armonico", "Perché il cristallo viene considerato infinitamente esteso"],c:0,
e:"Teorema generale (modi di Goldstone della traslazione rotta): la branca acustica parte da zero con pendenza v<sub>s</sub>. Gli ottici invece partono da ω finita: distinguerli su un grafico è domanda da quiz con figura."},
{id:"o88",b:"sol",q:"La quantizzazione dei modi normali della catena porta a scrivere l'energia come E = Σ<sub>J</sub>(n<sub>J</sub>+½)ħω<sub>J</sub>. I quanti n<sub>J</sub> sono:",
o:["I fononi: bosoni con μ = 0, occupazione di Planck 1/(e^(βħω)−1)", "Gli elettroni di conduzione presenti nella banda parzialmente piena", "Fotoni rimasti intrappolati all'interno del reticolo cristallino", "Stati di spin degli ioni che compongono il reticolo periodico"],c:0,
e:"La Z della catena fattorizza come prodotto di oscillatori indipendenti = grancanonica di bosoni a μ = 0 (numero non conservato). «Fonone» = quanto di modo normale collettivo, NON vibrazione di un singolo atomo (Esercitazione 10)."},
{id:"o89",b:"sol",q:"Il teorema di Bloch vale perché l'hamiltoniana del cristallo:",
o:["Commuta con tutte le traslazioni reticolari T<sub>R</sub>: gli autostati si scelgono comuni", "È separabile nelle tre coordinate cartesiane indipendenti", "Non dipende in alcun modo dal potenziale periodico del reticolo", "È invariante per rotazioni attorno a qualunque asse del cristallo"],c:0,
e:"[H, T<sub>R</sub>] = 0 → ψ(r+R) = e^(ik·R)ψ(r), cioè ψ = e^(ikr)u(r) con u periodica. k è il «numero quantico della traslazione», definito modulo G: tutto vive nella 1ª zona di Brillouin."},
{id:"o90",b:"sol",q:"In un cristallo, il quasi-momento ħk dell'elettrone di Bloch differisce dal momento vero perché:",
o:["È conservato solo modulo ħG, per i processi umklapp", "È sempre rigorosamente nullo per gli stati di Bloch stazionari", "Coincide esattamente con il momento vero della particella libera", "Non possiede alcun significato fisico, è solo un'etichetta"],c:0,
e:"ψ<sub>k</sub> non è autostato di p̂ (u(r) modula l'onda). Nei processi elettone-fonone e nella diffrazione il bilancio è k′ = k + q + G: i processi umklapp (G ≠ 0) sono cruciali per la resistività termica."},
{id:"o91",b:"sol",q:"Ai bordi della zona di Brillouin le bande elettroniche presentano gap perché:",
o:["L'onda di Bloch soddisfa la condizione di Bragg", "Il potenziale periodico diverge in corrispondenza dei siti ionici", "Gli elettroni si respingono fortemente al bordo della zona", "La massa efficace dell'elettrone diventa infinitamente grande"],c:0,
e:"ψ₊ ∝ cos(πx/a) (densità sugli ioni, energia più bassa) e ψ₋ ∝ sin(πx/a) (densità tra gli ioni, più alta): ΔE = 2|V<sub>G</sub>|. Metallo o isolante dipende da come le bande così formate si riempiono."},
{id:"o92",b:"sol",q:"Un solido è isolante (a T = 0) quando:",
o:["Le bande occupate sono piene e separate da un gap", "Il materiale contiene un numero molto piccolo di elettroni", "Le bande elettroniche del materiale sono particolarmente strette", "Il reticolo è amorfo e privo di ordine a lungo raggio"],c:0,
e:"Banda piena → corrente nulla (somma su k simmetrica, nessuno stato libero adiacente). Metallo: banda parzialmente piena (numero dispari di elettroni per cella, o bande sovrapposte — caso dei metalli bivalenti e semimetalli)."},
{id:"o93",b:"sol",q:"Il semimetallo del tema d'esame (bande C e V sovrapposte di Δ) è metallico perché:",
o:["La sovrapposizione trasferisce elettroni dalla banda V alla C", "Il gap fra banda di valenza e di conduzione è molto grande", "Tutti gli stati elettronici disponibili risultano vuoti a T = 0", "Le masse efficaci delle due bande risultano esattamente uguali"],c:0,
e:"Senza sovrapposizione (Δ &lt; 0) sarebbe un isolante a bande piene. Con Δ &gt; 0 la carica si ripartisce (n<sub>e</sub> = n<sub>l</sub>) e g(E<sub>F</sub>) ≠ 0: piccole densità di portatori «di banda» — bismuto e grafite reali (tema di luglio)."},
{id:"o94",b:"sol",q:"La massa efficace negativa in cima a una banda si reinterpreta come:",
o:["Una LACUNA: quasiparticella di carica +e e massa positiva", "Un errore del modello semiclassico, privo di senso fisico", "Un elettrone che si propaga all'indietro nel tempo", "Un fonone di alta energia emesso dal reticolo cristallino"],c:0,
e:"Una banda quasi piena si descrive con i pochi stati vuoti: rispondono ai campi come cariche positive. Q e R<sub>H</sub> positivi (Al, Be, Zn) — inspiegabili per Drude — diventano naturali (collegamento trasporto-bande)."},
{id:"o95",b:"sol",q:"L'approssimazione armonica per le vibrazioni reticolari consiste nel:",
o:["Troncare il potenziale al secondo ordine", "Trascurare del tutto le vibrazioni degli atomi attorno ai siti", "Considerare soltanto l'interazione fra atomi primi vicini", "Descrivere il moto degli atomi con la meccanica classica"],c:0,
e:"I termini cubici e oltre (anarmonici) sono responsabili di dilatazione termica, interazione fonone-fonone e conducibilità termica finita del reticolo: l'armonico puro non prevede nessuna delle tre. Da citare come limite del modello."},
{id:"o96",b:"sol",q:"Il numero di modi nella prima zona di Brillouin per una catena di N celle è N. Con base biatomica i gradi di libertà totali (1D) sono 2N:",
o:["N nella branca acustica e N in quella ottica", "2N modi concentrati tutti nella sola branca acustica", "N modi in totale, contando insieme entrambe le branche", "Un numero che dipende dalla temperatura del cristallo"],c:0,
e:"Regola di conservazione dei gradi di libertà: (celle)×(atomi per cella)×(dimensioni). Utile come CHECK in ogni problema: se i modi non tornano, l'errore è nel conteggio dei k o delle branche (Esercitazione 10)."},
{id:"o97",b:"sol",q:"Perché il contributo elettronico e quello fononico al calore specifico si scrivono c = γT + AT³ e non si «mescolano»?",
o:["Sono sottosistemi quasi indipendenti a bassa temperatura", "È in realtà un'approssimazione del tutto ingiustificata", "Perché elettroni e fononi non interagiscono mai fra loro", "Il termine cubico è elettronico e quello lineare è fononico"],c:0,
e:"L'interazione e-fonone rinormalizza i parametri (m*) ma non la forma delle leggi. ⚠ Attenzione all'attribuzione: LINEARE = elettroni, CUBICO = fononi. Il grafico c/T vs T² li separa (temi d'esame di giugno e maggio)."},
{id:"o98",b:"sol",q:"La densità di stati elettronica 2D (banda parabolica, con spin) vale:",
o:["g₂D = m/(πħ²) per unità di area, indipendente dall'energia", "g ∝ √ε, come nel caso tridimensionale parabolico", "g ∝ 1/ε, decrescente al crescere dell'energia", "g ∝ ε³ᐟ², crescente rapidamente con l'energia"],c:0,
e:"N(K) = 2·πK²/(2π/L)² → g(ε) costante. Conseguenze: μ(T) fermo, c<sub>V</sub> e χ con forme peculiari. Con dispersione LINEARE (grafene) g ∝ ε: le due «firme 2D» da non confondere (Esercitazione 14)."},
{id:"o99",b:"sol",q:"Il metodo generale per costruire g(ε) in qualunque dimensione è:",
o:["Contare N(K) (volume della «sfera» in K per la densità di punti k", "Misurarla esclusivamente per via sperimentale con la fotoemissione", "Usare sempre la formula tridimensionale, adattando le costanti", "Integrare la distribuzione di Fermi su tutte le energie"],c:0,
e:"Ricetta esplicita dell'Esercitazione 14 («fonte primaria di esercizi»): funziona per parabole, coni di Dirac, catene 1D, fononi. Errore tipico: dimenticare lo spin o lasciare K dentro g(ε)."},
{id:"o100",b:"sol",q:"Perché i modi con λ &lt; 2a non esistono nella catena discreta?",
o:["Tra due atomi non c'è materia da modulare: un'onda", "Perché l'energia associata a quei modi sarebbe infinita", "Esistono realmente, ma non sono osservabili sperimentalmente", "Per la conservazione della carica elettrica nel cristallo"],c:0,
e:"η<sub>ν</sub> = e^(iKνa) è campionata solo sui siti: K e K+2π/a danno gli stessi spostamenti (aliasing). Tutta l'informazione sta in −π/a &lt; K ≤ π/a: la zona di Brillouin è lo «schermo» del campionamento reticolare (Esercitazione 10)."},
// ---- Magnetismo: fenomenologia e teorie classiche (dispensa) ----
{id:"m31",b:"mag",q:"Nell'esperimento del dinamometro sul bordo del solenoide, un materiale DIAMAGNETICO:",
o:["È debolmente respinto verso l'esterno (forza uscente dal campo)", "È attratto con forza verso la regione di campo più intenso", "Non risente di alcuna forza, qualunque sia il gradiente", "Oscilla attorno alla posizione di equilibrio del solenoide"],c:0,
e:"Il momento indotto è OPPOSTO a B (Lenz microscopica): il materiale cerca il campo debole. Paramagneti: debolmente attratti; ferromagneti: attratti con forza ~10⁵ volte maggiore. L'esperimento classifica le tre famiglie (dispensa)."},
{id:"m32",b:"mag",q:"L'ossigeno liquido resta sospeso tra i poli di un magnete. Perché?",
o:["La molecola O₂ ha un tripletto di spin nel fondamentale (S = 1)", "Perché l'ossigeno liquido è fortemente diamagnetico", "Perché diventa ferromagnetico sotto la temperatura di Curie", "Per effetto della tensione superficiale del liquido criogenico"],c:0,
e:"Caso famoso: il riempimento degli orbitali molecolari π* dà due elettroni spaiati (regola di Hund molecolare). A 90 K la legge di Curie moltiplica χ: dimostrazione spettacolare da lezione (dispensa)."},
{id:"m33",b:"mag",q:"Le relazioni tra i vettori magnetici nei mezzi lineari sono:",
o:["B = μ₀(H+M), M = χ<sub>m</sub>H, B = μ₀μ<sub>r</sub>H con μ<sub>r</sub> = 1+χ<sub>m</sub>", "B = μ₀H − M, con suscettività pari alla permeabilità relativa", "M = B/μ₀ sempre, indipendentemente dal materiale considerato", "H = χM, con il campo proporzionale alla magnetizzazione"],c:0,
e:"H è generato dalle correnti libere (∇×H = j<sub>c</sub>), M dalle correnti di magnetizzazione (∇×M = j<sub>m</sub>). Per dia/para χ ~ ±10⁻⁵–10⁻³; per i ferro μ<sub>r</sub> ~ 10³–10⁵ e la linearità salta (isteresi) (dispensa)."},
{id:"m34",b:"mag",q:"Il rapporto giromagnetico orbitale e di spin valgono rispettivamente:",
o:["μ<sub>L</sub> = −(e/2m)L e μ<sub>S</sub> = −(e/m)S: lo spin è «doppiamente efficace» (g<sub>s</sub> ≈ 2)", "Sono uguali fra loro e pari a −e/2m per entrambi i momenti", "Sono uguali fra loro e pari a −e/m per entrambi i momenti", "Sono +e/2m e +e/m, cioè paralleli ai rispettivi momenti"],c:0,
e:"Il fattore 2 dello spin (da Dirac, con correzioni QED ~0,1%) è il motivo per cui gli esperimenti alla Einstein–de Haas distinguono l'origine orbitale o di spin del magnetismo: misurano γ = M/L (dispensa)."},
{id:"m35",b:"mag",q:"Perché il magnetismo NUCLEARE è trascurabile rispetto a quello elettronico?",
o:["μ<sub>N</sub> = eħ/2m<sub>p</sub> è ~1836 volte più piccolo di μ<sub>B</sub>", "Perché i nuclei atomici sono privi di momento angolare di spin", "Perché i nuclei sono completamente schermati dagli elettroni", "Non è affatto trascurabile: contribuisce in modo significativo"],c:0,
e:"Le energie nucleari Zeeman sono ~10⁻⁷ eV: irrilevanti per χ, ma preziose per NMR/MRI (risonanza a radiofrequenze). Nei bilanci di suscettività si ignora sempre il nucleo (dispensa)."},
{id:"m36",b:"mag",q:"Perché la precessione di Larmor NON produce da sola l'allineamento dei dipoli al campo?",
o:["τ = μ×B conserva l'angolo tra μ e B: per allinearsi serve DISSIPAZIONE", "Perché il campo magnetico applicato è troppo debole per allineare", "Perché i momenti magnetici sono quantizzati spazialmente", "In realtà l'allineamento avviene in modo istantaneo"],c:0,
e:"La precessione è moto conservativo (ω<sub>L</sub> = eB/2m, angolo fisso). La magnetizzazione di equilibrio nasce dalla statistica (Boltzmann sui livelli) TRAMITE i processi di rilassamento. Distinzione concettuale da orale (dispensa)."},
{id:"m37",b:"mag",q:"La validità della trattazione di Larmor (precessione lenta) richiede:",
o:["ω<sub>L</sub> ≪ ω₀, vero per qualunque campo di laboratorio", "Che il campo applicato superi il valore di cento tesla", "Che il campione sia portato a temperature criogeniche", "Che si tratti di atomi pesanti con molti elettroni interni"],c:0,
e:"ω<sub>L</sub>/ω₀ ≈ μ<sub>B</sub>B/E<sub>atomica</sub> ~ 10⁻⁵·B[T]: il campo esterno è SEMPRE una perturbazione minuscola sulla struttura atomica. Giustifica l'uso della teoria perturbativa in tutto il magnetismo (dispensa)."},
{id:"m38",b:"mag",q:"La suscettività diamagnetica di Larmor–Langevin, χ = −(μ₀ne²/6m)Σ⟨r²⟩, si verifica sperimentalmente graficando χ contro:",
o:["Z<sub>eff</sub>·r̄² degli ioni: i dati si allineano su ~2 decadi", "La temperatura assoluta a cui viene eseguita la misura", "L'intensità del campo magnetico esterno applicato", "La massa atomica dell'elemento che costituisce il sale"],c:0,
e:"Approssimando Σ⟨r<sub>i</sub>²⟩ ≈ Z<sub>eff</sub>·r̄² (elettroni esterni), i sali diamagnetici cadono su una retta: il modello, pur «classico», cattura la fisica perché ⟨r²⟩ è calcolato quantisticamente (dispensa)."},
{id:"m39",b:"mag",q:"Nel diamagnetismo quantistico, il termine H′ = (e²/2m)A² con A = ½B×r dà al primo ordine:",
o:["E⁽¹⁾ = (e²B²/12m)⟨r²⟩ &gt; 0, cioè diamagnetica", "Un contributo negativo, che abbassa l'energia dello stato", "Un contributo esattamente nullo per ragioni di parità", "Il termine Zeeman, lineare nel campo magnetico applicato"],c:0,
e:"∂²E/∂B² &gt; 0 → μ = −∂E/∂B &lt; 0. Con shell chiuse (L = S = J = 0) è l'UNICO termine: si ritrova esattamente la formula di Larmor–Langevin, ma ora ⟨r²⟩ è ben definito (dispensa)."},
{id:"m40",b:"mag",q:"L'hamiltoniana magnetica completa di un atomo contiene H<sub>para</sub> = (e/2m)(L+2S)·B e H<sub>dia</sub> ∝ A². Quando il paramagnetismo domina?",
o:["Appena J ≠ 0, perché il termine lineare vince", "Mai: il termine diamagnetico prevale in qualunque condizione", "Soltanto nei metalli, dove gli elettroni sono delocalizzati", "Soltanto a temperatura rigorosamente nulla, T = 0"],c:0,
e:"Ordini di grandezza: paramagnetico ~μ<sub>B</sub>B ~ 10⁻⁴ eV/T contro diamagnetico ~10⁻⁹ eV/T². Il diamagnetismo si vede solo con J = 0 (shell chiuse, molecole sature). Gerarchia da citare nei commenti dei problemi (dispensa)."},
{id:"m41",b:"mag",q:"La dimostrazione di Bohr–van Leeuwen usa il fatto che la funzione di partizione classica:",
o:["Non dipende dal potenziale vettore A", "Diverge non appena si applica un campo magnetico al sistema", "Dipende soltanto dalla temperatura e non dal campo applicato", "È esattamente nulla per qualunque campo magnetico diverso da zero"],c:0,
e:"L'integrale gaussiano sui momenti è invariante per traslazioni: Z(B) = Z(0) → F indipendente da B → M = 0. Nessuna scappatoia classica: dia e para emergono SOLO dalla quantizzazione dei livelli (dispensa, Esercitazione 9)."},
{id:"m42",b:"mag",q:"Nell'immagine «a orbite» del teorema di Bohr–van Leeuwen, le correnti di ciclotrone interne sono cancellate da:",
o:["Le «skipping orbits» degli elettroni che rimbalzano sul bordo del campione", "Le correnti prodotte dal momento magnetico dei nuclei atomici", "L'attrito viscoso che dissipa il moto orbitale degli elettroni", "Le cariche positive del reticolo, che ruotano in verso opposto"],c:0,
e:"Le orbite interne danno dia, quelle di bordo (che percorrono il perimetro in senso opposto) esattamente para: totale nullo. Immagine geometrica elegante della cancellazione di van Vleck (dispensa)."},
{id:"m43",b:"mag",q:"La trattazione classica di Langevin per il paramagnete tratta l'orientazione dei dipoli come:",
o:["Un angolo θ continuo con peso di Boltzmann e^(+μBcosθ/k<sub>B</sub>T)", "Due soli stati possibili, con momento su oppure giù", "Direzioni fisse e distribuite a caso, senza peso statistico", "Una pura precessione, senza alcun trattamento statistico"],c:0,
e:"Z₁ = ∫e^(βμBcosθ)dΩ → M = nμL(a) con L(a) = coth(a) − 1/a. È il limite J → ∞ della trattazione quantistica: utile come confronto, sbagliata nei dettagli (curve di saturazione) (dispensa, Esercitazione 9)."},
{id:"m44",b:"mag",q:"La funzione di Langevin L(a) per a ≪ 1 si comporta come:",
o:["L(a) ≈ a/3: da qui la legge di Curie classica χ = nμ₀μ²/3k<sub>B</sub>T", "L(a) ≈ 1, cioè saturazione completa già a campi deboli", "L(a) ≈ a², con dipendenza quadratica dal rapporto energetico", "L(a) ≈ 1/a, decrescente al crescere del campo applicato"],c:0,
e:"Sviluppo di coth: il fattore 1/3 viene dalla media sulle orientazioni. Nella versione quantistica μ² → g<sub>J</sub>²μ<sub>B</sub>²J(J+1): il «trucco» μ² → ⟨μ²⟩ traduce classico in quantistico (dispensa)."},
{id:"m45",b:"mag",q:"Perché la verifica quantitativa della teoria di Langevin sui gas classici era impossibile?",
o:["Il valore del momento μ del singolo atomo era incognito", "Perché la legge di Curie non era misurabile con precisione", "Perché i gas nobili non manifestano alcun paramagnetismo", "Perché non erano disponibili magneti sufficientemente intensi"],c:0,
e:"Langevin lascia μ come parametro libero; la MQ lo predice per ogni ione. Il confronto p<sub>eff</sub> teorico/sperimentale nelle tabelle delle terre rare è il trionfo della versione quantistica (dispensa, Esercitazione 17)."},
{id:"m46",b:"mag",q:"Il magnetone di Bohr in unità pratiche vale μ<sub>B</sub> ≈ 5,8·10⁻⁵ eV/T. A quale campo B l'energia μ<sub>B</sub>B eguaglia k<sub>B</sub>T a 300 K?",
o:["B ≈ 430 T, irraggiungibile in regime statico", "B ≈ 1 T, facilmente ottenibile con un magnete permanente", "B ≈ 10 T, ottenibile con un magnete superconduttore", "B ≈ 0,1 T, dell'ordine del campo di un magnete da frigorifero"],c:0,
e:"25 meV / 5,8·10⁻⁵ eV/T ≈ 430 T, contro i ~45 T statici record. La saturazione richiede quindi T criogeniche. Stima immediata che inquadra tutto il paramagnetismo (dispensa, Esercitazione 18)."},
{id:"m47",b:"mag",q:"Il momento magnetico per ione dedotto dalla LEGGE DI CURIE (χT) e quello dedotto dalla SATURAZIONE differiscono:",
o:["Curie dà ⟨μ⟩ = g<sub>J</sub>μ<sub>B</sub>√(J(J+1)), la saturazione dà μ<sub>sat</sub> = g<sub>J</sub>μ<sub>B</sub>J", "Coincidono sempre, essendo due misure della stessa grandezza", "La misura di saturazione fornisce sistematicamente il valore maggiore", "Differiscono soltanto per gli errori sperimentali di misura"],c:0,
e:"Nel regime lineare i momenti PRECEDONO (conta ⟨μ<sub>z</sub>²⟩); alla saturazione sono allineati al massimo m<sub>J</sub> = J. Confondere p<sub>eff</sub> con g<sub>J</sub>J è un errore da quiz classico (dispensa, Esercitazione 18)."},
{id:"m48",b:"mag",q:"Quale delle seguenti sequenze di suscettività a 300 K è realistica?",
o:["Diamagnete: −10⁻⁵; sale paramagnetico: +10⁻³; Pauli (metallo)", "Tutte dell'ordine dell'unità, indipendentemente dal materiale", "Diamagnete +10⁻² e paramagnete −10⁻³, con i segni invertiti", "Ferromagnete con χ ~ 10⁻⁵, come i materiali diamagnetici"],c:0,
e:"Ordini di grandezza da avere in mente per le crocette: il segno e la scala identificano il meccanismo. Il ferro non ha nemmeno una χ ben definita (dipende dalla storia): si parla di μ<sub>r</sub> efficace (dispensa)."},
{id:"m49",b:"mag",q:"L'effetto Barnett è il reciproco dell'Einstein–de Haas:",
o:["Un corpo messo in rotazione si magnetizza", "Un corpo magnetizzato si raffredda per smagnetizzazione adiabatica", "La rotazione rapida smagnetizza completamente il campione", "Non esiste alcun effetto reciproco di questo tipo"],c:0,
e:"Stessa fisica μ ↔ L letta al contrario: ω della rotazione equivale a un campo efficace. Entrambi gli esperimenti misurano γ e confermano che nel ferro γ = e/m (spin, g = 2) (dispensa)."},
{id:"m50",b:"mag",q:"Un materiale con χ &gt; 0 piccola e RIGOROSAMENTE indipendente dalla temperatura è probabilmente:",
o:["Un metallo (paramagnetismo di Pauli) o un sistema di van Vleck", "Un sale di terre rare diluito in una matrice diamagnetica", "Un ferromagnete portato sopra la sua temperatura di Curie", "Un superconduttore in stato Meissner sotto la temperatura critica"],c:0,
e:"χ ∝ 1/T (Curie) = momenti locali liberi; χ costante = elettroni itineranti degeneri (Pauli, ∝ 1/T<sub>F</sub>) o mescolamento van Vleck. Il comportamento in T è il DNA del meccanismo: prima domanda da farsi davanti ai dati (Esercitazione 18)."},
// ---- Magnetismo: sali paramagnetici (Es. 17) ----
{id:"m51",b:"mag",q:"Perché avere m<sub>J</sub> ≠ 0 non basta a garantire una magnetizzazione misurabile?",
o:["Serve anche che gli stati magnetici siano popolati", "È sufficiente in ogni caso, qualunque sia la temperatura", "Occorre applicare anche un campo elettrostatico esterno", "Occorre che il momento angolare totale J sia un numero intero"],c:0,
e:"M = n·μ<sub>B</sub>g<sub>J</sub>Σ(−m<sub>J</sub>)P(m<sub>J</sub>): il magnetismo è SEMPRE un fatto termodinamico. L'esempio J=0/J=1 con gap Δ dell'Esercitazione 17 mostra che due sistemi identici «magneticamente» rispondono in modo opposto a seconda di Δ vs k<sub>B</sub>T."},
{id:"m52",b:"mag",q:"Perché la matrice ospite di un sale paramagnetico è diamagnetica?",
o:["Nei legami chimici le subshell esterne si completano (regola dell'ottetto)", "Per via della temperatura a cui si trova il campione solido", "Perché la matrice ospite è un isolante elettrico e non un metallo", "Perché la matrice contiene atomi di idrogeno privi di elettroni"],c:0,
e:"Es. Al₂O₃: Al³⁺ e O²⁻ sono entrambi ¹S₀ (configurazioni di Ne). Solo lo ione drogante con subshell INTERNA incompleta (3d o 4f, non coinvolta nei legami) porta momento magnetico (Esercitazione 17, tema di luglio)."},
{id:"m53",b:"mag",q:"Il grafico di 1/χ<sub>M</sub> contro T per un sale paramagnetico ideale è:",
o:["Una retta per l'origine (legge di Curie): dalla pendenza si ricava p<sub>eff</sub>", "Una curva esponenziale crescente con la temperatura assoluta", "Una retta con intercetta sempre negativa sull'asse verticale", "Una parabola con concavità rivolta verso l'alto"],c:0,
e:"χ = C/T → 1/χ = T/C. Intercetta spostata (1/χ = (T−θ)/C) segnala interazioni residue (Curie–Weiss): θ &gt; 0 tendenza ferro, θ &lt; 0 antiferro. Lettura-lampo dei dati sperimentali (Esercitazione 17)."},
{id:"m54",b:"mag",q:"Per quale coppia di ioni la previsione «ione libero» p<sub>eff</sub> = g<sub>J</sub>√(J(J+1)) FALLISCE clamorosamente?",
o:["Cr³⁺ e gli altri ioni 3d, tranne il 3d⁵", "Gli ioni Gd³⁺ e Dy³⁺ delle terre rare pesanti", "Tutti gli ioni lantanidi, senza alcuna eccezione", "Nessuno: la previsione funziona sempre correttamente"],c:0,
e:"Cr³⁺: teoria con J dà 0,77, esperimento 3,85; con quenching 2√(S(S+1)) = 3,87 ✓. Le terre rare invece seguono lo ione libero (4f schermato). Il CONFRONTO tra le due famiglie è la domanda d'esame per eccellenza (Esercitazione 17)."},
{id:"m55",b:"mag",q:"Il modello del quenching usa un elettrone p in un potenziale a simmetria quadrata (cariche positive sugli assi). I «buoni» stati sono:",
o:["Le combinazioni reali p<sub>x</sub>, p<sub>y</sub>, p<sub>z</sub>: autostati di L² ma NON di L<sub>z</sub>", "Gli autostati dell'operatore L<sub>z</sub> con m = 0, ±1", "Stati con momento angolare orbitale totale L nullo", "Onde piane delocalizzate su tutto il cristallo"],c:0,
e:"Il campo cristallino rompe la simmetria di rotazione: la perturbazione degenere seleziona gli orbitali reali orientati verso/tra le cariche. Su funzioni reali ⟨L<sub>z</sub>⟩ = 0 (L<sub>z</sub> è immaginario puro): momento orbitale «spento» (Esercitazione 17)."},
{id:"m56",b:"mag",q:"Nel modello del quenching, quale orbitale p ha energia più bassa con cariche positive lungo x e y?",
o:["p<sub>x</sub> e p<sub>y</sub> (lobi verso le cariche positive: attrazione)", "p<sub>z</sub>, che si allontana dalle cariche positive del piano", "Restano tutti e tre degeneri, come nell'atomo isolato", "Dipende dall'orientazione dello spin dell'elettrone considerato"],c:0,
e:"L'elettrone abbassa l'energia avvicinandosi alle cariche +. Lo splitting orbitale nel campo cristallino (qui 2+1) è il prototipo dei t<sub>2g</sub>/e<sub>g</sub> nei complessi ottaedrici (Esercitazione 17)."},
{id:"m57",b:"mag",q:"In un campo cristallino OTTAEDRICO, i cinque orbitali d si separano in:",
o:["t<sub>2g</sub> più bassi ed e<sub>g</sub> più alti, separati da Δ₀", "e<sub>g</sub> più bassi e t<sub>2g</sub> più alti, con separazione Δ₀", "Cinque livelli tutti diversi fra loro", "Restano tutti e cinque degeneri"],c:0,
e:"I lobi e<sub>g</sub> puntano VERSO i ligandi (repulsione dagli anioni: su), i t<sub>2g</sub> in mezzo (giù). Nel campo tetraedrico l'ordine si INVERTE. La geometria di coordinazione decide lo splitting (Esercitazione 17)."},
{id:"m58",b:"mag",q:"Le «nuove regole di Hund» per gli ioni 3d nei sali sono:",
o:["S massimo; L = 0 (quenching); J = S → g = 2, p<sub>eff</sub> = 2√(S(S+1))", "S massimo, L massimo e J = L+S, come per lo ione libero", "S = 0 sempre, con momento magnetico complessivamente nullo", "L massimo e J = L, trascurando del tutto il contributo di spin"],c:0,
e:"La 2ª e 3ª regola dello ione libero sono scavalcate dal campo cristallino (che batte lo spin-orbita nei 3d). La 1ª (S max) resta: lo scambio intra-atomico è più forte del campo cristallino (Esercitazione 17)."},
{id:"m59",b:"mag",q:"Il «dragging» residuo dello spin-orbita nei sali 3d produce:",
o:["g<sub>eff</sub> leggermente ≠ 2: minore di 2 per subshell &lt; metà", "g esattamente pari a 1, come per i termini di singoletto", "La distruzione completa del quenching del momento orbitale", "La comparsa di ordine ferromagnetico spontaneo nel sale"],c:0,
e:"Lo spin-orbita, pur soppresso, «trascina» un residuo di momento orbitale: correzione fine ai p<sub>eff</sub> (es. Co²⁺ misurato sopra il valore di puro spin). Spiega le piccole deviazioni sistematiche nelle tabelle (Esercitazione 17)."},
{id:"m60",b:"mag",q:"L'eccezione di Sm³⁺ ed Eu³⁺ alle tabelle delle terre rare si spiega perché:",
o:["Il primo multipletto eccitato dista ~k<sub>B</sub>T dal fondamentale", "Perché in questi due ioni l'orbitale 4f non risulta schermato", "Perché si tratta in realtà di ioni 3d travestiti da terre rare", "Perché possiedono un momento angolare totale J semintero"],c:0,
e:"Sm³⁺: p<sub>th</sub>(solo fondamentale) = 0,85 vs p<sub>exp</sub> = 1,74. Serve sommare su più livelli J con pesi di Boltzmann (+ termine van Vleck per Eu³⁺, J = 0). «In passato oggetto di diversi esercizi nei temi d'esame» (Esercitazione 17)."},
{id:"m61",b:"mag",q:"Perché il ferromagnetismo NON può esistere per un singolo atomo isolato?",
o:["È un fenomeno cooperativo fra atomi diversi", "Perché gli atomi sono elettricamente neutri nel loro complesso", "Per via del teorema di Bohr–van Leeuwen sulla magnetizzazione", "In realtà esiste, e prende il nome di momento magnetico atomico"],c:0,
e:"Un atomo ha μ fissato da Hund; il ferromagnetismo è l'ordine SPONTANEO di molti momenti accoppiati (sotto T<sub>C</sub>). Confondere «grande momento atomico» con «ferromagnete» è errore concettuale da quiz (Esercitazione 17)."},
{id:"m62",b:"mag",q:"Nella gerarchia delle interazioni per uno ione magnetico, la differenza 4f vs 3d sta nell'ordine di:",
o:["Spin-orbita e campo cristallino: 4f → SO poi CC; 3d → CC poi SO", "Nell'ordine fra interazione coulombiana ed effetto Zeeman", "Nell'ordine fra interazione di scambio e correlazione elettronica", "Non c'è alcuna differenza: la gerarchia è identica"],c:0,
e:"1) e-nucleo, 2) e-e, poi: terre rare SO &gt; CC (4f schermato); metalli 3d CC &gt; SO (3d esposto). Lo Zeeman è sempre ultimo. Questa inversione è TUTTA la differenza tra le due famiglie di sali (Esercitazione 17)."},
{id:"m63",b:"mag",q:"Quali regole di Hund usare per il p<sub>eff</sub> di Fe²⁺ (3d⁶) in un sale?",
o:["S = 2 (4 spaiati), L quenchato → p<sub>eff</sub> = 2√(6) ≈ 4,90", "Le tre regole complete di Hund valide per lo ione libero", "S = 0, per compensazione fra gli spin dei sei elettroni d", "J = L − S = 4, secondo la terza regola di Hund"],c:0,
e:"3d⁶: 5 spin su + 1 giù → S = 2. Con quenching: p = 2√(2·3) = 4,90 (sperimentale ~5,4: il dragging alza). Con J (ione libero, ⁵D₄, g = 3/2): darebbe 6,7 — sbagliato. Meccanica del calcolo da avere fluida (Esercitazione 17)."},
{id:"m64",b:"mag",q:"La costante di Curie molare di un sale contiene il fattore n (densità di ioni MAGNETICI). Nel rubino (Al₂O₃ drogato 10% Cr³⁺):",
o:["n = 10% della densità dei siti Al: la diluizione entra linearmente in χ", "n pari alla densità totale di tutti gli atomi del cristallo", "Il valore di n non entra affatto nel calcolo della suscettività", "n pari alla densità degli ioni ossigeno presenti nella matrice"],c:0,
e:"χ = n·μ₀p<sub>eff</sub>²μ<sub>B</sub>²/3k<sub>B</sub>T: contare correttamente n (con la stechiometria e la percentuale di drogaggio) è metà del punto numerico — così nel tema di luglio (χ<sub>m</sub> = 6,2·10⁻⁴) (Esercitazione 17)."},
{id:"m65",b:"mag",q:"Prima di usare la legge di Curie in un problema numerico bisogna SEMPRE verificare che:",
o:["a = g<sub>J</sub>μ<sub>B</sub>JB/k<sub>B</sub>T ≪ 1 (regime lineare)", "Che la temperatura del campione sia superiore a 300 K", "Che il campo magnetico applicato superi il tesla", "Che il sale paramagnetico risulti otticamente colorato"],c:0,
e:"Nel tema di luglio: a = 0,034 ≪ 1 ✓ (verifica richiesta esplicitamente). A basse T o campi alti il sistema si avvicina alla saturazione e χ perde significato: il grafico χ vs 1/T devia dalla retta (Esercitazioni 17-18)."},
{id:"m66",b:"mag",q:"Il paramagnetismo di van Vleck (J = 0 ma L, S ≠ 0) nasce al secondo ordine perturbativo perché:",
o:["Il campo mescola il fondamentale con multipletti vicini", "Perché il campo eccita termicamente gli stati a energia più alta", "Perché lo spin si disaccoppia completamente dal momento orbitale", "Perché si tratta di un effetto di origine puramente nucleare"],c:0,
e:"E⁽²⁾ = −Σ|⟨exc|μ<sub>z</sub>B|0⟩|²/ΔE &lt; 0: l'energia SCENDE col campo → paramagnetico. Se ΔE ≫ k<sub>B</sub>T: né Curie né saturazione — χ piccola e costante. Caso Eu³⁺ (⁷F₀) (Esercitazione 17)."},
{id:"m67",b:"mag",q:"Un sale con concentrazione TROPPO ALTA di ioni magnetici smette di seguire Curie perché:",
o:["Le funzioni d'onda 3d/4f iniziano a sovrapporsi: lo scambio accoppia gli ioni", "Perché la massa complessiva del campione aumenta sensibilmente", "Perché gli ioni magnetici perdono progressivamente la loro carica", "Perché il campo cristallino della matrice tende a scomparire"],c:0,
e:"La diluizione serve a isolare gli ioni: statistica di momenti indipendenti. Aumentando la concentrazione compare θ ≠ 0 in 1/χ e, sotto una T critica, ordine ferro/antiferro: dal paramagnetismo al magnetismo cooperativo (Esercitazione 17)."},
{id:"m68",b:"mag",q:"Come si misura sperimentalmente p<sub>eff</sub> di uno ione in un sale?",
o:["Dalla pendenza di 1/χ vs T (costante di Curie): p<sub>eff</sub> = √(3k<sub>B</sub>C/nμ₀μ<sub>B</sub>²)", "Contando direttamente gli elettroni spaiati al microscopio", "Dalla temperatura di fusione del sale paramagnetico diluito", "Dalla misura della resistività elettrica in funzione di T"],c:0,
e:"Procedura standard: misura χ(T) → fit lineare di 1/χ → C → p<sub>eff</sub>, da confrontare con g<sub>J</sub>√(J(J+1)) (4f) o 2√(S(S+1)) (3d). È l'anello sperimentale del confronto teoria-esperimento delle tabelle (Esercitazione 17)."},
{id:"m69",b:"mag",q:"Lo ione Yb³⁺ (4f¹³) si comporta come:",
o:["Una «lacuna» nella shell 4f: termine ²F₇/₂ (più che semipiena → J = L+S)", "Uno ione a shell completamente chiusa e quindi diamagnetico", "Un caso tipico di quenching del momento angolare orbitale", "Un ferromagnete atomico con momento spontaneo permanente"],c:0,
e:"Una lacuna in una shell quasi piena si tratta come una particella: S = 1/2, L = 3, J = 7/2, g = 8/7. Sperimentale 4,50 vs teorico 4,54 ✓. La simmetria particella-lacuna accorcia i conti (Esercitazione 17)."},
{id:"m70",b:"mag",q:"Perché per i sali 3d si usano spesso ioni 2+ e 3+ (es. Fe²⁺/Fe³⁺, Cr³⁺)?",
o:["Nei composti i metalli di transizione perdono i 4s (e talvolta un 3d)", "Perché gli ioni bivalenti e trivalenti sono più stabili termicamente", "Per via dell'elevata carica del nucleo dei metalli di transizione", "Non esiste un motivo particolare: è una scelta convenzionale"],c:0,
e:"Es. Cr: [Ar]3d⁵4s¹ → Cr³⁺ [Ar]3d³. La configurazione dello IONE (non dell'atomo neutro!) decide S: partire dalla configurazione sbagliata è l'errore-base nei problemi (Esercitazione 17)."},
// ---- Magnetismo: Pauli, saturazione (Es. 18), ferromagnetismo ----
{id:"m71",b:"mag",q:"Le curve sperimentali di Henry (M per ione vs B/T per Cr³⁺, Fe³⁺, Gd³⁺) sono un test severo della teoria perché:",
o:["Seguono ESATTAMENTE le funzioni di Brillouin con i J previsti", "Mostrano curve identiche fra loro per tutti e tre gli ioni", "Deviano sistematicamente dalle previsioni della teoria quantistica", "Valgono soltanto a temperatura ambiente e campi moderati"],c:0,
e:"Dati a 1,3–4,2 K e campi fino a 5 T: a ≳ 1 raggiunto. Ogni ione satura al SUO M<sub>sat</sub> = g<sub>J</sub>μ<sub>B</sub>J (3, 5, 7 μ<sub>B</sub>) e segue la SUA B<sub>J</sub>: conferma di quantizzazione e teoria in un colpo solo (Esercitazione 18)."},
{id:"m72",b:"mag",q:"Nella derivazione del paramagnetismo di Pauli, accendendo B le due sottobande di spin:",
o:["Si spostano di ∓μ<sub>B</sub>B e gli spin ruotano fino a un unico ε<sub>F</sub>", "Si svuotano entrambe, cedendo elettroni alla banda di valenza", "Restano immutate, perché il campo non agisce sugli spin itineranti", "Si scambiano fra loro, invertendo le popolazioni di spin"],c:0,
e:"Lo spostamento rigido creerebbe due «mari» a livelli diversi: gli elettroni della banda sfavorita ruotano lo spin e riempiono gli stati vuoti dell'altra. Il riequilibrio coinvolge solo la zona vicino a ε<sub>F</sub> (Esercitazione 18)."},
{id:"m73",b:"mag",q:"L'eccesso di spin nella derivazione di Pauli si calcola con l'«approssimazione del rettangolo»:",
o:["Δn↑−Δn↓ = g(ε<sub>F</sub>)·μ<sub>B</sub>B", "Δn = n/2, cioè metà degli elettroni di conduzione del metallo", "Δn = g(ε<sub>F</sub>)·k<sub>B</sub>T, con la finestra termica al posto del campo", "Δn = μ<sub>B</sub>B/ε<sub>F</sub>, rapporto fra energia magnetica e di Fermi"],c:0,
e:"Con μ<sub>B</sub>B ≪ ε<sub>F</sub>, la fetta di stati coinvolta è sottile: Δn = g(ε<sub>F</sub>)μ<sub>B</sub>B → M = μ<sub>B</sub>Δn = g(ε<sub>F</sub>)μ<sub>B</sub>²B → χ<sub>P</sub> = μ₀μ<sub>B</sub>²g(ε<sub>F</sub>). Tre righe di conto: da saper riprodurre (Esercitazione 18)."},
{id:"m74",b:"mag",q:"Con g(ε<sub>F</sub>) = (3/2)n/ε<sub>F</sub>, la suscettività di Pauli diventa:",
o:["χ<sub>P</sub> = (3/2)·nμ₀μ<sub>B</sub>²/ε<sub>F</sub> = (3/2)·nμ₀μ<sub>B</sub>²/(k<sub>B</sub>T<sub>F</sub>)", "χ<sub>P</sub> = nμ₀μ<sub>B</sub>²/3k<sub>B</sub>T, cioè la legge di Curie", "χ<sub>P</sub> = μ₀μ<sub>B</sub>²·n·T, crescente con la temperatura", "χ<sub>P</sub> diverge allo zero assoluto"],c:0,
e:"Formalmente è «Curie con T → T<sub>F</sub>»: χ<sub>P</sub> = (T/T<sub>F</sub>)·χ<sub>Curie</sub>(T). Il denominatore fisso T<sub>F</sub> (~10⁴–10⁵ K) al posto di T spiega perché è piccola E costante (Esercitazione 18)."},
{id:"m75",b:"mag",q:"Quali DUE anomalie sperimentali del sodio metallico risolve il paramagnetismo di Pauli?",
o:["χ ~100 volte più piccola del previsto atomico E indipendente da T", "Una suscettività negativa e oscillante in funzione del campo", "Una suscettività gigantesca e con evidente ciclo di isteresi", "Nessuna anomalia: il sodio metallico non è affatto paramagnetico"],c:0,
e:"χ<sub>exp</sub> ≈ +7·10⁻⁶, costante in T, contro il modello a momenti liberi (~6·10⁻⁴, ∝1/T). Il principio di Pauli blocca la rotazione degli spin profondi: partecipa solo la frazione T/T<sub>F</sub>. Stessa soppressione del calore specifico (Esercitazione 18)."},
{id:"m76",b:"mag",q:"Il contributo orbitale degli elettroni di conduzione (diamagnetismo di Landau) vale:",
o:["χ<sub>L</sub> = −(1/3)χ<sub>Pauli</sub>: il totale itinerante è", "χ<sub>L</sub> = −χ<sub>Pauli</sub>, con cancellazione totale dei due termini", "χ<sub>L</sub> = +χ<sub>Pauli</sub>/3, cioè con lo stesso segno dello spin", "χ<sub>L</sub> = 0 esattamente: il moto orbitale non contribuisce"],c:0,
e:"B curva le orbite → livelli di Landau → risposta diamagnetica quantistica (classicamente nulla per Bohr–van Leeuwen). Il fattore −⅓ vale per banda parabolica con m* = m: deviazioni di m* lo modificano (Esercitazione 18)."},
{id:"m77",b:"mag",q:"Le oscillazioni di Shubnikov–de Haas (e de Haas–van Alphen) permettono di:",
o:["Ricostruire la superficie di Fermi", "Misurare la temperatura di Curie dei materiali ferromagnetici", "Osservare direttamente la struttura dei domini magnetici", "Determinare la massa e il momento magnetico del nucleo atomico"],c:0,
e:"Il periodo in 1/B è ∝ 1/(area estremale della superficie di Fermi ⊥ B): ruotando il campo si «tomografa» la superficie. Applicazione dei livelli di Landau citata nelle dispense (Esercitazione 18)."},
{id:"m78",b:"mag",q:"La suscettività TOTALE del sodio metallico somma tre contributi:",
o:["Diamagnetismo del core (Ne), Pauli (spin itineranti, +), Landau", "Soltanto il paramagnetismo di Pauli degli elettroni itineranti", "La legge di Curie dell'elettrone 3s sommata al termine di core", "Un debole ferromagnetismo sommato al contributo diamagnetico"],c:0,
e:"Il core ¹S₀ dà il Larmor–Langevin; l'elettrone 3s delocalizzato dà Pauli+Landau. Il bilancio netto è il debole χ &gt; 0 costante misurato. Scomporre i contributi è il tipico ultimo punto di un problema (Esercitazione 18)."},
{id:"m79",b:"mag",q:"Il modello di Pauli/Landau funziona per gli alcalini ma NON per i metalli di transizione perché:",
o:["Nei 3d le bande strette e la forte g(ε<sub>F</sub>) esaltano correlazioni e scambio", "Perché i metalli di transizione non hanno elettroni di conduzione", "Perché nei metalli 3d vale la statistica classica di Boltzmann", "In realtà il modello si applica in modo identico a tutti i metalli"],c:0,
e:"«Se Sommerfeld fallisce, fallisce anche Pauli»: la banda d è tutt'altro che parabolica e lo scambio tra itineranti (criterio di Stoner: U·g(ε<sub>F</sub>) &gt; 1) può ordinare gli spin: Fe, Co, Ni. Limite dichiarato del modello (Esercitazione 18)."},
{id:"m80",b:"mag",q:"Nel ciclo di isteresi, B<sub>r</sub> e H<sub>c</sub> indicano:",
o:["Campo residuo (magnetizzazione a H = 0) e campo coercitivo", "Il campo massimo e quello minimo raggiunti durante il ciclo", "Le pendenze iniziale e finale della curva di magnetizzazione", "Le due temperature critiche di transizione del materiale"],c:0,
e:"Il ciclo si percorre in senso antiorario partendo dalla curva di prima magnetizzazione. B<sub>r</sub> misura il magnete permanente; H<sub>c</sub> la difficoltà di smagnetizzare; l'AREA del ciclo l'energia dissipata per ciclo (dispensa)."},
{id:"m81",b:"mag",q:"Alla temperatura di Curie T<sub>C</sub> (Fe: 1043 K), il ferromagnete:",
o:["Perde la magnetizzazione spontanea e diventa paramagnetico", "Diventa diamagnetico, con suscettività negativa e piccola", "Fonde, perdendo la struttura cristallina ordinata del reticolo", "Diventa superconduttore, espellendo il flusso magnetico"],c:0,
e:"Transizione di fase: l'agitazione termica vince l'interazione di scambio. M(T) cala con continuità e si annulla a T<sub>C</sub>; sopra, i momenti restano ma scorrelati: χ = C/(T−T<sub>C</sub>) (dispensa)."},
{id:"m82",b:"mag",q:"Il momento magnetico per atomo del ferro metallico (~2,2 μ<sub>B</sub>) confrontato con M<sub>sat</sub> misurata mostra che:",
o:["Dentro un dominio tutti i momenti sono già allineati", "Che soltanto l'uno per cento dei momenti riesce ad allinearsi", "Che il momento magnetico atomico cresce al crescere del campo", "Che il ferro in realtà non raggiunge mai la saturazione completa"],c:0,
e:"M<sub>sat</sub>/n ≈ μ<sub>ion</sub>: l'ordine microscopico è già completo a campo nullo (sotto T<sub>C</sub>); il campo esterno serve solo a orientare i DOMINI. Distinzione dominio/campione da tenere chiara (dispensa)."},
{id:"m83",b:"mag",q:"L'anisotropia magnetocristallina (assi facili: Fe [100], Ni [111]) ha origine da:",
o:["Lo spin-orbita residuo che accoppia gli spin alla simmetria del reticolo", "L'interazione dipolare magnetica fra domini adiacenti del campione", "Soltanto la forma geometrica del campione macroscopico", "Il campo magnetico terrestre presente durante la misura"],c:0,
e:"Lo scambio è isotropo (S<sub>i</sub>·S<sub>j</sub>): da solo non sceglierebbe direzioni. Il SO lega lo spin agli orbitali e questi al cristallo: energia di anisotropia ~10⁻⁵–10⁻⁴ eV/atomo, decisiva per pareti, coercitività e magneti permanenti (dispensa)."},
{id:"m84",b:"mag",q:"Perché un ferromagnete si suddivide spontaneamente in domini di Weiss?",
o:["Per minimizzare l'energia magnetostatica del campo esterno", "Per aumentare l'entropia configurazionale del sistema di spin", "Per via della repulsione elettrostatica fra gli elettroni", "Per difetti introdotti durante la fabbricazione del materiale"],c:0,
e:"Un monodominio genera campo nello spazio (½∫B·H dV): suddividendosi e chiudendo il flusso (domini di chiusura) il costo esterno crolla. L'equilibrio volume/superficie fissa la taglia dei domini (~μm) (dispensa)."},
{id:"m85",b:"mag",q:"Lo spessore di una parete di Bloch (~10³ Å nel Fe) risulta dalla competizione tra:",
o:["Scambio, che allarga le pareti, e anisotropia, che le stringe", "Il campo magnetico esterno applicato e la temperatura del campione", "L'interazione dipolare e l'accoppiamento Zeeman con il campo", "Non esiste una spiegazione: lo spessore è puramente empirico"],c:0,
e:"Ruotare 180° in un solo passo costerebbe ~J′ per legame; spalmare la rotazione su N passi costa J′π²/N ma tiene ~N spin fuori asse facile: il minimo dà N ~ √(J′/K) ~ centinaia di passi reticolari (dispensa)."},
{id:"m86",b:"mag",q:"L'effetto Barkhausen (rumore «a scatti» durante la magnetizzazione) rivela che:",
o:["Le pareti si muovono a salti, strappandosi dai difetti", "Che la magnetizzazione cresce in modo perfettamente continuo", "Che gli spin ruotano uno alla volta, in sequenza ordinata", "Che il campo magnetico applicato oscilla attorno al valor medio"],c:0,
e:"Amplificando la f.e.m. indotta si sentono i «click» dei salti di parete. Dimostra la dinamica a pinning/depinning: base della parte irreversibile della curva di magnetizzazione e dell'isteresi (dispensa)."},
{id:"m87",b:"mag",q:"La curva di prima magnetizzazione di un ferromagnete procede attraverso:",
o:["Pareti reversibili, poi irreversibili, poi rotazione dei domini", "Soltanto rotazioni della magnetizzazione all'interno dei domini", "Un unico salto brusco dalla configurazione iniziale a quella finale", "La nucleazione di nuovi atomi magnetici all'interno del reticolo"],c:0,
e:"A campi bassi crescono i domini «ben orientati» (elastico, reversibile); poi le pareti saltano i difetti (irreversibile: qui nasce l'isteresi); a campi alti resta solo la rotazione contro l'anisotropia (dispensa)."},
{id:"m88",b:"mag",q:"Nel modello di Weiss, la magnetizzazione spontanea si trova risolvendo graficamente:",
o:["M/M<sub>sat</sub> = B<sub>J</sub>(a) insieme a una retta di pendenza ∝ T", "Un'equazione lineare nella magnetizzazione", "L'equazione di Laplace per il potenziale magnetico scalare", "Un integrale ellittico che richiede metodi numerici"],c:0,
e:"Il campo molecolare λM entra nell'argomento della Brillouin: autoconsistenza. La pendenza della retta cresce con T: sopra T<sub>C</sub> l'unica intersezione è M = 0; sotto, la soluzione M ≠ 0 è stabile. Grafico da saper disegnare all'esame (dispensa)."},
{id:"m89",b:"mag",q:"Nel modello di Weiss, la temperatura di Curie risulta:",
o:["T<sub>C</sub> = μ₀λnμ²/3k<sub>B</sub> (versione quantistica: μ² → g²μ<sub>B</sub>²S(S+1))", "T<sub>C</sub> = λ/n, rapporto fra costante di Weiss e densità", "T<sub>C</sub> è indipendente dalla costante di campo molecolare λ", "T<sub>C</sub> = μ<sub>B</sub>B/k<sub>B</sub>, con il campo esterno applicato"],c:0,
e:"Sviluppando B<sub>J</sub> per piccoli a al limite di stabilità. Con T<sub>C</sub> ~ 10³ K esce λ ~ 10³: il campo molecolare B<sub>m</sub> = μ₀λM ~ 10³ T. Inoltre C = T<sub>C</sub>/λ lega Curie–Weiss e T<sub>C</sub> (dispensa)."},
{id:"m90",b:"mag",q:"Sopra T<sub>C</sub>, il modello di Weiss prevede χ = C/(T−T<sub>C</sub>). Sperimentalmente:",
o:["La legge vale, ma la T<sub>C</sub> estrapolata è un po' maggiore", "La legge fallisce completamente nella regione paramagnetica", "La suscettività resta costante al di sopra della transizione", "L'intercetta estrapolata risulta sistematicamente negativa"],c:0,
e:"Il campo medio ignora le correlazioni a corto raggio che sopravvivono sopra T<sub>C</sub>: vicino alla transizione gli esponenti critici reali differiscono. Dettaglio sperimentale citato nelle dispense (T<sub>C,p</sub> ≳ T<sub>C,f</sub>)."},
{id:"m91",b:"mag",q:"L'hamiltoniana di Heisenberg H = −(2J′/ħ²)Σ S<sub>i</sub>·S<sub>j</sub> con J′ &gt; 0 favorisce:",
o:["Spin paralleli (ferromagnetismo); con J′ &lt; 0 spin antiparalleli", "Spin ortogonali fra loro, in configurazione non collineare", "Sempre spin antiparalleli, qualunque sia il segno di J′", "Nessun ordine magnetico, indipendentemente dal segno di J′"],c:0,
e:"J′ = ½(E<sub>↑↓</sub>−E<sub>↑↑</sub>): il segno decide l'ordine. L'origine è elettrostatica-quantistica (overlap + Pauli), NON magnetica: per questo k<sub>B</sub>T<sub>C</sub> ~ 0,1 eV è possibile (dispensa)."},
{id:"m92",b:"mag",q:"Sullo stesso atomo (es. elio), i livelli con spin diversi sono separati da E = E<sub>Coulomb</sub> ± J<sub>sc</sub>. Questo è il prototipo di:",
o:["La prima regola di Hund, che favorisce il tripletto", "La legge di Curie per la suscettività dei sali paramagnetici", "Il diamagnetismo di Larmor delle shell elettroniche chiuse", "La superconduttività e l'accoppiamento in coppie di Cooper"],c:0,
e:"Scambio intra-atomico (Hund, sempre «ferro») vs inter-atomico (segno variabile con la distanza, Bethe–Slater): stessa matematica, contesti diversi. Collegamento tra fisica atomica e magnetismo dei solidi (dispensa)."},
{id:"m93",b:"mag",q:"La curva di Bethe–Slater rappresenta J′ in funzione di:",
o:["Il rapporto fra distanza interatomica e raggio della shell 3d", "La temperatura assoluta a cui si trova il materiale magnetico", "L'intensità del campo magnetico esterno applicato al campione", "Il numero atomico Z degli elementi della serie di transizione"],c:0,
e:"L'overlap decide segno e intensità dello scambio. Spiega con UNA curva perché Fe/Co/Ni sono ferro, Mn e Cr antiferro, e le terre rare (4f interni, overlap nullo) paramagnetiche fino a bassissime T (dispensa)."},
{id:"m94",b:"mag",q:"Le leghe di Heusler (es. Cu₂MnSn) sono ferromagnetiche pur contenendo manganese perché:",
o:["Nella lega gli atomi di Mn sono più DISTANZIATI che nel Mn puro", "Perché il rame è di per sé un materiale ferromagnetico", "Perché lo stagno cede elettroni magnetici agli atomi di manganese", "Si tratta in realtà di un errore sperimentale mai confermato"],c:0,
e:"Prova sperimentale spettacolare della Bethe–Slater: la distanza Mn–Mn, non la chimica del singolo atomo, decide l'ordine magnetico (dispensa)."},
{id:"m95",b:"mag",q:"In approssimazione di campo medio, l'hamiltoniana di Heisenberg riproduce il modello di Weiss con:",
o:["λ = 2Z·J′<sub>sc</sub>/(μ₀nμ<sub>B</sub>²g²): il campo molecolare È lo scambio", "λ coincide con l'integrale di scambio J′ senza altri fattori", "λ = 1/J′, cioè l'inverso dell'integrale di scambio", "Non esiste alcuna relazione fra i due parametri"],c:0,
e:"Sostituendo S<sub>j</sub> → ⟨S⟩ ∝ M: H<sub>i</sub> ≈ −μ<sub>i</sub>·(λμ₀M). Per il Fe (Z = 8): J′ ~ 10⁻² eV, coerente col calcolo microscopico. Il «mistero» del campo molecolare di Weiss è risolto (dispensa)."},
{id:"m96",b:"mag",q:"In un antiferromagnete (es. MnO), sotto la temperatura di Néel T<sub>N</sub>:",
o:["Due sottoreticoli con magnetizzazioni opposte", "La magnetizzazione spontanea diverge alla temperatura di Néel", "Il materiale diventa ferromagnetico con momento non nullo", "Gli spin si dispongono in modo completamente casuale"],c:0,
e:"χ(T) ha un MASSIMO a T<sub>N</sub> (non una divergenza) e sopra segue Curie–Weiss con θ NEGATIVA. L'ordine si vede con la diffrazione di neutroni (raddoppio della cella magnetica): collegamento col blocco diffrazione."},
{id:"m97",b:"mag",q:"Un segno sperimentale che distingue antiferro da para semplice nella zona T &gt; T<sub>critica</sub> è:",
o:["L'intercetta θ dell'estrapolazione di 1/χ: θ &lt; 0 per antiferro", "Il valore assoluto della suscettività misurata a temperatura fissa", "Il colore assunto dal campione al di sotto della transizione", "La densità del materiale confrontata con quella teorica"],c:0,
e:"1/χ = (T−θ)/C: la stessa retta di Curie–Weiss, ma il segno di θ rivela il segno dell'interazione di scambio media. Lettura standard dei dati χ(T) (dispensa, Esercitazione 17)."},
{id:"m98",b:"mag",q:"Per un trasformatore serve un materiale magnetico:",
o:["DOLCE: ciclo di isteresi strettissimo (basse perdite per ciclo)", "Duro, con elevato campo coercitivo e magnetizzazione residua", "Antiferromagnetico, con magnetizzazione totale nulla", "Diamagnetico, per espellere il flusso magnetico dal nucleo"],c:0,
e:"P<sub>persa</sub> = f·(area del ciclo): a 50 Hz ogni mJ di area conta. Per i magneti permanenti serve l'opposto (NdFeB, H<sub>c</sub> enormi). Collegare microstruttura (pinning) e applicazione è tipica domanda di commento (dispensa)."},
{id:"m99",b:"mag",q:"Per smagnetizzare completamente un pezzo di ferro si può:",
o:["Scaldarlo sopra T<sub>C</sub> o applicare cicli decrescenti", "Semplicemente aspettare che si smagnetizzi spontaneamente", "Raffreddarlo fino alla temperatura dell'elio liquido, 4 K", "Illuminarlo con radiazione ultravioletta ad alta intensità"],c:0,
e:"Entrambe le vie riportano i domini alla configurazione disordinata a M = 0 (il degauss dei vecchi monitor CRT!). La smagnetizzazione termica è la prova che l'ordine è di equilibrio sotto T<sub>C</sub> (dispensa)."},
{id:"m100",b:"mag",q:"Quale catena logica spiega il ferromagnetismo partendo dai principi primi?",
o:["Coulomb + Pauli → scambio → Heisenberg → Weiss → domini", "Interazione dipolare → allineamento dei momenti → isteresi", "Campo esterno applicato → ordinamento permanente degli spin", "Spin-orbita → interazione di scambio → legge di Curie"],c:0,
e:"La piramide completa del blocco magnetismo, dal microscopico al macroscopico: saperla percorrere in entrambe le direzioni è la preparazione ideale per l'orale (dispensa, Esercitazioni 17-18)."},
