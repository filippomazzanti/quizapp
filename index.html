e:"H è generato dalle correnti libere (∇×H = j<sub>c</sub>), M dalle correnti di magnetizzazione (∇×M = j<sub>m</sub>). Per dia/para χ ~ ±10⁻⁵–10⁻³; per i ferro μ<sub>r</sub> ~ 10³–10⁵ e la linearità salta (isteresi) (dispensa)."},
{id:"m34",b:"mag",q:"Il rapporto giromagnetico orbitale e di spin valgono rispettivamente:",
o:["μ<sub>L</sub> = −(e/2m)L e μ<sub>S</sub> = −(e/m)S: lo spin è «doppiamente efficace» (g<sub>s</sub> ≈ 2)","Uguali: −e/2m per entrambi","−e/m per entrambi","+e/2m e +e/m"],c:0,
e:"Il fattore 2 dello spin (da Dirac, con correzioni QED ~0,1%) è il motivo per cui gli esperimenti alla Einstein–de Haas distinguono l'origine orbitale o di spin del magnetismo: misurano γ = M/L (dispensa)."},
{id:"m35",b:"mag",q:"Perché il magnetismo NUCLEARE è trascurabile rispetto a quello elettronico?",
o:["μ<sub>N</sub> = eħ/2m<sub>p</sub> è ~1836 volte più piccolo di μ<sub>B</sub>: la massa al denominatore penalizza il protone","I nuclei non hanno spin","I nuclei sono schermati dagli elettroni","Non è trascurabile"],c:0,
e:"Le energie nucleari Zeeman sono ~10⁻⁷ eV: irrilevanti per χ, ma preziose per NMR/MRI (risonanza a radiofrequenze). Nei bilanci di suscettività si ignora sempre il nucleo (dispensa)."},
{id:"m36",b:"mag",q:"Perché la precessione di Larmor NON produce da sola l'allineamento dei dipoli al campo?",
o:["τ = μ×B conserva l'angolo tra μ e B: per allinearsi serve DISSIPAZIONE (scambio di energia col reticolo o tra spin)","Perché il campo è troppo debole","Perché i dipoli sono quantizzati","L'allineamento è istantaneo"],c:0,
e:"La precessione è moto conservativo (ω<sub>L</sub> = eB/2m, angolo fisso). La magnetizzazione di equilibrio nasce dalla statistica (Boltzmann sui livelli) TRAMITE i processi di rilassamento. Distinzione concettuale da orale (dispensa)."},
{id:"m37",b:"mag",q:"La validità della trattazione di Larmor (precessione lenta) richiede:",
o:["ω<sub>L</sub> ≪ ω₀ (frequenze orbitali atomiche): vero per qualunque campo di laboratorio (B ≪ 10⁶ T)","B &gt; 100 T","Temperature criogeniche","Atomi pesanti"],c:0,
e:"ω<sub>L</sub>/ω₀ ≈ μ<sub>B</sub>B/E<sub>atomica</sub> ~ 10⁻⁵·B[T]: il campo esterno è SEMPRE una perturbazione minuscola sulla struttura atomica. Giustifica l'uso della teoria perturbativa in tutto il magnetismo (dispensa)."},
{id:"m38",b:"mag",q:"La suscettività diamagnetica di Larmor–Langevin, χ = −(μ₀ne²/6m)Σ⟨r²⟩, si verifica sperimentalmente graficando χ contro:",
o:["Z<sub>eff</sub>·r̄² degli ioni: i dati si allineano su ~2 decadi","La temperatura","Il campo applicato","La massa atomica"],c:0,
e:"Approssimando Σ⟨r<sub>i</sub>²⟩ ≈ Z<sub>eff</sub>·r̄² (elettroni esterni), i sali diamagnetici cadono su una retta: il modello, pur «classico», cattura la fisica perché ⟨r²⟩ è calcolato quantisticamente (dispensa)."},
{id:"m39",b:"mag",q:"Nel diamagnetismo quantistico, il termine H′ = (e²/2m)A² con A = ½B×r dà al primo ordine:",
o:["E⁽¹⁾ = (e²B²/12m)⟨r²⟩ &gt; 0: energia che cresce col campo → risposta diamagnetica","Un contributo negativo","Zero per parità","Il termine Zeeman"],c:0,
e:"∂²E/∂B² &gt; 0 → μ = −∂E/∂B &lt; 0. Con shell chiuse (L = S = J = 0) è l'UNICO termine: si ritrova esattamente la formula di Larmor–Langevin, ma ora ⟨r²⟩ è ben definito (dispensa)."},
{id:"m40",b:"mag",q:"L'hamiltoniana magnetica completa di un atomo contiene H<sub>para</sub> = (e/2m)(L+2S)·B e H<sub>dia</sub> ∝ A². Quando il paramagnetismo domina?",
o:["Appena J ≠ 0: il termine lineare in B (Zeeman) vince sempre sul quadratico ai campi ordinari","Mai","Solo nei metalli","Solo a T = 0"],c:0,
e:"Ordini di grandezza: paramagnetico ~μ<sub>B</sub>B ~ 10⁻⁴ eV/T contro diamagnetico ~10⁻⁹ eV/T². Il diamagnetismo si vede solo con J = 0 (shell chiuse, molecole sature). Gerarchia da citare nei commenti dei problemi (dispensa)."},
{id:"m41",b:"mag",q:"La dimostrazione di Bohr–van Leeuwen usa il fatto che la funzione di partizione classica:",
o:["Non dipende dal potenziale vettore: la sostituzione p → p−(−e)A si riassorbe traslando l'integrale sui momenti","Diverge in campo magnetico","Dipende solo dalla temperatura","È nulla per B ≠ 0"],c:0,
e:"L'integrale gaussiano sui momenti è invariante per traslazioni: Z(B) = Z(0) → F indipendente da B → M = 0. Nessuna scappatoia classica: dia e para emergono SOLO dalla quantizzazione dei livelli (dispensa, Esercitazione 9)."},
{id:"m42",b:"mag",q:"Nell'immagine «a orbite» del teorema di Bohr–van Leeuwen, le correnti di ciclotrone interne sono cancellate da:",
o:["Le «skipping orbits» degli elettroni che rimbalzano sul bordo del campione: correnti di bordo in verso opposto","Le correnti nucleari","L'attrito","Le cariche positive"],c:0,
e:"Le orbite interne danno dia, quelle di bordo (che percorrono il perimetro in senso opposto) esattamente para: totale nullo. Immagine geometrica elegante della cancellazione di van Vleck (dispensa)."},
{id:"m43",b:"mag",q:"La trattazione classica di Langevin per il paramagnete tratta l'orientazione dei dipoli come:",
o:["Un angolo θ continuo con peso di Boltzmann e^(+μBcosθ/k<sub>B</sub>T): media su tutte le direzioni","Due soli stati su/giù","Direzioni fisse casuali","Precessione senza statistica"],c:0,
e:"Z₁ = ∫e^(βμBcosθ)dΩ → M = nμL(a) con L(a) = coth(a) − 1/a. È il limite J → ∞ della trattazione quantistica: utile come confronto, sbagliata nei dettagli (curve di saturazione) (dispensa, Esercitazione 9)."},
{id:"m44",b:"mag",q:"La funzione di Langevin L(a) per a ≪ 1 si comporta come:",
o:["L(a) ≈ a/3: da qui la legge di Curie classica χ = nμ₀μ²/3k<sub>B</sub>T","L(a) ≈ 1","L(a) ≈ a²","L(a) ≈ 1/a"],c:0,
e:"Sviluppo di coth: il fattore 1/3 viene dalla media sulle orientazioni. Nella versione quantistica μ² → g<sub>J</sub>²μ<sub>B</sub>²J(J+1): il «trucco» μ² → ⟨μ²⟩ traduce classico in quantistico (dispensa)."},
{id:"m45",b:"mag",q:"Perché la verifica quantitativa della teoria di Langevin sui gas classici era impossibile?",
o:["Il valore del momento μ del singolo atomo era incognito: solo la quantizzazione (μ = g<sub>J</sub>μ<sub>B</sub>√(J(J+1))) lo fissa","La legge di Curie non era misurabile","I gas non sono paramagnetici","Mancavano i magneti"],c:0,
e:"Langevin lascia μ come parametro libero; la MQ lo predice per ogni ione. Il confronto p<sub>eff</sub> teorico/sperimentale nelle tabelle delle terre rare è il trionfo della versione quantistica (dispensa, Esercitazione 17)."},
{id:"m46",b:"mag",q:"Il magnetone di Bohr in unità pratiche vale μ<sub>B</sub> ≈ 5,8·10⁻⁵ eV/T. A quale campo B l'energia μ<sub>B</sub>B eguaglia k<sub>B</sub>T a 300 K?",
o:["B ≈ 430 T: irraggiungibile staticamente — per questo a RT vale sempre il regime lineare (Curie)","B ≈ 1 T","B ≈ 10 T","B ≈ 0,1 T"],c:0,
e:"25 meV / 5,8·10⁻⁵ eV/T ≈ 430 T, contro i ~45 T statici record. La saturazione richiede quindi T criogeniche. Stima immediata che inquadra tutto il paramagnetismo (dispensa, Esercitazione 18)."},
{id:"m47",b:"mag",q:"Il momento magnetico per ione dedotto dalla LEGGE DI CURIE (χT) e quello dedotto dalla SATURAZIONE differiscono:",
o:["Curie dà ⟨μ⟩ = g<sub>J</sub>μ<sub>B</sub>√(J(J+1)), la saturazione dà μ<sub>sat</sub> = g<sub>J</sub>μ<sub>B</sub>J: √(J(J+1)) &gt; J sempre","Sono sempre uguali","La saturazione dà il valore maggiore","Differiscono solo per gli errori di misura"],c:0,
e:"Nel regime lineare i momenti PRECEDONO (conta ⟨μ<sub>z</sub>²⟩); alla saturazione sono allineati al massimo m<sub>J</sub> = J. Confondere p<sub>eff</sub> con g<sub>J</sub>J è un errore da quiz classico (dispensa, Esercitazione 18)."},
{id:"m48",b:"mag",q:"Quale delle seguenti sequenze di suscettività a 300 K è realistica?",
o:["Diamagnete: −10⁻⁵; sale paramagnetico: +10⁻³; Pauli (metallo): +10⁻⁶; ferro: μ<sub>r</sub> ~ 10³–10⁵","Tutte ~1","Diamagnete +10⁻²; para −10⁻³","Ferro: χ ~ 10⁻⁵"],c:0,
e:"Ordini di grandezza da avere in mente per le crocette: il segno e la scala identificano il meccanismo. Il ferro non ha nemmeno una χ ben definita (dipende dalla storia): si parla di μ<sub>r</sub> efficace (dispensa)."},
{id:"m49",b:"mag",q:"L'effetto Barnett è il reciproco dell'Einstein–de Haas:",
o:["Un corpo messo in rotazione si magnetizza: la rotazione «pesca» i momenti magnetici tramite il loro momento angolare","Un corpo magnetizzato si raffredda","La rotazione smagnetizza","Non esiste"],c:0,
e:"Stessa fisica μ ↔ L letta al contrario: ω della rotazione equivale a un campo efficace. Entrambi gli esperimenti misurano γ e confermano che nel ferro γ = e/m (spin, g = 2) (dispensa)."},
{id:"m50",b:"mag",q:"Un materiale con χ &gt; 0 piccola e RIGOROSAMENTE indipendente dalla temperatura è probabilmente:",
o:["Un metallo (paramagnetismo di Pauli) o un sistema di van Vleck: i due para «senza Curie»","Un sale di terre rare","Un ferromagnete sopra T<sub>C</sub>","Un superconduttore"],c:0,
e:"χ ∝ 1/T (Curie) = momenti locali liberi; χ costante = elettroni itineranti degeneri (Pauli, ∝ 1/T<sub>F</sub>) o mescolamento van Vleck. Il comportamento in T è il DNA del meccanismo: prima domanda da farsi davanti ai dati (Esercitazione 18)."},
// ---- Magnetismo: sali paramagnetici (Es. 17) ----
{id:"m51",b:"mag",q:"Perché avere m<sub>J</sub> ≠ 0 non basta a garantire una magnetizzazione misurabile?",
o:["Serve anche che gli stati magnetici siano POPOLATI: se il gap col fondamentale Δ ≫ k<sub>B</sub>T, M → 0","Basta sempre","Serve un campo elettrico","Serve che J sia intero"],c:0,
e:"M = n·μ<sub>B</sub>g<sub>J</sub>Σ(−m<sub>J</sub>)P(m<sub>J</sub>): il magnetismo è SEMPRE un fatto termodinamico. L'esempio J=0/J=1 con gap Δ dell'Esercitazione 17 mostra che due sistemi identici «magneticamente» rispondono in modo opposto a seconda di Δ vs k<sub>B</sub>T."},
{id:"m52",b:"mag",q:"Perché la matrice ospite di un sale paramagnetico è diamagnetica?",
o:["Nei legami chimici le subshell esterne si completano (regola dell'ottetto): gli ioni della matrice restano a shell chiuse, J = 0","Per la temperatura","Perché è un isolante","Perché contiene idrogeno"],c:0,
e:"Es. Al₂O₃: Al³⁺ e O²⁻ sono entrambi ¹S₀ (configurazioni di Ne). Solo lo ione drogante con subshell INTERNA incompleta (3d o 4f, non coinvolta nei legami) porta momento magnetico (Esercitazione 17, tema di luglio)."},
{id:"m53",b:"mag",q:"Il grafico di 1/χ<sub>M</sub> contro T per un sale paramagnetico ideale è:",
o:["Una retta per l'origine (legge di Curie): dalla pendenza si ricava p<sub>eff</sub>","Un'esponenziale","Una retta con intercetta negativa sempre","Una parabola"],c:0,
e:"χ = C/T → 1/χ = T/C. Intercetta spostata (1/χ = (T−θ)/C) segnala interazioni residue (Curie–Weiss): θ &gt; 0 tendenza ferro, θ &lt; 0 antiferro. Lettura-lampo dei dati sperimentali (Esercitazione 17)."},
{id:"m54",b:"mag",q:"Per quale coppia di ioni la previsione «ione libero» p<sub>eff</sub> = g<sub>J</sub>√(J(J+1)) FALLISCE clamorosamente?",
o:["Cr³⁺ e gli altri 3d (tranne 3d⁵): il campo cristallino spegne L","Gd³⁺ e Dy³⁺","Tutti i lantanidi","Nessuno: funziona sempre"],c:0,
e:"Cr³⁺: teoria con J dà 0,77, esperimento 3,85; con quenching 2√(S(S+1)) = 3,87 ✓. Le terre rare invece seguono lo ione libero (4f schermato). Il CONFRONTO tra le due famiglie è la domanda d'esame per eccellenza (Esercitazione 17)."},
{id:"m55",b:"mag",q:"Il modello del quenching usa un elettrone p in un potenziale a simmetria quadrata (cariche positive sugli assi). I «buoni» stati sono:",
o:["Le combinazioni reali p<sub>x</sub>, p<sub>y</sub>, p<sub>z</sub>: autostati di L² ma NON di L<sub>z</sub>","Gli autostati di L<sub>z</sub> (m = 0, ±1)","Stati con L = 0","Onde piane"],c:0,
e:"Il campo cristallino rompe la simmetria di rotazione: la perturbazione degenere seleziona gli orbitali reali orientati verso/tra le cariche. Su funzioni reali ⟨L<sub>z</sub>⟩ = 0 (L<sub>z</sub> è immaginario puro): momento orbitale «spento» (Esercitazione 17)."},
{id:"m56",b:"mag",q:"Nel modello del quenching, quale orbitale p ha energia più bassa con cariche positive lungo x e y?",
o:["p<sub>x</sub> e p<sub>y</sub> (lobi verso le cariche positive: attrazione), mentre p<sub>z</sub> resta su","p<sub>z</sub>","Tutti degeneri","Dipende dallo spin"],c:0,
e:"L'elettrone abbassa l'energia avvicinandosi alle cariche +. Lo splitting orbitale nel campo cristallino (qui 2+1) è il prototipo dei t<sub>2g</sub>/e<sub>g</sub> nei complessi ottaedrici (Esercitazione 17)."},
{id:"m57",b:"mag",q:"In un campo cristallino OTTAEDRICO, i cinque orbitali d si separano in:",
o:["t<sub>2g</sub> (xy, xz, yz) più bassi ed e<sub>g</sub> (x²−y², z²) più alti, separati da Δ₀","e<sub>g</sub> più bassi e t<sub>2g</sub> più alti","Cinque livelli tutti diversi","Restano degeneri"],c:0,
e:"I lobi e<sub>g</sub> puntano VERSO i ligandi (repulsione dagli anioni: su), i t<sub>2g</sub> in mezzo (giù). Nel campo tetraedrico l'ordine si INVERTE. La geometria di coordinazione decide lo splitting (Esercitazione 17)."},
{id:"m58",b:"mag",q:"Le «nuove regole di Hund» per gli ioni 3d nei sali sono:",
o:["S massimo; L = 0 (quenching); J = S → g = 2, p<sub>eff</sub> = 2√(S(S+1))","S max, L max, J = L+S","S = 0 sempre","L massimo e J = L"],c:0,
e:"La 2ª e 3ª regola dello ione libero sono scavalcate dal campo cristallino (che batte lo spin-orbita nei 3d). La 1ª (S max) resta: lo scambio intra-atomico è più forte del campo cristallino (Esercitazione 17)."},
{id:"m59",b:"mag",q:"Il «dragging» residuo dello spin-orbita nei sali 3d produce:",
o:["g<sub>eff</sub> leggermente ≠ 2: minore di 2 per subshell &lt; metà, maggiore di 2 per &gt; metà","g = 1 esatto","La distruzione del quenching","Il ferromagnetismo"],c:0,
e:"Lo spin-orbita, pur soppresso, «trascina» un residuo di momento orbitale: correzione fine ai p<sub>eff</sub> (es. Co²⁺ misurato sopra il valore di puro spin). Spiega le piccole deviazioni sistematiche nelle tabelle (Esercitazione 17)."},
{id:"m60",b:"mag",q:"L'eccezione di Sm³⁺ ed Eu³⁺ alle tabelle delle terre rare si spiega perché:",
o:["Il primo multipletto eccitato dista ~k<sub>B</sub>T dal fondamentale: a temperatura ambiente è parzialmente popolato e contribuisce a χ","Il 4f non è schermato in questi due ioni","Sono ioni 3d camuffati","Hanno J semintero"],c:0,
e:"Sm³⁺: p<sub>th</sub>(solo fondamentale) = 0,85 vs p<sub>exp</sub> = 1,74. Serve sommare su più livelli J con pesi di Boltzmann (+ termine van Vleck per Eu³⁺, J = 0). «In passato oggetto di diversi esercizi nei temi d'esame» (Esercitazione 17)."},
{id:"m61",b:"mag",q:"Perché il ferromagnetismo NON può esistere per un singolo atomo isolato?",
o:["È un fenomeno cooperativo: serve l'interazione di scambio TRA atomi diversi; un atomo ha solo il suo momento paramagnetico","Perché gli atomi sono neutri","Per il teorema di Bohr–van Leeuwen","Esiste: si chiama momento atomico"],c:0,
e:"Un atomo ha μ fissato da Hund; il ferromagnetismo è l'ordine SPONTANEO di molti momenti accoppiati (sotto T<sub>C</sub>). Confondere «grande momento atomico» con «ferromagnete» è errore concettuale da quiz (Esercitazione 17)."},
{id:"m62",b:"mag",q:"Nella gerarchia delle interazioni per uno ione magnetico, la differenza 4f vs 3d sta nell'ordine di:",
o:["Spin-orbita e campo cristallino: 4f → SO poi CC; 3d → CC poi SO","Coulomb e Zeeman","Scambio e correlazione","Nessuna differenza"],c:0,
e:"1) e-nucleo, 2) e-e, poi: terre rare SO &gt; CC (4f schermato); metalli 3d CC &gt; SO (3d esposto). Lo Zeeman è sempre ultimo. Questa inversione è TUTTA la differenza tra le due famiglie di sali (Esercitazione 17)."},
{id:"m63",b:"mag",q:"Quali regole di Hund usare per il p<sub>eff</sub> di Fe²⁺ (3d⁶) in un sale?",
o:["S = 2 (4 spaiati), L quenchato → p<sub>eff</sub> = 2√(6) ≈ 4,90","Le tre regole complete dello ione libero","S = 0 per compensazione","J = L−S = 4"],c:0,
e:"3d⁶: 5 spin su + 1 giù → S = 2. Con quenching: p = 2√(2·3) = 4,90 (sperimentale ~5,4: il dragging alza). Con J (ione libero, ⁵D₄, g = 3/2): darebbe 6,7 — sbagliato. Meccanica del calcolo da avere fluida (Esercitazione 17)."},
{id:"m64",b:"mag",q:"La costante di Curie molare di un sale contiene il fattore n (densità di ioni MAGNETICI). Nel rubino (Al₂O₃ drogato 10% Cr³⁺):",
o:["n = 10% della densità dei siti Al: la diluizione entra linearmente in χ","n = densità di tutti gli atomi","n non conta","n = densità degli ossigeni"],c:0,
e:"χ = n·μ₀p<sub>eff</sub>²μ<sub>B</sub>²/3k<sub>B</sub>T: contare correttamente n (con la stechiometria e la percentuale di drogaggio) è metà del punto numerico — così nel tema di luglio (χ<sub>m</sub> = 6,2·10⁻⁴) (Esercitazione 17)."},
{id:"m65",b:"mag",q:"Prima di usare la legge di Curie in un problema numerico bisogna SEMPRE verificare che:",
o:["a = g<sub>J</sub>μ<sub>B</sub>JB/k<sub>B</sub>T ≪ 1 (regime lineare): altrimenti serve la Brillouin completa","T &gt; 300 K","B &gt; 1 T","Il sale sia colorato"],c:0,
e:"Nel tema di luglio: a = 0,034 ≪ 1 ✓ (verifica richiesta esplicitamente). A basse T o campi alti il sistema si avvicina alla saturazione e χ perde significato: il grafico χ vs 1/T devia dalla retta (Esercitazioni 17-18)."},
{id:"m66",b:"mag",q:"Il paramagnetismo di van Vleck (J = 0 ma L, S ≠ 0) nasce al secondo ordine perturbativo perché:",
o:["Il campo mescola il fondamentale con multipletti J = 1 vicini: guadagno di energia ∝ B² → χ &gt; 0 indipendente da T","Il campo eccita termicamente gli stati alti","Lo spin si disaccoppia","È un effetto nucleare"],c:0,
e:"E⁽²⁾ = −Σ|⟨exc|μ<sub>z</sub>B|0⟩|²/ΔE &lt; 0: l'energia SCENDE col campo → paramagnetico. Se ΔE ≫ k<sub>B</sub>T: né Curie né saturazione — χ piccola e costante. Caso Eu³⁺ (⁷F₀) (Esercitazione 17)."},
{id:"m67",b:"mag",q:"Un sale con concentrazione TROPPO ALTA di ioni magnetici smette di seguire Curie perché:",
o:["Le funzioni d'onda 3d/4f iniziano a sovrapporsi: lo scambio accoppia gli ioni (Curie–Weiss, poi ordine magnetico)","La massa aumenta","Gli ioni si scaricano","Il campo cristallino sparisce"],c:0,
e:"La diluizione serve a isolare gli ioni: statistica di momenti indipendenti. Aumentando la concentrazione compare θ ≠ 0 in 1/χ e, sotto una T critica, ordine ferro/antiferro: dal paramagnetismo al magnetismo cooperativo (Esercitazione 17)."},
{id:"m68",b:"mag",q:"Come si misura sperimentalmente p<sub>eff</sub> di uno ione in un sale?",
o:["Dalla pendenza di 1/χ vs T (costante di Curie): p<sub>eff</sub> = √(3k<sub>B</sub>C/nμ₀μ<sub>B</sub>²)","Contando gli elettroni al microscopio","Dalla temperatura di fusione","Dalla resistività"],c:0,
e:"Procedura standard: misura χ(T) → fit lineare di 1/χ → C → p<sub>eff</sub>, da confrontare con g<sub>J</sub>√(J(J+1)) (4f) o 2√(S(S+1)) (3d). È l'anello sperimentale del confronto teoria-esperimento delle tabelle (Esercitazione 17)."},
{id:"m69",b:"mag",q:"Lo ione Yb³⁺ (4f¹³) si comporta come:",
o:["Una «lacuna» nella shell 4f: termine ²F₇/₂ (più che semipiena → J = L+S), p<sub>eff</sub> = 4,54","Uno ione a shell chiusa","Un caso di quenching","Un ferromagnete atomico"],c:0,
e:"Una lacuna in una shell quasi piena si tratta come una particella: S = 1/2, L = 3, J = 7/2, g = 8/7. Sperimentale 4,50 vs teorico 4,54 ✓. La simmetria particella-lacuna accorcia i conti (Esercitazione 17)."},
{id:"m70",b:"mag",q:"Perché per i sali 3d si usano spesso ioni 2+ e 3+ (es. Fe²⁺/Fe³⁺, Cr³⁺)?",
o:["Nei composti i metalli di transizione perdono i 4s (e talvolta un 3d): resta la subshell 3d incompleta, sede del magnetismo","Perché sono più stabili termicamente","Per la carica del nucleo","Non c'è motivo particolare"],c:0,
e:"Es. Cr: [Ar]3d⁵4s¹ → Cr³⁺ [Ar]3d³. La configurazione dello IONE (non dell'atomo neutro!) decide S: partire dalla configurazione sbagliata è l'errore-base nei problemi (Esercitazione 17)."},
// ---- Magnetismo: Pauli, saturazione (Es. 18), ferromagnetismo ----
{id:"m71",b:"mag",q:"Le curve sperimentali di Henry (M per ione vs B/T per Cr³⁺, Fe³⁺, Gd³⁺) sono un test severo della teoria perché:",
o:["Seguono ESATTAMENTE le funzioni di Brillouin con i J previsti, dal regime lineare fino alla saturazione","Mostrano curve identiche per i tre ioni","Deviano sempre dalla teoria","Valgono solo a T ambiente"],c:0,
e:"Dati a 1,3–4,2 K e campi fino a 5 T: a ≳ 1 raggiunto. Ogni ione satura al SUO M<sub>sat</sub> = g<sub>J</sub>μ<sub>B</sub>J (3, 5, 7 μ<sub>B</sub>) e segue la SUA B<sub>J</sub>: conferma di quantizzazione e teoria in un colpo solo (Esercitazione 18)."},
{id:"m72",b:"mag",q:"Nella derivazione del paramagnetismo di Pauli, accendendo B le due sottobande di spin:",
o:["Si spostano di ∓μ<sub>B</sub>B in verso opposto; gli spin in eccesso ruotano fino a riportare un unico livello di Fermi comune","Si svuotano entrambe","Restano immutate","Si scambiano"],c:0,
e:"Lo spostamento rigido creerebbe due «mari» a livelli diversi: gli elettroni della banda sfavorita ruotano lo spin e riempiono gli stati vuoti dell'altra. Il riequilibrio coinvolge solo la zona vicino a ε<sub>F</sub> (Esercitazione 18)."},
{id:"m73",b:"mag",q:"L'eccesso di spin nella derivazione di Pauli si calcola con l'«approssimazione del rettangolo»:",
o:["Δn<sub>↑</sub>−Δn<sub>↓</sub> = g(ε<sub>F</sub>)·μ<sub>B</sub>B: la densità di stati al livello di Fermi moltiplicata per lo spostamento μ<sub>B</sub>B delle sottobande","Δn = n/2","Δn = g(ε<sub>F</sub>)·k<sub>B</sub>T","Δn = μ<sub>B</sub>B/ε<sub>F</sub>"],c:0,
e:"Con μ<sub>B</sub>B ≪ ε<sub>F</sub>, la fetta di stati coinvolta è sottile: Δn = g(ε<sub>F</sub>)μ<sub>B</sub>B → M = μ<sub>B</sub>Δn = g(ε<sub>F</sub>)μ<sub>B</sub>²B → χ<sub>P</sub> = μ₀μ<sub>B</sub>²g(ε<sub>F</sub>). Tre righe di conto: da saper riprodurre (Esercitazione 18)."},
{id:"m74",b:"mag",q:"Con g(ε<sub>F</sub>) = (3/2)n/ε<sub>F</sub>, la suscettività di Pauli diventa:",
o:["χ<sub>P</sub> = (3/2)·nμ₀μ<sub>B</sub>²/ε<sub>F</sub> = (3/2)·nμ₀μ<sub>B</sub>²/(k<sub>B</sub>T<sub>F</sub>)","χ<sub>P</sub> = nμ₀μ<sub>B</sub>²/3k<sub>B</sub>T","χ<sub>P</sub> = μ₀μ<sub>B</sub>²·n·T","χ<sub>P</sub> = ∞ a T = 0"],c:0,
e:"Formalmente è «Curie con T → T<sub>F</sub>»: χ<sub>P</sub> = (T/T<sub>F</sub>)·χ<sub>Curie</sub>(T). Il denominatore fisso T<sub>F</sub> (~10⁴–10⁵ K) al posto di T spiega perché è piccola E costante (Esercitazione 18)."},
{id:"m75",b:"mag",q:"Quali DUE anomalie sperimentali del sodio metallico risolve il paramagnetismo di Pauli?",
o:["χ ~100 volte più piccola del previsto atomico E indipendente da T (niente Curie)","χ negativa e oscillante","χ gigante e isteretica","Nessuna: il Na non è paramagnetico"],c:0,
e:"χ<sub>exp</sub> ≈ +7·10⁻⁶, costante in T, contro il modello a momenti liberi (~6·10⁻⁴, ∝1/T). Il principio di Pauli blocca la rotazione degli spin profondi: partecipa solo la frazione T/T<sub>F</sub>. Stessa soppressione del calore specifico (Esercitazione 18)."},
{id:"m76",b:"mag",q:"Il contributo orbitale degli elettroni di conduzione (diamagnetismo di Landau) vale:",
o:["χ<sub>L</sub> = −(1/3)χ<sub>Pauli</sub>: il totale itinerante è (2/3)χ<sub>P</sub> &gt; 0 per gli alcalini","χ<sub>L</sub> = −χ<sub>P</sub> (cancellazione totale)","χ<sub>L</sub> = +χ<sub>P</sub>/3","χ<sub>L</sub> = 0 esattamente"],c:0,
e:"B curva le orbite → livelli di Landau → risposta diamagnetica quantistica (classicamente nulla per Bohr–van Leeuwen). Il fattore −⅓ vale per banda parabolica con m* = m: deviazioni di m* lo modificano (Esercitazione 18)."},
{id:"m77",b:"mag",q:"Le oscillazioni di Shubnikov–de Haas (e de Haas–van Alphen) permettono di:",
o:["Ricostruire la superficie di Fermi: le proprietà oscillano in 1/B al passaggio dei livelli di Landau attraverso ε<sub>F</sub>","Misurare la temperatura di Curie","Vedere i domini magnetici","Misurare la massa del nucleo"],c:0,
e:"Il periodo in 1/B è ∝ 1/(area estremale della superficie di Fermi ⊥ B): ruotando il campo si «tomografa» la superficie. Applicazione dei livelli di Landau citata nelle dispense (Esercitazione 18)."},
{id:"m78",b:"mag",q:"La suscettività TOTALE del sodio metallico somma tre contributi:",
o:["Diamagnetismo del core (Ne), Pauli (spin itineranti, +), Landau (orbite itineranti, −⅓ Pauli)","Solo Pauli","Curie del 3s + core","Ferromagnetismo debole + dia"],c:0,
e:"Il core ¹S₀ dà il Larmor–Langevin; l'elettrone 3s delocalizzato dà Pauli+Landau. Il bilancio netto è il debole χ &gt; 0 costante misurato. Scomporre i contributi è il tipico ultimo punto di un problema (Esercitazione 18)."},
{id:"m79",b:"mag",q:"Il modello di Pauli/Landau funziona per gli alcalini ma NON per i metalli di transizione perché:",
o:["Nei 3d le bande strette e la forte g(ε<sub>F</sub>) esaltano correlazioni e scambio: si va verso Stoner e il ferromagnetismo itinerante","I 3d non hanno elettroni di conduzione","Nei 3d vale la statistica classica","Il modello vale identico ovunque"],c:0,
e:"«Se Sommerfeld fallisce, fallisce anche Pauli»: la banda d è tutt'altro che parabolica e lo scambio tra itineranti (criterio di Stoner: U·g(ε<sub>F</sub>) &gt; 1) può ordinare gli spin: Fe, Co, Ni. Limite dichiarato del modello (Esercitazione 18)."},
{id:"m80",b:"mag",q:"Nel ciclo di isteresi, B<sub>r</sub> e H<sub>c</sub> indicano:",
o:["Campo residuo (magnetizzazione a H = 0) e campo coercitivo (H necessario ad annullare B)","Campo massimo e minimo","Le pendenze iniziale e finale","Temperature critiche"],c:0,
e:"Il ciclo si percorre in senso antiorario partendo dalla curva di prima magnetizzazione. B<sub>r</sub> misura il magnete permanente; H<sub>c</sub> la difficoltà di smagnetizzare; l'AREA del ciclo l'energia dissipata per ciclo (dispensa)."},
{id:"m81",b:"mag",q:"Alla temperatura di Curie T<sub>C</sub> (Fe: 1043 K), il ferromagnete:",
o:["Perde la magnetizzazione spontanea e diventa paramagnetico (con legge di Curie–Weiss sopra T<sub>C</sub>)","Diventa diamagnetico","Fonde","Diventa superconduttore"],c:0,
e:"Transizione di fase: l'agitazione termica vince l'interazione di scambio. M(T) cala con continuità e si annulla a T<sub>C</sub>; sopra, i momenti restano ma scorrelati: χ = C/(T−T<sub>C</sub>) (dispensa)."},
{id:"m82",b:"mag",q:"Il momento magnetico per atomo del ferro metallico (~2,2 μ<sub>B</sub>) confrontato con M<sub>sat</sub> misurata mostra che:",
o:["Dentro un dominio TUTTI i momenti atomici sono allineati: la saturazione tecnica corrisponde all'allineamento dei domini, non dei singoli spin","Solo l'1% dei momenti si allinea","Il momento atomico cresce col campo","Il ferro non satura mai"],c:0,
e:"M<sub>sat</sub>/n ≈ μ<sub>ion</sub>: l'ordine microscopico è già completo a campo nullo (sotto T<sub>C</sub>); il campo esterno serve solo a orientare i DOMINI. Distinzione dominio/campione da tenere chiara (dispensa)."},
{id:"m83",b:"mag",q:"L'anisotropia magnetocristallina (assi facili: Fe [100], Ni [111]) ha origine da:",
o:["Lo spin-orbita residuo che accoppia gli spin alla simmetria del reticolo","L'interazione dipolare tra domini","La forma del campione soltanto","Il campo terrestre"],c:0,
e:"Lo scambio è isotropo (S<sub>i</sub>·S<sub>j</sub>): da solo non sceglierebbe direzioni. Il SO lega lo spin agli orbitali e questi al cristallo: energia di anisotropia ~10⁻⁵–10⁻⁴ eV/atomo, decisiva per pareti, coercitività e magneti permanenti (dispensa)."},
{id:"m84",b:"mag",q:"Perché un ferromagnete si suddivide spontaneamente in domini di Weiss?",
o:["Per minimizzare l'energia magnetostatica del campo esterno (∝ volume), al costo delle pareti (∝ superficie)","Per aumentare l'entropia","Per la repulsione tra elettroni","Per difetti di fabbricazione"],c:0,
e:"Un monodominio genera campo nello spazio (½∫B·H dV): suddividendosi e chiudendo il flusso (domini di chiusura) il costo esterno crolla. L'equilibrio volume/superficie fissa la taglia dei domini (~μm) (dispensa)."},
{id:"m85",b:"mag",q:"Lo spessore di una parete di Bloch (~10³ Å nel Fe) risulta dalla competizione tra:",
o:["Scambio (vuole rotazioni graduali → pareti larghe) e anisotropia (vuole spin sugli assi facili → pareti strette)","Campo esterno e temperatura","Dipolare e Zeeman","Non ha spiegazione"],c:0,
e:"Ruotare 180° in un solo passo costerebbe ~J′ per legame; spalmare la rotazione su N passi costa J′π²/N ma tiene ~N spin fuori asse facile: il minimo dà N ~ √(J′/K) ~ centinaia di passi reticolari (dispensa)."},
{id:"m86",b:"mag",q:"L'effetto Barkhausen (rumore «a scatti» durante la magnetizzazione) rivela che:",
o:["Le pareti dei domini si muovono con salti discreti, strappandosi dai difetti che le ancorano","La magnetizzazione è continua","Gli spin ruotano uno alla volta","Il campo applicato oscilla"],c:0,
e:"Amplificando la f.e.m. indotta si sentono i «click» dei salti di parete. Dimostra la dinamica a pinning/depinning: base della parte irreversibile della curva di magnetizzazione e dell'isteresi (dispensa)."},
{id:"m87",b:"mag",q:"La curva di prima magnetizzazione di un ferromagnete procede attraverso:",
o:["Spostamenti di parete reversibili → spostamenti irreversibili (Barkhausen) → rotazione della magnetizzazione dei domini fuori asse facile","Solo rotazioni","Un salto unico","Nucleazione di nuovi atomi"],c:0,
e:"A campi bassi crescono i domini «ben orientati» (elastico, reversibile); poi le pareti saltano i difetti (irreversibile: qui nasce l'isteresi); a campi alti resta solo la rotazione contro l'anisotropia (dispensa)."},
{id:"m88",b:"mag",q:"Nel modello di Weiss, la magnetizzazione spontanea si trova risolvendo graficamente:",
o:["M/M<sub>sat</sub> = B<sub>J</sub>(a) insieme alla retta a ∝ M·(T/…): sotto T<sub>C</sub> esiste un'intersezione a M ≠ 0","Un'equazione lineare","L'equazione di Laplace","Un integrale ellittico"],c:0,
e:"Il campo molecolare λM entra nell'argomento della Brillouin: autoconsistenza. La pendenza della retta cresce con T: sopra T<sub>C</sub> l'unica intersezione è M = 0; sotto, la soluzione M ≠ 0 è stabile. Grafico da saper disegnare all'esame (dispensa)."},
{id:"m89",b:"mag",q:"Nel modello di Weiss, la temperatura di Curie risulta:",
o:["T<sub>C</sub> = μ₀λnμ²/3k<sub>B</sub> (versione quantistica: μ² → g²μ<sub>B</sub>²S(S+1)): proporzionale alla costante di campo molecolare λ","T<sub>C</sub> = λ/n","T<sub>C</sub> indipendente da λ","T<sub>C</sub> = μ<sub>B</sub>B/k<sub>B</sub>"],c:0,
e:"Sviluppando B<sub>J</sub> per piccoli a al limite di stabilità. Con T<sub>C</sub> ~ 10³ K esce λ ~ 10³: il campo molecolare B<sub>m</sub> = μ₀λM ~ 10³ T. Inoltre C = T<sub>C</sub>/λ lega Curie–Weiss e T<sub>C</sub> (dispensa)."},
{id:"m90",b:"mag",q:"Sopra T<sub>C</sub>, il modello di Weiss prevede χ = C/(T−T<sub>C</sub>). Sperimentalmente:",
o:["La legge vale bene, ma la T<sub>C</sub> «paramagnetica» estrapolata è leggermente MAGGIORE della T<sub>C</sub> reale (fluttuazioni trascurate dal campo medio)","La legge fallisce completamente","χ resta costante","θ estrapolata è sempre negativa"],c:0,
e:"Il campo medio ignora le correlazioni a corto raggio che sopravvivono sopra T<sub>C</sub>: vicino alla transizione gli esponenti critici reali differiscono. Dettaglio sperimentale citato nelle dispense (T<sub>C,p</sub> ≳ T<sub>C,f</sub>)."},
{id:"m91",b:"mag",q:"L'hamiltoniana di Heisenberg H = −(2J′/ħ²)Σ S<sub>i</sub>·S<sub>j</sub> con J′ &gt; 0 favorisce:",
o:["Spin paralleli (ferromagnetismo); con J′ &lt; 0 spin antiparalleli (antiferromagnetismo)","Spin ortogonali","Sempre antiparalleli","Nessun ordine"],c:0,
e:"J′ = ½(E<sub>↑↓</sub>−E<sub>↑↑</sub>): il segno decide l'ordine. L'origine è elettrostatica-quantistica (overlap + Pauli), NON magnetica: per questo k<sub>B</sub>T<sub>C</sub> ~ 0,1 eV è possibile (dispensa)."},
{id:"m92",b:"mag",q:"Sullo stesso atomo (es. elio), i livelli con spin diversi sono separati da E = E<sub>Coulomb</sub> ± J<sub>sc</sub>. Questo è il prototipo di:",
o:["La prima regola di Hund: J<sub>sc</sub> &gt; 0 intra-atomico favorisce il tripletto","La legge di Curie","Il diamagnetismo","La superconduttività"],c:0,
e:"Scambio intra-atomico (Hund, sempre «ferro») vs inter-atomico (segno variabile con la distanza, Bethe–Slater): stessa matematica, contesti diversi. Collegamento tra fisica atomica e magnetismo dei solidi (dispensa)."},
{id:"m93",b:"mag",q:"La curva di Bethe–Slater rappresenta J′ in funzione di:",
o:["Il rapporto tra distanza interatomica e raggio della shell 3d: piccolo → antiferro (Mn), intermedio → ferro (Fe, Co, Ni), grande → J′ ≈ 0","La temperatura","Il campo applicato","Il numero atomico Z"],c:0,
e:"L'overlap decide segno e intensità dello scambio. Spiega con UNA curva perché Fe/Co/Ni sono ferro, Mn e Cr antiferro, e le terre rare (4f interni, overlap nullo) paramagnetiche fino a bassissime T (dispensa)."},
{id:"m94",b:"mag",q:"Le leghe di Heusler (es. Cu₂MnSn) sono ferromagnetiche pur contenendo manganese perché:",
o:["Nella lega gli atomi di Mn sono più DISTANZIATI che nel Mn puro: sulla curva di Bethe–Slater J′ passa da negativo a positivo","Il rame è ferromagnetico","Lo stagno dona elettroni magnetici","È un errore sperimentale"],c:0,
e:"Prova sperimentale spettacolare della Bethe–Slater: la distanza Mn–Mn, non la chimica del singolo atomo, decide l'ordine magnetico (dispensa)."},
{id:"m95",b:"mag",q:"In approssimazione di campo medio, l'hamiltoniana di Heisenberg riproduce il modello di Weiss con:",
o:["λ = 2Z·J′<sub>sc</sub>/(μ₀nμ<sub>B</sub>²g²): il campo molecolare È lo scambio con i Z primi vicini","λ = J′ senza altri fattori","λ = 1/J′","Nessuna relazione"],c:0,
e:"Sostituendo S<sub>j</sub> → ⟨S⟩ ∝ M: H<sub>i</sub> ≈ −μ<sub>i</sub>·(λμ₀M). Per il Fe (Z = 8): J′ ~ 10⁻² eV, coerente col calcolo microscopico. Il «mistero» del campo molecolare di Weiss è risolto (dispensa)."},
{id:"m96",b:"mag",q:"In un antiferromagnete (es. MnO), sotto la temperatura di Néel T<sub>N</sub>:",
o:["Due sottoreticoli hanno magnetizzazioni opposte: M totale nulla ma ordine microscopico perfetto","La magnetizzazione diverge","Il materiale diventa ferro","Gli spin sono casuali"],c:0,
e:"χ(T) ha un MASSIMO a T<sub>N</sub> (non una divergenza) e sopra segue Curie–Weiss con θ NEGATIVA. L'ordine si vede con la diffrazione di neutroni (raddoppio della cella magnetica): collegamento col blocco diffrazione."},
{id:"m97",b:"mag",q:"Un segno sperimentale che distingue antiferro da para semplice nella zona T &gt; T<sub>critica</sub> è:",
o:["L'intercetta θ dell'estrapolazione di 1/χ: θ &lt; 0 per antiferro, θ &gt; 0 per tendenza ferro, θ = 0 per para ideale","Il valore assoluto di χ","Il colore","La densità"],c:0,
e:"1/χ = (T−θ)/C: la stessa retta di Curie–Weiss, ma il segno di θ rivela il segno dell'interazione di scambio media. Lettura standard dei dati χ(T) (dispensa, Esercitazione 17)."},
{id:"m98",b:"mag",q:"Per un trasformatore serve un materiale magnetico:",
o:["DOLCE: ciclo di isteresi strettissimo (basse perdite per ciclo), alta permeabilità — es. Fe-Si a grani orientati","DURO: alta coercitività","Antiferromagnetico","Diamagnetico"],c:0,
e:"P<sub>persa</sub> = f·(area del ciclo): a 50 Hz ogni mJ di area conta. Per i magneti permanenti serve l'opposto (NdFeB, H<sub>c</sub> enormi). Collegare microstruttura (pinning) e applicazione è tipica domanda di commento (dispensa)."},
{id:"m99",b:"mag",q:"Per smagnetizzare completamente un pezzo di ferro si può:",
o:["Scaldarlo sopra T<sub>C</sub> e raffreddarlo a campo nullo, oppure applicare cicli di campo alternato di ampiezza decrescente","Solo aspettare","Raffreddarlo a 4 K","Colpirlo con luce UV"],c:0,
e:"Entrambe le vie riportano i domini alla configurazione disordinata a M = 0 (il degauss dei vecchi monitor CRT!). La smagnetizzazione termica è la prova che l'ordine è di equilibrio sotto T<sub>C</sub> (dispensa)."},
{id:"m100",b:"mag",q:"Quale catena logica spiega il ferromagnetismo partendo dai principi primi?",
o:["Coulomb + antisimmetria di Pauli → integrale di scambio J′ → (Bethe–Slater: segno) → Heisenberg → campo medio = Weiss → domini + anisotropia → isteresi macroscopica","Interazione dipolare → allineamento → isteresi","Campo esterno → ordine permanente","Spin-orbita → scambio → Curie"],c:0,
e:"La piramide completa del blocco magnetismo, dal microscopico al macroscopico: saperla percorrere in entrambe le direzioni è la preparazione ideale per l'orale (dispensa, Esercitazioni 17-18)."},

{id:"x01",b:"sta",x:1,q:"Nel conteggio microcanonico di un sistema quantistico di particelle identiche si fissano N ed E, e si contano le configurazioni di occupazione {n<sub>i</sub>} tali che Σn<sub>i</sub> = N e Σn<sub>i</sub>ε<sub>i</sub> = E. Quale delle seguenti condizioni è <b>errata</b>?",
o:["Per fermioni: n<sub>i</sub> = −1, 0, 1","Per bosoni: n<sub>i</sub> = 0, 1, 2, …","Tutti i microstati compatibili sono equiprobabili","Nel limite semiclassico di particelle indistinguibili, il conteggio va corretto del fattore 1/N!"],c:0,
e:"I numeri di occupazione non possono essere negativi: per i fermioni n<sub>i</sub> = 0 oppure 1 (principio di Pauli), mai −1. Le altre tre sono corrette: bosoni senza limite, equiprobabilità microcanonica, correzione di Gibbs. ⚠ Domanda uscita all'appello (era in forma «quale è ERRATA»: leggere bene la consegna)."},
{id:"x02",b:"sta",x:1,q:"In meccanica statistica, data la funzione di partizione canonica Z di un sistema a temperatura T, quale delle seguenti espressioni fornisce correttamente l'energia libera di Helmholtz F?",
o:["F = −k<sub>B</sub>T ln Z","F = k<sub>B</sub>T ln Z","F = k<sub>B</sub>T·Z","F = k<sub>B</sub> ln Z"],c:0,
e:"È il «ponte» tra statistica e termodinamica: F = −k<sub>B</sub>T lnZ, da cui S = −∂F/∂T, P = −∂F/∂V, μ = ∂F/∂N. Il segno meno è essenziale (F deve diminuire quando Z, cioè il numero di stati accessibili, cresce). ⚠ Domanda uscita all'appello."},
{id:"x03",b:"tra",x:1,q:"Un catodo metallico portato alla temperatura T = 1000 K emette corrente per effetto termoionico. Sapendo che il materiale ha coefficiente A = 1,2·10⁶ A·m⁻²K⁻² e funzione lavoro φ = 1,0 eV, quanto vale approssimativamente la densità di corrente a saturazione? (k<sub>B</sub> = 8,62·10⁻⁵ eV/K)",
o:["1,1·10⁷ A/m²","1,1·10⁴ A/m²","1,1·10⁻² A/m²","1,1·10¹² A/m²"],c:0,
e:"Richardson–Dushman: J = A·T²·e^(−φ/k<sub>B</sub>T). Qui k<sub>B</sub>T = 0,0862 eV → φ/k<sub>B</sub>T = 11,6 → e^(−11,6) ≈ 9,1·10⁻⁶; A·T² = 1,2·10⁶·10⁶ = 1,2·10¹² → J ≈ 1,1·10⁷ A/m². ⚠ Domanda uscita all'appello: l'esponenziale abbatte il prefattore di 5 ordini di grandezza."},
{id:"x04",b:"sol",x:1,q:"In una catena unidimensionale con un atomo per cella e costante reticolare a si osservano due modi vibrazionali: nel modo 1 tutti gli atomi si spostano nello stesso verso con lunghezza d'onda molto maggiore di a; nel modo 2 atomi adiacenti si spostano in versi opposti. Quali sono i rispettivi vettori d'onda?",
o:["k ≈ 0 (modo 1); k = π/a (modo 2)","k ≈ 0 (modo 1); k = a (modo 2)","k ≈ 0 (modo 1); k = 2π/a (modo 2)","k = −π/a (modo 1); k = π/a (modo 2)"],c:0,
e:"Spostamenti tutti concordi = grande lunghezza d'onda → k ≈ 0 (limite acustico). Atomi adiacenti in controfase → λ = 2a → k = 2π/λ = π/a, cioè il bordo della zona di Brillouin. Nota: k = 2π/a è FUORI dalla prima zona (equivale a k = 0). ⚠ Domanda uscita all'appello (con figura)."},
{id:"x05",b:"mag",x:1,q:"In un materiale ferromagnetico monodominio si ha M = 3,0·10⁴ A/m. Se la costante di Weiss vale λ = 200, qual è l'intensità del campo molecolare?",
o:["B<sub>m</sub> = 7,54 T","B<sub>m</sub> = 7,54·10⁻⁴ T","B<sub>m</sub> = 1,88·10⁻⁴ T","B<sub>m</sub> = 3,77·10⁻² T"],c:0,
e:"B<sub>m</sub> = μ₀λM = 4π·10⁻⁷ · 200 · 3,0·10⁴ ≈ 7,54 T. Il campo molecolare è enorme rispetto a quello dipolare: non è un vero campo magnetico ma l'equivalente dell'interazione di scambio. ⚠ Domanda uscita all'appello: attenzione a non dimenticare μ₀."},
{id:"x06",b:"sol",x:1,q:"Un cristallo bidimensionale ha reticolo rettangolare con passo b lungo x̂ e passo a lungo ŷ, con b &gt; a. Quali sono i vettori primitivi del reticolo reciproco?",
o:["b₁ = (2π/b)x̂ e b₂ = (2π/a)ŷ","b₁ = (2π/a)x̂ e b₂ = (2π/b)ŷ","b₁ = (π/b)x̂ e b₂ = (π/a)ŷ","b₁ = (b/2π)x̂ e b₂ = (a/2π)ŷ"],c:0,
e:"Da a<sub>i</sub>·b<sub>j</sub> = 2πδ<sub>ij</sub>: ogni vettore reciproco è parallelo al corrispondente diretto (reticolo ortogonale) con modulo 2π/passo. ⚠ Attenzione all'INVERSIONE: la direzione con passo maggiore nel reale dà il vettore più CORTO nel reciproco. Domanda uscita all'appello (con figura)."},
{id:"x07",b:"ato",x:1,q:"Un atomo di sodio nello stato fondamentale [Ne]3s¹ è posto in un campo magnetico intenso, in regime di Paschen–Back. In quanti sottolivelli si separa lo stato fondamentale?",
o:["In 2 sottolivelli","In 3 sottolivelli","In 4 sottolivelli","In 6 sottolivelli"],c:0,
e:"In Paschen–Back E ∝ (m<sub>l</sub> + 2m<sub>s</sub>). Per 3s¹: l = 0 → m<sub>l</sub> = 0; m<sub>s</sub> = ±½ → valori ±1: due sottolivelli. (Stesso risultato dello Zeeman debole, dove ²S₁/₂ ha 2J+1 = 2.) ⚠ Domanda uscita all'appello."},
{id:"x08",b:"mag",x:1,q:"Come sono correlate la funzione di Langevin e la funzione di Brillouin?",
o:["La funzione di Langevin è il limite classico della funzione di Brillouin per J → ∞","La funzione di Langevin considera effetti quantistici, mentre Brillouin descrive momenti classici continui","La funzione di Brillouin diventa quella di Langevin per J → 0, perché in quel limite scompare la quantizzazione","Le due funzioni coincidono per qualunque J, purché B e T siano gli stessi"],c:0,
e:"Brillouin somma sui 2J+1 orientamenti discreti; per J → ∞ la spaziatura tra i m<sub>J</sub> diventa trascurabile e si recupera l'integrale continuo sugli angoli di Langevin. Per J → 0 non c'è momento affatto. ⚠ Domanda uscita all'appello."},
{id:"x09",b:"ato",x:1,q:"Che cosa si intende per «interazione di Coulomb residua» rispetto all'approssimazione di campo centrale?",
o:["La parte dell'interazione elettrone-elettrone non già inclusa nel potenziale medio centrale","La parte di potenziale che contiene l'interazione elettrone-elettrone","L'interazione tra il nucleo e gli elettroni più esterni","L'interazione tra l'atomo e un campo elettrostatico esterno"],c:0,
e:"Il campo centrale assorbe la parte a simmetria sferica della repulsione e–e; ciò che avanza (la parte non sferica) è la Coulomb RESIDUA, che insieme allo spin-orbita determina i termini spettroscopici e l'accoppiamento LS o jj. ⚠ Domanda uscita all'appello: la distrazione C è vera ma non «residua»."},
{id:"x10",b:"tra",x:1,q:"Qual è la principale innovazione del modello di Sommerfeld rispetto a quello di Drude?",
o:["Introduce la statistica di Fermi–Dirac e il principio di esclusione di Pauli per gli elettroni di conduzione","Considera gli elettroni come un gas classico che obbedisce alla distribuzione di Maxwell–Boltzmann","Assume che tutti gli elettroni del metallo contribuiscano allo stesso modo alla conduzione","Considera il moto degli elettroni nel potenziale periodico del reticolo cristallino"],c:0,
e:"Sommerfeld tiene l'impianto di Drude (elettroni liberi, urti con tempo τ) e cambia SOLO la statistica: da MB a FD. Il potenziale periodico arriva dopo, con Bloch e la teoria delle bande. ⚠ Domanda uscita all'appello."},
{id:"x11",b:"ato",x:1,q:"Qual è l'idea di base del metodo di Hartree?",
o:["Sostituire le complicate interazioni tra gli elettroni con un'energia potenziale media efficace, che ogni elettrone sperimenta nella posizione considerata","Ignorare le interazioni tra gli elettroni e concentrarsi solo sull'interazione con il nucleo","Considerare la statistica delle funzioni d'onda totali: antisimmetria per i fermioni e simmetrizzazione per i bosoni","Descrivere gli elettroni usando un semplice potenziale di Coulomb come energia potenziale"],c:0,
e:"Campo medio autoconsistente: il problema a N corpi diventa N problemi a un corpo. L'opzione sull'antisimmetria descrive il passaggio successivo (Hartree–FOCK, con il determinante di Slater e il termine di scambio). ⚠ Domanda uscita all'appello."},
{id:"x12",b:"ato",x:1,q:"Quali termini spettrali possono risultare dalla configurazione elettronica np¹n′p¹, con n ≠ n′?",
o:["¹S, ³S, ¹P, ³P, ¹D, ³D","¹S, ¹P, ¹D","³P, ³F","¹S, ³P, ¹D"],c:0,
e:"Elettroni NON equivalenti (n diversi) → nessuna restrizione di Pauli: S = 0,1 e L = 0,1,2 si combinano liberamente, 6 termini (36 stati = 6×6 ✓). Per elettroni equivalenti (np²) resterebbero solo ¹S, ³P, ¹D. ⚠ Domanda uscita all'appello: distinguere equivalenti/non equivalenti è il punto."},
{id:"x13",b:"ato",x:1,q:"Qual è la differenza principale tra accoppiamento LS e accoppiamento jj negli atomi?",
o:["Nell'accoppiamento LS si sommano prima tutti i momenti orbitali tra loro e tutti gli spin tra loro; nell'accoppiamento jj si accoppiano prima l e s di ciascun elettrone","Nell'accoppiamento LS si considera solo lo spin, mentre nell'accoppiamento jj solo il momento orbitale","L'accoppiamento LS è tipico degli atomi pesanti, mentre jj è tipico degli atomi leggeri","Nell'accoppiamento LS il momento angolare totale J è sempre nullo, mentre in jj è sempre massimo"],c:0,
e:"LS (Russell–Saunders): L = Σl<sub>i</sub>, S = Σs<sub>i</sub>, poi J = L+S — valido quando la Coulomb residua batte lo spin-orbita (atomi LEGGERI). jj: j<sub>i</sub> = l<sub>i</sub>+s<sub>i</sub>, poi J = Σj<sub>i</sub> — atomi PESANTI (l'opzione C inverte i due casi). ⚠ Domanda uscita all'appello."},
{id:"x14",b:"sta",x:1,q:"In un sistema isolato (ensemble microcanonico) all'equilibrio termodinamico, tutti i microstati accessibili con energia compresa tra E ed E+ΔE:",
o:["Hanno la stessa probabilità di essere occupati","Hanno probabilità di occupazione diverse a seconda del numero di particelle","Hanno probabilità di occupazione inversamente proporzionale all'energia","Seguono la statistica di Maxwell–Boltzmann"],c:0,
e:"È il postulato fondamentale della meccanica statistica (equiprobabilità a priori), da cui S = k<sub>B</sub>lnΓ. Il peso di Boltzmann e^(−βE) vale per un sistema in contatto con un termostato (canonico), non per un sistema isolato. ⚠ Domanda uscita all'appello."},
{id:"x15",b:"sta",x:1,q:"La distribuzione di Maxwell–Boltzmann per un gas ideale classico si ottiene come limite delle distribuzioni quantistiche. Qual è la condizione fisica fondamentale perché questo limite sia valido?",
o:["Il gas si deve trovare in regime di bassa densità e alta temperatura","La temperatura deve essere vicina allo zero assoluto","La densità del gas deve essere molto alta","Le particelle devono avere spin intero"],c:0,
e:"Serve occupazione media ≪ 1 per ogni stato (e^((ε−μ)/k<sub>B</sub>T) ≫ 1), equivalente a nλ<sub>T</sub>³ ≪ 1: i pacchetti d'onda non si sovrappongono e l'indistinguibilità non produce effetti. Alta densità e bassa T portano invece alla degenerazione quantistica. ⚠ Domanda uscita all'appello."},
{id:"x16",b:"tra",x:1,q:"Da che cosa è originata la resistenza elettrica nel modello di Drude?",
o:["Dalle collisioni degli elettroni di conduzione con gli ioni del reticolo cristallino, che ne deviano il moto libero","Dalla massa degli elettroni, che si oppone alla loro accelerazione in presenza di un campo elettrico","Dalla repulsione elettrostatica tra gli elettroni liberi, che riduce il flusso di corrente","Dal principio di esclusione, che impedisce agli elettroni di occupare livelli già occupati"],c:0,
e:"Nel modello di Drude gli urti con gli ioni (tempo di rilassamento τ) limitano la velocità di deriva: σ = ne²τ/m. Nota storica: l'immagine è ingenua (nel reticolo perfetto gli elettroni non diffondono affatto — teorema di Bloch: diffondono fononi e difetti), ma è ciò che il modello assume. ⚠ Domanda uscita all'appello."},
{id:"x17",b:"tra",x:1,q:"In un metallo la densità elettronica è n = 8,5·10²⁸ m⁻³ e la resistività è ρ = 1,6·10⁻⁸ Ω·m. Quale risulta il tempo di rilassamento τ?",
o:["2,6·10⁻¹⁴ s","2,6·10⁻¹⁰ s","6,1·10⁻¹⁶ s","1,4·10⁻¹² s"],c:0,
e:"Da σ = ne²τ/m: τ = m/(ρne²) = 9,11·10⁻³¹ / (1,6·10⁻⁸ · 8,5·10²⁸ · (1,6·10⁻¹⁹)²) ≈ 2,6·10⁻¹⁴ s. Sono i dati del rame: il valore ~10⁻¹⁴ s (femtosecondi) è da tenere a memoria. ⚠ Domanda uscita all'appello."},
{id:"x18",b:"sol",x:1,q:"In un reticolo bidimensionale, quale delle seguenti aree NON può essere una cella unitaria (primitiva)?",
o:["Un'area che contiene due punti reticolari","Un parallelogramma costruito su due vettori primitivi del reticolo","Una regione di forma irregolare che, traslata per tutti i vettori del reticolo, ricopre il piano senza sovrapposizioni né vuoti","La cella di Wigner–Seitz costruita attorno a un punto reticolare"],c:0,
e:"La cella primitiva deve contenere esattamente UN punto reticolare (area = area primitiva): con due punti è una cella multipla (come la convenzionale dell'FCC, che ne contiene 4). La forma invece è libera: qualunque regione che tassella il piano va bene, anche irregolare. ⚠ Domanda uscita all'appello (con figura)."},
{id:"x19",b:"mag",x:1,q:"Quali condizioni sperimentali devono essere soddisfatte per misurare il momento magnetico di saturazione di una particella paramagnetica?",
o:["Applicare un campo magnetico esterno molto intenso e portare il sistema a temperatura molto bassa, così che l'energia di interazione magnetica sia molto maggiore di quella termica","Applicare un campo molto debole e portare il sistema a temperatura molto bassa, per non perturbare gli stati quantistici","Portare il sistema ad alta temperatura e applicare un campo intenso, sfruttando le fluttuazioni termiche per esplorare tutti gli stati di orientazione","Mantenere il sistema a temperatura ambiente con campo moderato, dove la funzione di Brillouin è lineare nel campo"],c:0,
e:"Serve a = g<sub>J</sub>μ<sub>B</sub>JB/k<sub>B</sub>T ≫ 1 perché B<sub>J</sub>(a) → 1. A temperatura ambiente con B = 10 T si ha a ≈ 10⁻²: si resta nel regime lineare di Curie (l'opzione D descrive proprio la misura di χ, non della saturazione). ⚠ Domanda uscita all'appello."},
];
// ============ GENERATORI NUMERICI (domande sempre nuove) ============
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const it=x=>String(x).replace(".",",");
const pw=(m,e)=>m+"·10<sup>"+(e<0?"−"+(-e):e)+"</sup>";
const GENS=[
{id:"g-tau",b:"tra",make(){
  const rho=rnd([1.6,2.2,2.8,4.2,5.6]), n=rnd([2.5,5.0,8.5,11.0,18.0]);
  const tau=9.109e-31/(rho*1e-8*n*1e28*2.566e-38); // s
  let e=-14, m=tau/1e-14; if(m<1){e=-15;m=tau/1e-15}
  const v=x=>it(x.toFixed(1));
  return{q:"Un metallo ha resistività ρ = "+pw(it(rho),-8)+" Ω·m e densità di elettroni n = "+pw(it(n),28)+" m⁻³. Nel modello di Drude, il tempo di rilassamento τ = m/(ρne²) vale circa:",
  o:[pw(v(m),e)+" s",pw(v(m),e+1)+" s",pw(v(m),e-1)+" s",pw(v(m*3.1),e)+" s"],
  e:"Da σ = ne²τ/m: τ = m/(ρne²) = 9,1·10⁻³¹/("+pw(it(rho),-8)+"·"+pw(it(n),28)+"·(1,6·10⁻¹⁹)²) ≈ "+pw(v(m),e)+" s. Ordine di grandezza da ricordare: 10⁻¹⁴–10⁻¹⁵ s (femtosecondi). Numerica ricorrente nei quiz reali."}}},
{id:"g-tf",b:"tra",make(){
  const ef=rnd([2.1,3.2,4.7,5.5,7.0,9.4]);
  const tf=ef*11604; const m=tf/1e4; const v=x=>it(x.toFixed(1));
  return{q:"Un metallo ha energia di Fermi ε<sub>F</sub> = "+it(ef)+" eV. La temperatura di Fermi T<sub>F</sub> = ε<sub>F</sub>/k<sub>B</sub> vale circa:",
  o:[pw(v(m),4)+" K",pw(v(m),3)+" K",pw(v(m),5)+" K",pw(v(m/3),4)+" K"],
  e:"Conversione chiave: 1 eV ↔ 11600 K (k<sub>B</sub> = 8,62·10⁻⁵ eV/K). T<sub>F</sub> = "+it(ef)+"·11600 ≈ "+pw(v(m),4)+" K ≫ 300 K: il gas di elettroni è sempre degenere e vale l'espansione di Sommerfeld in (T/T<sub>F</sub>)."}}},
{id:"g-deg",b:"ato",make(){
  const t=rnd([{t:"²D₅/₂",J:2.5,S:0.5},{t:"³P₂",J:2,S:1},{t:"⁴F₃/₂",J:1.5,S:1.5},{t:"²P₃/₂",J:1.5,S:0.5},{t:"⁶S₅/₂",J:2.5,S:2.5},{t:"⁵D₄",J:4,S:2},{t:"³F₄",J:4,S:1},{t:"⁸S₇/₂",J:3.5,S:3.5},{t:"⁴I₉/₂",J:4.5,S:1.5}]);
  const d=2*t.J+1; const wrong=[...new Set([2*t.J,2*t.S+1,d+2].map(Math.round))].filter(x=>x!==d&&x>0);
  while(wrong.length<3)wrong.push(d+wrong.length+2);
  return{q:"Qual è la degenerazione del livello atomico "+t.t+"?",
  o:[String(d),String(wrong[0]),String(wrong[1]),String(wrong[2])],
  e:"La degenerazione di un livello con momento angolare totale J è 2J+1 (i valori di m<sub>J</sub> da −J a +J). Qui J = "+it(t.J)+" → 2J+1 = "+d+". Non confondere con la molteplicità di spin 2S+1 scritta all'apice del termine."}}},
{id:"g-gj",b:"ato",make(){
  const L=[{t:"²S₁/₂",g:"2"},{t:"²P₁/₂",g:"2/3"},{t:"²P₃/₂",g:"4/3"},{t:"²D₃/₂",g:"4/5"},{t:"²D₅/₂",g:"6/5"},{t:"³P₂",g:"3/2"},{t:"⁴F₃/₂",g:"2/5"},{t:"⁸S₇/₂",g:"2"}];
  const t=rnd(L); const pool=["2","2/3","4/3","4/5","6/5","3/2","2/5","1"].filter(x=>x!==t.g);
  const w=[];while(w.length<3){const x=rnd(pool);if(!w.includes(x))w.push(x)}
  return{q:"Il fattore di Landé g<sub>J</sub> del termine "+t.t+" vale:",
  o:[t.g,w[0],w[1],w[2]],
  e:"g<sub>J</sub> = 1 + [J(J+1) − L(L+1) + S(S+1)] / [2J(J+1)]. Per "+t.t+" si ottiene g<sub>J</sub> = "+t.g+". Scorciatoie: singoletti (S=0) → g = 1; termini S (L=0) → g = 2. Il calcolo esplicito di g(²P₁/₂) = 2/3 spiega lo Zeeman anomalo del sodio."}}},
{id:"g-chain",b:"sol",make(){
  const N=rnd([50,100,200,400,1000]), a=rnd([0.2,0.25,0.3,0.4,0.5]);
  const lmin=2*a, lmax=N*a; const v=x=>it(+x.toFixed(2));
  return{q:"Una catena 1D ha N = "+N+" atomi a distanza a = "+it(a)+" nm, con condizioni al contorno periodiche. Le lunghezze d'onda minima e massima dei modi vibrazionali sono:",
  o:["λ<sub>min</sub> = "+v(lmin)+" nm, λ<sub>max</sub> = "+v(lmax)+" nm","λ<sub>min</sub> = "+v(a)+" nm, λ<sub>max</sub> = "+v(lmax)+" nm","λ<sub>min</sub> = "+v(lmin)+" nm, λ<sub>max</sub> = "+v(lmax/2)+" nm","λ<sub>min</sub> = "+v(a)+" nm, λ<sub>max</sub> = "+v(lmax/2)+" nm"],
  e:"k = 2πm/(Na): m = 1 → λ<sub>max</sub> = Na = L = "+v(lmax)+" nm; al bordo zona k = π/a → λ<sub>min</sub> = 2a = "+v(lmin)+" nm (atomi adiacenti in controfase). Domanda del quiz reale del II appello."}}},
{id:"g-dhkl",b:"sol",make(){
  const a=rnd([0.29,0.36,0.41,0.54]), hkl=rnd([{s:"(111)",v:3},{s:"(110)",v:2},{s:"(200)",v:4},{s:"(211)",v:6},{s:"(220)",v:8}]);
  const d=a/Math.sqrt(hkl.v); const v=x=>it(x.toFixed(3));
  return{q:"In un cristallo cubico con parametro reticolare a = "+it(a)+" nm, la distanza tra i piani "+hkl.s+" vale:",
  o:[v(d)+" nm",v(a/hkl.v)+" nm",v(a*Math.sqrt(hkl.v))+" nm",v(a/(hkl.v+1))+" nm"],
  e:"Per i reticoli cubici d<sub>hkl</sub> = a/√(h²+k²+l²) = "+it(a)+"/√"+hkl.v+" ≈ "+v(d)+" nm (equivalente a d = 2π/|G|). Maggiore d ⇔ minore angolo di Bragg: i piani a basso indice danno i primi picchi di diffrazione."}}},
{id:"g-zeeman",b:"ato",make(){
  const g=rnd([{s:"1",v:1},{s:"2",v:2},{s:"4/3",v:4/3}]), B=rnd([0.5,1,2,5]);
  const de=g.v*5.788e-5*B; let e=-5,m=de/1e-5; if(m>=10){e=-4;m=de/1e-4}
  const v=x=>it(x.toFixed(1));
  return{q:"Un livello con g<sub>J</sub> = "+g.s+" è immerso in un campo B = "+it(B)+" T. La separazione Zeeman tra due sottolivelli adiacenti (Δm<sub>J</sub> = 1) vale circa:",
  o:[pw(v(m),e)+" eV",pw(v(m),e+2)+" eV",pw(v(m),e-2)+" eV",pw(v(m*5),e)+" eV"],
  e:"ΔE = g<sub>J</sub>·μ<sub>B</sub>·B con μ<sub>B</sub> ≈ 5,8·10⁻⁵ eV/T → ΔE ≈ "+pw(v(m),e)+" eV. Scala da ricordare: lo Zeeman (~10⁻⁵–10⁻⁴ eV/T) è molto più piccolo di struttura fine (~10⁻³ eV) e livelli di Bohr (~eV): per questo si tratta come ultima perturbazione."}}},
{id:"g-curie",b:"mag",make(){
  const x0=rnd([1.2,2.4,6.2]), T2=rnd([75,100,150,600]);
  const x2=x0*300/T2; const v=x=>it(x.toFixed(2));
  return{q:"Un sale paramagnetico segue la legge di Curie e ha χ = "+pw(it(x0),-4)+" a 300 K. Quanto vale χ a "+T2+" K?",
  o:[pw(v(x2),-4),pw(v(x0*T2/300),-4),pw(it(x0),-4)+" (invariata)",pw(v(x0*Math.pow(300/T2,2)),-4)],
  e:"χ = C/T → χ₂ = χ₁·(T₁/T₂) = "+pw(it(x0),-4)+"·(300/"+T2+") ≈ "+pw(v(x2),-4)+". Raffreddando la suscettività aumenta (meno agitazione termica contro l'allineamento). Ricorda di verificare a ≪ 1 prima di usare Curie a bassa T."}}},
{id:"g-rich",b:"tra",make(){
  const d=rnd([{df:0.5,r:"10"},{df:1.0,r:"100"},{df:1.5,r:"1000"}]);
  const p1=rnd([1.8,2.0,2.5]); const p2=p1+d.df;
  return{q:"Due catodi sono alla stessa temperatura T = 2500 K (k<sub>B</sub>T ≈ 0,22 eV), con funzioni lavoro φ₁ = "+it(p1)+" eV e φ₂ = "+it(p2)+" eV. Il rapporto tra le correnti termoioniche J₁/J₂ è circa:",
  o:["~"+d.r+": il catodo 1 emette molto di più","~"+it(p2/p1<1.5?1.3:p2/p1).slice(0,4)+": poco più del rapporto delle φ","~1: alla stessa T emettono uguale","~1/"+d.r+": emette di più il catodo 2"],
  e:"Richardson–Dushman: J ∝ T²e^(−φ/k<sub>B</sub>T) → J₁/J₂ = e^((φ₂−φ₁)/k<sub>B</sub>T) = e^("+it(d.df)+"/0,22) ≈ "+d.r+". Piccole differenze di φ danno rapporti esponenzialmente grandi: per questo i filamenti si ricoprono di materiali a bassa φ (Cs: 1,8 eV)."}}},
{id:"g-weiss",b:"mag",make(){
  const t=rnd([{n:"il ferro",tc:1043},{n:"il nichel",tc:631},{n:"il cobalto",tc:1394},{n:"il gadolinio",tc:292}]);
  const B=1.488*t.tc; const m=B/1000;
  const v=x=>it(x.toFixed(1));
  return{q:"Per "+t.n+" (T<sub>C</sub> = "+t.tc+" K), il campo molecolare di Weiss B<sub>m</sub> ≈ k<sub>B</sub>T<sub>C</sub>/μ<sub>B</sub> vale circa:",
  o:[m>=1?pw(v(m),3)+" T":pw(v(B/100),2)+" T","~1 T, come il campo dipolare tra ioni vicini",m>=1?pw(v(m),0)+" T":pw(v(B/100),-1)+" T",m>=1?pw(v(m),6)+" T":pw(v(B/100),5)+" T"],
  e:"B<sub>m</sub> = k<sub>B</sub>T<sub>C</sub>/μ<sub>B</sub> = (8,6·10⁻⁵ · "+t.tc+")/(5,8·10⁻⁵) ≈ "+(B>=1000?pw(v(m),3):Math.round(B)+"")+" T: centinaia-migliaia di tesla, ~10³ volte il campo dipolare (~1 T). Nessuna interazione magnetica reale è così forte: il «campo molecolare» è in realtà l'interazione di scambio (elettrostatica + Pauli). Numerica ricorrente nei quiz."}}},
{id:"g-peff",b:"mag",make(){
  const t=rnd([{n:"V³⁺ (3d²)",u:2},{n:"Cr³⁺ (3d³)",u:3},{n:"Mn³⁺ (3d⁴)",u:4},{n:"Fe³⁺ (3d⁵)",u:5},{n:"Co²⁺ (3d⁷)",u:3},{n:"Ni²⁺ (3d⁸)",u:2},{n:"Cu²⁺ (3d⁹)",u:1}]);
  const S=t.u/2; const pv=2*Math.sqrt(S*(S+1));
  const v=x=>it(x.toFixed(2));
  return{q:"Il numero efficace di magnetoni di Bohr p<sub>eff</sub> per lo ione "+t.n+" in un sale (tenendo conto del quenching) vale:",
  o:[v(pv),v(Math.sqrt(S*(S+1))),v(2*S),v(2*pv)],
  e:"Ione 3d → campo cristallino &gt; spin-orbita → momento orbitale spento (L = 0): p<sub>eff</sub> = 2√(S(S+1)) = g<sub>s</sub>√(S(S+1)) con S = "+it(S)+" ("+t.u+" elettroni spaiati) → p<sub>eff</sub> ≈ "+v(pv)+". Usare J come per le terre rare è l'errore classico (per Cr³⁺ darebbe 0,77 contro 3,85 sperimentale)."}}},
];
